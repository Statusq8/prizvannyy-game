      cls: { id: null, spent: {}, changeDay: '' }, // класс главного героя
      booster: { owner: null, movedAt: 0 },      // «Печать силы»: владелец и время последнего переноса
      rituals: 0,
      bestFloor: 1,                              // рекорд за всю игру
      bestRecordAtRunStart: 1,                   // рекорд на момент начала забега (для бонуса за новый рекорд)
      heroAutoAcc: 0,                            // накопитель автоатаки героя (не сохраняется)
      reserveAcc: 0,                             // накопитель урона резерва (не сохраняется)
      pets: { active: null, levels: {} },        // питомцы: активный и уровни (≥1 — призван)
      petAcc: 0,                                 // накопитель атаки питомца (не сохраняется)
      rng: (opts && opts.rng) || Math.random,   // источник случайности (в тестах подменяется)
      // не сохраняется:
      enemy: null,
      bossTimeLeft: 0,
      respawn: 0,
    };
    spawn(s);
    return s;
  }

  function newAbilities() {
    const o = {};
    // cd — перезарядка, active — сколько ещё действует, auto — автоиспользование, acc — накопитель шквала
    for (const a of CONFIG.abilities) o[a.id] = { cd: 0, active: 0, auto: false, acc: 0 };
    return o;
  }
  function newHeroes() {
    const o = {};
    for (const a of CONFIG.allies) o[a.id] = { unlocked: !!a.starter, copies: 0, stars: 0, evo: 0, rank: 0 };
    return o;
  }
  function newAllies() {
    const o = {};
    // cd — перезарядка атаки, ult — накопленный заряд ультимейта, с (оба не сохраняются)
    for (const a of CONFIG.allies) o[a.id] = { level: 0, cd: a.attackInterval, ult: 0 };
    return o;
  }

  function spawn(s) {
    if (s.mode) return spawnMode(s);
    const isBoss = s.enemyIndex === CONFIG.enemiesPerFloor;
    const rare = rollRare(s, s.floor, s.enemyIndex);
    const hp = B.ceil(B.mul(enemyMaxHp(s.floor, isBoss), rare ? rare.hp : 1));
    const final = isBoss && isFinalBoss(s.floor);
    s.enemy = { hp, maxHp: hp, isBoss, final, alive: true, mark: 0, markPower: 1, rare: rare ? rare.id : null,
                phase: 1, vuln: 0, name: rare ? rare.name : enemyName(s.floor, s.enemyIndex, isBoss) };
    s.bossTimeLeft = isBoss ? bossTime(s) : 0;
    s.respawn = 0;
  }

  // ---------- действия ----------
  // Множители от ультимейтов: Ярость — весь урон отряда, Разрез — тапы, Метка — урон по врагу
  function damageMult(s, source) {
    let m = 1;
    if (s.buffs.team > 0) m *= s.buffs.teamPower;
    if (source === 'tap' && s.buffs.tap > 0) m *= s.buffs.tapPower;
    if (s.enemy.mark > 0) m *= s.enemy.markPower;
    if (s.enemy.vuln > 0) m *= CONFIG.bossPhases.vulnMult;
    if (s.enemy.isBoss) m *= bossDmgMult(s);
    m *= boneEnemyMult(s, source);
    return m;
  }

  function dealDamage(s, dmg, source, events) {
    dmg = B.mul(B.mul(dmg, permMult(s, source)), damageMult(s, source));
    const crit = s.rng() < critChance(s);
    if (crit) { dmg = B.mul(dmg, critMult(s)); s.stats.crits = (s.stats.crits | 0) + 1; }
    s.enemy.hp = B.max(0, B.sub(s.enemy.hp, dmg));
    events.push({ type: 'hit', dmg, source, crit });
    if (B.lte(s.enemy.hp, 0)) { s.enemy.hp = 0; kill(s, events); }
    else if (s.enemy.isBoss) checkPhase(s, events);
  }
  // Фазы босса: пороги HP, на каждом — короткая уязвимость
  function phaseThresholds(e) { const P = CONFIG.bossPhases; return e.final ? P.final : P.normal; }
  function checkPhase(s, events) {
    const e = s.enemy, th = phaseThresholds(e);
    while (e.phase <= th.length && B.toNum(B.div(e.hp, e.maxHp)) <= th[e.phase - 1]) {
      e.phase++; e.vuln = CONFIG.bossPhases.vulnSec + treePower(s, 'vulnSec');
      events.push({ type: 'phase', phase: e.phase, of: th.length + 1, name: e.name });
    }
  }

  function earnGold(s, g) { s.stats.goldEarned = B.add(s.stats.goldEarned, g); }
  function tap(s) {
    const events = [];
    if (!s.enemy.alive) return events;           // нельзя бить мёртвого
    s.stats.taps++; cnt(s, 'tap'); s.tpsWin.n++;
    if (modeRule(s) === 'alliesOnly') { events.push({ type: 'hit', dmg: 0, source: 'tap', crit: false, blocked: true }); return events; }
    dealDamage(s, tapDamage(s), 'tap', events);
    return events;
  }

  function kill(s, events) {
    const isBoss = s.enemy.isBoss;
    s.enemy.alive = false;
    s.respawn = CONFIG.respawnDelaySec;
    if (s.mode) return modeKill(s, events);
    rewardKill(s, isBoss, events, s.enemy.rare);
  }
  // Награды и переход к следующему врагу — общие для боя и офлайна
  function rewardKill(s, isBoss, events, rareId) {
    const rare = rareId ? rareDef(rareId) : null;
    const gold = B.ceil(B.mul(killGold(s.floor, isBoss), goldMult(s) * (rare ? rare.gold : 1)));
    s.gold = B.add(s.gold, gold); earnGold(s, gold);
    s.stats.kills++; cnt(s, 'kill');
    addEventPoints(s, isBoss ? CONFIG.events.pointsBoss : CONFIG.events.pointsKill);
    events.push({ type: 'kill', gold, boss: isBoss, rare: rareId || null });
    if (rare) cnt(s, 'rare');
    if (rare && rare.shards) {
      const n = Math.ceil(rare.shards * shardsForBoss(s.floor) * shardMult(s));
      s.materials.shard += n;
      events.push({ type: 'materials', shard: n, heart: 0, rare: true });
    }

    if (isBoss) {
      s.stats.bossKills++; cnt(s, 'boss');
      if (s.floor > s.highestCleared) {
        s.highestCleared = s.floor;
        const bonus = B.ceil(B.mul(firstClearGold(s.floor), goldMult(s)));
        s.gold = B.add(s.gold, bonus); earnGold(s, bonus);
        events.push({ type: 'firstClear', floor: s.floor, gold: bonus });
      }
      if (s.floor > s.ticketFloor) {
        s.ticketFloor = s.floor;
        const n = ticketsForFloor(s.floor);
        s.tickets += n;
        if (n) events.push({ type: 'tickets', n, floor: s.floor });
      }
      const mat = bossMaterials(s, s.floor);
      s.materials.shard += mat.shard; s.materials.heart += mat.heart;
      if (mat.heart) {
        s.heartFloor = s.floor;
        const b = biomeOf(s.floor);
        if (isFinalBoss(s.floor) && !s.totems[b.id]) { s.totems[b.id] = 1; events.push({ type: 'totem', id: b.id, name: b.name }); }
      }
      events.push({ type: 'materials', shard: mat.shard, heart: mat.heart });
      const bone = rollBone(s, isFinalBoss(s.floor) ? CONFIG.bones.dropFinal : CONFIG.bones.dropBoss, s.floor);
      if (bone) events.push({ type: 'bone', bone });
      // «Автопереход» выключен: этаж открыт, но остаёмся и фармим текущий
      if (!s.autoAdvance && s.floor < CONFIG.maxFloor) {
        s.maxFloor = Math.max(s.maxFloor, s.floor + 1); s.bestFloor = Math.max(s.bestFloor, s.maxFloor);
        s.enemyIndex = 1; s.farming = true;
        events.push({ type: 'stay', floor: s.floor });
        return;
      }
      if (s.floor >= CONFIG.maxFloor) {                 // вершина: этаж не растёт, босса можно бить снова
        s.enemyIndex = 1;
        events.push({ type: 'top', floor: s.floor });
        return;
      }
      s.maxFloor = Math.max(s.maxFloor, s.floor + 1);
      s.bestFloor = Math.max(s.bestFloor, s.maxFloor);
      s.floor += 1;
      s.enemyIndex = 1;
      events.push({ type: 'floor', floor: s.floor });
      if (isBiomeStart(s.floor) && s.floor >= s.maxFloor) events.push({ type: 'biome', floor: s.floor, name: biomeName(s.floor) });
    } else if (s.farming && s.enemyIndex === CONFIG.enemiesPerFloor - 1) {
      s.enemyIndex = 1;                          // фарм: крутим обычных врагов без босса
    } else {
      s.enemyIndex += 1;
    }
  }

  // Фиксированный шаг симуляции
  function tick(s, dt) {
    const events = [];
    s.stats.playTime += dt;
    const w = s.tpsWin; w.t += dt;
    if (w.t >= 1) { s.stats.maxTps = Math.max(s.stats.maxTps, Math.round(w.n / w.t)); w.t = 0; w.n = 0; }
    s.buffs.team = Math.max(0, s.buffs.team - dt);
    s.buffs.tap = Math.max(0, s.buffs.tap - dt);
    if (s.enemy.alive) { s.enemy.mark = Math.max(0, s.enemy.mark - dt); s.enemy.vuln = Math.max(0, s.enemy.vuln - dt); }
    for (const a of squadDefs(s)) {
      const st = s.allies[a.id];
      if (st.level > 0) st.ult = Math.min(a.ult.charge, st.ult + dt * (1 + treePower(s, 'ultCharge')));   // готовность копится и сохраняется между врагами
    }
    tickAbilities(s, dt, events);   // перезарядка идёт всегда; шквал и автоиспользование — только по живому врагу
    if (!s.enemy.alive) {
      s.respawn -= dt;
      if (s.respawn <= 0) { spawn(s); events.push({ type: 'spawn' }); }
      return events;
    }
    const rule = modeRule(s);
    // Ультимейты срабатывают автоматически, как только заряжены и враг жив
    for (const a of squadDefs(s)) {
      const st = s.allies[a.id];
      if (rule === 'noUlts' || rule === 'tapOnly') break;
      if (st.level <= 0 || st.ult < a.ult.charge || !s.enemy.alive) continue;
      st.ult = 0;
      fireUlt(s, a, events);
    }
    if (!s.enemy.alive) return events;
    // Автоатаки отряда: перезарядка идёт только пока враг жив
    for (const a of squadDefs(s)) {
      const st = s.allies[a.id];
      if (st.level <= 0 || rule === 'tapOnly') continue;
      st.cd -= dt;
      if (st.cd <= 0 && s.enemy.alive) {
        st.cd += a.attackInterval;
        dealDamage(s, allyDps(s, a.id) * a.attackInterval, a.id, events);
      }
      if (!s.enemy.alive) { for (const b of CONFIG.allies) s.allies[b.id].cd = Math.max(s.allies[b.id].cd, 0); return events; }
    }
    // Автоатака главного героя (артефакт «Клинок первого призыва»): фиксированная частота, тапы остаются
    if (hasHeroAuto(s) && rule !== 'alliesOnly') {
      s.heroAutoAcc += dt;
      if (s.heroAutoAcc >= CONFIG.heroAutoInterval) {
        s.heroAutoAcc -= CONFIG.heroAutoInterval;
        dealDamage(s, tapDamage(s), 'heroAuto', events);
        if (!s.enemy.alive) return events;
      }
    }
    // Резерв: доля DPS нанятых вне отряда, порциями раз в секунду
    const rd = rule === 'tapOnly' ? 0 : reserveDps(s);
    if (B.gt(rd, 0)) {
      s.reserveAcc += dt;
      if (s.reserveAcc >= 1) { s.reserveAcc -= 1; dealDamage(s, rd, 'reserve', events); if (!s.enemy.alive) return events; }
    }
    // Питомец: своя частота атаки
    const pet = s.pets.active && petDef(s.pets.active);
    if (pet && rule !== 'tapOnly') {
      s.petAcc += dt;
      if (s.petAcc >= pet.interval) {
        s.petAcc -= pet.interval;
        let hit = petHit(s);
        if (pet.boss && s.enemy.isBoss) hit = B.mul(hit, 1 + pet.boss);
        if (pet.vuln && s.enemy.vuln > 0) hit = B.mul(hit, 1 + pet.vuln);
        if (B.gt(hit, 0)) { dealDamage(s, hit, 'pet', events); if (!s.enemy.alive) return events; }
      }
    }
    if (s.mode) { modeTimer(s, dt, events); return events; }
    if (s.enemy.isBoss) {
      s.bossTimeLeft -= dt;
      if (s.bossTimeLeft <= 0) {
        s.farming = true;
        s.enemyIndex = 1;
        spawn(s);
        events.push({ type: 'bossFail' }, { type: 'spawn' });
      }
    }
    return events;
  }

  // ---------- доп. PvE ----------
  // Сброс ежедневных попыток: dayKey — дата устройства 'ГГГГ-ММ-ДД' (передаёт интерфейс)
  function dailyReset(s, dayKey) {
    if (s.pve.day !== dayKey) { s.pve.day = dayKey; s.pve.used = {}; }
  }
  function attemptsLeft(s, key) {
    const P = CONFIG.pve, max = key === 'endless' ? P.endless.attempts : key === 'personal' ? P.personal.attempts : key === 'event' ? CONFIG.events.attempts : P.dailyAttempts;
    return Math.max(0, max - (s.pve.used[key] | 0));
  }
  function maxDungeonTier(s) { return Math.max(1, Math.floor(s.bestFloor / CONFIG.pve.tierFloors)); }
  function dungeonDef(id) { return CONFIG.pve.dungeons.find(d => d.id === id); }
  // Фиксированная награда подземелья на уровне tier
  function dungeonReward(s, id, tier) {
    const P = CONFIG.pve, f = tier * P.tierFloors, d = dungeonDef(id);
    if (d.reward === 'gold') return { gold: B.ceil(B.mul(killGold(f, true), P.vaultGold * goldMult(s))) };
    if (d.reward === 'shard') return { shard: Math.ceil(shardsForBoss(f) * P.mineShards * shardMult(s)) };
    return { runeTier: Math.min(CONFIG.rarities.length - 1, Math.floor(tier / P.forgeTierEvery)) };
  }
  // Личные боссы — финальные боссы биомов, чей тотем уже получен
  function personalBosses(s) {
    const out = [];
    CONFIG.biomes.forEach((b, i) => { if (s.totems[b.id]) out.push({ id: b.id, name: b.final, floor: (i + 1) * CONFIG.biomeFloors, biome: b.name }); });
    return out;
  }
  function personalReward(s, floor, diff) {
    const D = CONFIG.pve.personal.diffs.find(x => x.id === diff);
    return { heart: D.hearts, shard: Math.ceil(shardsForBoss(floor) * D.shards * shardMult(s)) };
  }
  // Вход в режим: тратит попытку, тот же бой, своя очередь врагов
  function enterMode(s, kind, opts, dayKey) {
    if (s.mode) return null;
    if (dayKey) dailyReset(s, dayKey);
    const P = CONFIG.pve;
    let m;
    if (kind === 'dungeon') {
      const d = dungeonDef(opts.id), tier = opts.tier | 0;
      if (!d || tier < 1 || tier > maxDungeonTier(s) || !attemptsLeft(s, d.id)) return null;
      m = { kind, id: d.id, name: d.name, tier, step: 1, total: P.dungeonEnemies, timeLeft: P.dungeonTime, timeMax: P.dungeonTime };
      s.pve.used[d.id] = (s.pve.used[d.id] | 0) + 1;
    } else if (kind === 'event') {
      const e = currentEvent(s), tier = opts.tier | 0;
      if (!e || tier < 1 || tier > maxDungeonTier(s) || !attemptsLeft(s, 'event')) return null;
      const t = e.dungeon.rule === 'fast' ? CONFIG.events.fastTime : P.dungeonTime;
      m = { kind, id: 'event', name: e.dungeon.name, rule: e.dungeon.rule, tier, step: 1, total: P.dungeonEnemies, timeLeft: t, timeMax: t };
      s.pve.used.event = (s.pve.used.event | 0) + 1;
    } else if (kind === 'endless') {
      if (!attemptsLeft(s, 'endless')) return null;
      m = { kind, id: 'endless', name: 'Бесконечное подземелье', step: 1, timeLeft: 0, timeMax: P.endless.bossTime, essence: 0, tickets: 0 };
      s.pve.used.endless = (s.pve.used.endless | 0) + 1;
    } else if (kind === 'personal') {
      const b = personalBosses(s).find(x => x.id === opts.id), D = P.personal.diffs.find(x => x.id === opts.diff);
      if (!b || !D || !attemptsLeft(s, 'personal')) return null;
      m = { kind, id: b.id, name: b.name, floor: b.floor, diff: D.id, diffName: D.name, step: 1, total: 1, timeLeft: P.personal.time, timeMax: P.personal.time };
      s.pve.used.personal = (s.pve.used.personal | 0) + 1;
    } else return null;
    s.mode = m;
    s.buffs = { team: 0, tap: 0, teamPower: 1, tapPower: 1 };
    spawn(s);
    return [{ type: 'modeStart', kind, name: m.name }, { type: 'spawn' }];
  }
  function spawnMode(s) {
    const m = s.mode, P = CONFIG.pve;
    let hp, isBoss, name;
    if (m.kind === 'dungeon' || m.kind === 'event') {
      const f = m.tier * P.tierFloors;
      isBoss = m.step === m.total;
      hp = enemyMaxHp(f, isBoss);
      name = isBoss ? 'Страж: ' + m.name : enemyName(f, m.step, false);
    } else if (m.kind === 'endless') {
      isBoss = m.step % P.endless.bossEvery === 0;
      hp = B.ceil(B.mul(enemyMaxHp(m.step, isBoss), P.endless.hpMult));
      name = (isBoss ? 'Контрольный босс · ' : '') + enemyName(m.step, m.step % 9 + 1, isBoss);
      if (isBoss) m.timeLeft = P.endless.bossTime;
    } else {
      isBoss = true;
      hp = B.ceil(B.mul(enemyMaxHp(m.floor, true), P.personal.diffs.find(x => x.id === m.diff).hp));
      name = m.name + ' · ' + m.diffName;
    }
    const final = m.kind === 'personal';
    s.enemy = { hp, maxHp: hp, isBoss, final, alive: true, mark: 0, markPower: 1, rare: null, phase: 1, vuln: 0, name };
    s.bossTimeLeft = m.timeLeft;
    s.respawn = 0;
  }
  function modeKill(s, events) {
    const m = s.mode, P = CONFIG.pve;
    s.stats.kills++; cnt(s, 'kill');
    if (m.kind === 'endless') cnt(s, 'wave');
    events.push({ type: 'kill', gold: 0, boss: s.enemy.isBoss, mode: true });
    if (m.kind === 'endless') {
      if (s.enemy.isBoss) {
        const e = P.endless.essenceBase + Math.floor(m.step / P.endless.essenceStep);
        m.essence += e; s.essence += e;
        if (m.step > s.pve.endlessBest) { m.tickets++; s.tickets++; }   // новый рекордный рубеж — билет
        const bone = rollBone(s, CONFIG.bones.dropEndless, m.step);
        if (bone) events.push({ type: 'bone', bone });
      }
      s.pve.endlessBest = Math.max(s.pve.endlessBest, m.step);
      m.step++;
      return;
    }
    if (m.step < m.total) { m.step++; return; }
    finishMode(s, true, events);
  }
  function modeTimer(s, dt, events) {
    const m = s.mode;
    if (m.kind === 'endless' && !s.enemy.isBoss) return;     // таймер только у контрольного босса
    m.timeLeft -= dt; s.bossTimeLeft = m.timeLeft;
    if (m.timeLeft <= 0) finishMode(s, m.kind === 'endless', events);
  }
  // Итог режима: награда при победе (в бесконечном — уже начислена по ходу), возврат в Башню
  function finishMode(s, win, events) {
    const m = s.mode, res = { type: 'modeEnd', kind: m.kind, name: m.name, win, reward: {} };
    if (win && (m.kind === 'dungeon' || m.kind === 'event')) cnt(s, 'dungeon');
    if (win && m.kind === 'personal') cnt(s, 'personal');
    if (m.kind === 'dungeon' && win) {
      const r = dungeonReward(s, m.id, m.tier);
      if (r.gold) { s.gold = B.add(s.gold, r.gold); earnGold(s, r.gold); }
      if (r.shard) s.materials.shard += r.shard;
      if (r.runeTier != null) {
        const R = CONFIG.runes, k = R.kinds[Math.min(R.kinds.length - 1, Math.floor(s.rng() * R.kinds.length))];
        s.runes.push({ id: s.runeSeq++, type: k.id, tier: r.runeTier, lvl: 0 }); r.runeType = k.id;
      }
      res.reward = r;
    } else if (m.kind === 'event' && win) {
      const r = { lanterns: eventDungeonReward(m.tier) };
      s.event.lanterns += r.lanterns; addEventPoints(s, r.lanterns);
      res.reward = r;
    } else if (m.kind === 'personal' && win) {
      const r = personalReward(s, m.floor, m.diff);
      const bone = rollBone(s, CONFIG.bones.dropPersonal, m.floor);
      if (bone) r.bone = bone;
      s.materials.heart += r.heart; s.materials.shard += r.shard;
      res.reward = r;
    } else if (m.kind === 'endless') {
      res.reward = { waves: m.step - 1, essence: m.essence, tickets: m.tickets, best: s.pve.endlessBest };
    }
    exitMode(s);
    events.push(res, { type: 'spawn' });
    return res;
  }
  // Сдаться / выйти: попытка уже потрачена
  function leaveMode(s) {
    if (!s.mode) return [];
    const ev = [];
    finishMode(s, s.mode.kind === 'endless', ev);
    return ev;
  }
  function exitMode(s) {
    s.mode = null;
    s.buffs = { team: 0, tap: 0, teamPower: 1, tapPower: 1 };
    s.enemyIndex = Math.min(s.enemyIndex, CONFIG.enemiesPerFloor);
    spawn(s);
  }

  // ---------- еженедельные события ----------
  function weekNum(weekKey) { return Math.floor((dayNum(weekKey.replace(/^w/, '')) - dayNum(CONFIG.season.epoch)) / 7); }
  function eventFor(weekKey) { const L = CONFIG.events.list, n = weekNum(weekKey); return L[((n % L.length) + L.length) % L.length]; }
  function currentEvent(s) { return s.event && CONFIG.events.list.find(x => x.id === s.event.id) || null; }
  function newEventState(week, id) { return { week, id, points: 0, lanterns: 0, ms: {}, bought: {} }; }
  // Новая неделя — новое событие. Незабранные вехи уже лежат в «Наградах», фонари сгорают
  function eventReset(s, weekKey) {
    if (s.event.week !== weekKey) s.event = newEventState(weekKey, eventFor(weekKey).id);
    return currentEvent(s);
  }
  function addEventPoints(s, n) {
    if (!s.event || !s.event.id || !n) return;
    s.event.points += n;
    CONFIG.events.milestones.forEach((m, i) => {
      if (s.event.points >= m.at && !s.event.ms[i]) {
        s.event.ms[i] = true;
        inboxAdd(s, 'Событие «' + currentEvent(s).name + '»: ' + m.at + ' очков', m.reward);
      }
    });
  }
  function eventDungeonReward(tier) { const E = CONFIG.events; return E.dungeonLanterns + E.lanternsPerTier * tier; }
  function shopLeft(s, id) { const it = CONFIG.events.shop.find(x => x.id === id); return it ? it.limit - (s.event.bought[id] | 0) : 0; }
  function buyEventItem(s, id) {
    const it = CONFIG.events.shop.find(x => x.id === id);
    if (!it || !currentEvent(s) || shopLeft(s, id) <= 0 || s.event.lanterns < it.cost) return null;
    s.event.lanterns -= it.cost; s.event.bought[id] = (s.event.bought[id] | 0) + 1;
    grant(s, it.reward);
    return it.reward;
  }
  function modeRule(s) { return s.mode && s.mode.rule || null; }

  // ---------- центр наград ----------
  function inboxAdd(s, title, reward) { s.inbox.push({ id: s.inboxSeq++, title, reward: { ...reward } }); }
  function claimInbox(s, id) {
    const i = s.inbox.findIndex(x => x.id === id);
    if (i < 0) return null;
    const it = s.inbox.splice(i, 1)[0];
    grantSeason(s, it.reward);
    return it.reward;
  }
  function claimInboxAll(s) {
    if (!s.inbox.length) return null;
    const sum = {}, n = s.inbox.length;
    for (const it of s.inbox) { grantSeason(s, it.reward); for (const k in it.reward) sum[k] = (sum[k] || 0) + it.reward[k]; }
    s.inbox = [];
    return { count: n, reward: sum };
  }

  // ---------- задания ----------
  function allQuests() { const Q = CONFIG.quests; return [...Q.daily.map(q => ({ ...q, period: 'daily' })), ...Q.weekly.map(q => ({ ...q, period: 'weekly' })), ...Q.intro.map(q => ({ ...q, period: 'intro' })), ...Q.ritual.map(q => ({ ...q, period: 'ritual' }))]; }
  const QUESTS = allQuests();
  function questDef(id) { return QUESTS.find(q => q.id === id); }
  // Новый день / неделя: запоминаем счётчики на начало периода, отметки «забрано» сбрасываются
  function questsReset(s, day, week) {
    const Q = s.quests;
    if (day && Q.day !== day) {
      Q.day = day; Q.dayBase = { ...s.counters }; for (const q of CONFIG.quests.daily) delete Q.claimed[q.id]; Q.chests = {};
      inboxAdd(s, 'Ежедневный подарок', CONFIG.dailyGift);
    }
    if (week && Q.week !== week) { Q.week = week; Q.weekBase = { ...s.counters }; for (const q of CONFIG.quests.weekly) delete Q.claimed[q.id]; }
  }
  function questProgress(s, id) {
    const q = questDef(id), Q = s.quests;
    let v;
    if (q.key === 'allDaily') v = CONFIG.quests.daily.filter(x => x.id !== q.id && questDone(s, x.id)).length;
    else if (q.value === 'floor') v = s.bestFloor;
    else if (q.value === 'hired') v = s.squad.filter(id => s.allies[id].level > 0).length;
    else if (q.value === 'runFloor') v = s.maxFloor;
    else if (q.value === 'runHire') v = CONFIG.allies.filter(a => s.allies[a.id].level > 0).length;
    else {
      const total = s.counters[q.key] || 0;
      v = q.period === 'daily' ? total - (Q.dayBase[q.key] || 0) : q.period === 'weekly' ? total - (Q.weekBase[q.key] || 0)
        : q.period === 'ritual' ? total - (Q.runBase[q.key] || 0) : total;
    }
    return Math.min(q.goal, Math.max(0, v));
  }
  function questDone(s, id) { return questProgress(s, id) >= questDef(id).goal; }
  function questClaimable(s, id) { return questDone(s, id) && !s.quests.claimed[id]; }
  function grant(s, r) {
    if (r.souls) { s.souls = B.add(s.souls, r.souls); s.stats.soulsEarned = B.add(s.stats.soulsEarned, r.souls); }
    if (r.tickets) s.tickets += r.tickets;
    if (r.essence) s.essence += r.essence;
    if (r.shard) s.materials.shard += r.shard;
    if (r.heart) s.materials.heart += r.heart;
  }
  function claimQuest(s, id) {
    if (!questDef(id) || !questClaimable(s, id)) return null;
    s.quests.claimed[id] = true;
    const r = questDef(id).reward;
    grant(s, r);
    s.season.xp += CONFIG.season.questXp[questDef(id).period] || 0;
    return r;
  }
  // «Забрать всё»: суммарная награда; «все задания дня» проверяется последним
  function claimAll(s) {
    const sum = {};
    let n = 0;
    for (const pass of [0, 1]) for (const q of QUESTS) {
      if ((q.key === 'allDaily') !== !!pass) continue;
      const r = claimQuest(s, q.id);
      if (r) { n++; for (const k in r) sum[k] = (sum[k] || 0) + r[k]; }
    }
    return n ? { count: n, reward: sum } : null;
  }
  // ---------- сундуки заданий ----------
  function dailyClaimedCount(s) { return CONFIG.quests.daily.filter(q => s.quests.claimed[q.id]).length; }
  function questChestReady(s, i) { const c = CONFIG.questChests[i]; return !!c && !s.quests.chests[i] && dailyClaimedCount(s) >= c.need; }
  function openQuestChest(s, i) {
    if (!questChestReady(s, i)) return null;
    s.quests.chests[i] = true;
    const r = CONFIG.questChests[i].reward; grant(s, r); return r;
  }
  function questChestsReady(s) { return CONFIG.questChests.filter((c, i) => questChestReady(s, i)).length; }

  // ---------- бонус за вход ----------
  // Номер дня (1…30), который можно забрать сейчас, или 0 — сегодня уже забрано
  function loginDayIndex(s) { return s.login.n % CONFIG.login.days.length; }
  function loginAvailable(s, dayKey) { return s.login.day !== dayKey; }
  function claimLogin(s, dayKey) {
    if (!loginAvailable(s, dayKey)) return null;
    const i = loginDayIndex(s), r = CONFIG.login.days[i];
    s.login.day = dayKey; s.login.n++;
    grant(s, r);
    return { day: i + 1, reward: r };
  }

  // ---------- путешествие во времени ----------
  function travelReset(s, dayKey) { if (s.travel.day !== dayKey) { s.travel.day = dayKey; s.travel.used = 0; } }
  // Цена следующего путешествия: 0 — бесплатно, N — билетов, null — на сегодня всё
  function travelCost(s, dayKey) {
    travelReset(s, dayKey);
    const T = CONFIG.timeTravel;
    if (s.travel.used < T.freePerDay) return 0;
    if (s.travel.used < T.freePerDay + T.paidPerDay) return T.ticketCost;
    return null;
  }
  function timeTravel(s, dayKey) {
    const cost = travelCost(s, dayKey);
    if (cost == null || s.tickets < cost || !B.gt(offlineDps(s), 0)) return null;   // без авто-урона путешествие бесполезно — попытку не тратим
    s.tickets -= cost; s.travel.used++;
    return offlineProgress(s, CONFIG.timeTravel.hours * 3600);
  }

  // ---------- сезон и боевой пропуск ----------
  function dayNum(dayKey) { const [y, m, d] = dayKey.split('-').map(Number); return Math.round(Date.UTC(y, m - 1, d) / 864e5); }
  function seasonInfo(dayKey) {
    const S = CONFIG.season, d = dayNum(dayKey) - dayNum(S.epoch);
    const n = Math.floor(d / S.days) + 1, day = ((d % S.days) + S.days) % S.days + 1;
    const i = ((n - 1) % S.names.length + S.names.length) % S.names.length;
    return { n, day, daysLeft: S.days - day, name: S.names[i], hero: S.heroes[((n - 1) % S.heroes.length + S.heroes.length) % S.heroes.length] };
  }
  function newSeason(n) { return { n, xp: 0, tokens: 0, premium: false, free: {}, paid: {}, trail: 0, trailBase: null, catchupDay: '' }; }
  // Новый сезон: пропуск, тропа и жетоны начинаются заново; герои и их копии остаются навсегда
  function seasonReset(s, dayKey) {
    const info = seasonInfo(dayKey);
    if (s.season.n !== info.n) {
      // незабранные награды пропуска прошлого сезона — автоматически в «Награды»
      if (s.season.n > 0) {
        const sum = {}; let n = 0;
        for (let l = 1; l <= passLevel(s); l++) for (const t of ['free', 'paid']) {
          if ((t === 'paid' && !s.season.premium) || (t === 'paid' ? s.season.paid[l] : s.season.free[l])) continue;
          const r = passReward(l, t); delete r.tokens; n++;
          for (const k in r) sum[k] = (sum[k] || 0) + r[k];
        }
        if (n) inboxAdd(s, 'Незабранное за сезон ' + s.season.n + ' (' + n + ' наград)', sum);
      }
      s.season = newSeason(info.n);
    }
    if (!s.season.trailBase) s.season.trailBase = { ...s.counters };
    return info;
  }
  function passLevel(s) { const S = CONFIG.season; return Math.min(S.passLevels, Math.floor(s.season.xp / S.xpPerLevel)); }
  function passReward(level, track) {
    const S = CONFIG.season, ms = level % S.milestoneEvery === 0;
    const base = track === 'paid' ? S.paid : S.free, extra = ms ? (track === 'paid' ? S.milestonePaid : S.milestoneFree) : {};
    const r = { ...base };
    for (const k in extra) r[k] = (r[k] || 0) + extra[k];
    return r;
  }
  function grantSeason(s, r) { grant(s, r); if (r.tokens) s.season.tokens += r.tokens; }
  function claimPass(s, level, track) {
    const ss = s.season;
    if (!Number.isInteger(level) || level < 1 || level > passLevel(s)) return null;
    if (track === 'paid' && !ss.premium) return null;
    const box = track === 'paid' ? ss.paid : ss.free;
    if (box[level]) return null;
    box[level] = true;
    const r = passReward(level, track);
    grantSeason(s, r);
    return r;
  }
  function claimPassAll(s) {
    const sum = {}; let n = 0;
    for (let l = 1; l <= passLevel(s); l++) for (const t of ['free', 'paid']) {
      const r = claimPass(s, l, t);
      if (r) { n++; for (const k in r) sum[k] = (sum[k] || 0) + r[k]; }
    }
    return n ? { count: n, reward: sum } : null;
  }
  // Премиум-дорожка: в прототипе включается бесплатно, для проверки (оплаты нет)
  function setPremium(s, on) { s.season.premium = !!on; }
  // Догон: ожидаемый уровень = доля прошедших дней сезона × все уровни
  function expectedPassLevel(dayKey) { const S = CONFIG.season, i = seasonInfo(dayKey); return Math.floor(S.passLevels * i.day / S.days); }
  function catchupAvailable(s, dayKey) { return s.season.catchupDay !== dayKey && passLevel(s) < expectedPassLevel(dayKey) && passLevel(s) < CONFIG.season.passLevels; }
  function useCatchup(s, dayKey) {
    if (!catchupAvailable(s, dayKey)) return false;
    s.season.catchupDay = dayKey; s.season.xp += CONFIG.season.catchupXp;
    return true;
  }
  // Тропа сезона: одно текущее задание, прогресс с момента, когда оно стало текущим
  function trailStep(s) { return CONFIG.season.trail[s.season.trail] || null; }
  function trailProgress(s) {
    const t = trailStep(s);
    if (!t) return 0;
    return Math.min(t.goal, Math.max(0, (s.counters[t.key] || 0) - ((s.season.trailBase || {})[t.key] || 0)));
  }
  function claimTrail(s, dayKey) {
    const S = CONFIG.season, t = trailStep(s);
    if (!t || trailProgress(s) < t.goal) return null;
    s.season.trail++; s.season.trailBase = { ...s.counters };
    s.season.tokens += S.trailTokens; s.season.xp += S.trailXp;
    const r = { tokens: S.trailTokens, xp: S.trailXp };
    if (s.season.trail === S.trail.length) {             // финал тропы — сезонный герой бесплатно
      const id = seasonInfo(dayKey).hero, h = s.heroes[id];
      if (h.unlocked) h.copies++; else h.unlocked = true;
      r.hero = id;
    }
    return r;
  }
  // Гарантированный обмен жетонов на сезонного героя (или его копию)
  function seasonHeroCost(s, dayKey) { const id = seasonInfo(dayKey).hero; return s.heroes[id].unlocked ? CONFIG.season.copyCost : CONFIG.season.heroCost; }
  function buySeasonHero(s, dayKey) {
    const id = seasonInfo(dayKey).hero, cost = seasonHeroCost(s, dayKey);
    if (s.season.tokens < cost) return null;
    s.season.tokens -= cost;
    const h = s.heroes[id];
    if (h.unlocked) h.copies++; else h.unlocked = true;
    return id;
  }

  // ---------- достижения ----------
  function achDef(id) { return CONFIG.achievements.list.find(a => a.id === id); }
  function achValue(s, a) {
    switch (a.metric) {
      case 'floor': return s.bestFloor;
      case 'heroes': return CONFIG.allies.filter(x => s.heroes[x.id].unlocked).length;
      case 'endless': return s.pve.endlessBest;
      case 'totems': return totemCount(s);
      case 'ritual': return s.rituals;
      default: return s.counters[a.metric] || 0;
    }
  }
  function achTier(s, id) { return s.ach[id] | 0; }                  // сколько ступеней уже забрано
  function achClaimable(s, id) { const a = achDef(id), t = achTier(s, id); return t < a.goals.length && achValue(s, a) >= a.goals[t]; }
  function achPoints(s) { let n = 0; for (const id in s.ach) n += s.ach[id]; return n; }
  // ---------- коллекция героев ----------
  function collectionSets(s) {
    return CONFIG.rarities.filter(r => {
      const pool = CONFIG.allies.filter(a => a.rarity === r && !a.seasonal);
      return pool.length && pool.every(a => s.heroes[a.id].unlocked);
    });
  }
  function collectionMult(s) {
    const K = CONFIG.collection;
    let n = 0, stars = 0;
    for (const a of CONFIG.allies) if (s.heroes[a.id].unlocked) { if (!a.starter) n++; stars += s.heroes[a.id].stars; }   // стартовый отряд дан даром
    return 1 + K.perHero * n + K.perStar * stars;
  }
  function collectionAllyMult(s) { return 1 + collectionSets(s).reduce((t, r) => t + CONFIG.collection.setAlly * (CONFIG.rarities.indexOf(r) + 1), 0); }
  function achMult(s) { return 1 + CONFIG.achievements.dmgPerPoint * achPoints(s); }
  function claimAch(s, id) {
    const a = achDef(id);
    if (!a || !achClaimable(s, id)) return null;
    s.ach[id] = achTier(s, id) + 1;
    grant(s, a.reward);
    return a.reward;
  }
  function claimAllAch(s) {
    const sum = {}; let n = 0;
    for (const a of CONFIG.achievements.list) for (;;) { const r = claimAch(s, a.id); if (!r) break; n++; for (const k in r) sum[k] = B.add(sum[k] || 0, r[k]); }
    return n ? { count: n, reward: sum } : null;
  }
  function achClaimableCount(s) { return CONFIG.achievements.list.filter(a => achClaimable(s, a.id)).length; }

  function claimableCount(s) { return QUESTS.filter(q => questClaimable(s, q.id)).length; }

  // ---------- офлайн ----------
  // Средний авто-урон без тапов, ультимейтов и способностей, с учётом критов
  function offlineDps(s) { return B.mul(autoDps(s), (1 + critChance({ ...s, abilities: newAbilities() }) * (critMult(s) - 1)) * (1 + treePower(s, 'offlineDmg'))); }
  function killTime(hp, dps) { return Math.max(B.toNum(B.div(hp, dps)), CONFIG.offline.minKillSec) + CONFIG.respawnDelaySec; }
  // Проиграть отсутствие: продвижение до стены (босс не успевает умереть за таймер), потом фарм этажа ниже.
  // Возвращает сводку или null, если отсутствие короче minSec.
  function offlineProgress(s, seconds) {
    const O = CONFIG.offline;
    if (!(seconds >= O.minSec)) return null;
    if (s.mode) exitMode(s);                                // ушёл из подземелья — вернулся в Башню
    const secs = Math.min(seconds, O.maxSec);
    const r = { seconds: secs, capped: seconds > O.maxSec, fromFloor: s.floor, gold: 0, kills: 0,
                floorsCleared: 0, wallFloor: null, farmFloor: null, shard: 0, heart: 0, tickets: 0 };
    const gold0 = s.gold, kills0 = s.stats.kills, sh0 = s.materials.shard, he0 = s.materials.heart, t0 = s.tickets;
    for (const a of CONFIG.abilities) s.abilities[a.id].cd = Math.max(0, s.abilities[a.id].cd - secs);
    const dps = offlineDps(s);
    let t = 0;
    if (B.gt(dps, 0)) {
      // Был в фарме после проигрыша — снова пробуем рубеж (самый высокий открытый этаж)
      if (s.farming) { s.floor = s.maxFloor; s.enemyIndex = CONFIG.enemiesPerFloor; s.farming = false; }
      const events = [];
      while (!s.farming) {
        const isBoss = s.enemyIndex === CONFIG.enemiesPerFloor;
        const hp = enemyMaxHp(s.floor, isBoss);
        if (isBoss && B.toNum(B.div(hp, B.mul(dps, bossDmgMult(s)))) > bossTime(s)) {             // стена: босс не умирает за таймер
          r.wallFloor = s.floor;
          s.floor = Math.max(1, s.floor - 1); s.enemyIndex = 1; s.farming = true;
          break;
        }
        const kt = killTime(hp, dps);
        if (t + kt > secs) break;
        t += kt;
        const f = s.floor;
        rewardKill(s, isBoss, events);
        if (isBoss) r.floorsCleared++;
        if (s.floor !== f) events.length = 0;               // события не копим
      }
      if (s.farming) {
        // Фарм обычных врагов 1–9 этажа ниже стены — сразу за всё оставшееся время
        r.farmFloor = s.floor;
        const kt = killTime(enemyMaxHp(s.floor, false), dps);
        const n = Math.floor((secs - t) / kt);
        const per = CONFIG.enemiesPerFloor - 1;
        const fg = B.mul(n, B.ceil(B.mul(killGold(s.floor, false), goldMult(s))));
        s.gold = B.add(s.gold, fg); earnGold(s, fg);
        s.stats.kills += n; cnt(s, 'kill', n); addEventPoints(s, n * CONFIG.events.pointsKill);
        s.enemyIndex = 1 + (s.enemyIndex - 1 + n) % per;
      }
    }
    r.toFloor = s.floor;
    r.gold = B.sub(s.gold, gold0); r.kills = s.stats.kills - kills0;
    r.shard = s.materials.shard - sh0; r.heart = s.materials.heart - he0; r.tickets = s.tickets - t0;
    spawn(s);
    return r;
  }

  function fireUlt(s, a, events) {
    const u = a.ult;
    events.push({ type: 'ult', id: a.id, name: u.name, kind: u.kind });
    if (u.kind === 'nuke') dealDamage(s, allyDps(s, a.id) * u.power, 'ult:' + a.id, events);
    else if (u.kind === 'teamBuff') { s.buffs.team = u.duration; s.buffs.teamPower = u.power; }
    else if (u.kind === 'tapBuff') { s.buffs.tap = u.duration; s.buffs.tapPower = u.power; }
    else if (u.kind === 'mark') { s.enemy.mark = u.duration; s.enemy.markPower = u.power; }
  }

  function challengeBoss(s) {
    if (s.mode) return [];
    s.farming = false;
    s.enemyIndex = CONFIG.enemiesPerFloor;
    spawn(s);
    return [{ type: 'spawn' }];
  }

  function goToFloor(s, floor) {
    if (s.mode || !Number.isInteger(floor) || floor < 1 || floor > s.maxFloor || floor === s.floor) return [];
    s.floor = floor;
    s.enemyIndex = 1;
    s.farming = floor < s.maxFloor ? s.farming : false;
    spawn(s);
    return [{ type: 'floor', floor }, { type: 'spawn' }];
  }

  // n: число уровней или 'max'
  // ---------- ранги и потолки уровней ----------
  // k — число пройденных ступеней (0…100). Ранг = ⌊k/10⌋+1 (до 10), подранг = k mod 10.
  function maxSteps() { const R = CONFIG.ranks; return R.count * R.subs; }
  function capAt(k) {
    const R = CONFIG.ranks, t = Math.min(k, maxSteps()) / maxSteps();
    return Math.round(R.capMin * Math.pow(R.capMax / R.capMin, t) / 10) * 10;
  }
  function rankLabel(k) {
    const R = CONFIG.ranks;
    if (k >= maxSteps()) return { rank: R.count, sub: R.subs, max: true };
    return { rank: Math.floor(k / R.subs) + 1, sub: k % R.subs, max: false };
  }
  function tapCap(s) { return capAt(s.heroRank); }
  function allyCap(s, id) { return capAt(s.heroes[id].rank); }
  // Цена следующей ступени: who = 'hero' или id союзника. null — предел.
  function rankCost(s, who) {
    const R = CONFIG.ranks, hero = who === 'hero', a = !hero && allyDef(who);
    if (!hero && !a) return null;
    const k = hero ? s.heroRank : s.heroes[who].rank;
    if (k >= maxSteps()) return null;
    const next = k + 1, newRank = next % R.subs === 0 && next < maxSteps() ? next / R.subs : 0;   // переход на ранг newRank+1
    const mult = hero ? 1 : CONFIG.evolution.rarityCost[a.rarity];
    const needEvo = !hero && newRank ? R.evoFor[newRank] || 0 : 0;
    return { step: next, cap: capAt(next), shards: Math.ceil(R.shards * Math.pow(R.growth, k) * mult),
             hearts: newRank ? newRank + 1 : 0, needEvo, newRank: newRank ? newRank + 1 : 0 };
  }
  function canRankUp(s, who) {
    const c = rankCost(s, who);
    if (!c || s.materials.shard < c.shards || s.materials.heart < c.hearts) return false;
    if (who !== 'hero' && (!s.heroes[who].unlocked || s.heroes[who].evo < c.needEvo)) return false;
    return true;
  }
  function rankUp(s, who) {
    if (!canRankUp(s, who)) return false;
    const c = rankCost(s, who);
    s.materials.shard -= c.shards; s.materials.heart -= c.hearts;
    if (who === 'hero') s.heroRank++; else s.heroes[who].rank++;
    cnt(s, 'rank');
    return true;
  }
  function buyTap(s, n) {
    let count = n === 'max' ? maxAffordable(s.tapLevel, s.gold) : n;
    if (Number.isInteger(count)) count = Math.min(count, tapCap(s) - s.tapLevel);
    if (!Number.isInteger(count) || count <= 0) return false;
    const cost = upgradeCost(s.tapLevel, count);
    if (B.gt(cost, s.gold)) return false;
    s.gold = B.sub(s.gold, cost);

    return true;
  }

  // ---------- способности главного героя ----------
  function abilityUnlocked(s, id) { return Math.max(s.maxFloor, s.bestFloor) >= abilityDef(id).unlockFloor; }
  function abilityReady(s, id) { return abilityUnlocked(s, id) && s.abilities[id].cd <= 0; }
  function useAbility(s, id) {
    const def = abilityDef(id);
    if (!def || !abilityReady(s, id)) return [];
    const st = s.abilities[id];
    st.cd = def.cooldown * Math.max(0.2, 1 - treePower(s, 'abilityCd')); st.active = def.duration; st.acc = 0;
    return [{ type: 'ability', id, name: def.name }];
  }
  function setAbilityAuto(s, id, on) { if (abilityDef(id)) s.abilities[id].auto = !!on; }

  function tickAbilities(s, dt, events) {
    for (const def of CONFIG.abilities) {
      const st = s.abilities[def.id];
      st.cd = Math.max(0, st.cd - dt);
      if (st.active > 0) {
        if (def.id === 'flurry' && s.enemy.alive) {

          while (st.acc >= 1 && s.enemy.alive) { st.acc -= 1; if (modeRule(s) !== 'alliesOnly') dealDamage(s, tapDamage(s), 'tap', events); }
        }
        st.active = Math.max(0, st.active - dt);
      }
      if (st.auto && s.enemy.alive && abilityReady(s, def.id)) events.push(...useAbility(s, def.id));
    }
  }

  function buyAlly(s, id, n) {
    if (!allyDef(id) || !s.heroes[id].unlocked) return false;
    let count = n === 'max' ? allyMax(s, id) : n;
    if (Number.isInteger(count)) count = Math.min(count, allyCap(s, id) - s.allies[id].level);
    if (!Number.isInteger(count) || count <= 0) return false;
    const cost = allyCost(s, id, count);

    s.allies[id].level += count;
    return true;
  }

  // ---------- портал, звёзды, отряд ----------
  function ticketsForFloor(f) {
    const p = CONFIG.portal;
    return f % 10 === 0 ? p.ticketsPerTenth : f % 5 === 0 ? p.ticketsPerFifth : 0;
  }
  const RANK = r => CONFIG.rarities.indexOf(r);
  function rollRarity(s, minRank, sPity) {
    const P = CONFIG.portal, odds = { ...P.odds };
    if (sPity != null && sPity > P.softS) odds.S += (sPity - P.softS) * P.softStep;   // возрастающие шансы
    const pool = CONFIG.rarities.filter(r => RANK(r) >= minRank);
    const total = pool.reduce((x, r) => x + odds[r], 0);
    let roll = s.rng() * total;
    for (const r of pool) { roll -= odds[r]; if (roll < 0) return r; }
    return pool[pool.length - 1];
  }
  function bannerDef(id) { return CONFIG.portal.banners.find(b => b.id === id); }
  // Герои недели тематического баннера (A и S из портала, по кругу по номеру недели)
  function featuredHeroes(s) {
    const pool = CONFIG.allies.filter(a => !a.hidden && !a.seasonal && RANK(a.rarity) >= RANK('A'));
    const w = s.event && s.event.week ? weekNum(s.event.week) : 0, n = bannerDef('theme').featured, out = [];
    for (let i = 0; i < n; i++) out.push(pool[(((w * n + i) % pool.length) + pool.length) % pool.length].id);
    return out;
  }
  function bannerPity(s, id) { return id === 'normal' ? s.pity : (s.bpity[id] = s.bpity[id] || { a: 0, s: 0 }); }
  function bannerCost(id, n) { const c = bannerDef(id).cost; return { tickets: (c.tickets || 0) * n, lanterns: (c.lanterns || 0) * n }; }
  function canSummon(s, id, n) {
    const b = bannerDef(id); if (!b || !Number.isInteger(n) || n <= 0) return false;
    if (id === 'event' && !currentEvent(s)) return false;
    const c = bannerCost(id, n);
    return s.tickets >= c.tickets && s.event.lanterns >= c.lanterns;
  }
  // n призывов на баннере. Гарантии: S+ каждые pityS, A+ каждые pityA призывов без них; перед S — возрастающие шансы.
  function summon(s, n, bannerId) {
    const id = bannerId || 'normal', b = bannerDef(id), P = CONFIG.portal;
    if (!canSummon(s, id, n)) return null;
    const c = bannerCost(id, n);
    s.tickets -= c.tickets; s.event.lanterns -= c.lanterns; cnt(s, 'summon', n);
    const pity = bannerPity(s, id), pA = b.pityA || P.pityA, pS = b.pityS || P.pityS, base = b.minRarity ? RANK(b.minRarity) : 0;
    const feat = b.featured ? featuredHeroes(s) : [];
    const out = [];
    for (let i = 0; i < n; i++) {
      pity.a++; pity.s++;
      const min = pity.s >= pS ? RANK('S') : pity.a >= pA ? Math.max(base, RANK('A')) : base;
      const rarity = rollRarity(s, min, pity.s);
      if (RANK(rarity) >= RANK('A')) pity.a = 0;
      if (RANK(rarity) >= RANK('S')) pity.s = 0;
      const pool = CONFIG.allies.filter(a => a.rarity === rarity && !a.hidden && !a.seasonal);
      const fp = pool.filter(a => feat.includes(a.id));
      const hero = fp.length && s.rng() < b.featuredRate ? fp[Math.floor(s.rng() * fp.length) % fp.length]
        : pool[Math.min(pool.length - 1, Math.floor(s.rng() * pool.length))];
      const h = s.heroes[hero.id];
      const isNew = !h.unlocked;
      if (isNew) h.unlocked = true; else h.copies++;
      out.push({ id: hero.id, rarity, isNew });
    }
    return out;
  }
  function starCost(s, id) {
    const st = s.heroes[id].stars;
    return st >= CONFIG.maxStars ? null : CONFIG.starCopies[st];
  }
  function starUp(s, id) {
    const h = s.heroes[id], need = h && starCost(s, id);
    if (!h || !h.unlocked || need == null || h.copies < need) return false;
    h.copies -= need; h.stars++; cnt(s, 'star');
    return true;
  }
  function squadAdd(s, id) {
    if (!allyDef(id) || !s.heroes[id].unlocked || inSquad(s, id) || s.squad.length >= CONFIG.squadSize) return false;
    s.squad.push(id);

  }
  function squadRemove(s, id) {
    const i = s.squad.indexOf(id);

  }

  // ---------- материалы и эволюция ----------
  function shardsForBoss(f) { const M = CONFIG.materials; return M.shardsPerBoss + Math.floor(f / M.shardsFloorStep); }
  function heartsForFloor(f) { return f % CONFIG.materials.heartEvery === 0 ? 1 : 0; }
  // Осколки — за любого босса; сердце — только за первое в игре прохождение (не повторяется после ритуала)
  function bossMaterials(s, f) {
    return { shard: Math.ceil(shardsForBoss(f) * shardMult(s)), heart: f > s.heartFloor ? heartsForFloor(f) : 0 };
  }
  // Требования следующей ступени или null, если эволюция завершена
  function evoCost(s, id) {
    const a = allyDef(id), E = CONFIG.evolution, st = a && E.stages[s.heroes[id].evo];
    if (!st) return null;
    return { stage: s.heroes[id].evo + 1, name: st.name, stars: st.stars, mult: st.mult,
             shards: Math.ceil(st.shards * E.rarityCost[a.rarity]), hearts: st.hearts };
  }
  function canEvolve(s, id) {
    const c = evoCost(s, id), h = s.heroes[id];
    return !!c && h.unlocked && h.stars >= c.stars && s.materials.shard >= c.shards && s.materials.heart >= c.hearts;
  }
  function evolve(s, id) {
    if (!canEvolve(s, id)) return false;

    s.materials.shard -= c.shards; s.materials.heart -= c.hearts;
    s.heroes[id].evo++; cnt(s, 'evolve');

  }
  // Алтарь: гарантированная альтернатива — осколки в сердце
  function forgeHeart(s, n) {
    const cost = CONFIG.materials.heartRecipe * n;
    if (!Number.isInteger(n) || n <= 0 || s.materials.shard < cost) return false;
    s.materials.shard -= cost; s.materials.heart += n;

  }

  // ---------- руны: создание, улучшение, слияние ----------
  function createRune(s) {
    const R = CONFIG.runes;
    if (s.materials.shard < R.createCost) return null;
    s.materials.shard -= R.createCost;
    const k = R.kinds[Math.min(R.kinds.length - 1, Math.floor(s.rng() * R.kinds.length))];
    const r = { id: s.runeSeq++, type: k.id, tier: 0, lvl: 0 };
    s.runes.push(r); cnt(s, 'rune');
    return r;
  }
  function runeById(s, id) { return s.runes.find(r => r.id === id); }
  function runeUpCost(r) {
    const R = CONFIG.runes;
    return r.lvl >= R.maxLevel ? null : Math.ceil(R.upCost * (r.tier + 1) * Math.pow(R.upGrowth, r.lvl));
  }
  function upgradeRune(s, id) {
    const r = runeById(s, id), c = r && runeUpCost(r);
    if (!c || s.materials.shard < c) return false;
    s.materials.shard -= c; r.lvl++;
    return true;
  }
  // Можно ли слить: есть mergeCount рун вида и редкости, и это не высшая редкость
  function mergeable(s, type, tier) {

  }
  // Слияние берёт руны с наименьшим уровнем; новая руна — следующей редкости, уровень 0
  function mergeRunes(s, type, tier) {
    if (!mergeable(s, type, tier)) return null;
    const use = s.runes.filter(r => r.type === type && r.tier === tier).sort((a, b) => a.lvl - b.lvl).slice(0, CONFIG.runes.mergeCount);
    s.runes = s.runes.filter(r => !use.includes(r));
    const r = { id: s.runeSeq++, type, tier: tier + 1, lvl: 0 };
    s.runes.push(r);
    return r;
  }
  // ---------- тотемы ----------
  function totemUpCost(s, id) {
    const T = CONFIG.totems, lv = s.totems[id];
    if (!lv || lv >= T.maxLevel) return null;
    return { shards: Math.ceil(T.upShards * Math.pow(T.upGrowth, lv - 1)), hearts: (lv + 1) % T.heartEvery === 0 ? 1 : 0 };
  }
  function upgradeTotem(s, id) {
    const c = totemUpCost(s, id);
    if (!c || s.materials.shard < c.shards || s.materials.heart < c.hearts) return false;
    s.materials.shard -= c.shards; s.materials.heart -= c.hearts; s.totems[id]++;
    return true;
  }

  // ---------- артефакты за души ----------
  function foundCount(s) { return CONFIG.artifacts.filter(a => artLevel(s, a.id) > 0).length; }
  function findCost(s) {
    const f = CONFIG.artifactFind;
    return foundCount(s) >= CONFIG.artifacts.length ? null : Math.ceil(f.cost * Math.pow(f.growth, foundCount(s)));
  }
  // Найти случайный ещё не найденный артефакт
  function findArtifact(s) {
    const cost = findCost(s);
    if (cost == null || B.lt(s.souls, cost)) return null;
    const pool = CONFIG.artifacts.filter(a => artLevel(s, a.id) === 0);
    const a = pool[Math.min(pool.length - 1, Math.floor(s.rng() * pool.length))];
    s.souls = B.sub(s.souls, cost);
    s.artifacts[a.id] = 1;
    return a.id;
  }
  function upgradeArtCost(s, id) {
    const a = artDef(id), lv = artLevel(s, id);
    if (!a || lv === 0 || (a.max && lv >= a.max)) return null;
    return Math.ceil(a.cost * Math.pow(a.growth, lv - 1));
  }
  function upgradeArtifact(s, id) {
    const cost = upgradeArtCost(s, id);
    if (cost == null || B.lt(s.souls, cost)) return false;
    s.souls = B.sub(s.souls, cost);
    s.artifacts[id]++;
    return true;
  }
  // Предпросмотр: ожидаемый DPS до и после траты душ (бонус неизрасходованных душ уменьшится)
  function previewSpend(s, action, id, tps) {
    const before = expectedDps(s, tps);
    const t = { ...s, souls: s.souls, artifacts: { ...s.artifacts }, tree: { ...s.tree } };
    if (action === 'upgrade') { const c = upgradeArtCost(s, id); if (c == null) return null; t.souls = B.sub(t.souls, c); t.artifacts[id]++; }
    if (action === 'tree') { const c = treeCost(s, id); if (c == null) return null; t.souls = B.sub(t.souls, c); t.tree[id] = treeLevel(s, id) + 1; }
    return { before, after: expectedDps(t, tps) };
  }

  // ---------- ритуал ----------
  function canRitual(s) { return s.maxFloor >= CONFIG.ritual.floor; }
  // Стартовый этаж следующего забега зависит только от артефакта «Врата восхождения»
  function ritualStartFloor(s) { return Math.min(CONFIG.ritual.floor - 1, 1 + Math.floor(artPower(s, 'startFloor'))); }
  function ritualSouls(s) {
    if (!canRitual(s)) return 0;
    const R = CONFIG.ritual;
    const lb = Math.log10(R.soulsBase) + (s.maxFloor - R.floor) * Math.log10(R.soulsGrowth);
    const base = lb >= LOGLIM ? B.fromLog10(lb) : Math.floor(R.soulsBase * Math.pow(R.soulsGrowth, s.maxFloor - R.floor));
    // бонус только за этажи выше прежнего рекорда (и выше этажа ритуала)
    const record = Math.max(0, s.maxFloor - Math.max(s.bestRecordAtRunStart, R.floor)) * R.recordBonus;
    return B.floor(B.mul(B.add(base, record), 1 + treePower(s, 'ritualSouls')));
  }
  // «Наследие»: стартовый запас золота = per·уровень × золото за босса стартового этажа
  function ritualStartGold(s) { return B.ceil(B.mul(treePower(s, 'startGold'), killGold(ritualStartFloor(s), true))); }
  function ritual(s) {

    s.souls = B.add(s.souls, souls); s.stats.soulsEarned = B.add(s.stats.soulsEarned, souls);

    s.quests.runBase = { ...s.counters };

    s.buffs = { team: 0, tap: 0, teamPower: 1, tapPower: 1 };

  }

  // ---------- Алтарь ----------
  function setLock(s, id, on) {

    return true;

  // Эссенция за выбор {id: копий}
  function sacrificeValue(sel) {

    return e;
  }
  function needsRareConfirm(sel) {

  // Все незаблокированные копии (массовый выбор)
  function selectAllUnlocked(s) {

  function sacrifice(s, sel) {
    if (!sel || typeof sel !== 'object') return null;
    const clean = {};
    for (const id in sel) {

  // ---------- сохранение ----------

  function deserialize(str) {

    if (d.v === 2) { d.v = 3; d.critChanceLevel = 0; d.critMultLevel = 0; d.abilities = {}; }   // 0.5 → 0.6

  // Облики эволюции (временные заглушки): I — сияние, II — наплечники и плащ, III — корона и ореол
  function allySvg(v, evo) {
    evo = evo || 0;
    const aura = evo >= 1 ? '<ellipse cx="50" cy="80" rx="44" ry="52" fill="' + v.eye + '" opacity="' + (0.10 + 0.05 * evo) + '"/>' : '';
    const cape = evo >= 2 ? '<path d="M30 60 Q16 96 20 126 L34 124 Z M70 60 Q84 96 80 126 L66 124 Z" fill="' + v.eye + '" opacity=".55" stroke="#0a0a10" stroke-width="2"/>' +
      '<path d="M26 64 Q34 52 44 58 L40 70 Z M74 64 Q66 52 56 58 L60 70 Z" fill="#c8ccd4" stroke="#0a0a10" stroke-width="2.5"/>' : '';
    const crown = evo >= 3 ? '<ellipse cx="50" cy="12" rx="17" ry="4.5" fill="none" stroke="' + v.eye + '" stroke-width="2.5"/>' +
      '<path d="M38 22 L41 12 L46 19 L50 9 L54 19 L59 12 L62 22 Z" fill="#ffd36b" stroke="#5a3a0a" stroke-width="1.5"/>' : '';
    return '<svg viewBox="0 0 100 130"><ellipse cx="50" cy="126" rx="34" ry="5" fill="#00000070"/>' + aura + cape +
      '<path d="M22 124 L34 58 Q50 46 66 58 L78 124 Q50 116 22 124Z" fill="' + v.body + '" stroke="#0a0a10" stroke-width="3"/>' +
      '<path d="M32 52 Q32 22 50 18 Q68 22 68 52 Q60 60 50 60 Q40 60 32 52Z" fill="' + v.hood + '" stroke="#0a0a10" stroke-width="3"/>' +
      '<ellipse cx="44" cy="44" rx="3" ry="2.4" fill="' + v.eye + '"/><ellipse cx="57" cy="44" rx="3" ry="2.4" fill="' + v.eye + '"/>' +
      WEAPON[v.weapon] + crown + '</svg>';
  }
  const allyUi = {};                 // id → { sprite, title, sub, btn }

    for (const a of CFG.allies) {

      layer.appendChild(sp);
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = '<div class="cardIcon" style="background:' + v.iconBg + '">' + v.icon + '</div>' +
        '<div class="cardInfo"><div class="cardTitle"></div><div class="cardSub"></div></div><button class="buy"></button>';
      cards.appendChild(card);
      // закрытый герой — плашка «Освободить героя»

      lk.querySelector('button').addEventListener('click', () => { tab = a.hidden ? 'altar' : a.seasonal ? 'season' : 'portal'; setCollapsed(false); render(); });
      cards.appendChild(lk);
      const btn = card.querySelector('.buy');
      btn.addEventListener('click', () => {
        if (btn.dataset.rank) { if (C.rankUp(s, a.id)) { toast('Новый ранг · ' + a.name + '<small>потолок уровня ' + fmt(C.allyCap(s, a.id)) + '</small>'); save(); render(); } return; }
        if (C.buyAlly(s, a.id, buyCount(s.allies[a.id].level))) { save(); render(); }
      });
      allyUi[a.id] = { lock: lk, evo: s.heroes[a.id].evo, fig: sp.querySelector('.fig'), card, ultBar: sp.querySelector('.ultBar'), ultFill: sp.querySelector('.ultBar i'), sprite: sp, title: card.querySelector('.cardTitle'), sub: card.querySelector('.cardSub'), btn, color: v.eye };
    }
  }

  const TAB_NAMES = { stats: 'Статистика', map: 'Карта Башни', bones: 'Кости', inbox: 'Награды', events: 'События', season: 'Сезон', up: 'Прокачка', quests: 'Задания', heroes: 'Герои', portal: 'Портал', altar: 'Алтарь', souls: 'Души', runes: 'Руны', pve: 'PvE' };
  // как в «Крушителях»: левый верхний угол — группа героя, правый — «Сумка» (стрелка «назад» справа),

  const GROUP_L = [['up', '⚔', 'Прокачка'], ['heroes', '🪖', 'Герои'], ['portal', '🌀', 'Портал'], ['altar', '🕯', 'Алтарь'], ['souls', '👻', 'Души']];
  const GROUP_R = [['runes', 'ᚦ', 'Руны'], ['bones', '🦴', 'Кости'], ['stats', '📊', 'Статистика'], ['inbox', '📬', 'Награды'], ['settings', '⚙', 'Настройки']];
  const POPUP_TABS = new Set(['quests', 'events', 'season']);
  const grpOf = t => GROUP_L.some(g => g[0] === t) ? 'L' : GROUP_R.some(g => g[0] === t) ? 'R' : null;
  let lastL = 'up', lastR = 'runes', navBang = {};
  function applyMode() {

    if (g && open) $('grpTabs').innerHTML = (g === 'L' ? GROUP_L : GROUP_R).map(([id, ic, nm]) =>

  }
  function setCollapsed(on) {
    $('panel').classList.toggle('collapsed', on);
    $('flyout').classList.remove('show');
    if (!on) applyMode();

  }
  setCollapsed(true);                    // на старте меню закрыто — весь экран под бой
  $('panelToggle').addEventListener('click', () => setCollapsed(true));
  $('popBack').addEventListener('click', () => setCollapsed(true));
  $('grpBack').addEventListener('click', () => setCollapsed(true));
  $('grpTabs').addEventListener('click', e => {

  // боковые кнопки открывают нужный раздел; повторное нажатие закрывает
  document.querySelectorAll('.sideBtn').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation();
    let t = b.dataset.open;
    if (t === '@book') { $('flyout').classList.toggle('show'); return; }
    if (t === '@L') t = lastL; if (t === '@R') t = lastR;

    if (open && tab === t) { setCollapsed(true); return; }
    tab = t; setCollapsed(false); render();
  }));
  const dmgLog = [];                    // [время, урон] для DPS
  let tapped = s.stats.taps > 0;

  for (let i = 1; i <= CFG.enemiesPerFloor; i++) {
    const d = document.createElement('div');
    d.className = 'dot' + (i === CFG.enemiesPerFloor ? ' boss' : '');

  // ---------- эффекты ----------
  // ---------- настройки устройства (GDD §12): качество, FPS, эффекты, вспышки, камера, вибрация ----------
  const SET_KEY = 'prizvannyy_v2_settings';
  const SET_DEF = { quality: 'high', fps: 60, fx: 'full', flash: 'on', shake: 'off', vibro: 'on', hitstop: 'on' };
  let setg = { ...SET_DEF };
  try { setg = { ...SET_DEF, ...JSON.parse(localStorage.getItem(SET_KEY) || '{}') }; } catch (e) {}
  const SET_ROWS = [
    { k: 'quality', name: 'Качество графики', opts: [['high', 'Высокое'], ['low', 'Низкое']] },
    { k: 'fps', name: 'Частота кадров', opts: [[60, '60'], [30, '30']] },
    { k: 'fx', name: 'Эффекты и числа урона', opts: [['full', 'Все'], ['less', 'Меньше'], ['off', 'Выкл']] },
    { k: 'flash', name: 'Вспышки критов', opts: [['on', 'Вкл'], ['off', 'Выкл']] },
    { k: 'shake', name: 'Тряска камеры при крите', opts: [['on', 'Вкл'], ['off', 'Выкл']] },
    { k: 'hitstop', name: 'Замирание при ударе (hit-stop)', opts: [['on', 'Вкл'], ['off', 'Выкл']] },
    { k: 'vibro', name: 'Вибрация', opts: [['on', 'Вкл'], ['off', 'Выкл']] },
  ];
  function applySettings() {
    document.body.classList.toggle('lowq', setg.quality === 'low');
    try { localStorage.setItem(SET_KEY, JSON.stringify(setg)); } catch (e) {}
  }
  function renderSettings() {
    $('setList').innerHTML = SET_ROWS.map(r => '<div class="setRow"><span>' + r.name + '</span><div class="opts">' +
      r.opts.map(([v, t]) => '<button data-sk="' + r.k + '" data-sv="' + v + '" class="' + (String(setg[r.k]) === String(v) ? 'on' : '') + '">' + t + '</button>').join('') + '</div></div>').join('');
  }
  applySettings();
  let fxCount = 0;
  function fx(cls, x, y, text, life) {
    // экономия эффектов: «Меньше» — только тапы, криты, ульты и золото; «Выкл» — без чисел и искр
    if (setg.fx !== 'full' && !/gold|nuke/.test(cls)) {
      if (setg.fx === 'off') return document.createElement('div');
      if (/auto/.test(cls) && !/crit/.test(cls) && (fxCount++ % 3)) return document.createElement('div');
    }
    if (cls === 'critFlash') {
      if (setg.shake === 'on') { el.arena.classList.remove('shake'); void el.arena.offsetWidth; el.arena.classList.add('shake'); }
      if (setg.flash === 'off') return document.createElement('div');
    }
    const n = document.createElement('div');
    if (cls === 'spark' || cls === 'critFlash') cls += ' art';
    n.className = cls; n.style.left = x + 'px'; n.style.top = y + 'px';
    if (text != null) n.textContent = text;
    el.arena.appendChild(n);
    setTimeout(() => n.remove(), life);
    return n;
  }
  function restartAnim(cls) {
    el.enemy.classList.remove('hit', 'spawn', 'dead');
    void el.enemy.offsetWidth;
    if (cls) el.enemy.classList.add(cls);
  }
  let toastTimer = 0;
  function toast(html) {
    el.toast.innerHTML = html; el.toast.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => el.toast.classList.remove('show'), 1600);
  }

  // ---------- hit-stop: длительность в мс (временные числа, TBD) ----------
  const HITSTOP = { tap: 45, crit: 110, ult: 140 };
  let hsUntil = 0, hsTimer = 0;
  function hitStop(ms) {
    if (setg.hitstop !== 'on') return;
    const now = performance.now(), end = now + ms;
    if (end <= hsUntil) return;                 // уже замерли дольше — не продлеваем мелкими ударами
    hsUntil = end; $('game').classList.add('hs');
    clearTimeout(hsTimer); hsTimer = setTimeout(() => $('game').classList.remove('hs'), ms);
  }

  // ---------- обработка событий ядра ----------
  function handle(events, x, y) {
    const r = el.arena.getBoundingClientRect();
    for (const e of events) {
      if (e.type === 'hit') {
        if (e.blocked) { fx('dmg', x, y, 'нет урона', 500).style.color = 'var(--muted)'; continue; }
        if (e.source === 'tap') {
          dmgLog.push([performance.now(), e.dmg, 'tap']);
          heroEl.classList.remove('attack'); void heroEl.offsetWidth; heroEl.classList.add('attack');
          fx('spark', x, y, null, 300);
          fx('slash', x, y, null, 240).style.setProperty('--r', (Math.random() * 70 - 35) + 'deg');
          hitStop(e.crit ? HITSTOP.crit : HITSTOP.tap);
          if (e.crit) fx('critFlash', x, y, null, 160);
          fx('dmg' + (e.crit ? ' crit' : ''), x + Math.random() * 30 - 15, y, (e.crit ? 'КРИТ ' : '') + fmt(e.dmg), e.crit ? 850 : 700);
        } else if (e.source === 'pet') {
          dmgLog.push([performance.now(), e.dmg, 'auto']);
          const pe = $('pet'); pe.classList.remove('attack'); void pe.offsetWidth; pe.classList.add('attack');
          const dx = r.width * (0.42 + Math.random() * 0.16), dy = r.height * (0.46 + Math.random() * 0.1);
          if (e.crit) { fx('critFlash', dx, dy, null, 160); hitStop(HITSTOP.crit); }
          const d = fx('dmg auto' + (e.crit ? ' crit' : ''), dx, dy, fmt(e.dmg), 700); if (!e.crit) d.style.color = '#d8b8ff';
        } else if (e.source === 'heroAuto') {
          dmgLog.push([performance.now(), e.dmg, 'auto']);
          heroEl.classList.remove('attack'); void heroEl.offsetWidth; heroEl.classList.add('attack');
          const dx = r.width * (0.44 + Math.random() * 0.12), dy = r.height * 0.5;
          if (e.crit) { fx('critFlash', dx, dy, null, 160); hitStop(HITSTOP.crit); }
          fx('dmg auto' + (e.crit ? ' crit' : ''), dx, dy, fmt(e.dmg), 700).style.color = e.crit ? '' : 'var(--gold)';
        } else {
          dmgLog.push([performance.now(), e.dmg, 'auto']);
          const isUlt = e.source.startsWith('ult:');
          if (isUlt) hitStop(HITSTOP.ult); else if (e.crit) hitStop(HITSTOP.crit);
          const u = allyUi[isUlt ? e.source.slice(4) : e.source];
          if (u && isUlt) {
            const d = fx('dmg nuke', r.width / 2, r.height * 0.4, fmt(e.dmg), 900);
            d.style.color = u.color;
          } else if (u) {
            u.sprite.classList.remove('attack'); void u.sprite.offsetWidth; u.sprite.classList.add('attack');
            const dx = r.width * (0.38 + Math.random() * 0.24), dy = r.height * (0.42 + Math.random() * 0.14);
            if (e.crit) fx('critFlash', dx, dy, null, 160);
            const d = fx('dmg auto' + (e.crit ? ' crit' : ''), dx, dy, fmt(e.dmg), 700);
            if (!e.crit) d.style.color = u.color;
          }
        }
        restartAnim('hit');
      } else if (e.type === 'kill') {
        restartAnim('dead');
        if (!e.mode) fx('dmg gold', r.width / 2, r.height * 0.35, '+' + fmt(e.gold) + ' ◆', 700);
        if (e.rare) toast(C.rareDef(e.rare).name + '!<small>+' + fmt(e.gold) + ' ◆' + (e.rare === 'crystal' ? ' и осколки' : '') + '</small>');
        if (e.boss) save();
      } else if (e.type === 'materials') {
        fx('dmg gold', r.width / 2, r.height * 0.28, '+' + e.shard + ' ' + CFG.materials.shard.icon, 900).style.color = '#8fd0ff';
        if (e.heart) setTimeout(() => toast('Сердце стража!<small>+' + e.heart + ' ' + CFG.materials.heart.icon + ' — для эволюции героев</small>'), 3200);
      } else if (e.type === 'phase') {
        const b = $('ultBanner');
        b.textContent = 'Фаза ' + e.phase + '/' + e.of + ' · босс уязвим!';
        b.style.color = 'var(--boss)';
        b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
      } else if (e.type === 'top') {
        toast('Вершина Башни!<small>Этаж ' + fmt(e.floor) + ' — выше пока не подняться</small>');
      } else if (e.type === 'modeEnd') {
        dmgLog.length = 0; save(); showModeEnd(e);
      } else if (e.type === 'modeStart') {
        const b = $('ultBanner'); b.textContent = e.name; b.style.color = '#8fb8ff';
        b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
      } else if (e.type === 'bone') {
        const bs = C.boneSlot(e.bone.slot);
        setTimeout(() => toast('Кость монстра!<small>' + bs.icon + ' ' + bs.name + ' · ' + CFG.rarities[e.bone.tier] + '</small>'), 2600);
      } else if (e.type === 'totem') {
        setTimeout(() => toast('Тотем получен!<small>🗿 ' + e.name + ' · вкладка «Руны»</small>'), 4800);
      } else if (e.type === 'biome') {
        setTimeout(() => toast('Новый биом<small>' + e.name + '</small>'), 600);
      } else if (e.type === 'tickets') {
        setTimeout(() => toast('Билеты портала<small>+' + e.n + ' 🎟</small>'), 1700);
      } else if (e.type === 'firstClear') {
        toast('Этаж ' + e.floor + ' пройден впервые!<small>+' + fmt(e.gold) + ' ◆</small>');
      } else if (e.type === 'bossFail') {
        toast('Время вышло!<small style="color:var(--muted)">Усились и вызови босса снова</small>');
        save();
      } else if (e.type === 'ability') {
        const b = $('ultBanner');
        b.textContent = 'Призванный · ' + e.name + '!';
        b.style.color = 'var(--gold)';
        b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
        heroEl.classList.remove('attack'); void heroEl.offsetWidth; heroEl.classList.add('attack');
        renderAbilities();
      } else if (e.type === 'ult') {
        const u = allyUi[e.id];
        u.sprite.classList.remove('ulting'); void u.sprite.offsetWidth; u.sprite.classList.add('ulting');
        const b = $('ultBanner');
        b.textContent = CFG.allies.find(a => a.id === e.id).name + ' · ' + e.name + '!';
        b.style.color = u.color;
        b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
      } else if (e.type === 'spawn') {
        restartAnim('spawn');
      }
    }
  }

  // ---------- ввод ----------
  el.arena.addEventListener('pointerdown', e => {
    if (e.target.closest('#farmBar') || e.target.closest('#modeBar') || e.target.closest('.sideBtn') || e.target.closest('#flyout')) { return; }
    $('flyout').classList.remove('show');

    if (navigator.vibrate && setg.vibro === 'on') navigator.vibrate(8);
    handle(ev, e.clientX - r.left, e.clientY - r.top);

  });
