  }
  // ---------- статистика (0.32) ----------
  let liveTapDps = 0, liveAllDps = 0;
  const goldLog = [];                      // [время, заработано золота] раз в секунду — для «золото/мин»
  function goldSample(now) {
    if (goldLog.length && now - goldLog[goldLog.length - 1][0] < 1000) return;
    goldLog.push([now, s.stats.goldEarned]);
    while (goldLog.length > 61) goldLog.shift();
  }
  function goldPerMin() {
    if (goldLog.length < 2) return 0;
    const a = goldLog[0], b = goldLog[goldLog.length - 1], span = (b[0] - a[0]) / 60000;
    return span > 0 ? B.max(0, B.div(B.sub(b[1], a[1]), span)) : 0;
  }
  function playTimeTxt(sec) {

  // ---------- карта Башни (0.32): путь по этажам биома, замки, финальный босс ----------
  let mapPage = null, mapHtml = '';

  let classPick = false, heroDetail = null;
  // экран героя (по образцу): портрет, характеристики, 6 слотов костей, кнопки развития
  function heroDetailHtml() {

        continue;
      }

      html += '<div class="hRow" style="--r:' + (act ? 'var(--gold)' : '#b98cff') + '"><div class="artIcon">' + p.icon + '</div><div class="hInfo">' +
        '<div class="hName">' + p.name + ' · ур. ' + lv + '/' + P.maxLevel + (act ? ' <span class="badge sq">в бою</span>' : '') + '</div>' +
        '<div class="hSub">' + Math.round(C.petShare(s, p.id) * 100) + '% DPS отряда · удар раз в ' + p.interval + ' с · ' + p.desc + '</div></div><div class="hBtns">' +
        (act ? '' : '<button class="hBtn go" data-pset="' + p.id + '">В бой</button>') +
        (up ? '<button class="hBtn' + (canUp ? ' go' : '') + '" data-pup="' + p.id + '"' + (canUp ? '' : ' disabled') + '>⬆ 🔹' + fmt(up) + '</button>' : '<button class="hBtn" disabled>max</button>') + '</div></div>';
    }
    return html;
  }

  // ---------- Алтарь ----------
  let altarSel = {}, altarHtml = '';
  function cleanSel() {
    for (const id in altarSel) {
      const max = s.locks[id] ? 0 : s.heroes[id].copies;
      altarSel[id] = Math.max(0, Math.min(altarSel[id], max));
      if (!altarSel[id]) delete altarSel[id];
    }
  }
  function renderAltar() {
    cleanSel();
    const A = CFG.altar;
    const total = Object.values(altarSel).reduce((a, b) => a + b, 0);
    const value = total ? C.sacrificeValue(altarSel) : 0;
    let html = '<div class="altHead"><div class="ess">✦ <b>' + fmt(s.essence) + '</b> эссенции</div><div class="altBtns">' +
      '<button class="hBtn go" data-act="all">Выбрать всё</button><button class="hBtn" data-act="none">Сброс</button></div></div>' +
      '<div class="hint2">Пожертвованные копии исчезают навсегда. 🔒 защищает копии героя от выбора.</div>';
    const list = CFG.allies.filter(a => s.heroes[a.id].unlocked)
      .sort((a, b) => RANKS.indexOf(b.rarity) - RANKS.indexOf(a.rarity));
    for (const a of list) {
      const h = s.heroes[a.id], v = ALLY_VIS[a.id], n = altarSel[a.id] || 0, locked = !!s.locks[a.id];
      html += '<div class="hRow r-' + a.rarity + '"><div class="hIcon" style="background:' + v.iconBg + '">' + v.icon + '</div>' +
        '<div class="hInfo"><div class="hName"><span class="rar r-' + a.rarity + '">' + a.rarity + '</span> ' + a.name + '</div>' +
        '<div class="hSub">копий ' + h.copies + ' · ✦' + A.essence[a.rarity] + ' за копию</div></div>' +
        '<button class="lockBtn' + (locked ? ' on' : '') + '" data-lock="' + a.id + '">' + (locked ? '🔒' : '🔓') + '</button>' +
        '<div class="step"><button data-minus="' + a.id + '"' + (n ? '' : ' disabled') + '>−</button><span>' + n + '</span>' +
        '<button data-plus="' + a.id + '"' + (!locked && n < h.copies ? '' : ' disabled') + '>+</button></div></div>';
    }
    html += '<button class="sacBtn" data-act="sac"' + (total ? '' : ' disabled') + '>' +
      (total ? 'Пожертвовать ' + total + ' коп. → +' + fmt(value) + ' ✦' : 'Выберите копии для жертвы') + '</button>';
    html += '<div class="secTitle">РЕЦЕПТЫ</div>';
    html += '<div class="recipe"><div>Слеза портала<small>✦' + A.ticketCost + ' → 1 билет</small></div>' +
      '<button class="hBtn' + (s.essence >= A.ticketCost ? ' go' : '') + '" data-act="tear"' + (s.essence >= A.ticketCost ? '' : ' disabled') + '>Создать</button></div>';
    html += '<div class="recipe"><div>След героя<small>Копия выбранного открытого героя (для звёзд). Цена по редкости: ' +
      RANKS.map(r => r + ' ✦' + A.traceCost[r]).join(', ') + '</small></div></div>';
    for (const a of list) {
      const c = C.traceCost(a.id);
      html += '<div class="recipe" style="border-style:solid"><div><span class="rar r-' + a.rarity + '">' + a.rarity + '</span> ' + a.name + '</div>' +
        '<button class="hBtn' + (s.essence >= c ? ' go' : '') + '" data-trace="' + a.id + '"' + (s.essence >= c ? '' : ' disabled') + '>+1 копия ✦' + fmt(c) + '</button></div>';
    }
    { const M = CFG.materials, r = M.heartRecipe, can = s.materials.shard >= r;
      html += '<div class="recipe"><div>' + M.heart.icon + ' Сердце стража<small>' + r + ' ' + M.shard.icon + ' осколков → 1 сердце (есть ' + fmt(s.materials.shard) + ')</small></div>' +
        '<button class="hBtn' + (can ? ' go' : '') + '" data-act="heart"' + (can ? '' : ' disabled') + '>Создать</button></div>'; }
    for (const h of CFG.allies.filter(a => a.hidden)) {
      html += s.discovered[h.id]
        ? '<div class="recipe" style="border-color:var(--gold)"><div>' + ALLY_VIS[h.id].icon + ' ' + h.name + ' — скрытый рецепт<small>Пожертвовать за раз по копии: ' +
          h.recipe.map(id => CFG.allies.find(a => a.id === id).name).join(', ') + '</small></div></div>'
        : '<div class="recipe"><div>??? — скрытый рецепт<small>Говорят, Алтарь откликается, если отдать ему весь первый отряд разом…</small></div></div>';
    }
    if (html !== altarHtml) { $('altarTab').innerHTML = html; altarHtml = html; }
  }
  $('altarTab').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || b.disabled) return;
    const d = b.dataset;
    if (d.plus) altarSel[d.plus] = (altarSel[d.plus] || 0) + 1;
    else if (d.minus) altarSel[d.minus] = (altarSel[d.minus] || 0) - 1;
    else if (d.lock) { C.setLock(s, d.lock, !s.locks[d.lock]); save(); }
    else if (d.act === 'all') {
      altarSel = C.selectAllUnlocked(s);
      if (!Object.keys(altarSel).length) toast('Нечего выбрать<small style="color:var(--muted)">Нет копий без 🔒 — их дают повторы в портале</small>');
    }
    else if (d.act === 'none') altarSel = {};
    else if (d.act === 'heart') { if (C.forgeHeart(s, 1)) { toast('Сердце стража<small>+1 ' + CFG.materials.heart.icon + '</small>'); save(); } }
    else if (d.act === 'tear') { if (C.tearOfPortal(s, 1)) { toast('Слеза портала<small>+1 🎟</small>'); save(); } }
    else if (d.trace) { if (C.heroTrace(s, d.trace)) { toast('След героя<small>+1 копия · ' + CFG.allies.find(a => a.id === d.trace).name + '</small>'); save(); } }
    else if (d.act === 'sac') {
      cleanSel();
      const total = Object.values(altarSel).reduce((a, x) => a + x, 0);
      if (!total) return;
      const doSacrifice = () => {
        const r = C.sacrifice(s, altarSel);
        if (r) {
          altarSel = {};
          const f = r.found[0];
          if (f) toast((f.isNew ? 'Скрытое открытие!' : 'Скрытый рецепт') + '<small>' + CFG.allies.find(a => a.id === f.id).name + (f.isNew ? ' присоединилась' : ' +' + f.sets + ' коп.') + ' · +' + fmt(r.essence) + ' ✦</small>');
          else toast('Алтарь принял жертву<small>+' + fmt(r.essence) + ' ✦</small>');
          save();
        }
        render();
      };
      const value = C.sacrificeValue(altarSel);
      ask('Пожертвовать <b>' + total + '</b> коп. за <b>' + fmt(value) + ' ✦</b>?<br><span style="color:var(--muted)">Копии исчезнут навсегда.</span>', 'Пожертвовать', () => {
        if (C.needsRareConfirm(altarSel))
          ask('Среди них есть <b>редкие герои</b> (A, S или GOD). Точно пожертвовать?', 'Да, точно', doSacrifice);
        else doSacrifice();
      });
    }
    render();
  });

  // ---------- задания ----------
  // Неделя начинается с понедельника; ключ — дата этого понедельника
  function weekKey() {
    const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - (d.getDay() + 6) % 7);
    return 'w' + d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  let questsHtml = '';
  function rewardLine(r) {
    const M = CFG.materials, p = [];
    if (r.souls) p.push('👻 ' + fmt(r.souls));
    if (r.tickets) p.push('🎟 ' + r.tickets); if (r.essence) p.push('✦ ' + r.essence);
    if (r.shard) p.push(M.shard.icon + ' ' + r.shard); if (r.heart) p.push(M.heart.icon + ' ' + r.heart);
    return p.join(' · ');
  }
  function questRows(list) {
    let html = '';
    for (const q of list) {
      const pr = C.questProgress(s, q.id), done = pr >= q.goal, claimed = !!s.quests.claimed[q.id];
      const btn = claimed ? '<button class="hBtn" disabled>✓</button>'
        : done ? '<button class="hBtn go" data-claim="' + q.id + '">Забрать</button>'
        : q.go ? '<button class="hBtn" data-go="' + q.go + '">Перейти</button>' : '';
      html += '<div class="hRow' + (claimed ? ' claimed' : '') + '" style="--r:' + (done && !claimed ? 'var(--ok)' : 'var(--line)') + '"><div class="hInfo">' +
        '<div class="hName">' + q.name + '</div><div class="hSub">' + fmt(pr) + ' / ' + fmt(q.goal) + ' · награда ' + rewardLine(q.reward) + '</div>' +
        '<div class="qBar' + (done ? ' done' : '') + '"><i style="width:' + (pr / q.goal * 100) + '%"></i></div></div>' + btn + '</div>';
    }
    return html;
  }
  function renderQuests() {
    const Q = CFG.quests, n = C.claimableCount(s) + C.achClaimableCount(s);
    let html = '<button class="claimAll" data-act="all"' + (n ? '' : ' disabled') + '>' + (n ? 'Забрать всё (' + n + ')' : 'Нечего забирать') + '</button>';
    const dc = C.dailyClaimedCount(s), QC = CFG.questChests, last = QC[QC.length - 1].need;
    html += '<div class="secTitle">СУНДУКИ ЗАДАНИЙ · выполнено ' + dc + '/' + last + ' ежедневных</div><div class="chestBar"><i style="width:' + Math.min(100, dc / last * 100) + '%"></i></div><div class="chestRow">' +
      QC.map((c, i) => { const open = s.quests.chests[i], ready = C.questChestReady(s, i);
        return '<button class="' + (open ? 'open' : ready ? 'ready' : '') + '" data-chest="' + i + '"' + (ready ? '' : ' disabled') + '><span class="ci">' + (open ? '📭' : '🧰') + '</span>' +
          (open ? 'открыт' : c.need + ' задан.') + '<br><small>' + rewardLine(c.reward) + '</small></button>'; }).join('') + '</div>';
    html += '<div class="secTitle">ЕЖЕДНЕВНЫЕ · обновятся в полночь</div>' + questRows(Q.daily);
    html += '<div class="secTitle">ЕЖЕНЕДЕЛЬНЫЕ · обновятся в понедельник</div>' + questRows(Q.weekly);
    const intro = Q.intro.filter(q => !s.quests.claimed[q.id]), doneN = Q.intro.length - intro.length;
    html += '<div class="secTitle">ВВОДНЫЕ · выполнено ' + doneN + '/' + Q.intro.length + '</div>' + (intro.length ? questRows(intro) : '<div class="hint2">Все вводные задания выполнены.</div>');
    html += '<div class="secTitle">РИТУАЛЬНЫЕ · текущий забег, обновятся после ритуала</div>' + questRows(Q.ritual);
    const A = CFG.achievements, pts = C.achPoints(s);
    html += '<div class="secTitle">ДОСТИЖЕНИЯ · очков ' + pts + ' · +' + Math.round(pts * A.dmgPerPoint * 100) + '% всего урона навсегда</div>';
    for (const a of A.list) {
      const t = C.achTier(s, a.id), maxed = t >= a.goals.length, goal = maxed ? a.goals[a.goals.length - 1] : a.goals[t];
      const v = C.achValue(s, a), can = C.achClaimable(s, a.id), pr = Math.min(1, v / goal);
      html += '<div class="hRow' + (maxed ? ' claimed' : '') + '" style="--r:' + (can ? 'var(--ok)' : maxed ? 'var(--gold)' : 'var(--line)') + '"><div class="artIcon">' + a.icon + '</div><div class="hInfo">' +
        '<div class="hName">' + a.name + ' · ступень ' + t + '/' + a.goals.length + '</div>' +
        '<div class="hSub">' + (maxed ? 'все ступени получены' : fmt(Math.min(v, goal)) + ' / ' + fmt(goal) + ' · награда ' + rewardLine(a.reward) + ' и +1 очко') + '</div>' +
        (maxed ? '' : '<div class="qBar' + (can ? ' done' : '') + '"><i style="width:' + pr * 100 + '%"></i></div>') + '</div>' +
        (can ? '<button class="hBtn go" data-ach="' + a.id + '">Забрать</button>' : maxed ? '<button class="hBtn" disabled>✓</button>' : '') + '</div>';
    }
    if (html !== questsHtml) { $('questsTab').innerHTML = html; questsHtml = html; }
  }
  $('questsTab').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || b.disabled) return;

  // ---------- доп. PvE ----------
  function dayKey() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  const tierSel = {};
  let pveHtml = '';
  function rewardText(r) {
    const M = CFG.materials, parts = [];
    if (r.gold) parts.push('◆ ' + fmt(r.gold));
    if (r.shard) parts.push(M.shard.icon + ' ' + fmt(r.shard));
    if (r.heart) parts.push(M.heart.icon + ' ' + r.heart);
    if (r.bone) parts.push('кость ' + CFG.rarities[r.bone.tier] + ' · ' + C.boneSlot(r.bone.slot).name);
    if (r.runeTier != null) parts.push('руна ' + CFG.rarities[r.runeTier] + (r.runeType ? ' · ' + C.runeKind(r.runeType).name : ''));
    return parts.join(' · ');
  }
  function renderPve() {
    const P = CFG.pve, busy = !!s.mode, maxT = C.maxDungeonTier(s);

    html += '<div class="secTitle">ЕЖЕДНЕВНЫЕ ПОДЗЕМЕЛЬЯ · ' + P.dungeonEnemies + ' врагов за ' + P.dungeonTime + ' с · попытки обновляются в полночь</div>';
    for (const d of P.dungeons) {

      html += '<div class="hRow" style="--r:#6bb8ff"><div class="artIcon">' + d.icon + '</div><div class="hInfo">' +
        '<div class="hName">' + d.name + ' · попыток ' + left + '/' + P.dailyAttempts + '</div><div class="hSub">' + d.desc + '</div>' +
        '<div class="dpsPrev">Награда: <b>' + rewardText(C.dungeonReward(s, d.id, t)) + '</b> · враги как на этаже ' + t * P.tierFloors + '</div></div>' +
        '<div class="hBtns"><div class="tierPick"><button data-tier="' + d.id + ':-1"' + (t > 1 ? '' : ' disabled') + '>−</button><span>ур. ' + t + '</span>' +

    }

      '<div class="hRow" style="--r:#b98cff"><div class="artIcon">∞</div><div class="hInfo"><div class="hName">Рекорд: ' + s.pve.endlessBest + ' волн · попыток ' + el2 + '/' + P.endless.attempts + '</div>' +
      '<div class="hSub">Волны без таймера, каждые ' + P.endless.bossEvery + ' — контрольный босс на ' + P.endless.bossTime + ' с. За босса ✦ эссенция, за новый рекордный рубеж — 🎟 билет.</div></div>' +
      '<button class="hBtn' + (canE ? ' go' : '') + '" data-act="endless"' + (canE ? '' : ' disabled') + '>Войти</button></div>';
    const bosses = C.personalBosses(s), pl = C.attemptsLeft(s, 'personal');
    html += '<div class="secTitle">ЛИЧНЫЕ БОССЫ · попыток ' + pl + '/' + P.personal.attempts + ' в день · ' + P.personal.time + ' с</div>';
    if (!bosses.length) html += '<div class="hRow locked" style="--r:#3a2a4a"><div class="artIcon">?</div><div class="hInfo"><div class="hName">Пока нет</div><div class="hSub">Победите финального босса биома (этаж 50) — он станет личным боссом</div></div></div>';
    for (const b of bosses) {

        P.personal.diffs.map(D => { const can = !busy && pl > 0; return '<button class="hBtn' + (can ? ' go' : '') + '" data-pb="' + b.id + ':' + D.id + '"' + (can ? '' : ' disabled') + '>' + D.name + '<br><small>' + rewardText(C.personalReward(s, b.floor, D.id)) + '</small></button>'; }).join('') +
        '</div></div></div>';

  // ---------- руны и тотемы ----------

      '<button class="hBtn' + (s.materials.shard >= R.createCost ? ' go' : '') + '" data-act="rune"' + (s.materials.shard >= R.createCost ? '' : ' disabled') + '>' + M.shard.icon + ' ' + R.createCost + '</button></div>';

        '<div class="hName"><span class="rar r-' + rr + '">' + rr + '</span> ' + k.name + ' · ур. ' + best.lvl + '/' + R.maxLevel + ' <span class="badge sq">действует</span></div>' +
        '<div class="hSub">' + pct(C.runeValue(best)) + ' ' + k.desc + (up ? ' → <b>' + pct(C.runeValue({ ...best, lvl: best.lvl + 1 })) + '</b>' : '') + '</div></div>' +

      '<div class="hint2">Тотем биома даёт финальный босс его 50-го этажа (первое прохождение). +' + Math.round(T.dpsPerLevel * 100) + '% урона за каждый уровень тотема' +
      (next ? '; при ' + next + ' тотемах — ещё ×' + T.collectionMult : '') + (sets ? '. Бонус коллекции сейчас ×' + Math.pow(T.collectionMult, sets).toFixed(2) : '') + '.</div>';
    CFG.biomes.forEach((b, i) => {

  $('runesTab').addEventListener('click', e => {

  // ---------- души, артефакты, ритуал ----------

  let soulsHtml = '';
  const pctUp = m => '+' + fmt(B.floor(B.mul(B.sub(m, 1), 100))) + '%';
  function dpsChange(p) {
    if (!p) return '';

  }
  function renderSouls() {

      const souls = C.ritualSouls(s), start = C.ritualStartFloor(s);
      const after = { ...s, souls: B.add(s.souls, souls) };
      ask('<b>Ритуал</b><span class="askList">' +
        '<b>Получите:</b> +' + fmt(souls) + ' душ (бонус урона ' + pctUp(C.soulMult(s)) + ' → ' + pctUp(C.soulMult(after)) + ')<br>' +
        '<b>Сбросится:</b> золото, уровни удара и героев, найм, этаж — новый забег с этажа ' + start +
        (C.ritualStartGold(s) ? ' и ◆ ' + fmt(C.ritualStartGold(s)) + ' золота' : '') + '<br>' +
        '<b>Сохранится:</b> дерево душ, герои, звёзды, эволюции, материалы, копии, отряд, билеты, эссенция, артефакты, души, рекорды</span>', 'Провести ритуал', () => {
        const r = C.ritual(s);
        if (!r) return;
        dmgLog.length = 0;
        restartAnim('spawn');
        toast('Ритуал проведён<small>+' + fmt(r.souls) + ' 👻 · старт с этажа ' + r.start + '</small>');
        save(); render();
      });
      return;
    }
    render();
  });

  let banner = 'normal', bannerHtml = '';
  function costText(id, n) { const c = C.bannerCost(id, n); return c.lanterns ? '🏮' + c.lanterns : '🎟' + c.tickets; }
  function renderPortal() {
    const P = CFG.portal, b = C.bannerDef(banner), pity = C.bannerPity(s, banner);
    const chips = P.banners.map(x => '<button class="hBtn' + (x.id === banner ? ' go' : '') + '" data-banner="' + x.id + '"' +
      (x.id === 'event' && !C.currentEvent(s) ? ' disabled' : '') + '>' + x.icon + ' ' + x.name + '</button>').join('');
    if (chips !== bannerHtml) { $('bannerPick').innerHTML = chips; bannerHtml = chips; }
    const feat = b.featured ? C.featuredHeroes(s).map(id => CFG.allies.find(a => a.id === id)) : [];
    $('bannerInfo').innerHTML = b.desc + (feat.length ? '. Герои недели: <b>' + feat.map(a => a.name + ' (' + a.rarity + ')').join(', ') + '</b>' : '') +
      (b.id === 'event' ? '. Фонарей: 🏮 ' + fmt(s.event.lanterns) : '');
    $('ticketCount').textContent = fmt(s.tickets);
    const pA = b.pityA || P.pityA, pS = b.pityS || P.pityS;
    $('pityInfo').textContent = 'A+ гарантия через ' + (pA - pity.a) + ' · S+ через ' + (pS - pity.s) + (pity.s > P.softS ? ' · шанс S повышен!' : '');
    $('pull1').disabled = !C.canSummon(s, banner, 1); $('pull1').textContent = '×1 · ' + costText(banner, 1);
    $('pull10').disabled = !C.canSummon(s, banner, 10); $('pull10').textContent = '×10 · ' + costText(banner, 10);
    const base = b.minRarity ? RANKS.indexOf(b.minRarity) : 0, pool = RANKS.filter((r, i) => i >= base);
    const total = pool.reduce((a, r) => a + P.odds[r], 0);
    $('oddsInfo').innerHTML = 'Шансы: ' + pool.map(r => '<span class="rar r-' + r + '">' + r + '</span> ' + (P.odds[r] / total * 100).toFixed(1) + '%').join(' ') +
      '<br>После ' + P.softS + ' призывов без S шанс S растёт с каждым призывом. Гарантии у баннеров раздельные.' +
      '<br>Билеты: за первое прохождение босса каждого 5-го этажа, на 10-м — больше.';
    if (pullShown === lastPull) return;
    pullShown = lastPull;
    $('pullResults').innerHTML = lastPull.map((x, i) => {
      const a = CFG.allies.find(h => h.id === x.id), v = ALLY_VIS[x.id];
      return '<div class="res r-' + x.rarity + '" style="animation-delay:' + (i * 0.05) + 's"><div class="ri">' + v.icon + '</div><div class="rn">' + a.name +
        '</div><div>' + (x.isNew ? '<span class="new">НОВЫЙ</span>' : '+1 копия') + '</div></div>';
    }).join('');
  }
  document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => { tab = b.dataset.tab; render(); }));
  $('heroesTab').addEventListener('click', e => {
    const hd = e.target.closest('[data-hd]');
    if (hd) { heroDetail = hd.dataset.hd; render(); $('heroesTab').scrollTop = 0; return; }
    const b = e.target.closest('button'); if (!b) return;
    let ok = false;
    if (b.dataset.hclose) { heroDetail = null; ok = true; }
    if (b.dataset.hbones) { boneWho = b.dataset.hbones; tab = 'bones'; ok = true; }
    if (b.dataset.hrank) { ok = C.rankUp(s, b.dataset.hrank); if (ok) toast('Новый ранг<small>потолок уровня ' + fmt(C.allyCap(s, b.dataset.hrank)) + '</small>'); }
    if (b.dataset.star) ok = C.starUp(s, b.dataset.star);
    if (b.dataset.in) ok = C.squadAdd(s, b.dataset.in);
    if (b.dataset.out) ok = C.squadRemove(s, b.dataset.out);
    const dd = b.dataset;
    if (dd.cls) { ok = C.chooseClass(s, dd.cls, dayKey()); if (ok) { classPick = false; toast('Класс героя<small>' + C.classDef(dd.cls).name + '</small>'); } }
    if (dd.act === 'clsPick') { classPick = true; ok = true; }
    if (dd.act === 'clsBack') { classPick = false; ok = true; }
    if (dd.cnode) ok = C.buyClassNode(s, dd.cnode);
    if (dd.pet) { ok = C.unlockPet(s, dd.pet); if (ok) toast('Призванное существо!<small>' + C.petDef(dd.pet).icon + ' ' + C.petDef(dd.pet).name + '</small>'); }
    if (dd.pset) ok = C.setPet(s, dd.pset);
    if (dd.pup) ok = C.upgradePet(s, dd.pup);
    if (dd.boost) { ok = C.moveBooster(s, dd.boost, Date.now()); if (ok) toast(CFG.booster.name + '<small>теперь у: ' + (dd.boost === 'hero' ? 'Призванный' : CFG.allies.find(a => a.id === dd.boost).name) + '</small>'); }
    if (b.dataset.evo) {
      const ec = C.evoCost(s, b.dataset.evo);
      ok = C.evolve(s, b.dataset.evo);
      if (ok) toast('Эволюция · ' + ec.name + '!<small>' + CFG.allies.find(a => a.id === b.dataset.evo).name + ': новый облик, ×' + ec.mult + ' DPS</small>');
    }
    if (ok) { save(); render(); }
  });
  $('bannerPick').addEventListener('click', e => { const b = e.target.closest('button'); if (!b || b.disabled) return; banner = b.dataset.banner; render(); });
  function pull(n) {
    const r = C.summon(s, n, banner);
    if (!r) return;
    lastPull = r; save(); render();
    const best = r.reduce((m, x) => RANKS.indexOf(x.rarity) > RANKS.indexOf(m.rarity) ? x : m, r[0]);
    if (RANKS.indexOf(best.rarity) >= RANKS.indexOf('A')) toast('Редкий герой!<small>' + best.rarity + ' · ' + CFG.allies.find(a => a.id === best.id).name + '</small>');
  }
  $('pull1').addEventListener('click', () => pull(1));
  $('pull10').addEventListener('click', () => pull(10));


  // ---------- способности главного героя ----------
  const ABIL_ICON = { flurry: '⚔', hunt: '🎯' };
  const abilUi = {};
  function buildAbilities() {
    const bar = $('abilityBar');
    for (const a of CFG.abilities) {
      const w = document.createElement('div');
      w.className = 'abil';
      w.innerHTML = '<button class="abilUse"><div class="abilCd"></div><span class="abilIcon">' + ABIL_ICON[a.id] + '</span>' +
        '<div class="abilText"><div class="abilName">' + a.name + '</div><div class="abilState"></div></div></button>' +
        '<button class="abilAuto" aria-label="Автоиспользование">АВТО</button>';
      bar.appendChild(w);
      const use = w.querySelector('.abilUse'), auto = w.querySelector('.abilAuto');
      use.addEventListener('click', () => { const ev = C.useAbility(s, a.id); if (ev.length) { handle(ev); save(); } });
      auto.addEventListener('click', () => { C.setAbilityAuto(s, a.id, !s.abilities[a.id].auto); save(); renderAbilities(); });
      abilUi[a.id] = { w, state: w.querySelector('.abilState'), cd: w.querySelector('.abilCd'), auto };
    }
  }
  function renderAbilities() {
    for (const a of CFG.abilities) {
      const u = abilUi[a.id], st = s.abilities[a.id];
      const unlocked = C.abilityUnlocked(s, a.id);
      u.w.classList.toggle('locked', !unlocked);
      u.w.classList.toggle('active', st.active > 0);
      u.w.classList.toggle('ready', unlocked && st.cd <= 0 && st.active <= 0);
      u.auto.classList.toggle('on', st.auto);
      u.auto.style.visibility = unlocked ? '' : 'hidden';
      u.state.textContent = !unlocked ? 'с этажа ' + a.unlockFloor
        : st.active > 0 ? 'действует ' + Math.ceil(st.active) + 'с'
        : st.cd > 0 ? 'через ' + Math.ceil(st.cd) + 'с' : 'готово';
      u.cd.style.height = (unlocked && st.active <= 0 && st.cd > 0 ? Math.min(1, st.cd / a.cooldown) * 100 : 0) + '%';
    }
  }

  function renderLive() {
    renderAbilities();
    renderUlts();
    if (s.enemy.isBoss || s.mode) {
      const p = Math.max(0, s.bossTimeLeft / (s.mode ? s.mode.timeMax : C.bossTime(s)));
      el.timerFill.style.width = (p * 100) + '%';
      el.timerFill.classList.toggle('low', s.bossTimeLeft < 5);
    }
    const now = performance.now();
    while (dmgLog.length && now - dmgLog[0][0] > DPS_WINDOW * 1000) dmgLog.shift();
    let tapSum = 0, allSum = 0;
    for (const d of dmgLog) { allSum = B.add(allSum, d[1]); if (d[2] === 'tap') tapSum = B.add(tapSum, d[1]); }
    const tapDps = B.div(tapSum, DPS_WINDOW), auto = C.autoDps(s);
    el.dps.textContent = fmt(B.add(tapDps, auto));                       // общий DPS
    liveTapDps = tapDps; liveAllDps = B.div(allSum, DPS_WINDOW);
    goldSample(now);
    if (el.statsMore.classList.contains('show'))
      el.statsMore.textContent = 'Тап ' + fmt(tapDps) + '/с · Авто ' + fmt(auto) + '/с · Реальный средний ' + fmt(B.div(allSum, DPS_WINDOW)) + '/с · Крит ' + Math.round(C.critChance(s) * 100) + '% ×' + C.critMult(s).toFixed(1);
  }

  // ---------- игровой цикл ----------
  let acc = 0, last = performance.now();
  let frameN = 0, pendingRender = false;
  function loop(now) {
    acc += Math.min(0.25, (now - last) / 1000); last = now;
    let changed = false;
    while (acc >= STEP) {
      const ev = C.tick(s, STEP); acc -= STEP;
      if (ev.length) { handle(ev); changed = true; }
    }
    // FPS 30: логика идёт с прежним шагом, перерисовка — через кадр
    const skip = setg.fps === 30 && (frameN++ & 1);
    if (changed && !skip) render(); else if (changed) pendingRender = true;
    if (!skip) { if (pendingRender) { render(); pendingRender = false; } renderLive(); }
    if (Date.now() - lastSave > 5000) save();
    requestAnimationFrame(loop);
  }
  buildAllies();
  buildAbilities();
  render();
  if (s.savedAt) applyOffline((Date.now() - s.savedAt) / 1000);
  if (C.loginAvailable(s, dayKey())) setTimeout(() => toast('📬 Бонус за вход ждёт<small>день ' + (C.loginDayIndex(s) + 1) + ' из ' + CFG.login.days.length + '</small>'), 1200);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
