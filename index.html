  el.prev.addEventListener('click', () => { handle(C.goToFloor(s, s.floor - 1)); render(); save(); });
  el.next.addEventListener('click', () => { handle(C.goToFloor(s, s.floor + 1)); render(); save(); });
  // один переключатель: ×1 → ×10 → ×25 → ×100 → MAX → Next (до следующей вехи ×3) → ×1
  const MULTS = [[1, '×1'], [10, '×10'], [25, '×25'], [100, '×100'], ['max', 'MAX'], ['ms', 'Next']];
  $('multCycle').addEventListener('click', () => {
    const i = (MULTS.findIndex(x => x[0] === mult) + 1) % MULTS.length;
    mult = MULTS[i][0]; $('multCycle').textContent = MULTS[i][1];
    render();
  });
  // «ДО ×3»: ровно столько уровней, сколько осталось до следующей вехи урона
  function buyCount(level) { return mult === 'ms' ? C.nextMilestone(level) - level : mult; }
  el.buyTap.addEventListener('click', () => {
    if (el.buyTap.dataset.rank) { if (C.rankUp(s, 'hero')) { toast('Новый ранг · Призванный<small>потолок удара ' + fmt(C.tapCap(s)) + '</small>'); save(); render(); } return; }
    if (C.buyTap(s, buyCount(s.tapLevel))) { save(); render(); }
  });
  $('stats').addEventListener('click', () => el.statsMore.classList.toggle('show'));
  $('settingsBtn').addEventListener('click', () => {
    el.saveInfo.textContent = 'Прогресс сохраняется автоматически на этом устройстве. Лучший этаж: ' +
      (s.maxFloor) + '. Тапов: ' + fmt(s.stats.taps) + ', побеждено врагов: ' + fmt(s.stats.kills) + '.';
    renderSettings();
    el.modal.classList.add('show');
  });
  $('setList').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const v = b.dataset.sv; setg[b.dataset.sk] = b.dataset.sk === 'fps' ? +v : v;
    applySettings(); renderSettings();
  });
  $('closeModal').addEventListener('click', () => el.modal.classList.remove('show'));
  // ---------- окно подтверждения ----------
  let askYesFn = null;
  function ask(text, yesLabel, onYes) {
    $('askText').innerHTML = text;
    $('askYes').textContent = yesLabel || 'Да';
    askYesFn = onYes;
    $('ask').classList.add('show');
  }
  $('askNo').addEventListener('click', () => { $('ask').classList.remove('show'); askYesFn = null; });
  $('askYes').addEventListener('click', () => { $('ask').classList.remove('show'); const f = askYesFn; askYesFn = null; if (f) f(); });

  $('resetBtn').addEventListener('click', () => {
    ask('Сбросить весь прогресс? Это нельзя отменить.', 'Сбросить', () => {
      try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
      s = C.newState(); tapped = false; dmgLog.length = 0;
      el.modal.classList.remove('show'); restartAnim('spawn'); render();
    });
  });
  // ---------- офлайн: отряд сам идёт вверх до стены, затем фармит этаж ниже ----------
  function dur(sec) {
    const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60);
    return (h ? h + ' ч ' : '') + m + ' мин';
  }
  function applyOffline(seconds) { showReport(C.offlineProgress(s, seconds), 'Пока вас не было'); }
  function showReport(r, title) {
    if (!r) return;
    dmgLog.length = 0;
    $('awayTitle').textContent = title; $('awayOk').textContent = 'Забрать';
    $('awayTime').textContent = dur(r.seconds) + (r.capped ? ' (больше 12 ч не считается)' : '');
    const M = CFG.materials, lines = [];
    if (C.offlineDps(s) <= 0) lines.push('Отряд не нанят — без союзников и автоатаки офлайн-дохода нет.');
    else {
      lines.push(r.floorsCleared ? '<b>Пройдено этажей:</b> ' + r.floorsCleared + ' (' + r.fromFloor + ' → ' + (r.wallFloor || r.toFloor) + ')'
                                 : '<b>Новых этажей нет</b>');
      if (r.wallFloor) lines.push('Босс этажа ' + r.wallFloor + ' оказался не по силам — отряд фармит этаж ' + r.farmFloor);
      lines.push('<b>Золото:</b> +' + fmt(r.gold) + ' ◆ · врагов ' + fmt(r.kills));
      if (r.shard || r.heart) lines.push('<b>Материалы:</b> +' + fmt(r.shard) + ' ' + M.shard.icon + (r.heart ? ' · +' + r.heart + ' ' + M.heart.icon : ''));
      if (r.tickets) lines.push('<b>Билеты:</b> +' + r.tickets + ' 🎟');
    }
    $('awayList').innerHTML = lines.join('<br>');
    $('away').classList.add('show');
    save(); render();
  }
  $('awayOk').addEventListener('click', () => $('away').classList.remove('show'));
  let hiddenAt = 0;
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { hiddenAt = Date.now(); save(); }
    else if (hiddenAt) { const gap = (Date.now() - hiddenAt) / 1000; hiddenAt = 0; last = performance.now(); applyOffline(gap); }
  });
  window.addEventListener('pagehide', save);
  document.addEventListener('contextmenu', e => e.preventDefault());

  // ---------- отрисовка ----------
  let lastBiome = '', lastMarks = '';
  function render() {
    const en = s.enemy;
    el.floorLabel.textContent = 'Этаж ' + s.floor;
    const bio = C.biomeOf(s.floor);
    const hall = C.hallOf(s.floor), place = C.biomeName(s.floor) + ' · ' + hall.name;
    if (lastBiome !== place && !s.mode) {
      lastBiome = place;
      $('biomeLabel').textContent = place;
      const g = $('game').style;
      g.setProperty('--bg2', bio.sky[0]); g.setProperty('--bg1', bio.sky[1]);
      g.setProperty('--bh', (bio.bg[0] + hall.hue) + 'deg'); g.setProperty('--bs', bio.bg[1]); g.setProperty('--bb', bio.bg[2] * hall.bri);
      g.setProperty('--hx', hall.x + '%'); g.setProperty('--hz', hall.zoom); g.setProperty('--hf', hall.flip ? -1 : 1);
    }
    const m = s.mode;
    if (m) {
      el.floorLabel.textContent = m.kind === 'endless' ? 'Волна ' + m.step : m.name;
      $('biomeLabel').textContent = m.kind === 'event' ? 'Событие · ' + C.currentEvent(s).dungeon.ruleText + ' · ' + m.step + '/' + m.total
        : m.kind === 'dungeon' ? 'Подземелье · уровень ' + m.tier + ' · враг ' + m.step + '/' + m.total
        : m.kind === 'endless' ? 'Бесконечное подземелье · рекорд ' + s.pve.endlessBest : 'Личный босс · ' + m.diffName;
      $('modeInfo').textContent = m.kind === 'endless' ? '✦ +' + m.essence + (m.tickets ? ' · 🎟 +' + m.tickets : '') : m.name;
      lastBiome = '';
    }
    $('modeBar').classList.toggle('show', !!m);
    const pd = s.pets.active && C.petDef(s.pets.active), pel = $('pet');
    pel.classList.toggle('on', !!pd);
    if (pd && pel.dataset.id !== pd.id) { pel.dataset.id = pd.id; pel.querySelector('.pfig').textContent = pd.icon; pel.querySelector('.allyTag').textContent = pd.name.split(' ').pop(); }
    el.dots.style.visibility = m ? 'hidden' : '';
    el.prev.disabled = !!m || s.floor <= 1;
    el.next.disabled = !!m || s.floor >= s.maxFloor;
    [...el.dots.children].forEach((d, i) => {
      const idx = i + 1;
      d.classList.toggle('done', idx < s.enemyIndex);
      d.classList.toggle('cur', idx === s.enemyIndex);
    });
    el.enemyName.textContent = en.isBoss ? (en.final ? 'ФИНАЛЬНЫЙ БОСС · ' : 'БОСС · ') + en.name : en.rare ? (en.rare === 'chest' ? '🧰 ' + en.name + ' 🧰' : '✦ ' + en.name + ' ✦') : en.name;
    el.enemyName.classList.toggle('boss', en.isBoss);
    el.enemyName.classList.toggle('rare', !!en.rare);
    el.enemyName.classList.toggle('crystal', en.rare === 'crystal');
    el.enemyName.classList.toggle('chest', en.rare === 'chest');
    el.enemy.classList.toggle('boss', en.isBoss);
    el.enemy.classList.toggle('rare-gold', en.rare === 'gold');
    el.enemy.classList.toggle('rare-crystal', en.rare === 'crystal');
    el.enemy.classList.toggle('rare-chest', en.rare === 'chest');
    // оттенок от биома + небольшой разброс; редкие и боссы — свои
    el.enemy.style.filter = en.rare ? 'none' : en.isBoss ? 'hue-rotate(' + (bio.hue + 130) + 'deg) saturate(1.3)' + (en.final ? ' contrast(1.15)' : '')
      : 'hue-rotate(' + (bio.hue + (s.floor * 37 + s.enemyIndex * 11) % 60 - 30) + 'deg)';
    // отметки фаз на полоске HP босса
    const marks = en.isBoss ? (en.final ? CFG.bossPhases.final : CFG.bossPhases.normal) : [];
    const mk = marks.map((t, i) => t + ':' + (en.phase > i + 1 ? 1 : 0)).join();
    if (mk !== lastMarks) {
      lastMarks = mk;
      $('hpBar').querySelectorAll('.phMark').forEach(x => x.remove());
      marks.forEach((t, i) => { const d = document.createElement('div'); d.className = 'phMark' + (en.phase > i + 1 ? ' past' : ''); d.style.left = (t * 100) + '%'; $('hpBar').appendChild(d); });
    }
    el.hpFill.style.width = (B.toNum(B.div(en.hp, en.maxHp)) * 100) + '%';
    el.hpText.textContent = fmt(en.hp) + ' / ' + fmt(en.maxHp);
    el.timerBar.classList.toggle('show', s.mode ? (s.mode.kind !== 'endless' || en.isBoss) : en.isBoss);
    el.farmBar.classList.toggle('show', s.farming && !s.mode);
    el.hint.style.display = tapped ? 'none' : '';
    el.tapDmg.textContent = fmt(C.tapHit(s));
    el.gold.textContent = fmt(s.gold);
    const tcap = C.tapCap(s), tAtCap = s.tapLevel >= tcap;
    el.tapLvl.textContent = fmt(s.tapLevel) + '/' + fmt(tcap);

    const n = Math.max(1, Math.min(tcap - s.tapLevel, mult === 'max' ? Math.max(1, C.maxAffordable(s.tapLevel, s.gold)) : buyCount(s.tapLevel)));
    const cost = C.upgradeCost(s.tapLevel, n);
    const can = B.lte(cost, s.gold);
    el.tapSub.innerHTML = rankTag(s.heroRank) + (tAtCap ? 'Урон ' + fmt(C.tapHit(s)) + ' · <span class="ms">потолок — повысьте ранг</span>'
      : 'Урон ' + fmt(C.tapHit(s)) + ' → <b>' + fmt(B.mul(C.tapDamageAt(s.tapLevel + n), C.permMult(s, 'tap'))) + '</b>' + msHint(s.tapLevel));
    anyAffordable = false;
    renderTabs();
    if (tAtCap) setRank(el.buyTap, 'hero');
    else setBuy(el.buyTap, can, n, cost, '+' + fmt(n) + ' ур.' + (mult === 'ms' ? ' ×' + CFG.milestoneMult : ''));

    // союзник
    for (const a of CFG.allies) {
      const u = allyUi[a.id], lv = s.allies[a.id].level;
      const acap = C.allyCap(s, a.id), aAtCap = lv >= acap;
      const an = Math.max(1, Math.min(acap - lv, mult === 'max' ? Math.max(1, C.allyMax(s, a.id)) : buyCount(lv)));
      const acost = C.allyCost(s, a.id, an);
      const pm = B.mul(C.permMult(s, 'ally'), C.heroMult(s, a.id));   // души, артефакты, звёзды и эволюция
      if (u.evo !== s.heroes[a.id].evo) { u.evo = s.heroes[a.id].evo; u.fig.innerHTML = allySvg(ALLY_VIS[a.id], u.evo); }
      u.sub.innerHTML = aAtCap ? rankTag(s.heroes[a.id].rank) + 'DPS ' + fmt(B.mul(C.allyDps(s, a.id), C.permMult(s, 'ally'))) + ' · <span class="ms">потолок — повысьте ранг</span>'
                    : lv ? rankTag(s.heroes[a.id].rank) + 'DPS ' + fmt(B.mul(C.allyDps(s, a.id), C.permMult(s, 'ally'))) + ' → <b>' + fmt(B.mul(C.allyDpsAt(a.id, lv + an), pm)) + '</b>' + msHint(lv)
                           : '<span class="dim">' + a.role + ' · удар раз в ' + a.attackInterval + ' с</span> DPS <b>' + fmt(B.mul(C.allyDpsAt(a.id, an), pm)) + '</b>';
      if (aAtCap) setRank(u.btn, a.id);
      else setBuy(u.btn, B.lte(acost, s.gold), an, acost, (lv ? '+' + fmt(an) + ' ур.' : 'Нанять' + (an > 1 ? ' +' + fmt(an - 1) : '')) + (mult === 'ms' ? ' ×' + CFG.milestoneMult : ''));
      const unlocked = s.heroes[a.id].unlocked, sq = s.squad.indexOf(a.id);
      u.card.style.display = unlocked ? '' : 'none';
      u.card.classList.toggle('nohire', !lv);
      u.lock.style.display = unlocked ? 'none' : '';
      u.lock.style.order = 100 + CFG.allies.indexOf(a);
      u.card.style.order = sq >= 0 ? sq : 10 + CFG.allies.indexOf(a);
      u.title.innerHTML = '<span class="rar r-' + a.rarity + '">' + a.rarity + '</span> ' + a.name + ' · ' + (lv ? 'ур. ' + fmt(lv) + '/' + fmt(acap) : a.role) +
        (sq >= 0 ? '<span class="badge sq">отряд</span>' : '<span class="badge rs">резерв</span>') + (s.booster.owner === a.id ? '<span class="badge sq" style="color:var(--gold)">✦×' + CFG.booster.power + '</span>' : '');
      // фигура на арене — только у героя в отряде и нанятого
      const slot = SLOTS[sq];
      u.sprite.classList.toggle('on', sq >= 0 && lv > 0);
      if (slot) {
        u.sprite.className = 'ally ' + slot.side + (slot.back ? ' back' : '') + (sq >= 0 && lv > 0 ? ' on' : '');
        u.sprite.style.cssText = slot.pos;
      }
    }
    $('canBuy').classList.toggle('on', anyAffordable);
    const upBtn = document.querySelector('.sideBtn[data-open="up"]'); if (upBtn) upBtn.classList.toggle('on', anyAffordable);
  }

  // Подсказка о следующей вехе уровня
  function msHint(level) {
    return '<span class="ms"> · ×' + CFG.milestoneMult + ' на ' + fmt(C.nextMilestone(level)) + '</span>';
  }

  // Ранг: «Р III·4» — ранг и подранг
  const RN = ['', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X'];
  function rankTag(k) { const r = C.rankLabel(k); return '<span class="ms">Ранг ' + RN[r.rank] + (r.max ? ' · макс' : '·' + r.sub) + '</span> · '; }
  // Кнопка повышения ранга на месте покупки, когда уровень упёрся в потолок
  function setRank(btn, who) {
    const c = C.rankCost(s, who), M = CFG.materials;
    btn.dataset.rank = '1';
    if (!c) { btn.disabled = true; btn.innerHTML = 'Предел<span>ур. ' + fmt(C.capAt(C.maxSteps())) + '</span>'; return; }
    const evoOk = who === 'hero' || s.heroes[who].evo >= c.needEvo;
    const can = C.canRankUp(s, who);
    btn.disabled = !can;
    if (can) anyAffordable = true;
    const price = M.shard.icon + ' ' + fmt(c.shards) + (c.hearts ? ' ' + M.heart.icon + ' ' + c.hearts : '');
    btn.innerHTML = !evoOk ? 'Нужна эволюция ' + RN[c.needEvo] + '<span>для ранга ' + RN[c.newRank] + '</span>'
      : (c.newRank ? '⇧ Ранг ' + RN[c.newRank] : '⇧ Подранг') + '<span>' + price + ' → ' + fmt(c.cap) + '</span>';
  }
  function setBuy(btn, can, n, cost, label) {
    delete btn.dataset.rank;
    btn.disabled = !can;
    if (can) anyAffordable = true;
    const hire = /^Нанять/.test(label);
    btn.classList.toggle('hire', hire);
    // как в образце: «Улучшить / Нанять» и цена; сколько уровней — мелко
    const head = (hire ? 'Нанять' : 'Улучшить') + (n > 1 ? ' <small>+' + fmt(n) + '</small>' : '');
    btn.innerHTML = head + '<span>◆ ' + fmt(cost) + '</span>';
  }

  const BUFF_UI = [
    { key: 'team', kind: 'teamBuff', color: '#ff8a6b' },
    { key: 'tap', kind: 'tapBuff', color: '#c8b8ff' },
  ];
  let lastBuffHtml = '';
  function renderUlts() {
    for (const a of CFG.allies) {
      const u = allyUi[a.id], st = s.allies[a.id];
      const p = st.level > 0 ? st.ult / a.ult.charge : 0;
      u.ultFill.style.width = (p * 100) + '%';
      u.ultBar.classList.toggle('ready', p >= 1);
    }
    const parts = [];
    for (const b of BUFF_UI) {
      const left = s.buffs[b.key];
      if (left > 0) parts.push('<span class="buff" style="color:' + b.color + '">' + CFG.allies.find(a => a.ult.kind === b.kind).ult.name + ' ' + Math.ceil(left) + 'с</span>');
    }
    if (s.enemy.vuln > 0 && s.enemy.alive) parts.push('<span class="buff" style="color:#ff6b4a">Уязвим ' + Math.ceil(s.enemy.vuln) + 'с</span>');
    el.enemy.classList.toggle('vuln', s.enemy.vuln > 0 && s.enemy.alive);
    if (s.enemy.mark > 0) parts.push('<span class="buff" style="color:#ffb36b">Метка ' + Math.ceil(s.enemy.mark) + 'с</span>');
    const html = parts.join('');
    if (html !== lastBuffHtml) { $('buffs').innerHTML = html; lastBuffHtml = html; }
    el.arena.classList.toggle('fury', s.buffs.team > 0);
    el.enemy.classList.toggle('marked', s.enemy.mark > 0 && s.enemy.alive);
    heroEl.classList.toggle('empowered', s.buffs.tap > 0);
  }

  // ---------- вкладки: коллекция героев и портал ----------
  let tab = 'up';
  let lastPull = [], pullShown = null, heroesHtml = '';
  const RANKS = CFG.rarities;
  function renderTabs() {
    C.dailyReset(s, dayKey());
    C.seasonReset(s, dayKey());
    C.eventReset(s, weekKey());
    C.questsReset(s, dayKey(), weekKey());
    $('questDot').classList.toggle('on', C.claimableCount(s) + C.achClaimableCount(s) + C.questChestsReady(s) > 0);
    if (tab === 'quests') renderQuests();
    if (tab === 'season') renderSeason();
    if (tab === 'events') renderEvents();
    if (tab === 'inbox') renderInbox();
    if (tab === 'bones') renderBones();
    if (tab === 'stats') renderStats();
    if (tab === 'map') renderMap();
    const inbN = s.inbox.length + (C.loginAvailable(s, dayKey()) ? 1 : 0) + (C.travelCost(s, dayKey()) === 0 && B.gt(C.offlineDps(s), 0) ? 1 : 0);
    $('inboxCnt').textContent = inbN; $('inboxCnt').classList.toggle('on', inbN > 0);
    $('toggleLabel').textContent = TAB_NAMES[tab] || '';
    // «!» на боковых кнопках
    const fcost = C.findCost(s);
    const bang = {
      up: anyAffordable, quests: C.claimableCount(s) + C.achClaimableCount(s) + C.questChestsReady(s) > 0, portal: s.tickets > 0,
      heroes: (C.classUnlocked(s) && (!s.cls.id || C.classFree(s) > 0)) || CFG.pets.list.some(p => !C.petLevel(s, p.id) && C.petCanUnlock(s, p.id)) || CFG.allies.some(a => s.heroes[a.id].unlocked && (C.canEvolve(s, a.id) || (C.starCost(s, a.id) != null && s.heroes[a.id].copies >= C.starCost(s, a.id)))),
      souls: C.canRitual(s) || (fcost != null && B.gte(s.souls, fcost)),
      pve: !s.mode && CFG.pve.dungeons.some(d => C.attemptsLeft(s, d.id) > 0),
      bones: s.bones.some(b => !b.on) && CFG.bones.slots.some(x => !s.bones.some(b => b.on === 'hero' && b.slot === x.id) && s.bones.some(b => !b.on && b.slot === x.id)),
      season: seasonBang(), events: !s.mode && C.attemptsLeft(s, 'event') > 0, altar: false, runes: s.materials.shard >= CFG.runes.createCost && !s.runes.length,
    };
    bang.inbox = inbN > 0; bang.travel = C.travelCost(s, dayKey()) === 0 && B.gt(C.offlineDps(s), 0);
    navBang = bang;
    const opened = !$('panel').classList.contains('collapsed');
    if (opened) applyMode();
    document.querySelectorAll('.sideBtn').forEach(b => { b.classList.toggle('on', (b.dataset.bang || b.dataset.open).split(',').some(k => bang[k])); b.classList.toggle('cur', opened && tab === b.dataset.open); });
    $('resGold').textContent = fmt(s.gold); $('resTickets').textContent = fmt(s.tickets);
    $('resShards').textContent = fmt(s.materials.shard); $('resSouls').textContent = fmt(s.souls);
    $('panel').dataset.tab = tab;
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
    $('ticketDot').classList.toggle('on', s.tickets > 0);
    const fc = C.findCost(s);
    $('soulDot').classList.toggle('on', C.canRitual(s) || (fc != null && B.gte(s.souls, fc)));
    if (tab === 'heroes') renderHeroes();
    if (tab === 'portal') renderPortal();
    if (tab === 'altar') renderAltar();
    if (tab === 'souls') renderSouls();
    if (tab === 'runes') renderRunes();
    if (tab === 'pve') renderPve();
    $('pveDot').classList.toggle('on', !s.mode && CFG.pve.dungeons.some(d => C.attemptsLeft(s, d.id) > 0));
  }
  function renderHeroes() {
    const list = CFG.allies.slice().sort((a, b) => {
      const ua = s.heroes[a.id].unlocked, ub = s.heroes[b.id].unlocked;
      if (ua !== ub) return ua ? -1 : 1;
      return RANKS.indexOf(b.rarity) - RANKS.indexOf(a.rarity);
    });
    const M = CFG.materials, ROMAN = ['', 'I', 'II', 'III', 'IV', 'V'];
    let html = '<div class="matHead"><span>' + M.shard.icon + ' <b>' + fmt(s.materials.shard) + '</b> осколков</span><span>' +
      M.heart.icon + ' <b>' + fmt(s.materials.heart) + '</b> сердец</span></div>' +
      heroDetailHtml() + heroTopHtml() +
      '<div class="secTitle">СОЮЗНИКИ</div><div class="hint2">Отряд ' + s.squad.length + '/' + CFG.squadSize + ' — на арене, у них работают ультимейты. ' +
      'Нанятые вне отряда тоже бьют в полную силу. Звёзды — за дубликаты из портала. Эволюция — за звёзды и материалы с боссов, навсегда.</div>';
    for (const a of list) {

  // ---------- статистика (0.32) ----------
  let liveTapDps = 0, liveAllDps = 0;
  const goldLog = [];                      // [время, заработано золота] раз в секунду — для «золото/мин»
  function goldSample(now) {
    if (goldLog.length && now - goldLog[goldLog.length - 1][0] < 1000) return;
    goldLog.push([now, s.stats.goldEarned]);
    while (goldLog.length > 61) goldLog.shift();
  }
  function goldPerMin() {
    if (goldLog.length < 2) return 0;
    const a = goldLog[0], b = goldLog[goldLog.length - 1], span = (b[0] - a[0]) / 60000;
    return span > 0 ? B.max(0, B.div(B.sub(b[1], a[1]), span)) : 0;
  }
  function playTimeTxt(sec) {
    const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60);

      if ((f - 1) % CFG.hallFloors === 0) html += '<div class="mapHall">' + C.hallOf(f).name + '</div>';

  // ---------- задания ----------

  function weekKey() {
    const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - (d.getDay() + 6) % 7);
    return 'w' + d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  let questsHtml = '';
  function rewardLine(r) {
    const M = CFG.materials, p = [];
    if (r.souls) p.push('👻 ' + fmt(r.souls));
    if (r.tickets) p.push('🎟 ' + r.tickets); if (r.essence) p.push('✦ ' + r.essence);
    if (r.shard) p.push(M.shard.icon + ' ' + r.shard); if (r.heart) p.push(M.heart.icon + ' ' + r.heart);
    return p.join(' · ');
  }
  function questRows(list) {
    let html = '';
    for (const q of list) {
      const pr = C.questProgress(s, q.id), done = pr >= q.goal, claimed = !!s.quests.claimed[q.id];
      const btn = claimed ? '<button class="hBtn" disabled>✓</button>'
        : done ? '<button class="hBtn go" data-claim="' + q.id + '">Забрать</button>'
        : q.go ? '<button class="hBtn" data-go="' + q.go + '">Перейти</button>' : '';
      html += '<div class="hRow' + (claimed ? ' claimed' : '') + '" style="--r:' + (done && !claimed ? 'var(--ok)' : 'var(--line)') + '"><div class="hInfo">' +
        '<div class="hName">' + q.name + '</div><div class="hSub">' + fmt(pr) + ' / ' + fmt(q.goal) + ' · награда ' + rewardLine(q.reward) + '</div>' +
        '<div class="qBar' + (done ? ' done' : '') + '"><i style="width:' + (pr / q.goal * 100) + '%"></i></div></div>' + btn + '</div>';
    }
    return html;
  }

        '<div class="hSub">' + (maxed ? 'все ступени получены' : fmt(Math.min(v, goal)) + ' / ' + fmt(goal) + ' · награда ' + rewardLine(a.reward) + ' и +1 очко') + '</div>' +

        (can ? '<button class="hBtn go" data-ach="' + a.id + '">Забрать</button>' : maxed ? '<button class="hBtn" disabled>✓</button>' : '') + '</div>';

        '<div class="hSub">' + pct(C.runeValue(best)) + ' ' + k.desc + (up ? ' → <b>' + pct(C.runeValue({ ...best, lvl: best.lvl + 1 })) + '</b>' : '') + '</div></div>' +
        (up == null ? '<button class="hBtn" disabled>max</button>'
                    : '<button class="hBtn' + (s.materials.shard >= up ? ' go' : '') + '" data-rup="' + best.id + '"' + (s.materials.shard >= up ? '' : ' disabled') + '>⬆ ' + M.shard.icon + fmt(up) + '</button>') + '</div>';
      // запас по редкостям и слияние
      const parts = [];
      CFG.rarities.forEach((r, tier) => {
        const n = list.filter(x => x.tier === tier).length;
        if (!n) return;
        parts.push('<span><span class="rar r-' + r + '">' + r + '</span> ×' + n + '</span>' +
          (C.mergeable(s, k.id, tier) ? '<button class="hBtn go" data-merge="' + k.id + ':' + tier + '">Слить ' + R.mergeCount + ' → ' + CFG.rarities[tier + 1] + '</button>' : ''));
      });
      html += '<div class="spare">Всего: ' + parts.join(' ') + '</div>';
    }
    // тотемы
    const sets = T.collection.filter(n => C.totemCount(s) >= n).length, next = T.collection.find(n => C.totemCount(s) < n);
    html += '<div class="secTitle">ТОТЕМЫ · собрано ' + C.totemCount(s) + '/' + CFG.biomes.length + ' · ' + pct(C.totemMult(s) - 1) + ' всего урона</div>' +
      '<div class="hint2">Тотем биома даёт финальный босс его 50-го этажа (первое прохождение). +' + Math.round(T.dpsPerLevel * 100) + '% урона за каждый уровень тотема' +
      (next ? '; при ' + next + ' тотемах — ещё ×' + T.collectionMult : '') + (sets ? '. Бонус коллекции сейчас ×' + Math.pow(T.collectionMult, sets).toFixed(2) : '') + '.</div>';
    CFG.biomes.forEach((b, i) => {
      const lv = s.totems[b.id];
      if (!lv) { html += '<div class="hRow locked" style="--r:#3a2a4a"><div class="artIcon">?</div><div class="hInfo"><div class="hName">Тотем: ' + b.name + '</div><div class="hSub">Финальный босс этажа ' + (i + 1) * CFG.biomeFloors + '</div></div></div>'; return; }
      const cst = C.totemUpCost(s, b.id), can = cst && s.materials.shard >= cst.shards && s.materials.heart >= cst.hearts;
      html += '<div class="hRow" style="--r:#ffd36b"><div class="artIcon">🗿</div><div class="hInfo"><div class="hName">Тотем: ' + b.name + ' · ур. ' + lv + '/' + T.maxLevel + '</div>' +
        '<div class="hSub">' + pct(T.dpsPerLevel * lv) + ' всего урона</div></div>' +
        (cst == null ? '<button class="hBtn" disabled>max</button>'
                     : '<button class="hBtn' + (can ? ' go' : '') + '" data-totem="' + b.id + '"' + (can ? '' : ' disabled') + '>⬆ ' + M.shard.icon + fmt(cst.shards) + (cst.hearts ? ' ' + M.heart.icon + cst.hearts : '') + '</button>') + '</div>';
    });
    if (html !== runesHtml) { $('runesTab').innerHTML = html; runesHtml = html; }
  }
  $('runesTab').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || b.disabled) return;
    const d = b.dataset;
    if (d.act === 'rune') {
      const r = C.createRune(s);
      if (r) { const k = C.runeKind(r.type); toast('Новая руна<small>' + k.icon + ' ' + k.name + ' · E</small>'); save(); }
    } else if (d.rup) { if (C.upgradeRune(s, +d.rup)) save(); }
    else if (d.merge) {
      const [type, tier] = d.merge.split(':');
      const r = C.mergeRunes(s, type, +tier);
      if (r) { toast('Слияние рун<small>' + C.runeKind(type).name + ' · ' + CFG.rarities[r.tier] + '</small>'); save(); }
    } else if (d.totem) { if (C.upgradeTotem(s, d.totem)) save(); }
    render();
  });

  // ---------- души, артефакты, ритуал ----------
  const TPS_PREVIEW = 5;                       // для сравнения «до / после» — ожидаемый DPS при 5 тапах в секунду
  let soulsHtml = '';
  const pctUp = m => '+' + fmt(B.floor(B.mul(B.sub(m, 1), 100))) + '%';
  function dpsChange(p) {
    if (!p) return '';
    const cls = B.gte(p.after, p.before) ? 'up' : 'dn';
    return '<div class="dpsPrev">DPS ' + fmt(p.before) + ' → <b class="' + cls + '">' + fmt(p.after) + '</b></div>';
  }
  function renderSouls() {
    const R = CFG.ritual;
    let html = '<div class="soulHead"><div class="soulCnt">👻 <b>' + fmt(s.souls) + '</b> душ</div>' +
      '<div class="soulBonus">' + pctUp(C.soulMult(s)) + ' урона</div></div>' +
      '<div class="hint2">Неизрасходованные души усиливают весь урон: +' + Math.round(CFG.souls.dpsPerSoul * 100) +
      '% за каждую. Трата на артефакты уменьшает этот бонус — смотрите DPS до и после.</div>';
    // ритуал
    const ready = C.canRitual(s);
    html += '<div class="ritualBox' + (ready ? ' ready' : '') + '"><b>Ритуал</b>' +
      (ready ? '<p>Сейчас: <b style="color:#8fe6ff">+' + fmt(C.ritualSouls(s)) + ' душ</b>, новый забег с этажа ' + C.ritualStartFloor(s) +
               '. Чем выше этаж, тем больше душ.</p>'
             : '<p>Откроется на этаже ' + R.floor + '. Сейчас этаж ' + s.maxFloor + ', рекорд ' + s.bestFloor +
               (s.rituals ? ', ритуалов: ' + s.rituals : '') + '.</p>') +
      '<button class="ritBtn" data-act="ritual"' + (ready ? '' : ' disabled') + '>' + (ready ? 'Провести ритуал' : 'Нужен этаж ' + R.floor) + '</button></div>';
    // поиск артефакта
    const fc = C.findCost(s);
    html += '<div class="secTitle">АРТЕФАКТЫ · найдено ' + C.foundCount(s) + '/' + CFG.artifacts.length + ' · все действуют сразу</div>';
    if (fc != null) {
      const after = { ...s, souls: B.sub(s.souls, fc) };
      html += '<div class="recipe"><div>Найти случайный артефакт<small>Бонус душ ' + pctUp(C.soulMult(s)) + ' → ' + pctUp(C.soulMult(after)) + '</small></div>' +
        '<button class="hBtn' + (B.gte(s.souls, fc) ? ' go' : '') + '" data-act="find"' + (B.gte(s.souls, fc) ? '' : ' disabled') + '>👻 ' + fmt(fc) + '</button></div>';
    }
    const arts = CFG.artifacts.slice().sort((x, y) => (C.artLevel(s, y.id) > 0) - (C.artLevel(s, x.id) > 0));   // найденные сверху
    for (const a of arts) {
      const lv = C.artLevel(s, a.id);
      if (!lv) {
        html += '<div class="hRow locked" style="--r:#3a2a4a"><div class="artIcon">?</div><div class="hInfo"><div class="hName">???</div><div class="hSub">Ещё не найден</div></div></div>';
        continue;
      }
      const c = C.upgradeArtCost(s, a.id);
      const prev = c != null ? C.previewSpend(s, 'upgrade', a.id, TPS_PREVIEW) : null;
      html += '<div class="hRow" style="--r:#8fe6ff"><div class="artIcon">' + a.icon + '</div><div class="hInfo">' +
        '<div class="hName">' + a.name + ' · ур. ' + lv + (a.max ? '/' + a.max : '') + '</div><div class="hSub">' + a.desc + '</div>' +
        (prev ? dpsChange(prev) : '') + '</div>' +
        (c == null ? '<button class="hBtn" disabled>max</button>'
                   : '<button class="hBtn' + (B.gte(s.souls, c) ? ' go' : '') + '" data-up="' + a.id + '"' + (B.gte(s.souls, c) ? '' : ' disabled') + '>👻 ' + fmt(c) + '</button>') + '</div>';
    }
    // дерево душ
    html += '<div class="secTitle">ДЕРЕВО ДУШ · ветви открываются ритуалами · без критов</div>';
    for (const b of CFG.soulTree) {
      const open = C.branchOpen(s, b);
      html += '<div class="secTitle branchHead">' + b.name.toUpperCase() + (open ? '' : '<small>🔒 после ' + b.rituals + ' ритуал' + (b.rituals === 1 ? 'а' : 'ов') + '</small>') + '</div>';
      html += '<div class="branch' + (open ? '' : ' closed') + '">';
      b.nodes.forEach((n, i) => {
        const lv = C.treeLevel(s, n.id), nodeOpen = C.treeNodeOpen(s, n.id), c = C.treeCost(s, n.id);
        const prev = c != null && nodeOpen ? C.previewSpend(s, 'tree', n.id, TPS_PREVIEW) : null;
        const extra = n.kind === 'startGold' && lv ? '. Сейчас: ◆ ' + fmt(C.ritualStartGold(s)) : '';
        const hint = !open ? '' : !nodeOpen ? '<div class="dpsPrev">Сначала откройте «' + b.nodes[i - 1].name + '»</div>' : prev ? dpsChange(prev) : '';
        html += '<div class="hRow' + (nodeOpen || lv ? '' : ' locked') + '" style="--r:#b98cff"><div class="artIcon">' + (open ? n.icon : '?') + '</div><div class="hInfo">' +
          '<div class="hName">' + n.name + ' · ' + lv + '/' + n.max + '</div><div class="hSub">' + n.desc + ' за уровень' + extra + '</div>' + hint + '</div>' +
          (c == null ? '<button class="hBtn" disabled>max</button>'
                     : '<button class="hBtn' + (nodeOpen && B.gte(s.souls, c) ? ' go' : '') + '" data-tree="' + n.id + '"' + (nodeOpen && B.gte(s.souls, c) ? '' : ' disabled') + '>👻 ' + fmt(c) + '</button>') + '</div>';
      });
      html += '</div>';
    }
    if (html !== soulsHtml) { $('soulsTab').innerHTML = html; soulsHtml = html; }
  }
  $('soulsTab').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || b.disabled) return;
    const d = b.dataset;
    if (d.act === 'find') {
      const id = C.findArtifact(s);
      if (id) { const a = CFG.artifacts.find(x => x.id === id); toast('Найден артефакт!<small>' + a.icon + ' ' + a.name + '</small>'); save(); }
    } else if (d.up) {
      if (C.upgradeArtifact(s, d.up)) save();
    } else if (d.tree) {
      if (C.buyTreeNode(s, d.tree)) save();
    } else if (d.act === 'ritual') {
      if (!C.canRitual(s)) return;
      const souls = C.ritualSouls(s), start = C.ritualStartFloor(s);
      const after = { ...s, souls: B.add(s.souls, souls) };
      ask('<b>Ритуал</b><span class="askList">' +
        '<b>Получите:</b> +' + fmt(souls) + ' душ (бонус урона ' + pctUp(C.soulMult(s)) + ' → ' + pctUp(C.soulMult(after)) + ')<br>' +
        '<b>Сбросится:</b> золото, уровни удара и героев, найм, этаж — новый забег с этажа ' + start +
        (C.ritualStartGold(s) ? ' и ◆ ' + fmt(C.ritualStartGold(s)) + ' золота' : '') + '<br>' +
        '<b>Сохранится:</b> дерево душ, герои, звёзды, эволюции, материалы, копии, отряд, билеты, эссенция, артефакты, души, рекорды</span>', 'Провести ритуал', () => {
        const r = C.ritual(s);
        if (!r) return;
        dmgLog.length = 0;
        restartAnim('spawn');
        toast('Ритуал проведён<small>+' + fmt(r.souls) + ' 👻 · старт с этажа ' + r.start + '</small>');
        save(); render();
      });
      return;
    }
    render();
  });

  let banner = 'normal', bannerHtml = '';
  function costText(id, n) { const c = C.bannerCost(id, n); return c.lanterns ? '🏮' + c.lanterns : '🎟' + c.tickets; }
  function renderPortal() {
    const P = CFG.portal, b = C.bannerDef(banner), pity = C.bannerPity(s, banner);
    const chips = P.banners.map(x => '<button class="hBtn' + (x.id === banner ? ' go' : '') + '" data-banner="' + x.id + '"' +
      (x.id === 'event' && !C.currentEvent(s) ? ' disabled' : '') + '>' + x.icon + ' ' + x.name + '</button>').join('');
    if (chips !== bannerHtml) { $('bannerPick').innerHTML = chips; bannerHtml = chips; }
    const feat = b.featured ? C.featuredHeroes(s).map(id => CFG.allies.find(a => a.id === id)) : [];
    $('bannerInfo').innerHTML = b.desc + (feat.length ? '. Герои недели: <b>' + feat.map(a => a.name + ' (' + a.rarity + ')').join(', ') + '</b>' : '') +
      (b.id === 'event' ? '. Фонарей: 🏮 ' + fmt(s.event.lanterns) : '');
    $('ticketCount').textContent = fmt(s.tickets);
    const pA = b.pityA || P.pityA, pS = b.pityS || P.pityS;
    $('pityInfo').textContent = 'A+ гарантия через ' + (pA - pity.a) + ' · S+ через ' + (pS - pity.s) + (pity.s > P.softS ? ' · шанс S повышен!' : '');
    $('pull1').disabled = !C.canSummon(s, banner, 1); $('pull1').textContent = '×1 · ' + costText(banner, 1);
    $('pull10').disabled = !C.canSummon(s, banner, 10); $('pull10').textContent = '×10 · ' + costText(banner, 10);
    const base = b.minRarity ? RANKS.indexOf(b.minRarity) : 0, pool = RANKS.filter((r, i) => i >= base);
    const total = pool.reduce((a, r) => a + P.odds[r], 0);
    $('oddsInfo').innerHTML = 'Шансы: ' + pool.map(r => '<span class="rar r-' + r + '">' + r + '</span> ' + (P.odds[r] / total * 100).toFixed(1) + '%').join(' ') +
      '<br>После ' + P.softS + ' призывов без S шанс S растёт с каждым призывом. Гарантии у баннеров раздельные.' +
      '<br>Билеты: за первое прохождение босса каждого 5-го этажа, на 10-м — больше.';
    if (pullShown === lastPull) return;
    pullShown = lastPull;
    $('pullResults').innerHTML = lastPull.map((x, i) => {
      const a = CFG.allies.find(h => h.id === x.id), v = ALLY_VIS[x.id];
      return '<div class="res r-' + x.rarity + '" style="animation-delay:' + (i * 0.05) + 's"><div class="ri">' + v.icon + '</div><div class="rn">' + a.name +
        '</div><div>' + (x.isNew ? '<span class="new">НОВЫЙ</span>' : '+1 копия') + '</div></div>';
    }).join('');
  }
  document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => { tab = b.dataset.tab; render(); }));
  $('heroesTab').addEventListener('click', e => {
    const hd = e.target.closest('[data-hd]');
    if (hd) { heroDetail = hd.dataset.hd; render(); $('heroesTab').scrollTop = 0; return; }
    const b = e.target.closest('button'); if (!b) return;
    let ok = false;
    if (b.dataset.hclose) { heroDetail = null; ok = true; }
    if (b.dataset.hbones) { boneWho = b.dataset.hbones; tab = 'bones'; ok = true; }
    if (b.dataset.hrank) { ok = C.rankUp(s, b.dataset.hrank); if (ok) toast('Новый ранг<small>потолок уровня ' + fmt(C.allyCap(s, b.dataset.hrank)) + '</small>'); }
    if (b.dataset.star) ok = C.starUp(s, b.dataset.star);
    if (b.dataset.in) ok = C.squadAdd(s, b.dataset.in);
    if (b.dataset.out) ok = C.squadRemove(s, b.dataset.out);
    const dd = b.dataset;
    if (dd.cls) { ok = C.chooseClass(s, dd.cls, dayKey()); if (ok) { classPick = false; toast('Класс героя<small>' + C.classDef(dd.cls).name + '</small>'); } }
    if (dd.act === 'clsPick') { classPick = true; ok = true; }
    if (dd.act === 'clsBack') { classPick = false; ok = true; }
    if (dd.cnode) ok = C.buyClassNode(s, dd.cnode);
    if (dd.pet) { ok = C.unlockPet(s, dd.pet); if (ok) toast('Призванное существо!<small>' + C.petDef(dd.pet).icon + ' ' + C.petDef(dd.pet).name + '</small>'); }
    if (dd.pset) ok = C.setPet(s, dd.pset);
    if (dd.pup) ok = C.upgradePet(s, dd.pup);
    if (dd.boost) { ok = C.moveBooster(s, dd.boost, Date.now()); if (ok) toast(CFG.booster.name + '<small>теперь у: ' + (dd.boost === 'hero' ? 'Призванный' : CFG.allies.find(a => a.id === dd.boost).name) + '</small>'); }
    if (b.dataset.evo) {
      const ec = C.evoCost(s, b.dataset.evo);
      ok = C.evolve(s, b.dataset.evo);
      if (ok) toast('Эволюция · ' + ec.name + '!<small>' + CFG.allies.find(a => a.id === b.dataset.evo).name + ': новый облик, ×' + ec.mult + ' DPS</small>');
    }
    if (ok) { save(); render(); }
  });
  $('bannerPick').addEventListener('click', e => { const b = e.target.closest('button'); if (!b || b.disabled) return; banner = b.dataset.banner; render(); });
  function pull(n) {
    const r = C.summon(s, n, banner);
    if (!r) return;
    lastPull = r; save(); render();
    const best = r.reduce((m, x) => RANKS.indexOf(x.rarity) > RANKS.indexOf(m.rarity) ? x : m, r[0]);
    if (RANKS.indexOf(best.rarity) >= RANKS.indexOf('A')) toast('Редкий герой!<small>' + best.rarity + ' · ' + CFG.allies.find(a => a.id === best.id).name + '</small>');
  }
  $('pull1').addEventListener('click', () => pull(1));
  $('pull10').addEventListener('click', () => pull(10));


  // ---------- способности главного героя ----------
  const ABIL_ICON = { flurry: '⚔', hunt: '🎯' };
  const abilUi = {};
  function buildAbilities() {
    const bar = $('abilityBar');
    for (const a of CFG.abilities) {
      const w = document.createElement('div');
      w.className = 'abil';
      w.innerHTML = '<button class="abilUse"><div class="abilCd"></div><span class="abilIcon">' + ABIL_ICON[a.id] + '</span>' +
        '<div class="abilText"><div class="abilName">' + a.name + '</div><div class="abilState"></div></div></button>' +
        '<button class="abilAuto" aria-label="Автоиспользование">АВТО</button>';
      bar.appendChild(w);
      const use = w.querySelector('.abilUse'), auto = w.querySelector('.abilAuto');
      use.addEventListener('click', () => { const ev = C.useAbility(s, a.id); if (ev.length) { handle(ev); save(); } });
      auto.addEventListener('click', () => { C.setAbilityAuto(s, a.id, !s.abilities[a.id].auto); save(); renderAbilities(); });
      abilUi[a.id] = { w, state: w.querySelector('.abilState'), cd: w.querySelector('.abilCd'), auto };
    }
  }
  function renderAbilities() {
    for (const a of CFG.abilities) {
      const u = abilUi[a.id], st = s.abilities[a.id];
      const unlocked = C.abilityUnlocked(s, a.id);
      u.w.classList.toggle('locked', !unlocked);
      // поза ульты героя на 0,7 с, когда способность только что включилась (вручную или авто)
      if (st.active > 0 && !u.wasActive) { heroEl.classList.add('casting'); clearTimeout(u.castT); u.castT = setTimeout(() => heroEl.classList.remove('casting'), 700); }
      u.wasActive = st.active > 0;
      u.w.classList.toggle('active', st.active > 0);
      u.w.classList.toggle('ready', unlocked && st.cd <= 0 && st.active <= 0);
      u.auto.classList.toggle('on', st.auto);
      u.auto.style.visibility = unlocked ? '' : 'hidden';
      u.state.textContent = !unlocked ? 'с этажа ' + a.unlockFloor
        : st.active > 0 ? 'действует ' + Math.ceil(st.active) + 'с'
        : st.cd > 0 ? 'через ' + Math.ceil(st.cd) + 'с' : 'готово';
      u.cd.style.height = (unlocked && st.active <= 0 && st.cd > 0 ? Math.min(1, st.cd / a.cooldown) * 100 : 0) + '%';
    }
  }

  function renderLive() {
    renderAbilities();
    renderUlts();
    if (s.enemy.isBoss || s.mode) {
      const p = Math.max(0, s.bossTimeLeft / (s.mode ? s.mode.timeMax : C.bossTime(s)));
      el.timerFill.style.width = (p * 100) + '%';
      el.timerFill.classList.toggle('low', s.bossTimeLeft < 5);
    }
    const now = performance.now();
    while (dmgLog.length && now - dmgLog[0][0] > DPS_WINDOW * 1000) dmgLog.shift();
    let tapSum = 0, allSum = 0;
    for (const d of dmgLog) { allSum = B.add(allSum, d[1]); if (d[2] === 'tap') tapSum = B.add(tapSum, d[1]); }
    const tapDps = B.div(tapSum, DPS_WINDOW), auto = C.autoDps(s);
    el.dps.textContent = fmt(B.add(tapDps, auto));                       // общий DPS
    liveTapDps = tapDps; liveAllDps = B.div(allSum, DPS_WINDOW);
    goldSample(now);
    if (el.statsMore.classList.contains('show'))
      el.statsMore.textContent = 'Тап ' + fmt(tapDps) + '/с · Авто ' + fmt(auto) + '/с · Реальный средний ' + fmt(B.div(allSum, DPS_WINDOW)) + '/с · Крит ' + Math.round(C.critChance(s) * 100) + '% ×' + C.critMult(s).toFixed(1);
  }

  // ---------- игровой цикл ----------
  let acc = 0, last = performance.now();
  let frameN = 0, pendingRender = false;
  function loop(now) {
    acc += Math.min(0.25, (now - last) / 1000); last = now;
    let changed = false;
    while (acc >= STEP) {
      const ev = C.tick(s, STEP); acc -= STEP;
      if (ev.length) { handle(ev); changed = true; }
    }
    // FPS 30: логика идёт с прежним шагом, перерисовка — через кадр
    const skip = setg.fps === 30 && (frameN++ & 1);
    if (changed && !skip) render(); else if (changed) pendingRender = true;
    if (!skip) { if (pendingRender) { render(); pendingRender = false; } renderLive(); }
    if (Date.now() - lastSave > 5000) save();
    requestAnimationFrame(loop);
  }
  buildAllies();
  buildAbilities();
  render();
  if (s.savedAt) applyOffline((Date.now() - s.savedAt) / 1000);
  if (C.loginAvailable(s, dayKey())) setTimeout(() => toast('📬 Бонус за вход ждёт<small>день ' + (C.loginDayIndex(s) + 1) + ' из ' + CFG.login.days.length + '</small>'), 1200);
  requestAnimationFrame(loop);
})();
