<style>
  :root {
    --bg1: #0d0a12; --bg2: #1e1329; --panel: #170f20; --panel2: #23172f;

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    height: 100%; background: var(--bg1); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden; touch-action: manipulation; user-select: none; -webkit-user-select: none;
  }
  button { font: inherit; color: inherit; border: none; background: none; cursor: pointer; }
  #game {
    position: relative; height: 100%; height: 100dvh; max-width: calc(100dvh * 9 / 16); margin: 0 auto;
    background: radial-gradient(ellipse at 50% 45%, var(--bg2) 0%, var(--bg1) 70%);
    display: flex; flex-direction: column; overflow: hidden; isolation: isolate;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  /* затемнение сверху (HUD) и снизу (панель), чтобы текст читался */
  #bgHall::after { content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, #0d0a12f0 0%, #0d0a12a0 18%, #0d0a1230 38%, #0d0a1210 60%, #0d0a1280 80%, #0d0a12f0 100%); }

  /* ---------- верхний HUD ---------- */
  #hud { padding: 10px 16px 6px; text-align: center; position: relative; z-index: 2; }
  #floorRow { display: flex; align-items: center; justify-content: center; gap: 10px; }
  .navBtn {
    width: 34px; height: 34px; border-radius: 10px; font-size: 18px;
    background: var(--panel2); border: 1px solid var(--line);
  }
  .navBtn:disabled { opacity: .25; }
  #floorLabel { font-size: 17px; font-weight: 800; min-width: 100px; }
  #settingsBtn { position: absolute; right: 12px; top: 10px; font-size: 18px; opacity: .6; width: 34px; height: 34px; }
  #biomeLabel { font-size: 11px; font-weight: 700; letter-spacing: .6px; color: var(--muted); margin-top: 3px; text-transform: uppercase; }
  #dots { display: flex; justify-content: center; gap: 5px; margin-top: 6px; }
  .dot { width: 18px; height: 6px; border-radius: 3px; background: var(--line); }
  .dot.done { background: var(--accent); }
  .dot.cur { background: var(--text); }
  .dot.boss { width: 26px; background: #5a2a24; }
  .dot.boss.cur { background: var(--boss); }
  #enemyName { margin-top: 8px; font-size: 15px; font-weight: 700; }
  #enemyName.boss { color: var(--boss); }
  #enemyName.rare { color: var(--gold); }
  #enemyName.rare.crystal { color: #8fe6ff; }
  .phMark { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: #ffffffb0; box-shadow: 0 0 3px #000; z-index: 1; }
  .phMark.past { background: #ffffff30; }
  #enemy.rare-gold .body { filter: drop-shadow(0 0 12px #ffd36b) drop-shadow(0 0 4px #fff3b0); }
  #enemy.rare-crystal .body { filter: drop-shadow(0 0 12px #8fe6ff) drop-shadow(0 0 4px #e0faff); }
  #enemy.vuln .body { animation: vulnPulse .5s ease-in-out infinite alternate; }
  @keyframes vulnPulse { to { filter: brightness(1.6) drop-shadow(0 0 14px #ff6b4a); } }
  #hpBar {
    position: relative; margin-top: 6px; height: 18px; border-radius: 9px;
    background: var(--hp-dark); border: 1px solid #00000080; overflow: hidden;
  }
  #hpFill { height: 100%; width: 100%; background: linear-gradient(180deg, #e65566, var(--hp)); transition: width .1s ease-out; }
  #hpText { position: absolute; inset: 0; font-size: 12px; line-height: 18px; font-weight: 700; text-shadow: 0 1px 2px #000; }
  #timerBar { margin-top: 5px; height: 5px; border-radius: 3px; background: #2a1c1c; overflow: hidden; visibility: hidden; }
  #timerBar.show { visibility: visible; }
  #timerFill { height: 100%; width: 100%; background: var(--boss); }
  #timerFill.low { background: #ff3030; }
  #stats { margin-top: 6px; font-size: 12px; color: var(--muted); }
  #stats b { color: var(--text); }

  /* ---------- арена ---------- */
  #arena { position: relative; flex: 1; display: flex; align-items: center; justify-content: center; cursor: pointer; min-height: 0; }
  #enemy {
    position: relative; z-index: 1;
    /* размер по высоте арены; враг приподнят, чтобы впереди было место главному герою */
    height: min(44%, 280px); aspect-ratio: 1 / 1.15; transform-origin: 50% 90%; margin-bottom: min(24%, 120px);
    animation: idle 2.4s ease-in-out infinite; pointer-events: none;
  }
  #enemy.boss { height: min(52%, 330px); }
  #enemy svg { width: 100%; height: 100%; overflow: visible; }
  #enemy .crown { display: none; }
  #enemy.boss .crown { display: inline; }
  #enemy.hit { animation: hit .14s ease-out; }
  #enemy.hit .body { filter: brightness(2.2) saturate(.4); }
  #enemy.dead { animation: death .35s ease-in forwards; }
  #enemy.spawn { animation: spawn .25s ease-out; }
  @keyframes idle { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-6px) scale(1.01,.99); } }
  @keyframes hit { 0% { transform: none; } 30% { transform: translate(-6px,2px) scale(.94,1.04); } 60% { transform: translate(5px,-1px) scale(1.03,.97); } 100% { transform: none; } }
  @keyframes death { 30% { transform: scale(1.08,.9); filter: brightness(2.5); } 100% { transform: scale(.6,.1) translateY(40px); opacity: 0; filter: brightness(3); } }
  @keyframes spawn { from { transform: scale(.7) translateY(20px); opacity: 0; } }

  .dmg {
    position: absolute; font-weight: 800; font-size: 24px; color: #fff; pointer-events: none;
    text-shadow: 0 2px 0 #000, 0 0 8px var(--accent); animation: float .7s ease-out forwards;
    transform: translate(-50%,-50%); white-space: nowrap;
  }
  .dmg.gold { color: var(--gold); font-size: 18px; text-shadow: 0 2px 0 #000; }
  @keyframes float { 0% { opacity: 0; transform: translate(-50%,-30%) scale(.6); } 15% { opacity: 1; transform: translate(-50%,-60%) scale(1.15); } 100% { opacity: 0; transform: translate(-50%,-180%) scale(1); } }
  .spark {
    position: absolute; width: 56px; height: 56px; border-radius: 50%; border: 3px solid var(--accent);
    pointer-events: none; transform: translate(-50%,-50%) scale(.2); animation: spark .3s ease-out forwards;
  }
  @keyframes spark { to { transform: translate(-50%,-50%) scale(1.3); opacity: 0; } }
  #hint { position: absolute; bottom: 10px; left: 0; right: 0; text-align: center; font-size: 13px; color: var(--muted); pointer-events: none; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }

  #farmBar {
    position: absolute; top: 8px; left: 16px; right: 16px; display: none;
    align-items: center; justify-content: space-between; gap: 8px;
    padding: 8px 10px 8px 14px; border-radius: 12px; background: #2a1720e6; border: 1px solid #5a2a34;
    font-size: 13px; z-index: 3;
  }
  #farmBar.show { display: flex; }
  #modeBar { position: absolute; top: 8px; left: 16px; right: 16px; display: none; align-items: center; justify-content: space-between; gap: 8px;
    padding: 8px 10px 8px 14px; border-radius: 12px; background: #1a2030e6; border: 1px solid #3a4a6a; font-size: 13px; z-index: 3; }
  #modeBar.show { display: flex; }
  #leaveBtn { padding: 8px 12px; border-radius: 9px; font-weight: 700; background: var(--panel2); border: 1px solid var(--line); }
  #questDot { display: none; width: 7px; height: 7px; border-radius: 50%; background: var(--gold); vertical-align: middle; }
  #questDot.on { display: inline-block; }
  .qBar { height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; margin-top: 4px; }
  .qBar i { display: block; height: 100%; background: var(--accent); }
  .qBar.done i { background: var(--ok); }
  .hRow.claimed { opacity: .45; }
  .claimAll { width: 100%; margin-bottom: 6px; padding: 10px; border-radius: 10px; font-weight: 800; background: linear-gradient(180deg, #3a8a5a, #1f5a36); border: 1px solid var(--ok); }
  #seasonTab .altBtns { flex-wrap: wrap; } #seasonTab .altBtns .hBtn { flex: 1; white-space: normal; }
  #panel .tabBody { overflow-x: hidden; }
  .seasonHead { padding: 10px 12px; border-radius: 12px; margin-bottom: 6px; background: linear-gradient(135deg, #4a1f3a, #1f1430); border: 1px solid #b98cff66; }
  .seasonHead b { font-size: 15px; } .seasonHead small { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; }
  .passBar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; margin: 6px 0 2px; }
  .passBar i { display: block; height: 100%; background: linear-gradient(90deg, #b98cff, #ffd36b); }
  .passRow { display: grid; grid-template-columns: 44px 1fr 1fr; gap: 5px; align-items: stretch; }
  .passRow + .passRow { margin-top: 5px; }
  .passLv { display: grid; place-items: center; border-radius: 9px; background: var(--panel2); font-weight: 800; font-size: 12px; border: 1px solid var(--line); }
  .passLv.got { border-color: var(--gold); color: var(--gold); }

  #allyLayer { position: absolute; inset: 0; pointer-events: none; }
  /* размер зависит от высоты арены — на коротком экране фигуры меньше и не перекрываются */
  .ally { position: absolute; height: min(36%, 130px); aspect-ratio: 1 / 1.3; display: none; transform-origin: 50% 100%; bottom: 18px; }
  .ally.back { height: min(28%, 106px); bottom: calc(18px + min(36%, 130px) + 16px); filter: brightness(.8); }
  .ally.on { display: block; }
  .ally .fig { width: 100%; height: 100%; animation: allyIdle 2.8s ease-in-out infinite; }
  .ally.R .fig svg { transform: scaleX(-1); }
  .ally.attack .fig { animation: allyAtkL .2s ease-out; }
  .ally.R.attack .fig { animation: allyAtkR .2s ease-out; }
  .ally svg { width: 100%; height: 100%; overflow: visible; }
  .allyTag { position: absolute; left: -10px; right: -10px; bottom: -15px; text-align: center; font-size: 10px; font-weight: 700; white-space: nowrap; }
  @keyframes allyIdle { 50% { transform: translateY(-3px); } }
  @keyframes allyAtkL { 40% { transform: translate(14px,-6px) rotate(6deg); } 100% { transform: none; } }
  @keyframes allyAtkR { 40% { transform: translate(-14px,-6px) rotate(-6deg); } 100% { transform: none; } }
  #version { position: absolute; bottom: 2px; left: 8px; font-size: 10px; color: #ffffff30; pointer-events: none; }

  /* ===== интерфейс в стиле образца (0.20): весь экран — бой, меню по бокам, шторка снизу ===== */
  :root { --frame1: #b3302a; --frame2: #6a1512; --frameEdge: #e0a85a; --frameDark: #3a0c0a; }
  #hud { padding-top: 6px; }
  #resBar { display: flex; gap: 5px; align-items: center; margin-bottom: 6px; }
  .res { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: space-between; gap: 4px; height: 28px; padding: 0 8px 0 6px;
    border-radius: 8px; background: #0a0608cc; border: 1px solid #ffffff14; box-shadow: inset 0 1px 0 #ffffff0d; }
  .res i { font-style: normal; font-size: 14px; }
  .res b { font-size: 13px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .res:first-child b { color: var(--gold); }
  #inboxBtn { position: relative; flex: none; width: 30px; height: 28px; font-size: 16px; }
  #inboxCnt { display: none; position: absolute; top: -4px; right: -4px; min-width: 16px; height: 16px; padding: 0 3px; border-radius: 8px; font-style: normal;
    font-size: 10px; font-weight: 900; line-height: 16px; background: #ff4a3a; color: #fff; box-shadow: 0 0 0 2px #0a0608; }
  #inboxCnt.on { display: block; }
  #settingsBtn { position: static; flex: none; width: 30px; height: 28px; opacity: .75; }
  /* кнопки в рамках */
  .side { position: absolute; top: 8px; display: flex; flex-direction: column; gap: clamp(4px, 1dvh, 10px); z-index: 3; }
  .side.L { left: 8px; } .side.R { right: 8px; }
  .sideBtn { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; width: clamp(44px, 6.6dvh, 58px); }
  .sideBtn .ico { width: 100%; aspect-ratio: 1; display: grid; place-items: center; font-size: clamp(20px, 3.4dvh, 28px); border-radius: 12px;
    background: radial-gradient(circle at 50% 35%, var(--frame1), var(--frame2)); border: 2px solid var(--frameEdge);
    box-shadow: 0 0 0 2px var(--frameDark), inset 0 0 0 2px #00000040, inset 0 2px 0 #ffffff30, 0 4px 8px #0008; }
  .sideBtn .lbl { font-size: 10px; font-weight: 800; color: #fff; text-shadow: 0 1px 0 #000, 0 0 4px #000; white-space: nowrap; }
  .sideBtn .bang { display: none; position: absolute; top: -6px; right: -6px; width: 18px; height: 22px; font-style: normal; font-size: 15px; font-weight: 900; line-height: 22px;
    color: #3a1a00; background: linear-gradient(180deg, #ffe08a, #ffa628); border-radius: 6px 6px 9px 9px; box-shadow: 0 0 0 2px #5a2a00, 0 2px 4px #000a; animation: bang 1.4s ease-in-out infinite; }
  .sideBtn.on .bang { display: block; }
  .sideBtn.cur .ico { border-color: #fff3c0; box-shadow: 0 0 0 2px var(--frameDark), 0 0 12px #ffd36b99, inset 0 2px 0 #ffffff30; }
  .sideBtn:active .ico { transform: scale(.94); }
  @keyframes bang { 50% { transform: translateY(-3px) rotate(8deg); } }
  /* «Бей босса» — большая кнопка по центру */
  #farmBar { left: 50%; right: auto; transform: translateX(-50%); top: 6px; flex-direction: column; gap: 4px; padding: 0; background: none; border: none; z-index: 3; }
  #farmBar .plate { padding: 3px 14px; border-radius: 6px; background: #2a120ccc; color: #ffcf8a; font-size: 12px; font-weight: 800; }
  #bossBtn { padding: 10px 30px; border-radius: 12px; font-size: 18px; font-weight: 900; color: #fff; text-shadow: 0 1px 0 #6a2a00;
    background: linear-gradient(180deg, #ffb347, #e8741c 55%, #c2500f); border: 2px solid #ffe08a; box-shadow: 0 0 0 3px #5a2400, 0 4px 10px #000a; }
  #modeBar { left: 50%; right: auto; transform: translateX(-50%); top: 6px; width: min(62%, 260px); }
  /* способности — в нижних углах, рамки как у меню */
  #abilityBar { background: none; border: none; justify-content: space-between; align-items: flex-end; padding: 4px 8px 6px; z-index: 3; }
  #abilityBar .abil { flex: none; width: clamp(62px, 9dvh, 76px); height: auto; flex-direction: column; background: none; border: none; overflow: visible; }
  .abilUse { flex: none; width: 100%; aspect-ratio: 1; flex-direction: column; justify-content: center; gap: 0; padding: 0; text-align: center; border-radius: 12px; overflow: hidden;
    background: radial-gradient(circle at 50% 35%, var(--frame1), var(--frame2)); border: 2px solid var(--frameEdge); box-shadow: 0 0 0 2px var(--frameDark), inset 0 2px 0 #ffffff30, 0 4px 8px #0008; }
  .abilIcon { font-size: clamp(20px, 3.4dvh, 26px); }
  .abilText { width: 100%; }
  .abilName { font-size: 9px; text-shadow: 0 1px 0 #000; }
  .abilState { font-size: 9px; color: #ffe6c0; }
  .abilCd { left: 0; right: 0; top: auto; bottom: 0; width: auto !important; height: 0; background: #000000a0; }
  .abilAuto { width: 100%; height: 20px; margin-top: 4px; border: 1px solid #ffffff20; border-radius: 7px; background: #0a0608cc; font-size: 9px; }
  .abil.ready .abilUse { border-color: #fff3c0; box-shadow: 0 0 0 2px var(--frameDark), 0 0 12px #ffd36b88; }
  .abil.active .abilUse { border-color: var(--gold); box-shadow: 0 0 0 2px var(--frameDark), 0 0 16px #ffd36bcc; }
  .abil.ready, .abil.active { border: none; box-shadow: none; }
  /* меню — шторка снизу поверх боя */
  #game { position: relative; }
  #panel { position: absolute; left: 0; right: 0; bottom: 0; z-index: 6; height: 62%; display: flex; flex-direction: column;
    border-radius: 18px 18px 0 0; border: 2px solid var(--frameEdge); border-bottom: none; box-shadow: 0 -2px 0 var(--frameDark), 0 -10px 30px #000c;
    padding-bottom: calc(10px + env(safe-area-inset-bottom)); transition: transform .22s ease-out; }
  #panel.collapsed { transform: translateY(105%); pointer-events: none; }
  #panelToggle { height: 34px; justify-content: space-between; padding: 0 4px; font-size: 14px; font-weight: 800; color: var(--text); }
  #panelToggle .x { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 8px; background: var(--panel2); border: 1px solid var(--line); font-size: 13px; color: var(--muted); }
  #panel.collapsed #canBuy.on { display: none; }
  .tabBody, #cards { max-height: none; flex: 1; min-height: 0; }
  #panel #cards { overflow-y: auto; }
  #panel .tabBody { overflow-y: auto; }
  #panel { overflow: hidden; }
  /* задний ряд союзников — внутрь, чтобы не прятаться за боковыми кнопками */
  .ally.back { margin: 0 9%; }
  /* «Бей босса» не наезжает на боковые колонки */
  #farmBar, #modeBar { top: 4px; }
  #version { bottom: auto; top: 2px; left: auto; right: 6px; }
  /* ===== нижняя навигация (0.34) ===== */
  #bottomNav { position: relative; z-index: 8; display: flex; justify-content: space-around; gap: 4px; padding: 6px 8px 6px;
    background: linear-gradient(180deg, #1a0f14, #0a0608); border-top: 2px solid var(--frameEdge); box-shadow: 0 -2px 0 var(--frameDark); }
  #bottomNav .sideBtn { width: clamp(52px, 7.2dvh, 64px); }
  #bottomNav .sideBtn .ico { aspect-ratio: auto; height: clamp(38px, 5.4dvh, 48px); }
  #panel { bottom: var(--navH, 72px); height: calc(58% - var(--navH, 72px) * .3); }
  #panel.full { top: 0; height: auto; border-radius: 0; border-top: none; z-index: 9; bottom: var(--navH, 72px); }
  #tabs { display: none !important; }
  #panel[data-tab="more"] #moreTab { display: block; }
  #moreGrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px 8px; padding: 6px 2px; justify-items: center; }
  #moreGrid .sideBtn { width: 100%; max-width: 70px; }

  /* ===== карточки «Прокачки» по образцу (0.31): пергамент, портрет в рамке ===== */
  #multCycle { min-width: 76px; padding: 7px 14px; border-radius: 9px; font-size: 15px; font-weight: 900; color: #3a2a00;
    background: linear-gradient(180deg, #f4e35a, #c9b52a); border: 2px solid #5a4a10; box-shadow: 0 0 0 2px #1a1408, inset 0 2px 0 #fff8; }
  #cards .card { background: linear-gradient(180deg, #d8b886, #b8925e); border: 2px solid #4a3018; box-shadow: 0 0 0 2px #1a1008, inset 0 1px 0 #fff5; border-radius: 10px; padding: 8px; }
  #cards .cardIcon { width: 58px; height: 58px; border-radius: 6px; font-size: 28px; border: 3px solid #8a8a92; box-shadow: 0 0 0 2px #2a2a30, inset 0 0 10px #0008; }
  #cards .card.nohire .cardIcon { filter: grayscale(1) brightness(.85); opacity: .55; }
  #cards .cardTitle { color: #3a2410; font-size: 15px; }
  #cards .cardSub { color: #5a3a1c; font-weight: 600; }
  #cards .cardSub b { color: #1f6a2e; } #cards .cardSub .ms { color: #8a3a10; opacity: 1; } #cards .cardSub .dim { color: #6a4a2c; }
  #cards .badge.rs { background: #0002; color: #4a3018; } #cards .badge.sq { background: #1f6a2e33; color: #1f5a28; }
  #cards .buy { min-width: 116px; border-radius: 10px; color: #ffe8c0; text-shadow: 0 1px 0 #0008;
    background: linear-gradient(180deg, #d8382c, #8a1410); border: 2px solid #2a0a08; box-shadow: 0 0 0 2px #5a5a62, inset 0 2px 0 #ff9a8a66; }
  #cards .buy.hire { background: linear-gradient(180deg, #9a4ad8, #5a1a8a); box-shadow: 0 0 0 2px #5a5a62, inset 0 2px 0 #d8a8ff66; }
  #cards .buy span { color: #ffd36b; }
  #cards .buy:disabled { background: linear-gradient(180deg, #4a4a52, #2a2a30); color: #a8a8b0; }
  #cards .buy:disabled span { color: #c8c8d0; }
  .lockCard { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 10px;
    background: linear-gradient(180deg, #2a3a30, #1a2620); border: 2px solid #4a3a5a; box-shadow: 0 0 0 2px #120a18; }
  .lockCard .cardIcon { width: 58px; height: 58px; border-radius: 6px; font-size: 26px; filter: grayscale(.6) brightness(.7); border: 3px solid #5a4a6a; display: grid; place-items: center; flex: none; }
  .lockCard .lcInfo { flex: 1; text-align: center; }
  .lockCard .lcName { font-weight: 800; color: #e8e0d0; }
  .lockCard button { margin-top: 6px; padding: 7px 14px; border-radius: 8px; font-weight: 800; color: #fff; background: linear-gradient(180deg, #4aa8e8, #1a6aa8); border: 2px solid #0a2a48; }
  .heroDetail { padding: 10px; border-radius: 12px; margin-bottom: 8px; background: linear-gradient(180deg, #d8b886, #b8925e); border: 2px solid #4a3018; color: #3a2410; }
  .heroDetail .hdTop { display: flex; gap: 10px; }
  .heroDetail .hdPort { width: 76px; height: 76px; border-radius: 8px; display: grid; place-items: center; font-size: 40px; border: 3px solid #8a8a92; flex: none; }
  .heroDetail .hdName { font-size: 16px; font-weight: 900; }
  .heroDetail .hdStat { font-size: 12px; font-weight: 700; color: #5a3a1c; margin-top: 2px; }
  .heroDetail .hdSlots { display: grid; grid-template-columns: repeat(3, 34px); gap: 4px; margin-left: auto; align-content: start; }
  .heroDetail .hdSlot { width: 34px; height: 34px; border-radius: 5px; display: grid; place-items: center; font-size: 16px; background: #1a1210; border: 2px solid #5a4a3a; position: relative; }
  .heroDetail .hdSlot.empty { opacity: .5; }
  .heroDetail .hdSlot.empty::after { content: "✕"; position: absolute; right: 1px; bottom: -2px; font-size: 10px; color: #ff4a3a; font-weight: 900; }
  .heroDetail .hdBtns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-top: 8px; }
  .heroDetail .hdBtns button { padding: 8px 4px; border-radius: 8px; font-size: 12px; font-weight: 800; color: #fff; background: linear-gradient(180deg, #2a8a6a, #145a44); border: 2px solid #0a2a20; }
  .heroDetail .hdBtns button:disabled { background: #4a4a52; color: #a8a8b0; }
  .hIcon { cursor: pointer; }
  /* экран героя: описание, ульт, навыки (0.32) */
  .hdLore { margin-top: 8px; padding: 7px 9px; border-radius: 9px; background: #3a1e0c1c; border: 1px solid #5a3a1a30; font-size: 12px; color: #5a3a1e; font-weight: 700; }
  .hdLore q { display: block; font-style: italic; color: #2a1608; font-weight: 600; margin-bottom: 3px; }
  .hdUlt { margin-top: 6px; font-size: 12px; line-height: 1.35; color: #2a1608; }
  .hdUlt b { color: #8a2a10; }
  .heroDetail .secTitle { color: #6a3a1a; }
  .hdPerks { margin-top: 6px; display: grid; gap: 4px; }
  .hdPerk { display: flex; align-items: center; gap: 7px; padding: 5px 8px; border-radius: 8px; background: #3a1e0c1c; font-size: 12px; color: #2a1608; }
  .hdPerk .pl { flex: none; min-width: 42px; text-align: center; padding: 2px 4px; border-radius: 6px; font-weight: 900; font-size: 11px; background: #2a8a6a; color: #fff; }
  .hdPerk .pd { flex: 1; min-width: 0; } .hdPerk .pd b { display: block; }
  .hdPerk.lock { color: #6a5a4a; } .hdPerk.lock .pl { background: #6a6056; }
  .hdPerk .pk { flex: none; font-size: 11px; font-weight: 700; color: #8a2a10; white-space: nowrap; }
  /* бонус за вход, путешествие во времени, сундуки (0.33) */
  .loginGrid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin: 4px 0 8px; }
  .lgDay { position: relative; padding: 4px 2px 3px; border-radius: 8px; text-align: center; font-size: 10px; line-height: 1.2; background: var(--panel2); border: 1px solid var(--line); min-height: 44px; }
  .lgDay b { display: block; font-size: 11px; color: var(--muted); }
  .lgDay.big { border-color: #c9962e; background: linear-gradient(180deg, #3a2a10, #23172f); }
  .lgDay.got { opacity: .45; } .lgDay.got::after { content: "✓"; position: absolute; top: 1px; right: 4px; color: var(--ok); font-weight: 900; }
  .lgDay.now { border: 2px solid var(--gold); box-shadow: 0 0 8px #ffd36b80; } .lgDay.now b { color: var(--gold); }
  .chestRow { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 4px 0 6px; }
  .chestRow button { padding: 6px 2px; border-radius: 10px; background: var(--panel2); border: 1px solid var(--line); font-size: 11px; line-height: 1.25; }
  .chestRow button .ci { display: block; font-size: 22px; }
  .chestRow button.ready { border: 2px solid var(--gold); box-shadow: 0 0 8px #ffd36b80; animation: vulnPulse .6s ease-in-out infinite alternate; }
  .chestRow button.open { opacity: .45; }
  .chestBar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .chestBar i { display: block; height: 100%; background: var(--gold); }
  #enemy.rare-chest .body { filter: drop-shadow(0 0 12px #ffb36b) drop-shadow(0 0 4px #fff3b0) sepia(.6) saturate(1.6); }
  #enemyName.rare.chest { color: #ffb36b; }
  /* статистика */
  .stGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .stCell { padding: 7px 9px; border-radius: 9px; background: var(--panel2); border: 1px solid var(--line); }
  .stCell span { display: block; font-size: 11px; color: var(--muted); }
  .stCell b { font-size: 15px; }
  /* карта Башни */
  #floorLabel { cursor: pointer; }
  #floorLabel::after { content: " 🗺"; font-size: 13px; opacity: .7; }
  .mapHead { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .mapHead .mt { flex: 1; text-align: center; font-weight: 800; font-size: 13px; }
  .mapHead .mt small { display: block; font-weight: 600; color: var(--muted); font-size: 11px; }
  .mapBar { display: flex; gap: 6px; margin-bottom: 8px; }
  .mapBar button { flex: 1; }
  .mapPath { position: relative; padding: 4px 0 10px; }
  .mapPath::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 4px; margin-left: -2px; background: repeating-linear-gradient(#c9962e80 0 8px, transparent 8px 14px); }
  .mapHall { position: relative; margin: 8px auto 4px; width: max-content; padding: 2px 10px; border-radius: 10px; font-size: 11px; font-weight: 800; color: var(--gold); background: #0a0608; border: 1px solid #c9962e60; }
  .mapRow { position: relative; height: 38px; }
  .mapNode { position: absolute; top: 3px; width: 34px; height: 32px; margin-left: -17px; border-radius: 50%; font-size: 11px; font-weight: 900; color: #fff;
    background: radial-gradient(circle at 50% 35%, #3a8a5a, #1a4a2a); border: 2px solid #8fe6a0; display: grid; place-items: center; }
  .mapNode.lock { background: #2a2a30; border-color: #4a4a52; color: #8a8a90; }
  .mapNode.cur { background: radial-gradient(circle at 50% 35%, var(--frame1), var(--frame2)); border-color: var(--frameEdge); box-shadow: 0 0 10px #ffb36b; }
  .mapNode.fin { width: 44px; height: 40px; margin-left: -22px; top: -1px; font-size: 18px; }
  .mapNode i { position: absolute; bottom: -9px; font-style: normal; font-size: 10px; color: var(--text); text-shadow: 0 0 3px #000; }
</style>
</head>
<body>
<div id="game">
  <div id="bgHall"><div class="img"></div></div>
  <div id="hud">
    <div id="resBar">
      <div class="res"><i>◆</i><b id="resGold">0</b></div>
      <div class="res"><i>🎟</i><b id="resTickets">0</b></div>
      <div class="res"><i>🔹</i><b id="resShards">0</b></div>
      <div class="res"><i>👻</i><b id="resSouls">0</b></div>
      <button id="inboxBtn" aria-label="Награды">📬<i id="inboxCnt"></i></button>
      <button id="settingsBtn" aria-label="Настройки">⚙</button>
    </div>
    <div id="floorRow">
      <button class="navBtn" id="prevFloor" aria-label="Этаж ниже">‹</button>
      <div id="floorLabel">Этаж 1</div>
      <button class="navBtn" id="nextFloor" aria-label="Этаж выше">›</button>
    </div>
    <div id="biomeLabel"></div>
    <div id="dots"></div>
    <div id="enemyName"></div>
    <div id="hpBar"><div id="hpFill"></div><div id="hpText"></div></div>
    <div id="timerBar"><div id="timerFill"></div></div>
    <div id="stats">Урон за тап <b id="tapDmg"></b> · DPS <b id="dps">0</b> ⓘ<div id="statsMore"></div></div>
    <div id="buffs"></div>
  </div>

  <div id="arena">
    <div id="ultBanner"></div>
    <div id="modeBar"><span id="modeInfo"></span><button id="leaveBtn">Выйти</button></div>
    <div id="farmBar"><span class="plate">Фарм этажа</span><button id="bossBtn">Бей босса</button></div>
    <!-- Временная заглушка врага (не финальный ассет) -->
    <div id="enemy">
      <svg viewBox="0 0 200 230">
        <ellipse cx="100" cy="222" rx="70" ry="8" fill="#00000070"/>
        <g class="body">
          <path d="M40 215 Q30 140 55 95 Q70 60 100 55 Q130 60 145 95 Q170 140 160 215 Q130 200 100 210 Q70 200 40 215Z" fill="#3b2550" stroke="#140a1d" stroke-width="4"/>
          <path d="M65 90 L55 40 L80 75Z M135 90 L145 40 L120 75Z" fill="#2a1a3a" stroke="#140a1d" stroke-width="4" stroke-linejoin="round"/>
          <path class="crown" d="M70 62 L76 30 L88 50 L100 22 L112 50 L124 30 L130 62Z" fill="#c9962e" stroke="#140a1d" stroke-width="4" stroke-linejoin="round"/>
          <ellipse cx="80" cy="110" rx="11" ry="8" fill="#ff4d6a"/>
          <ellipse cx="120" cy="110" rx="11" ry="8" fill="#ff4d6a"/>
          <circle cx="80" cy="110" r="3.5" fill="#fff"/><circle cx="120" cy="110" r="3.5" fill="#fff"/>
          <path d="M78 145 Q100 160 122 145 L115 152 L108 146 L100 154 L92 146 L85 152Z" fill="#140a1d"/>
          <path d="M60 170 Q100 185 140 170" fill="none" stroke="#5c3b7a" stroke-width="4" stroke-linecap="round"/>
        </g>
      </svg>
    </div>
    <div id="allyLayer"></div>
    <div id="pet"><div class="pfig"></div><div class="allyTag"></div></div>
    <div id="hero">
      <div class="fig">
        <svg viewBox="0 0 120 138">
          <ellipse cx="60" cy="133" rx="44" ry="6" fill="#00000080"/>

(function (root) {

    // Потолок шанса крита 50% для всех источников вместе (обычные удары остаются всегда). Одинаков для героя,
    // союзников и питомца; каждый удар проверяется отдельно. Крит-урон растёт отдельно, тоже только от артефактов.

    // Отряд определяет, чьи фигуры на арене и чьи ультимейты срабатывают. Звёзды повышают только индивидуальный DPS.
    rarities: ['E', 'D', 'C', 'B', 'A', 'S', 'GOD'],

    maxStars: 10,

    portal: {
      odds: { E: 40, D: 28, C: 17, B: 9, A: 4.5, S: 1.2, GOD: 0.3 },

      // «Возрастающие шансы»: после softS призывов без S+ шанс S растёт на softStep п.п. за призыв (до гарантии)
      softS: 70, softStep: 3,

    souls: { dpsPerSoul: 0.1 },
