  <div id="ask" class="askWrap">
    <div class="askBox">
      <p id="askText"></p>
      <div class="askBtns"><button class="mBtn" id="askNo">Отмена</button><button class="mBtn danger" id="askYes">Да</button></div>
    </div>
  </div>
  <div id="version">v0.22</div>
</div>

<script>
/*__CORE__*/
</script>
<script>
(function () {
  'use strict';
  const C = Core, CFG = Core.CONFIG, fmt = Core.fmt;
  // Внешний вид союзников (временные заглушки, не финальные ассеты)
  const WEAPON = {
    bow: '<path d="M82 40 Q100 76 82 112" fill="none" stroke="#6b4a2a" stroke-width="4" stroke-linecap="round"/><path d="M82 40 L82 112" stroke="#cfd8dc" stroke-width="1.2"/><path d="M60 76 L96 76" stroke="#cfd8dc" stroke-width="2.5" stroke-linecap="round"/>',
    axe: '<path d="M78 30 L84 118" stroke="#5a3a22" stroke-width="5" stroke-linecap="round"/><path d="M80 34 Q104 40 100 62 Q90 54 82 56Z" fill="#9aa4ab" stroke="#1a1a1a" stroke-width="2.5"/>',
    staff: '<path d="M80 36 L84 120" stroke="#4a2a1a" stroke-width="4" stroke-linecap="round"/><circle cx="80" cy="30" r="9" fill="#ff8a3d" stroke="#5a1a0a" stroke-width="2"/><circle cx="80" cy="30" r="4" fill="#ffe08a"/>',
    blades: '<path d="M70 70 L98 44" stroke="#c8b8ff" stroke-width="4" stroke-linecap="round"/><path d="M68 84 L100 72" stroke="#c8b8ff" stroke-width="4" stroke-linecap="round"/>',
  };
  const ALLY_VIS = {
    irene:  { body: '#1f3c4a', hood: '#163039', eye: '#8fe6ff', icon: '🏹', iconBg: '#1e3a46', weapon: 'bow' },
    borg:   { body: '#4a2a1f', hood: '#3a1f16', eye: '#ffb36b', icon: '🪓', iconBg: '#46281e', weapon: 'axe' },
    lia:    { body: '#4a1f2a', hood: '#3a1620', eye: '#ffd36b', icon: '🔥', iconBg: '#46201e', weapon: 'staff' },
    kael:   { body: '#2a1f4a', hood: '#20163a', eye: '#c8b8ff', icon: '🗡', iconBg: '#2a1e46', weapon: 'blades' },
    garret: { body: '#3a3a2a', hood: '#2c2c1e', eye: '#e6e6b0', icon: '🛡', iconBg: '#36361e', weapon: 'axe' },
    saya:   { body: '#1f4a2c', hood: '#163a20', eye: '#9dffb8', icon: '🔪', iconBg: '#1e4628', weapon: 'blades' },
    drake:  { body: '#1f2c4a', hood: '#16203a', eye: '#8fb8ff', icon: '🔱', iconBg: '#1e2a46', weapon: 'staff' },
    noa:    { body: '#2a2a4a', hood: '#1f1f3a', eye: '#d8e6ff', icon: '⚡', iconBg: '#24244a', weapon: 'staff' },
    velma:  { body: '#2a3a2a', hood: '#1e2c1e', eye: '#b8ff8f', icon: '💀', iconBg: '#223a22', weapon: 'staff' },
    ragnar: { body: '#3a2a3a', hood: '#2c1e2c', eye: '#ff8fb8', icon: '⚔', iconBg: '#3a223a', weapon: 'axe' },
    seiren: { body: '#1f3a4a', hood: '#16303a', eye: '#8fffff', icon: '🌪', iconBg: '#1e3a46', weapon: 'staff' },
    carna:  { body: '#4a1f3a', hood: '#3a162c', eye: '#ffd36b', icon: '🎭', iconBg: '#46203a', weapon: 'blades' },
    yuki:   { body: '#dfe8f2', hood: '#b8c8da', eye: '#6bd8ff', icon: '❄', iconBg: '#2a3a4a', weapon: 'staff' },
    morra:  { body: '#3a1f2a', hood: '#2c1620', eye: '#ff6b9a', icon: '🕯', iconBg: '#3a1e2a', weapon: 'staff' },
    azrael: { body: '#4a3a1f', hood: '#3a2c16', eye: '#fff0a0', icon: '🪽', iconBg: '#46381e', weapon: 'blades' },
  };
  // Слоты отряда: двое по бокам впереди, двое позади
  const SLOTS = [
    { pos: 'left:2%', side: 'L', back: false }, { pos: 'right:2%', side: 'R', back: false },
    { pos: 'left:7%', side: 'L', back: true },  { pos: 'right:7%', side: 'R', back: true },
  ];

  // Облики эволюции (временные заглушки): I — сияние, II — наплечники и плащ, III — корона и ореол
  function allySvg(v, evo) {
    evo = evo || 0;
    const aura = evo >= 1 ? '<ellipse cx="50" cy="80" rx="44" ry="52" fill="' + v.eye + '" opacity="' + (0.10 + 0.05 * evo) + '"/>' : '';
    const cape = evo >= 2 ? '<path d="M30 60 Q16 96 20 126 L34 124 Z M70 60 Q84 96 80 126 L66 124 Z" fill="' + v.eye + '" opacity=".55" stroke="#0a0a10" stroke-width="2"/>' +
      '<path d="M26 64 Q34 52 44 58 L40 70 Z M74 64 Q66 52 56 58 L60 70 Z" fill="#c8ccd4" stroke="#0a0a10" stroke-width="2.5"/>' : '';
    const crown = evo >= 3 ? '<ellipse cx="50" cy="12" rx="17" ry="4.5" fill="none" stroke="' + v.eye + '" stroke-width="2.5"/>' +
      '<path d="M38 22 L41 12 L46 19 L50 9 L54 19 L59 12 L62 22 Z" fill="#ffd36b" stroke="#5a3a0a" stroke-width="1.5"/>' : '';
    return '<svg viewBox="0 0 100 130"><ellipse cx="50" cy="126" rx="34" ry="5" fill="#00000070"/>' + aura + cape +
      '<path d="M22 124 L34 58 Q50 46 66 58 L78 124 Q50 116 22 124Z" fill="' + v.body + '" stroke="#0a0a10" stroke-width="3"/>' +
      '<path d="M32 52 Q32 22 50 18 Q68 22 68 52 Q60 60 50 60 Q40 60 32 52Z" fill="' + v.hood + '" stroke="#0a0a10" stroke-width="3"/>' +
      '<ellipse cx="44" cy="44" rx="3" ry="2.4" fill="' + v.eye + '"/><ellipse cx="57" cy="44" rx="3" ry="2.4" fill="' + v.eye + '"/>' +
      WEAPON[v.weapon] + crown + '</svg>';
  }
  const allyUi = {};                 // id → { sprite, title, sub, btn }
  function buildAllies() {
    const layer = $('allyLayer'), cards = $('allyCards');
    for (const a of CFG.allies) {
      const v = ALLY_VIS[a.id];
      const sp = document.createElement('div');
      sp.className = 'ally';
      sp.innerHTML = '<div class="fig">' + allySvg(v, s.heroes[a.id].evo) + '</div><div class="allyTag" style="color:' + v.eye + '">' + a.name + '</div><div class="ultBar" style="color:' + v.eye + '"><i></i></div>';
      layer.appendChild(sp);
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = '<div class="cardIcon" style="background:' + v.iconBg + '">' + v.icon + '</div>' +
        '<div class="cardInfo"><div class="cardTitle"></div><div class="cardSub"></div></div><button class="buy"></button>';
      cards.appendChild(card);
      const btn = card.querySelector('.buy');
      btn.addEventListener('click', () => {
        if (btn.dataset.rank) { if (C.rankUp(s, a.id)) { toast('Новый ранг · ' + a.name + '<small>потолок уровня ' + fmt(C.allyCap(s, a.id)) + '</small>'); save(); render(); } return; }
        if (C.buyAlly(s, a.id, buyCount(s.allies[a.id].level))) { save(); render(); }
      });
      allyUi[a.id] = { evo: s.heroes[a.id].evo, fig: sp.querySelector('.fig'), card, ultBar: sp.querySelector('.ultBar'), ultFill: sp.querySelector('.ultBar i'), sprite: sp, title: card.querySelector('.cardTitle'), sub: card.querySelector('.cardSub'), btn, color: v.eye };
    }
  }
  const SAVE_KEY = 'prizvannyy_v2_save';
  const STEP = 1 / 30;                 // фиксированный шаг логики
  const DPS_WINDOW = 5;                // период усреднения DPS, сек (TBD)

  const $ = id => document.getElementById(id);
  const el = {
    arena: $('arena'), enemy: $('enemy'), hpFill: $('hpFill'), hpText: $('hpText'),
    enemyName: $('enemyName'), dots: $('dots'), floorLabel: $('floorLabel'),
    prev: $('prevFloor'), next: $('nextFloor'), timerBar: $('timerBar'), timerFill: $('timerFill'),
    tapDmg: $('tapDmg'), dps: $('dps'), hint: $('hint'), farmBar: $('farmBar'), bossBtn: $('bossBtn'),
    toast: $('toast'), gold: $('gold'), tapLvl: $('tapLvl'), tapSub: $('tapSub'), buyTap: $('buyTap'),
    statsMore: $('statsMore'),
    modal: $('modal'), saveInfo: $('saveInfo'),
  };

  // ---------- сохранение ----------
  function load() {
    try { const raw = localStorage.getItem(SAVE_KEY); if (raw) { const s = C.deserialize(raw); if (s) return s; } } catch (e) {}
    return C.newState();
  }
  let lastSave = 0;
  function save() {
    try { localStorage.setItem(SAVE_KEY, C.serialize(s)); lastSave = Date.now(); } catch (e) {}
  }

  let s = load();
  let mult = 1;
  let anyAffordable = false;
  const heroEl = $('hero');
  const UI_KEY = 'prizvannyy_v2_ui';
  const TAB_NAMES = { season: 'Сезон', up: 'Прокачка', quests: 'Задания', heroes: 'Герои', portal: 'Портал', altar: 'Алтарь', souls: 'Души', runes: 'Руны', pve: 'PvE' };
  function setCollapsed(on) {
    $('panel').classList.toggle('collapsed', on);
    try { localStorage.setItem(UI_KEY, JSON.stringify({ collapsed: on })); } catch (e) {}
  }
  setCollapsed(true);                    // на старте меню закрыто — весь экран под бой
  $('panelToggle').addEventListener('click', () => setCollapsed(true));
  // боковые кнопки открывают нужный раздел; повторное нажатие закрывает
  document.querySelectorAll('.sideBtn').forEach(b => b.addEventListener('click', () => {
    const open = !$('panel').classList.contains('collapsed');
    if (open && tab === b.dataset.open) { setCollapsed(true); return; }
    tab = b.dataset.open; setCollapsed(false); render();
  }));
  const dmgLog = [];                    // [время, урон] для DPS
  let tapped = s.stats.taps > 0;

  for (let i = 1; i <= CFG.enemiesPerFloor; i++) {
    const d = document.createElement('div');
    d.className = 'dot' + (i === CFG.enemiesPerFloor ? ' boss' : '');
    el.dots.appendChild(d);
  }

  // ---------- эффекты ----------
  function fx(cls, x, y, text, life) {
    const n = document.createElement('div');
    n.className = cls; n.style.left = x + 'px'; n.style.top = y + 'px';
    if (text != null) n.textContent = text;
    el.arena.appendChild(n);
    setTimeout(() => n.remove(), life);
    return n;
  }
  function restartAnim(cls) {
    el.enemy.classList.remove('hit', 'spawn', 'dead');
    void el.enemy.offsetWidth;
    if (cls) el.enemy.classList.add(cls);
  }
  let toastTimer = 0;
  function toast(html) {
    el.toast.innerHTML = html; el.toast.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => el.toast.classList.remove('show'), 1600);
  }

  // ---------- обработка событий ядра ----------
  function handle(events, x, y) {
    const r = el.arena.getBoundingClientRect();
    for (const e of events) {
      if (e.type === 'hit') {
        if (e.source === 'tap') {
          dmgLog.push([performance.now(), e.dmg, 'tap']);
          heroEl.classList.remove('attack'); void heroEl.offsetWidth; heroEl.classList.add('attack');
          fx('spark', x, y, null, 300);
          if (e.crit) fx('critFlash', x, y, null, 160);
          fx('dmg' + (e.crit ? ' crit' : ''), x + Math.random() * 30 - 15, y, (e.crit ? 'КРИТ ' : '') + fmt(e.dmg), e.crit ? 850 : 700);
        } else if (e.source === 'heroAuto') {
          dmgLog.push([performance.now(), e.dmg, 'auto']);
          heroEl.classList.remove('attack'); void heroEl.offsetWidth; heroEl.classList.add('attack');
          const dx = r.width * (0.44 + Math.random() * 0.12), dy = r.height * 0.5;
          if (e.crit) fx('critFlash', dx, dy, null, 160);
          fx('dmg auto' + (e.crit ? ' crit' : ''), dx, dy, fmt(e.dmg), 700).style.color = e.crit ? '' : 'var(--gold)';
        } else {
          dmgLog.push([performance.now(), e.dmg, 'auto']);
          const isUlt = e.source.startsWith('ult:');
          const u = allyUi[isUlt ? e.source.slice(4) : e.source];
          if (u && isUlt) {
            const d = fx('dmg nuke', r.width / 2, r.height * 0.4, fmt(e.dmg), 900);
            d.style.color = u.color;
          } else if (u) {
            u.sprite.classList.remove('attack'); void u.sprite.offsetWidth; u.sprite.classList.add('attack');
            const dx = r.width * (0.38 + Math.random() * 0.24), dy = r.height * (0.42 + Math.random() * 0.14);
            if (e.crit) fx('critFlash', dx, dy, null, 160);
            const d = fx('dmg auto' + (e.crit ? ' crit' : ''), dx, dy, fmt(e.dmg), 700);
            if (!e.crit) d.style.color = u.color;
          }
        }
        restartAnim('hit');
      } else if (e.type === 'kill') {
        restartAnim('dead');
        if (!e.mode) fx('dmg gold', r.width / 2, r.height * 0.35, '+' + fmt(e.gold) + ' ◆', 700);
        if (e.rare) toast(C.rareDef(e.rare).name + '!<small>+' + fmt(e.gold) + ' ◆' + (e.rare === 'crystal' ? ' и осколки' : '') + '</small>');
        if (e.boss) save();
      } else if (e.type === 'materials') {
        fx('dmg gold', r.width / 2, r.height * 0.28, '+' + e.shard + ' ' + CFG.materials.shard.icon, 900).style.color = '#8fd0ff';
        if (e.heart) setTimeout(() => toast('Сердце стража!<small>+' + e.heart + ' ' + CFG.materials.heart.icon + ' — для эволюции героев</small>'), 3200);
      } else if (e.type === 'phase') {
        const b = $('ultBanner');
        b.textContent = 'Фаза ' + e.phase + '/' + e.of + ' · босс уязвим!';
        b.style.color = 'var(--boss)';
        b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
      } else if (e.type === 'top') {
        toast('Вершина Башни!<small>Этаж ' + fmt(e.floor) + ' — выше пока не подняться</small>');
      } else if (e.type === 'modeEnd') {
        dmgLog.length = 0; save(); showModeEnd(e);
      } else if (e.type === 'modeStart') {
        const b = $('ultBanner'); b.textContent = e.name; b.style.color = '#8fb8ff';
        b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
      } else if (e.type === 'totem') {
        setTimeout(() => toast('Тотем получен!<small>🗿 ' + e.name + ' · вкладка «Руны»</small>'), 4800);
      } else if (e.type === 'biome') {
        setTimeout(() => toast('Новый биом<small>' + e.name + '</small>'), 600);
      } else if (e.type === 'tickets') {
        setTimeout(() => toast('Билеты портала<small>+' + e.n + ' 🎟</small>'), 1700);
      } else if (e.type === 'firstClear') {
        toast('Этаж ' + e.floor + ' пройден впервые!<small>+' + fmt(e.gold) + ' ◆</small>');
      } else if (e.type === 'bossFail') {
        toast('Время вышло!<small style="color:var(--muted)">Усились и вызови босса снова</small>');
        save();
      } else if (e.type === 'ability') {
        const b = $('ultBanner');
        b.textContent = 'Призванный · ' + e.name + '!';
        b.style.color = 'var(--gold)';
        b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
        heroEl.classList.remove('attack'); void heroEl.offsetWidth; heroEl.classList.add('attack');
        renderAbilities();
      } else if (e.type === 'ult') {
        const u = allyUi[e.id];
        u.sprite.classList.remove('ulting'); void u.sprite.offsetWidth; u.sprite.classList.add('ulting');
        const b = $('ultBanner');
        b.textContent = CFG.allies.find(a => a.id === e.id).name + ' · ' + e.name + '!';
        b.style.color = u.color;
        b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
      } else if (e.type === 'spawn') {
        restartAnim('spawn');
      }
    }
  }

  // ---------- ввод ----------
  el.arena.addEventListener('pointerdown', e => {
    if (e.target.closest('#farmBar') || e.target.closest('#modeBar') || e.target.closest('.side')) return;
    e.preventDefault();
    const r = el.arena.getBoundingClientRect();
    const ev = C.tap(s);
    if (!ev.length) return;
    if (!tapped) { tapped = true; }
    if (navigator.vibrate) navigator.vibrate(8);
    handle(ev, e.clientX - r.left, e.clientY - r.top);
    render();
  });
  el.bossBtn.addEventListener('click', () => { handle(C.challengeBoss(s)); render(); });
  el.prev.addEventListener('click', () => { handle(C.goToFloor(s, s.floor - 1)); render(); save(); });
  el.next.addEventListener('click', () => { handle(C.goToFloor(s, s.floor + 1)); render(); save(); });
  document.querySelectorAll('.multBtn').forEach(b => b.addEventListener('click', () => {
    mult = b.dataset.n === 'max' || b.dataset.n === 'ms' ? b.dataset.n : +b.dataset.n;
    document.querySelectorAll('.multBtn').forEach(x => x.classList.toggle('on', x === b));
    render();
  }));
  // «ДО ×3»: ровно столько уровней, сколько осталось до следующей вехи урона
  function buyCount(level) { return mult === 'ms' ? C.nextMilestone(level) - level : mult; }
  el.buyTap.addEventListener('click', () => {
    if (el.buyTap.dataset.rank) { if (C.rankUp(s, 'hero')) { toast('Новый ранг · Призванный<small>потолок удара ' + fmt(C.tapCap(s)) + '</small>'); save(); render(); } return; }
    if (C.buyTap(s, buyCount(s.tapLevel))) { save(); render(); }
  });
  $('stats').addEventListener('click', () => el.statsMore.classList.toggle('show'));
  $('settingsBtn').addEventListener('click', () => {
    el.saveInfo.textContent = 'Прогресс сохраняется автоматически на этом устройстве. Лучший этаж: ' +
      (s.maxFloor) + '. Тапов: ' + fmt(s.stats.taps) + ', побеждено врагов: ' + fmt(s.stats.kills) + '.';
    el.modal.classList.add('show');
  });
  $('closeModal').addEventListener('click', () => el.modal.classList.remove('show'));
  // ---------- окно подтверждения ----------
  let askYesFn = null;
  function ask(text, yesLabel, onYes) {
    $('askText').innerHTML = text;
    $('askYes').textContent = yesLabel || 'Да';
    askYesFn = onYes;
    $('ask').classList.add('show');
  }
  $('askNo').addEventListener('click', () => { $('ask').classList.remove('show'); askYesFn = null; });
  $('askYes').addEventListener('click', () => { $('ask').classList.remove('show'); const f = askYesFn; askYesFn = null; if (f) f(); });

  $('resetBtn').addEventListener('click', () => {
    ask('Сбросить весь прогресс? Это нельзя отменить.', 'Сбросить', () => {
      try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
      s = C.newState(); tapped = false; dmgLog.length = 0;
      el.modal.classList.remove('show'); restartAnim('spawn'); render();
    });
  });
  // ---------- офлайн: отряд сам идёт вверх до стены, затем фармит этаж ниже ----------
  function dur(sec) {
    const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60);
    return (h ? h + ' ч ' : '') + m + ' мин';
  }
  function applyOffline(seconds) {
    const r = C.offlineProgress(s, seconds);
    if (!r) return;
    dmgLog.length = 0;
    $('awayTitle').textContent = 'Пока вас не было';
    $('awayTime').textContent = dur(r.seconds) + (r.capped ? ' (больше 12 ч не считается)' : '');
    const M = CFG.materials, lines = [];
    if (C.offlineDps(s) <= 0) lines.push('Отряд не нанят — без союзников и автоатаки офлайн-дохода нет.');
    else {
      lines.push(r.floorsCleared ? '<b>Пройдено этажей:</b> ' + r.floorsCleared + ' (' + r.fromFloor + ' → ' + (r.wallFloor || r.toFloor) + ')'
                                 : '<b>Новых этажей нет</b>');
      if (r.wallFloor) lines.push('Босс этажа ' + r.wallFloor + ' оказался не по силам — отряд фармит этаж ' + r.farmFloor);
      lines.push('<b>Золото:</b> +' + fmt(r.gold) + ' ◆ · врагов ' + fmt(r.kills));
      if (r.shard || r.heart) lines.push('<b>Материалы:</b> +' + fmt(r.shard) + ' ' + M.shard.icon + (r.heart ? ' · +' + r.heart + ' ' + M.heart.icon : ''));
      if (r.tickets) lines.push('<b>Билеты:</b> +' + r.tickets + ' 🎟');
    }
    $('awayList').innerHTML = lines.join('<br>');
    $('away').classList.add('show');
    save(); render();
  }
  $('awayOk').addEventListener('click', () => $('away').classList.remove('show'));
  let hiddenAt = 0;
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { hiddenAt = Date.now(); save(); }
    else if (hiddenAt) { const gap = (Date.now() - hiddenAt) / 1000; hiddenAt = 0; last = performance.now(); applyOffline(gap); }
  });
  window.addEventListener('pagehide', save);
  document.addEventListener('contextmenu', e => e.preventDefault());

  // ---------- отрисовка ----------
  let lastBiome = '', lastMarks = '';
  function render() {
    const en = s.enemy;
    el.floorLabel.textContent = 'Этаж ' + s.floor;
    const bio = C.biomeOf(s.floor);
    const hall = C.hallOf(s.floor), place = C.biomeName(s.floor) + ' · ' + hall.name;
    if (lastBiome !== place && !s.mode) {
      lastBiome = place;
      $('biomeLabel').textContent = place;
      const g = $('game').style;
      g.setProperty('--bg2', bio.sky[0]); g.setProperty('--bg1', bio.sky[1]);
      g.setProperty('--bh', (bio.bg[0] + hall.hue) + 'deg'); g.setProperty('--bs', bio.bg[1]); g.setProperty('--bb', bio.bg[2] * hall.bri);
      g.setProperty('--hx', hall.x + '%'); g.setProperty('--hz', hall.zoom); g.setProperty('--hf', hall.flip ? -1 : 1);
    }
    const m = s.mode;
    if (m) {
      el.floorLabel.textContent = m.kind === 'endless' ? 'Волна ' + m.step : m.name;
      $('biomeLabel').textContent = m.kind === 'dungeon' ? 'Подземелье · уровень ' + m.tier + ' · враг ' + m.step + '/' + m.total
        : m.kind === 'endless' ? 'Бесконечное подземелье · рекорд ' + s.pve.endlessBest : 'Личный босс · ' + m.diffName;
      $('modeInfo').textContent = m.kind === 'endless' ? '✦ +' + m.essence + (m.tickets ? ' · 🎟 +' + m.tickets : '') : m.name;
      lastBiome = '';
    }
    $('modeBar').classList.toggle('show', !!m);
    el.dots.style.visibility = m ? 'hidden' : '';
    el.prev.disabled = !!m || s.floor <= 1;
    el.next.disabled = !!m || s.floor >= s.maxFloor;
    [...el.dots.children].forEach((d, i) => {
      const idx = i + 1;
      d.classList.toggle('done', idx < s.enemyIndex);
      d.classList.toggle('cur', idx === s.enemyIndex);
    });
    el.enemyName.textContent = en.isBoss ? (en.final ? 'ФИНАЛЬНЫЙ БОСС · ' : 'БОСС · ') + en.name : en.rare ? '✦ ' + en.name + ' ✦' : en.name;
    el.enemyName.classList.toggle('boss', en.isBoss);
    el.enemyName.classList.toggle('rare', !!en.rare);
    el.enemyName.classList.toggle('crystal', en.rare === 'crystal');
    el.enemy.classList.toggle('boss', en.isBoss);
    el.enemy.classList.toggle('rare-gold', en.rare === 'gold');
    el.enemy.classList.toggle('rare-crystal', en.rare === 'crystal');
    // оттенок от биома + небольшой разброс; редкие и боссы — свои
    el.enemy.style.filter = en.rare ? 'none' : en.isBoss ? 'hue-rotate(' + (bio.hue + 130) + 'deg) saturate(1.3)' + (en.final ? ' contrast(1.15)' : '')
      : 'hue-rotate(' + (bio.hue + (s.floor * 37 + s.enemyIndex * 11) % 60 - 30) + 'deg)';
    // отметки фаз на полоске HP босса
    const marks = en.isBoss ? (en.final ? CFG.bossPhases.final : CFG.bossPhases.normal) : [];
    const mk = marks.map((t, i) => t + ':' + (en.phase > i + 1 ? 1 : 0)).join();
    if (mk !== lastMarks) {
      lastMarks = mk;
      $('hpBar').querySelectorAll('.phMark').forEach(x => x.remove());
      marks.forEach((t, i) => { const d = document.createElement('div'); d.className = 'phMark' + (en.phase > i + 1 ? ' past' : ''); d.style.left = (t * 100) + '%'; $('hpBar').appendChild(d); });
    }
    el.hpFill.style.width = (en.hp / en.maxHp * 100) + '%';
    el.hpText.textContent = fmt(en.hp) + ' / ' + fmt(en.maxHp);
    el.timerBar.classList.toggle('show', s.mode ? (s.mode.kind !== 'endless' || en.isBoss) : en.isBoss);
    el.farmBar.classList.toggle('show', s.farming && !s.mode);
    el.hint.style.display = tapped ? 'none' : '';
    el.tapDmg.textContent = fmt(C.tapHit(s));
    el.gold.textContent = fmt(s.gold);
    const tcap = C.tapCap(s), tAtCap = s.tapLevel >= tcap;
    el.tapLvl.textContent = fmt(s.tapLevel) + '/' + fmt(tcap);

    const n = Math.max(1, Math.min(tcap - s.tapLevel, mult === 'max' ? Math.max(1, C.maxAffordable(s.tapLevel, s.gold)) : buyCount(s.tapLevel)));
    const cost = C.upgradeCost(s.tapLevel, n);
    const can = cost <= s.gold;
    el.tapSub.innerHTML = rankTag(s.heroRank) + (tAtCap ? 'Урон ' + fmt(C.tapHit(s)) + ' · <span class="ms">потолок — повысьте ранг</span>'
      : 'Урон ' + fmt(C.tapHit(s)) + ' → <b>' + fmt(C.tapDamageAt(s.tapLevel + n) * C.permMult(s, 'tap')) + '</b>' + msHint(s.tapLevel));
    anyAffordable = false;
    renderTabs();
    if (tAtCap) setRank(el.buyTap, 'hero');
    else setBuy(el.buyTap, can, n, cost, '+' + fmt(n) + ' ур.' + (mult === 'ms' ? ' ×' + CFG.milestoneMult : ''));

    // союзник
    for (const a of CFG.allies) {
      const u = allyUi[a.id], lv = s.allies[a.id].level;
      const acap = C.allyCap(s, a.id), aAtCap = lv >= acap;
      const an = Math.max(1, Math.min(acap - lv, mult === 'max' ? Math.max(1, C.allyMax(s, a.id)) : buyCount(lv)));
      const acost = C.allyCost(s, a.id, an);
      const pm = C.permMult(s, 'ally') * C.heroMult(s, a.id);   // души, артефакты, звёзды и эволюция
      if (u.evo !== s.heroes[a.id].evo) { u.evo = s.heroes[a.id].evo; u.fig.innerHTML = allySvg(ALLY_VIS[a.id], u.evo); }
      u.sub.innerHTML = aAtCap ? rankTag(s.heroes[a.id].rank) + 'DPS ' + fmt(C.allyDps(s, a.id) * C.permMult(s, 'ally')) + ' · <span class="ms">потолок — повысьте ранг</span>'
                    : lv ? rankTag(s.heroes[a.id].rank) + 'DPS ' + fmt(C.allyDps(s, a.id) * C.permMult(s, 'ally')) + ' → <b>' + fmt(C.allyDpsAt(a.id, lv + an) * pm) + '</b>' + msHint(lv)
                           : '<span class="dim">' + a.role + ' · удар раз в ' + a.attackInterval + ' с</span> DPS <b>' + fmt(C.allyDpsAt(a.id, an) * pm) + '</b>';
      if (aAtCap) setRank(u.btn, a.id);
      else setBuy(u.btn, acost <= s.gold, an, acost, (lv ? '+' + fmt(an) + ' ур.' : 'Нанять' + (an > 1 ? ' +' + fmt(an - 1) : '')) + (mult === 'ms' ? ' ×' + CFG.milestoneMult : ''));
      const unlocked = s.heroes[a.id].unlocked, sq = s.squad.indexOf(a.id);
      u.card.style.display = unlocked ? '' : 'none';
      u.card.style.order = sq >= 0 ? sq : 10 + CFG.allies.indexOf(a);
      u.title.innerHTML = '<span class="rar r-' + a.rarity + '">' + a.rarity + '</span> ' + a.name + ' · ' + (lv ? 'ур. ' + fmt(lv) + '/' + fmt(acap) : a.role) +
        (sq >= 0 ? '<span class="badge sq">отряд</span>' : '<span class="badge rs">резерв</span>');
      // фигура на арене — только у героя в отряде и нанятого
      const slot = SLOTS[sq];
      u.sprite.classList.toggle('on', sq >= 0 && lv > 0);
      if (slot) {
        u.sprite.className = 'ally ' + slot.side + (slot.back ? ' back' : '') + (sq >= 0 && lv > 0 ? ' on' : '');
        u.sprite.style.cssText = slot.pos;
      }
    }
    $('canBuy').classList.toggle('on', anyAffordable);
    const upBtn = document.querySelector('.sideBtn[data-open="up"]'); if (upBtn) upBtn.classList.toggle('on', anyAffordable);
  }

  // Подсказка о следующей вехе уровня
  function msHint(level) {
    return '<span class="ms"> · ×' + CFG.milestoneMult + ' на ' + fmt(C.nextMilestone(level)) + '</span>';
  }

  // Ранг: «Р III·4» — ранг и подранг
  const RN = ['', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X'];
  function rankTag(k) { const r = C.rankLabel(k); return '<span class="ms">Ранг ' + RN[r.rank] + (r.max ? ' · макс' : '·' + r.sub) + '</span> · '; }
  // Кнопка повышения ранга на месте покупки, когда уровень упёрся в потолок
  function setRank(btn, who) {
    const c = C.rankCost(s, who), M = CFG.materials;
    btn.dataset.rank = '1';
    if (!c) { btn.disabled = true; btn.innerHTML = 'Предел<span>ур. ' + fmt(C.capAt(C.maxSteps())) + '</span>'; return; }
    const evoOk = who === 'hero' || s.heroes[who].evo >= c.needEvo;
    const can = C.canRankUp(s, who);
    btn.disabled = !can;
    if (can) anyAffordable = true;
    const price = M.shard.icon + ' ' + fmt(c.shards) + (c.hearts ? ' ' + M.heart.icon + ' ' + c.hearts : '');
    btn.innerHTML = !evoOk ? 'Нужна эволюция ' + RN[c.needEvo] + '<span>для ранга ' + RN[c.newRank] + '</span>'
      : (c.newRank ? '⇧ Ранг ' + RN[c.newRank] : '⇧ Подранг') + '<span>' + price + ' → ' + fmt(c.cap) + '</span>';
  }
  function setBuy(btn, can, n, cost, label) {
    delete btn.dataset.rank;
    btn.disabled = !can;
    if (can) anyAffordable = true;
    btn.innerHTML = can ? label + '<span>◆ ' + fmt(cost) + '</span>'
                              : 'Не хватает<span>◆ ' + fmt(cost - s.gold) + '</span>';
  }

  const BUFF_UI = [
    { key: 'team', kind: 'teamBuff', color: '#ff8a6b' },
    { key: 'tap', kind: 'tapBuff', color: '#c8b8ff' },
  ];
  let lastBuffHtml = '';
  function renderUlts() {
    for (const a of CFG.allies) {
      const u = allyUi[a.id], st = s.allies[a.id];
      const p = st.level > 0 ? st.ult / a.ult.charge : 0;
      u.ultFill.style.width = (p * 100) + '%';
      u.ultBar.classList.toggle('ready', p >= 1);
    }
    const parts = [];
    for (const b of BUFF_UI) {
      const left = s.buffs[b.key];
      if (left > 0) parts.push('<span class="buff" style="color:' + b.color + '">' + CFG.allies.find(a => a.ult.kind === b.kind).ult.name + ' ' + Math.ceil(left) + 'с</span>');
    }
    if (s.enemy.vuln > 0 && s.enemy.alive) parts.push('<span class="buff" style="color:#ff6b4a">Уязвим ' + Math.ceil(s.enemy.vuln) + 'с</span>');
    el.enemy.classList.toggle('vuln', s.enemy.vuln > 0 && s.enemy.alive);
    if (s.enemy.mark > 0) parts.push('<span class="buff" style="color:#ffb36b">Метка ' + Math.ceil(s.enemy.mark) + 'с</span>');
    const html = parts.join('');
    if (html !== lastBuffHtml) { $('buffs').innerHTML = html; lastBuffHtml = html; }
    el.arena.classList.toggle('fury', s.buffs.team > 0);
    el.enemy.classList.toggle('marked', s.enemy.mark > 0 && s.enemy.alive);
    heroEl.classList.toggle('empowered', s.buffs.tap > 0);
  }

  // ---------- вкладки: коллекция героев и портал ----------
  let tab = 'up';
  let lastPull = [], pullShown = null, heroesHtml = '';
  const RANKS = CFG.rarities;
  function renderTabs() {
    C.dailyReset(s, dayKey());
    C.seasonReset(s, dayKey());
    C.questsReset(s, dayKey(), weekKey());
    $('questDot').classList.toggle('on', C.claimableCount(s) > 0);
    if (tab === 'quests') renderQuests();
    if (tab === 'season') renderSeason();
    $('toggleLabel').textContent = TAB_NAMES[tab] || '';
    // «!» на боковых кнопках
    const fcost = C.findCost(s);
    const bang = {
      up: anyAffordable, quests: C.claimableCount(s) > 0, portal: s.tickets > 0,
      heroes: CFG.allies.some(a => s.heroes[a.id].unlocked && (C.canEvolve(s, a.id) || (C.starCost(s, a.id) != null && s.heroes[a.id].copies >= C.starCost(s, a.id)))),
      souls: C.canRitual(s) || (fcost != null && s.souls >= fcost),
      pve: !s.mode && CFG.pve.dungeons.some(d => C.attemptsLeft(s, d.id) > 0),
      season: seasonBang(), altar: false, runes: s.materials.shard >= CFG.runes.createCost && !s.runes.length,
    };
    const opened = !$('panel').classList.contains('collapsed');
    document.querySelectorAll('.sideBtn').forEach(b => { b.classList.toggle('on', !!bang[b.dataset.open]); b.classList.toggle('cur', opened && tab === b.dataset.open); });
    $('resGold').textContent = fmt(s.gold); $('resTickets').textContent = fmt(s.tickets);
    $('resShards').textContent = fmt(s.materials.shard); $('resSouls').textContent = fmt(s.souls);
    $('panel').dataset.tab = tab;
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
    $('ticketDot').classList.toggle('on', s.tickets > 0);
    const fc = C.findCost(s);
    $('soulDot').classList.toggle('on', C.canRitual(s) || (fc != null && s.souls >= fc));
    if (tab === 'heroes') renderHeroes();
    if (tab === 'portal') renderPortal();
    if (tab === 'altar') renderAltar();
    if (tab === 'souls') renderSouls();
    if (tab === 'runes') renderRunes();
    if (tab === 'pve') renderPve();
    $('pveDot').classList.toggle('on', !s.mode && CFG.pve.dungeons.some(d => C.attemptsLeft(s, d.id) > 0));
  }
  function renderHeroes() {
    const list = CFG.allies.slice().sort((a, b) => {
      const ua = s.heroes[a.id].unlocked, ub = s.heroes[b.id].unlocked;
      if (ua !== ub) return ua ? -1 : 1;
      return RANKS.indexOf(b.rarity) - RANKS.indexOf(a.rarity);
    });
    const M = CFG.materials, ROMAN = ['', 'I', 'II', 'III', 'IV', 'V'];
    let html = '<div class="matHead"><span>' + M.shard.icon + ' <b>' + fmt(s.materials.shard) + '</b> осколков</span><span>' +
      M.heart.icon + ' <b>' + fmt(s.materials.heart) + '</b> сердец</span></div>' +
      '<div class="hint2">Отряд ' + s.squad.length + '/' + CFG.squadSize + ' — на арене, у них работают ультимейты. ' +
      'Нанятые вне отряда тоже бьют в полную силу. Звёзды — за дубликаты из портала. Эволюция — за звёзды и материалы с боссов, навсегда.</div>';
    for (const a of list) {
      const h = s.heroes[a.id], v = ALLY_VIS[a.id];
      if (!h.unlocked) {
        html += '<div class="hRow locked r-' + a.rarity + '"><div class="hIcon" style="background:#1a1420">?</div><div class="hInfo">' +
          '<div class="hName"><span class="rar r-' + a.rarity + '">' + a.rarity + '</span> ???</div><div class="hSub">' + (a.hidden ? 'Скрытый рецепт Алтаря' : a.seasonal ? 'Сезонный герой — тропа сезона или обмен жетонов' : 'Откройте в портале') + '</div></div></div>';
        continue;
      }
      const sq = C.inSquad(s, a.id), need = C.starCost(s, a.id), ec = C.evoCost(s, a.id), canEvo = C.canEvolve(s, a.id);
      const stars = '★ ' + h.stars + '/' + CFG.maxStars;
      const nEvo = CFG.evolution.stages.length;
      const okNo = (have, want) => '<span class="' + (have >= want ? 'ok' : 'no') + '">';
      const evoNeed = ec ? '<div class="evoNeed">' + ec.name + ' (×' + ec.mult + ' DPS): ' + okNo(h.stars, ec.stars) + '★' + ec.stars + '</span> · ' +
          okNo(s.materials.shard, ec.shards) + M.shard.icon + fmt(ec.shards) + '</span>' +
          (ec.hearts ? ' · ' + okNo(s.materials.heart, ec.hearts) + M.heart.icon + ec.hearts + '</span>' : '') + '</div>'
        : '<div class="evoNeed"><span class="ok">Эволюция завершена</span></div>';
      html += '<div class="hRow r-' + a.rarity + '"><div class="hIcon" style="background:' + v.iconBg + '">' + v.icon +
        (h.evo ? '<span class="evoPip">' + ROMAN[h.evo] + '</span>' : '') + '</div>' +
        '<div class="hInfo"><div class="hName"><span class="rar r-' + a.rarity + '">' + a.rarity + '</span> ' + a.name +
        (sq ? '<span class="badge sq">отряд</span>' : '') + '</div>' +
        '<div class="hSub"><span class="stars">' + stars + '</span>' + (h.evo ? ' · <span class="evoTag">облик ' + ROMAN[h.evo] + '/' + ROMAN[nEvo] + '</span>' : '') +
        ' · ранг ' + (() => { const r = C.rankLabel(h.rank); return RN[r.rank] + (r.max ? ' макс' : '·' + r.sub); })() + ' · копий ' + h.copies + ' · ' + a.ult.name + '</div>' + evoNeed + '</div><div class="hBtns">' +
        (need == null ? '<button class="hBtn" disabled>★ max</button>'
                      : '<button class="hBtn' + (h.copies >= need ? ' go' : '') + '" data-star="' + a.id + '"' + (h.copies >= need ? '' : ' disabled') + '>★ за ' + need + '</button>') +
        (sq ? '<button class="hBtn" data-out="' + a.id + '">Убрать</button>'
            : '<button class="hBtn go" data-in="' + a.id + '"' + (s.squad.length >= CFG.squadSize ? ' disabled' : '') + '>В отряд</button>') +
        (ec ? '<button class="hBtn' + (canEvo ? ' evo' : '') + '" data-evo="' + a.id + '"' + (canEvo ? '' : ' disabled') + '>⬆ ' + ROMAN[ec.stage] + '</button>' : '') +
        '</div></div>';
    }
    if (html !== heroesHtml) { $('heroesTab').innerHTML = html; heroesHtml = html; }   // без лишних перерисовок
  }
  // ---------- Алтарь ----------
  let altarSel = {}, altarHtml = '';
  function cleanSel() {
    for (const id in altarSel) {
      const max = s.locks[id] ? 0 : s.heroes[id].copies;
      altarSel[id] = Math.max(0, Math.min(altarSel[id], max));
      if (!altarSel[id]) delete altarSel[id];
    }
  }
  function renderAltar() {
    cleanSel();
    const A = CFG.altar;
    const total = Object.values(altarSel).reduce((a, b) => a + b, 0);
    const value = total ? C.sacrificeValue(altarSel) : 0;
    let html = '<div class="altHead"><div class="ess">✦ <b>' + fmt(s.essence) + '</b> эссенции</div><div class="altBtns">' +
      '<button class="hBtn go" data-act="all">Выбрать всё</button><button class="hBtn" data-act="none">Сброс</button></div></div>' +
      '<div class="hint2">Пожертвованные копии исчезают навсегда. 🔒 защищает копии героя от выбора.</div>';
    const list = CFG.allies.filter(a => s.heroes[a.id].unlocked)
      .sort((a, b) => RANKS.indexOf(b.rarity) - RANKS.indexOf(a.rarity));
    for (const a of list) {
      const h = s.heroes[a.id], v = ALLY_VIS[a.id], n = altarSel[a.id] || 0, locked = !!s.locks[a.id];
      html += '<div class="hRow r-' + a.rarity + '"><div class="hIcon" style="background:' + v.iconBg + '">' + v.icon + '</div>' +
        '<div class="hInfo"><div class="hName"><span class="rar r-' + a.rarity + '">' + a.rarity + '</span> ' + a.name + '</div>' +
        '<div class="hSub">копий ' + h.copies + ' · ✦' + A.essence[a.rarity] + ' за копию</div></div>' +
        '<button class="lockBtn' + (locked ? ' on' : '') + '" data-lock="' + a.id + '">' + (locked ? '🔒' : '🔓') + '</button>' +
        '<div class="step"><button data-minus="' + a.id + '"' + (n ? '' : ' disabled') + '>−</button><span>' + n + '</span>' +
        '<button data-plus="' + a.id + '"' + (!locked && n < h.copies ? '' : ' disabled') + '>+</button></div></div>';
    }
    html += '<button class="sacBtn" data-act="sac"' + (total ? '' : ' disabled') + '>' +
      (total ? 'Пожертвовать ' + total + ' коп. → +' + fmt(value) + ' ✦' : 'Выберите копии для жертвы') + '</button>';
    html += '<div class="secTitle">РЕЦЕПТЫ</div>';
    html += '<div class="recipe"><div>Слеза портала<small>✦' + A.ticketCost + ' → 1 билет</small></div>' +
      '<button class="hBtn' + (s.essence >= A.ticketCost ? ' go' : '') + '" data-act="tear"' + (s.essence >= A.ticketCost ? '' : ' disabled') + '>Создать</button></div>';

  $('altarTab').addEventListener('click', e => {

    }

        const r = C.sacrifice(s, altarSel);

  // ---------- задания ----------
  // Неделя начинается с понедельника; ключ — дата этого понедельника
  function weekKey() {
    const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - (d.getDay() + 6) % 7);
    return 'w' + d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  let questsHtml = '';
  function rewardLine(r) {
    const M = CFG.materials, p = [];
    if (r.tickets) p.push('🎟 ' + r.tickets); if (r.essence) p.push('✦ ' + r.essence);
    if (r.shard) p.push(M.shard.icon + ' ' + r.shard); if (r.heart) p.push(M.heart.icon + ' ' + r.heart);
    return p.join(' · ');
  }
  function questRows(list) {
    let html = '';
    for (const q of list) {
      const pr = C.questProgress(s, q.id), done = pr >= q.goal, claimed = !!s.quests.claimed[q.id];
      const btn = claimed ? '<button class="hBtn" disabled>✓</button>'
        : done ? '<button class="hBtn go" data-claim="' + q.id + '">Забрать</button>'
        : q.go ? '<button class="hBtn" data-go="' + q.go + '">Перейти</button>' : '';
      html += '<div class="hRow' + (claimed ? ' claimed' : '') + '" style="--r:' + (done && !claimed ? 'var(--ok)' : 'var(--line)') + '"><div class="hInfo">' +
        '<div class="hName">' + q.name + '</div><div class="hSub">' + fmt(pr) + ' / ' + fmt(q.goal) + ' · награда ' + rewardLine(q.reward) + '</div>' +
        '<div class="qBar' + (done ? ' done' : '') + '"><i style="width:' + (pr / q.goal * 100) + '%"></i></div></div>' + btn + '</div>';
    }
    return html;
  }

    html += '<div class="secTitle">ЕЖЕНЕДЕЛЬНЫЕ · обновятся в понедельник</div>' + questRows(Q.weekly);

  // ---------- сезон и боевой пропуск ----------
  let seasonHtml = '';
  function seasonReward(r) {
    const M = CFG.materials, p = [];
    if (r.tickets) p.push('🎟' + r.tickets); if (r.shard) p.push(M.shard.icon + r.shard); if (r.essence) p.push('✦' + r.essence);

  function seasonBang() {

    return (t && C.trailProgress(s) >= t.goal) || C.catchupAvailable(s, dayKey());
  }

      '<button class="hBtn' + (ss.premium ? ' go' : '') + '" data-act="premium">' + (ss.premium ? 'Премиум включён (тест)' : 'Включить премиум (тест)') + '</button></div>';

    const R = CFG.runes, T = CFG.totems, M = CFG.materials;
    const pct = x => '+' + fmt(Math.round(x * 100)) + '%';
    let html = '<div class="matHead"><span>' + M.shard.icon + ' <b>' + fmt(s.materials.shard) + '</b> осколков</span><span>' + M.heart.icon + ' <b>' + fmt(s.materials.heart) + '</b> сердец</span></div>' +
      '<div class="recipe"><div>Создать руну<small>Случайный вид, редкость E. В каждом виде действует лучшая руна; 3 одинаковые сливаются в следующую редкость</small></div>' +
      '<button class="hBtn' + (s.materials.shard >= R.createCost ? ' go' : '') + '" data-act="rune"' + (s.materials.shard >= R.createCost ? '' : ' disabled') + '>' + M.shard.icon + ' ' + R.createCost + '</button></div>';
    for (const k of R.kinds) {
      const list = s.runes.filter(r => r.type === k.id), best = C.bestRune(s, k.id);
      html += '<div class="secTitle">' + k.name.toUpperCase() + ' · ' + k.desc + '</div>';
      if (!best) { html += '<div class="hRow locked" style="--r:#3a2a4a"><div class="runeIcon">' + k.icon + '</div><div class="hInfo"><div class="hName">Нет руны</div><div class="hSub">Создайте руну — вид выпадает случайно</div></div></div>'; continue; }
      const rr = CFG.rarities[best.tier], up = C.runeUpCost(best);
      html += '<div class="hRow r-' + rr + '"><div class="runeIcon">' + k.icon + '</div><div class="hInfo">' +
        '<div class="hName"><span class="rar r-' + rr + '">' + rr + '</span> ' + k.name + ' · ур. ' + best.lvl + '/' + R.maxLevel + ' <span class="badge sq">действует</span></div>' +
        '<div class="hSub">' + pct(C.runeValue(best)) + ' ' + k.desc + (up ? ' → <b>' + pct(C.runeValue({ ...best, lvl: best.lvl + 1 })) + '</b>' : '') + '</div></div>' +
        (up == null ? '<button class="hBtn" disabled>max</button>'
                    : '<button class="hBtn' + (s.materials.shard >= up ? ' go' : '') + '" data-rup="' + best.id + '"' + (s.materials.shard >= up ? '' : ' disabled') + '>⬆ ' + M.shard.icon + fmt(up) + '</button>') + '</div>';
      // запас по редкостям и слияние
      const parts = [];
      CFG.rarities.forEach((r, tier) => {
        const n = list.filter(x => x.tier === tier).length;
        if (!n) return;
        parts.push('<span><span class="rar r-' + r + '">' + r + '</span> ×' + n + '</span>' +
          (C.mergeable(s, k.id, tier) ? '<button class="hBtn go" data-merge="' + k.id + ':' + tier + '">Слить ' + R.mergeCount + ' → ' + CFG.rarities[tier + 1] + '</button>' : ''));
      });
      html += '<div class="spare">Всего: ' + parts.join(' ') + '</div>';
    }
    // тотемы
    const sets = T.collection.filter(n => C.totemCount(s) >= n).length, next = T.collection.find(n => C.totemCount(s) < n);
    html += '<div class="secTitle">ТОТЕМЫ · собрано ' + C.totemCount(s) + '/' + CFG.biomes.length + ' · ' + pct(C.totemMult(s) - 1) + ' всего урона</div>' +
      '<div class="hint2">Тотем биома даёт финальный босс его 50-го этажа (первое прохождение). +' + Math.round(T.dpsPerLevel * 100) + '% урона за каждый уровень тотема' +
      (next ? '; при ' + next + ' тотемах — ещё ×' + T.collectionMult : '') + (sets ? '. Бонус коллекции сейчас ×' + Math.pow(T.collectionMult, sets).toFixed(2) : '') + '.</div>';
    CFG.biomes.forEach((b, i) => {
      const lv = s.totems[b.id];
      if (!lv) { html += '<div class="hRow locked" style="--r:#3a2a4a"><div class="artIcon">?</div><div class="hInfo"><div class="hName">Тотем: ' + b.name + '</div><div class="hSub">Финальный босс этажа ' + (i + 1) * CFG.biomeFloors + '</div></div></div>'; return; }
      const cst = C.totemUpCost(s, b.id), can = cst && s.materials.shard >= cst.shards && s.materials.heart >= cst.hearts;
      html += '<div class="hRow" style="--r:#ffd36b"><div class="artIcon">🗿</div><div class="hInfo"><div class="hName">Тотем: ' + b.name + ' · ур. ' + lv + '/' + T.maxLevel + '</div>' +
        '<div class="hSub">' + pct(T.dpsPerLevel * lv) + ' всего урона</div></div>' +
        (cst == null ? '<button class="hBtn" disabled>max</button>'
                     : '<button class="hBtn' + (can ? ' go' : '') + '" data-totem="' + b.id + '"' + (can ? '' : ' disabled') + '>⬆ ' + M.shard.icon + fmt(cst.shards) + (cst.hearts ? ' ' + M.heart.icon + cst.hearts : '') + '</button>') + '</div>';
    });
    if (html !== runesHtml) { $('runesTab').innerHTML = html; runesHtml = html; }
  }
  $('runesTab').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || b.disabled) return;
    const d = b.dataset;
    if (d.act === 'rune') {
      const r = C.createRune(s);
      if (r) { const k = C.runeKind(r.type); toast('Новая руна<small>' + k.icon + ' ' + k.name + ' · E</small>'); save(); }
    } else if (d.rup) { if (C.upgradeRune(s, +d.rup)) save(); }
    else if (d.merge) {
      const [type, tier] = d.merge.split(':');
      const r = C.mergeRunes(s, type, +tier);
      if (r) { toast('Слияние рун<small>' + C.runeKind(type).name + ' · ' + CFG.rarities[r.tier] + '</small>'); save(); }
    } else if (d.totem) { if (C.upgradeTotem(s, d.totem)) save(); }
    render();
  });

  // ---------- души, артефакты, ритуал ----------
  const TPS_PREVIEW = 5;                       // для сравнения «до / после» — ожидаемый DPS при 5 тапах в секунду
  let soulsHtml = '';
  const pctUp = m => '+' + fmt(Math.round((m - 1) * 100)) + '%';
  function dpsChange(p) {
    if (!p) return '';
    const cls = p.after >= p.before ? 'up' : 'dn';
    return '<div class="dpsPrev">DPS ' + fmt(p.before) + ' → <b class="' + cls + '">' + fmt(p.after) + '</b></div>';
  }
  function renderSouls() {
    const R = CFG.ritual;
    let html = '<div class="soulHead"><div class="soulCnt">👻 <b>' + fmt(s.souls) + '</b> душ</div>' +
      '<div class="soulBonus">' + pctUp(C.soulMult(s)) + ' урона</div></div>' +
      '<div class="hint2">Неизрасходованные души усиливают весь урон: +' + Math.round(CFG.souls.dpsPerSoul * 100) +
      '% за каждую. Трата на артефакты уменьшает этот бонус — смотрите DPS до и после.</div>';
    // ритуал
    const ready = C.canRitual(s);
    html += '<div class="ritualBox' + (ready ? ' ready' : '') + '"><b>Ритуал</b>' +
      (ready ? '<p>Сейчас: <b style="color:#8fe6ff">+' + fmt(C.ritualSouls(s)) + ' душ</b>, новый забег с этажа ' + C.ritualStartFloor(s) +
               '. Чем выше этаж, тем больше душ.</p>'
             : '<p>Откроется на этаже ' + R.floor + '. Сейчас этаж ' + s.maxFloor + ', рекорд ' + s.bestFloor +
               (s.rituals ? ', ритуалов: ' + s.rituals : '') + '.</p>') +
      '<button class="ritBtn" data-act="ritual"' + (ready ? '' : ' disabled') + '>' + (ready ? 'Провести ритуал' : 'Нужен этаж ' + R.floor) + '</button></div>';
    // поиск артефакта
    const fc = C.findCost(s);
    html += '<div class="secTitle">АРТЕФАКТЫ · найдено ' + C.foundCount(s) + '/' + CFG.artifacts.length + ' · все действуют сразу</div>';
    if (fc != null) {
      const after = { ...s, souls: s.souls - fc };
      html += '<div class="recipe"><div>Найти случайный артефакт<small>Бонус душ ' + pctUp(C.soulMult(s)) + ' → ' + pctUp(C.soulMult(after)) + '</small></div>' +
        '<button class="hBtn' + (s.souls >= fc ? ' go' : '') + '" data-act="find"' + (s.souls >= fc ? '' : ' disabled') + '>👻 ' + fmt(fc) + '</button></div>';
    }
    const arts = CFG.artifacts.slice().sort((x, y) => (C.artLevel(s, y.id) > 0) - (C.artLevel(s, x.id) > 0));   // найденные сверху
    for (const a of arts) {
      const lv = C.artLevel(s, a.id);
      if (!lv) {
        html += '<div class="hRow locked" style="--r:#3a2a4a"><div class="artIcon">?</div><div class="hInfo"><div class="hName">???</div><div class="hSub">Ещё не найден</div></div></div>';
        continue;
      }
      const c = C.upgradeArtCost(s, a.id);
      const prev = c != null ? C.previewSpend(s, 'upgrade', a.id, TPS_PREVIEW) : null;
      html += '<div class="hRow" style="--r:#8fe6ff"><div class="artIcon">' + a.icon + '</div><div class="hInfo">' +
        '<div class="hName">' + a.name + ' · ур. ' + lv + (a.max ? '/' + a.max : '') + '</div><div class="hSub">' + a.desc + '</div>' +
        (prev ? dpsChange(prev) : '') + '</div>' +
        (c == null ? '<button class="hBtn" disabled>max</button>'
                   : '<button class="hBtn' + (s.souls >= c ? ' go' : '') + '" data-up="' + a.id + '"' + (s.souls >= c ? '' : ' disabled') + '>👻 ' + fmt(c) + '</button>') + '</div>';
    }
    // дерево душ
    html += '<div class="secTitle">ДЕРЕВО ДУШ · ветви открываются ритуалами · без критов</div>';
    for (const b of CFG.soulTree) {
      const open = C.branchOpen(s, b);
      html += '<div class="secTitle branchHead">' + b.name.toUpperCase() + (open ? '' : '<small>🔒 после ' + b.rituals + ' ритуал' + (b.rituals === 1 ? 'а' : 'ов') + '</small>') + '</div>';
      html += '<div class="branch' + (open ? '' : ' closed') + '">';
      b.nodes.forEach((n, i) => {
        const lv = C.treeLevel(s, n.id), nodeOpen = C.treeNodeOpen(s, n.id), c = C.treeCost(s, n.id);
        const prev = c != null && nodeOpen ? C.previewSpend(s, 'tree', n.id, TPS_PREVIEW) : null;
        const extra = n.kind === 'startGold' && lv ? '. Сейчас: ◆ ' + fmt(C.ritualStartGold(s)) : '';
        const hint = !open ? '' : !nodeOpen ? '<div class="dpsPrev">Сначала откройте «' + b.nodes[i - 1].name + '»</div>' : prev ? dpsChange(prev) : '';
        html += '<div class="hRow' + (nodeOpen || lv ? '' : ' locked') + '" style="--r:#b98cff"><div class="artIcon">' + (open ? n.icon : '?') + '</div><div class="hInfo">' +
          '<div class="hName">' + n.name + ' · ' + lv + '/' + n.max + '</div><div class="hSub">' + n.desc + ' за уровень' + extra + '</div>' + hint + '</div>' +
          (c == null ? '<button class="hBtn" disabled>max</button>'
                     : '<button class="hBtn' + (nodeOpen && s.souls >= c ? ' go' : '') + '" data-tree="' + n.id + '"' + (nodeOpen && s.souls >= c ? '' : ' disabled') + '>👻 ' + fmt(c) + '</button>') + '</div>';
      });
      html += '</div>';
    }
    if (html !== soulsHtml) { $('soulsTab').innerHTML = html; soulsHtml = html; }
  }
  $('soulsTab').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || b.disabled) return;
    const d = b.dataset;
    if (d.act === 'find') {
      const id = C.findArtifact(s);
      if (id) { const a = CFG.artifacts.find(x => x.id === id); toast('Найден артефакт!<small>' + a.icon + ' ' + a.name + '</small>'); save(); }
    } else if (d.up) {
      if (C.upgradeArtifact(s, d.up)) save();
    } else if (d.tree) {
      if (C.buyTreeNode(s, d.tree)) save();
    } else if (d.act === 'ritual') {
      if (!C.canRitual(s)) return;
      const souls = C.ritualSouls(s), start = C.ritualStartFloor(s);
      const after = { ...s, souls: s.souls + souls };
      ask('<b>Ритуал</b><span class="askList">' +
        '<b>Получите:</b> +' + fmt(souls) + ' душ (бонус урона ' + pctUp(C.soulMult(s)) + ' → ' + pctUp(C.soulMult(after)) + ')<br>' +
        '<b>Сбросится:</b> золото, уровни удара и героев, найм, этаж — новый забег с этажа ' + start +
        (C.ritualStartGold(s) ? ' и ◆ ' + fmt(C.ritualStartGold(s)) + ' золота' : '') + '<br>' +
        '<b>Сохранится:</b> дерево душ, герои, звёзды, эволюции, материалы, копии, отряд, билеты, эссенция, артефакты, души, рекорды</span>', 'Провести ритуал', () => {
        const r = C.ritual(s);
        if (!r) return;
        dmgLog.length = 0;
        restartAnim('spawn');
        toast('Ритуал проведён<small>+' + fmt(r.souls) + ' 👻 · старт с этажа ' + r.start + '</small>');
        save(); render();
      });
      return;
    }
    render();
  });

  function renderPortal() {
    const P = CFG.portal;
    $('ticketCount').textContent = fmt(s.tickets);
    $('pityInfo').textContent = 'A+ гарантия через ' + (P.pityA - s.pity.a) + ' · S+ через ' + (P.pityS - s.pity.s);
    $('pull1').disabled = s.tickets < 1;
    $('pull10').disabled = s.tickets < 10;
    const total = Object.values(P.odds).reduce((a, b) => a + b, 0);
    $('oddsInfo').innerHTML = 'Шансы: ' + RANKS.map(r => '<span class="rar r-' + r + '">' + r + '</span> ' + (P.odds[r] / total * 100).toFixed(1) + '%').join(' ') +
      '<br>Билеты: за первое прохождение босса каждого 5-го этажа, на 10-м — больше.';
    if (pullShown === lastPull) return;
    pullShown = lastPull;
    $('pullResults').innerHTML = lastPull.map((x, i) => {
      const a = CFG.allies.find(h => h.id === x.id), v = ALLY_VIS[x.id];
      return '<div class="res r-' + x.rarity + '" style="animation-delay:' + (i * 0.05) + 's"><div class="ri">' + v.icon + '</div><div class="rn">' + a.name +
        '</div><div>' + (x.isNew ? '<span class="new">НОВЫЙ</span>' : '+1 копия') + '</div></div>';
    }).join('');
  }
  document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => { tab = b.dataset.tab; render(); }));
  $('heroesTab').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    let ok = false;
    if (b.dataset.star) ok = C.starUp(s, b.dataset.star);
    if (b.dataset.in) ok = C.squadAdd(s, b.dataset.in);
    if (b.dataset.out) ok = C.squadRemove(s, b.dataset.out);
    if (b.dataset.evo) {
      const ec = C.evoCost(s, b.dataset.evo);
      ok = C.evolve(s, b.dataset.evo);
      if (ok) toast('Эволюция · ' + ec.name + '!<small>' + CFG.allies.find(a => a.id === b.dataset.evo).name + ': новый облик, ×' + ec.mult + ' DPS</small>');
    }
    if (ok) { save(); render(); }
  });
  function pull(n) {
    const r = C.summon(s, n);
    if (!r) return;
    lastPull = r; save(); render();
    const best = r.reduce((m, x) => RANKS.indexOf(x.rarity) > RANKS.indexOf(m.rarity) ? x : m, r[0]);
    if (RANKS.indexOf(best.rarity) >= RANKS.indexOf('A')) toast('Редкий герой!<small>' + best.rarity + ' · ' + CFG.allies.find(a => a.id === best.id).name + '</small>');
  }
  $('pull1').addEventListener('click', () => pull(1));
  $('pull10').addEventListener('click', () => pull(10));


  // ---------- способности главного героя ----------
  const ABIL_ICON = { flurry: '⚔', hunt: '🎯' };
  const abilUi = {};
  function buildAbilities() {
    const bar = $('abilityBar');
    for (const a of CFG.abilities) {
      const w = document.createElement('div');
      w.className = 'abil';
      w.innerHTML = '<button class="abilUse"><div class="abilCd"></div><span class="abilIcon">' + ABIL_ICON[a.id] + '</span>' +
        '<div class="abilText"><div class="abilName">' + a.name + '</div><div class="abilState"></div></div></button>' +
        '<button class="abilAuto" aria-label="Автоиспользование">АВТО</button>';
      bar.appendChild(w);
      const use = w.querySelector('.abilUse'), auto = w.querySelector('.abilAuto');
      use.addEventListener('click', () => { const ev = C.useAbility(s, a.id); if (ev.length) { handle(ev); save(); } });
      auto.addEventListener('click', () => { C.setAbilityAuto(s, a.id, !s.abilities[a.id].auto); save(); renderAbilities(); });
      abilUi[a.id] = { w, state: w.querySelector('.abilState'), cd: w.querySelector('.abilCd'), auto };
    }
  }
  function renderAbilities() {
    for (const a of CFG.abilities) {
      const u = abilUi[a.id], st = s.abilities[a.id];
      const unlocked = C.abilityUnlocked(s, a.id);
      u.w.classList.toggle('locked', !unlocked);
      u.w.classList.toggle('active', st.active > 0);
      u.w.classList.toggle('ready', unlocked && st.cd <= 0 && st.active <= 0);
      u.auto.classList.toggle('on', st.auto);
      u.auto.style.visibility = unlocked ? '' : 'hidden';
      u.state.textContent = !unlocked ? 'с этажа ' + a.unlockFloor
        : st.active > 0 ? 'действует ' + Math.ceil(st.active) + 'с'
        : st.cd > 0 ? 'через ' + Math.ceil(st.cd) + 'с' : 'готово';
      u.cd.style.height = (unlocked && st.active <= 0 && st.cd > 0 ? Math.min(1, st.cd / a.cooldown) * 100 : 0) + '%';
    }
  }

  function renderLive() {
    renderAbilities();
    renderUlts();
    if (s.enemy.isBoss || s.mode) {
      const p = Math.max(0, s.bossTimeLeft / (s.mode ? s.mode.timeMax : C.bossTime(s)));
      el.timerFill.style.width = (p * 100) + '%';
      el.timerFill.classList.toggle('low', s.bossTimeLeft < 5);
    }
    const now = performance.now();
    while (dmgLog.length && now - dmgLog[0][0] > DPS_WINDOW * 1000) dmgLog.shift();
    let tapSum = 0, allSum = 0;
    for (const d of dmgLog) { allSum += d[1]; if (d[2] === 'tap') tapSum += d[1]; }
    const tapDps = tapSum / DPS_WINDOW, auto = C.autoDps(s);
    el.dps.textContent = fmt(tapDps + auto);                       // общий DPS
    if (el.statsMore.classList.contains('show'))
      el.statsMore.textContent = 'Тап ' + fmt(tapDps) + '/с · Авто ' + fmt(auto) + '/с · Реальный средний ' + fmt(allSum / DPS_WINDOW) + '/с · Крит ' + Math.round(C.critChance(s) * 100) + '% ×' + C.critMult(s).toFixed(1);
  }

  // ---------- игровой цикл ----------
  let acc = 0, last = performance.now();
  function loop(now) {
    acc += Math.min(0.25, (now - last) / 1000); last = now;
    let changed = false;
    while (acc >= STEP) {
      const ev = C.tick(s, STEP); acc -= STEP;
      if (ev.length) { handle(ev); changed = true; }
    }
    if (changed) render();
    renderLive();
    if (Date.now() - lastSave > 5000) save();
    requestAnimationFrame(loop);
  }
  buildAllies();
  buildAbilities();
  render();
  if (s.savedAt) applyOffline((Date.now() - s.savedAt) / 1000);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
