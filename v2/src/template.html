<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d0a12">
<title>Призванный: Башня Гачи</title>
<style>
  :root {
    --bg1: #0d0a12; --bg2: #1e1329; --panel: #170f20; --panel2: #23172f;
    --text: #efe6f5; --muted: #9a8aa8; --line: #3a2a4a;
    --hp: #c23a4a; --hp-dark: #5a1820;
    --accent: #b98cff; --gold: #ffd36b; --boss: #ff6b4a; --ok: #6be3a0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%; background: var(--bg1); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden; touch-action: manipulation; user-select: none; -webkit-user-select: none;
  }
  button { font: inherit; color: inherit; border: none; background: none; cursor: pointer; }
  #game {
    position: relative; height: 100%; height: 100dvh; max-width: calc(100dvh * 9 / 16); margin: 0 auto;
    background: radial-gradient(ellipse at 50% 45%, var(--bg2) 0%, var(--bg1) 70%);
    display: flex; flex-direction: column; overflow: hidden; isolation: isolate;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  /* фон этажа: зал Башни (одна картинка, оттенок по биому) */
  #bgHall { position: absolute; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
  #bgHall .img { position: absolute; inset: 0; background: url("__BG_HALL__") center 62% / cover no-repeat;
    filter: hue-rotate(var(--bh, 0deg)) saturate(var(--bs, 1)) brightness(var(--bb, 1));
    transform: translateX(var(--hx, 0%)) scale(var(--hz, 1)) scaleX(var(--hf, 1)); transform-origin: 50% 62%;
    transition: filter .8s, transform .8s; }
  /* затемнение сверху (HUD) и снизу (панель), чтобы текст читался */
  #bgHall::after { content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, #0d0a12f0 0%, #0d0a12a0 18%, #0d0a1230 38%, #0d0a1210 60%, #0d0a1280 80%, #0d0a12f0 100%); }

  /* ---------- верхний HUD ---------- */
  #hud { padding: 10px 16px 6px; text-align: center; position: relative; z-index: 2; }
  #floorRow { display: flex; align-items: center; justify-content: center; gap: 10px; }
  .navBtn {
    width: 34px; height: 34px; border-radius: 10px; font-size: 18px;
    background: var(--panel2); border: 1px solid var(--line);
  }
  .navBtn:disabled { opacity: .25; }
  #floorLabel { font-size: 17px; font-weight: 800; min-width: 100px; }
  #settingsBtn { position: absolute; right: 12px; top: 10px; font-size: 18px; opacity: .6; width: 34px; height: 34px; }
  #biomeLabel { font-size: 11px; font-weight: 700; letter-spacing: .6px; color: var(--muted); margin-top: 3px; text-transform: uppercase; }
  #dots { display: flex; justify-content: center; gap: 5px; margin-top: 6px; }
  .dot { width: 18px; height: 6px; border-radius: 3px; background: var(--line); }
  .dot.done { background: var(--accent); }
  .dot.cur { background: var(--text); }
  .dot.boss { width: 26px; background: #5a2a24; }
  .dot.boss.cur { background: var(--boss); }
  #enemyName { margin-top: 8px; font-size: 15px; font-weight: 700; }
  #enemyName.boss { color: var(--boss); }
  #enemyName.rare { color: var(--gold); }
  #enemyName.rare.crystal { color: #8fe6ff; }
  .phMark { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: #ffffffb0; box-shadow: 0 0 3px #000; z-index: 1; }
  .phMark.past { background: #ffffff30; }
  #enemy.rare-gold .body { filter: drop-shadow(0 0 12px #ffd36b) drop-shadow(0 0 4px #fff3b0); }
  #enemy.rare-crystal .body { filter: drop-shadow(0 0 12px #8fe6ff) drop-shadow(0 0 4px #e0faff); }
  #enemy.vuln .body { animation: vulnPulse .5s ease-in-out infinite alternate; }
  @keyframes vulnPulse { to { filter: brightness(1.6) drop-shadow(0 0 14px #ff6b4a); } }
  #hpBar {
    position: relative; margin-top: 6px; height: 18px; border-radius: 9px;
    background: var(--hp-dark); border: 1px solid #00000080; overflow: hidden;
  }
  #hpFill { height: 100%; width: 100%; background: linear-gradient(180deg, #e65566, var(--hp)); transition: width .1s ease-out; }
  #hpText { position: absolute; inset: 0; font-size: 12px; line-height: 18px; font-weight: 700; text-shadow: 0 1px 2px #000; }
  #timerBar { margin-top: 5px; height: 5px; border-radius: 3px; background: #2a1c1c; overflow: hidden; visibility: hidden; }
  #timerBar.show { visibility: visible; }
  #timerFill { height: 100%; width: 100%; background: var(--boss); }
  #timerFill.low { background: #ff3030; }
  #stats { margin-top: 6px; font-size: 12px; color: var(--muted); }
  #stats b { color: var(--text); }

  /* ---------- арена ---------- */
  #arena { position: relative; flex: 1; display: flex; align-items: center; justify-content: center; cursor: pointer; min-height: 0; }
  #enemy {
    position: relative; z-index: 1;
    /* размер по высоте арены; враг приподнят, чтобы впереди было место главному герою */
    height: min(44%, 280px); aspect-ratio: 1 / 1.15; transform-origin: 50% 90%; margin-bottom: min(24%, 120px);
    animation: idle 2.4s ease-in-out infinite; pointer-events: none;
  }
  #enemy.boss { height: min(52%, 330px); }
  #enemy svg { width: 100%; height: 100%; overflow: visible; }
  #enemy .crown { display: none; }
  #enemy.boss .crown { display: inline; }
  #enemy.hit { animation: hit .14s ease-out; }
  #enemy.hit .body { filter: brightness(2.2) saturate(.4); }
  #enemy.dead { animation: death .35s ease-in forwards; }
  #enemy.spawn { animation: spawn .25s ease-out; }
  @keyframes idle { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-6px) scale(1.01,.99); } }
  @keyframes hit { 0% { transform: none; } 30% { transform: translate(-6px,2px) scale(.94,1.04); } 60% { transform: translate(5px,-1px) scale(1.03,.97); } 100% { transform: none; } }
  @keyframes death { 30% { transform: scale(1.08,.9); filter: brightness(2.5); } 100% { transform: scale(.6,.1) translateY(40px); opacity: 0; filter: brightness(3); } }
  @keyframes spawn { from { transform: scale(.7) translateY(20px); opacity: 0; } }

  .dmg {
    position: absolute; font-weight: 800; font-size: 24px; color: #fff; pointer-events: none;
    text-shadow: 0 2px 0 #000, 0 0 8px var(--accent); animation: float .7s ease-out forwards;
    transform: translate(-50%,-50%); white-space: nowrap;
  }
  .dmg.gold { color: var(--gold); font-size: 18px; text-shadow: 0 2px 0 #000; }
  @keyframes float { 0% { opacity: 0; transform: translate(-50%,-30%) scale(.6); } 15% { opacity: 1; transform: translate(-50%,-60%) scale(1.15); } 100% { opacity: 0; transform: translate(-50%,-180%) scale(1); } }
  .spark {
    position: absolute; width: 56px; height: 56px; border-radius: 50%; border: 3px solid var(--accent);
    pointer-events: none; transform: translate(-50%,-50%) scale(.2); animation: spark .3s ease-out forwards;
  }
  @keyframes spark { to { transform: translate(-50%,-50%) scale(1.3); opacity: 0; } }
  #hint { position: absolute; bottom: 10px; left: 0; right: 0; text-align: center; font-size: 13px; color: var(--muted); pointer-events: none; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }

  #farmBar {
    position: absolute; top: 8px; left: 16px; right: 16px; display: none;
    align-items: center; justify-content: space-between; gap: 8px;
    padding: 8px 10px 8px 14px; border-radius: 12px; background: #2a1720e6; border: 1px solid #5a2a34;
    font-size: 13px; z-index: 3;
  }
  #farmBar.show { display: flex; }
  #modeBar { position: absolute; top: 8px; left: 16px; right: 16px; display: none; align-items: center; justify-content: space-between; gap: 8px;
    padding: 8px 10px 8px 14px; border-radius: 12px; background: #1a2030e6; border: 1px solid #3a4a6a; font-size: 13px; z-index: 3; }
  #modeBar.show { display: flex; }
  #leaveBtn { padding: 8px 12px; border-radius: 9px; font-weight: 700; background: var(--panel2); border: 1px solid var(--line); }
  #questDot { display: none; width: 7px; height: 7px; border-radius: 50%; background: var(--gold); vertical-align: middle; }
  #questDot.on { display: inline-block; }
  .qBar { height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; margin-top: 4px; }
  .qBar i { display: block; height: 100%; background: var(--accent); }
  .qBar.done i { background: var(--ok); }
  .hRow.claimed { opacity: .45; }
  .claimAll { width: 100%; margin-bottom: 6px; padding: 10px; border-radius: 10px; font-weight: 800; background: linear-gradient(180deg, #3a8a5a, #1f5a36); border: 1px solid var(--ok); }
  #seasonTab .altBtns { flex-wrap: wrap; } #seasonTab .altBtns .hBtn { flex: 1; white-space: normal; }
  #panel .tabBody { overflow-x: hidden; }
  .seasonHead { padding: 10px 12px; border-radius: 12px; margin-bottom: 6px; background: linear-gradient(135deg, #4a1f3a, #1f1430); border: 1px solid #b98cff66; }
  .seasonHead b { font-size: 15px; } .seasonHead small { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; }
  .passBar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; margin: 6px 0 2px; }
  .passBar i { display: block; height: 100%; background: linear-gradient(90deg, #b98cff, #ffd36b); }
  .passRow { display: grid; grid-template-columns: 44px 1fr 1fr; gap: 5px; align-items: stretch; }
  .passRow + .passRow { margin-top: 5px; }
  .passLv { display: grid; place-items: center; border-radius: 9px; background: var(--panel2); font-weight: 800; font-size: 12px; border: 1px solid var(--line); }
  .passLv.got { border-color: var(--gold); color: var(--gold); }
  .passCell { min-width: 0; padding: 6px; border-radius: 9px; font-size: 10px; text-align: left; background: var(--panel2); border: 1px solid var(--line); white-space: normal; line-height: 1.35; }
  .passCell.paid { background: #2a1f14; border-color: #6a4a24; }
  .passCell.ready { border-color: var(--ok); box-shadow: 0 0 8px #6be3a040; }
  .passCell.done { opacity: .4; }
  .passCell:disabled:not(.done) { opacity: .65; }
  .claimAll:disabled { background: #2a2234; border-color: var(--line); color: var(--muted); }
  #pveDot { display: none; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); vertical-align: middle; }
  #pveDot.on { display: inline-block; }
  .tierPick { display: flex; align-items: center; gap: 3px; }
  .tierPick button { width: 24px; height: 24px; border-radius: 7px; background: var(--panel); border: 1px solid var(--line); font-weight: 800; }
  .tierPick span { min-width: 30px; text-align: center; font-size: 11px; font-weight: 800; }
  .diffs { display: flex; gap: 4px; margin-top: 5px; flex-wrap: wrap; }
  .diffs .hBtn { flex: 1; min-width: 0; }
  #bossBtn { padding: 8px 12px; border-radius: 9px; font-weight: 700; background: var(--boss); color: #1a0a08; }

  #toast {
    position: absolute; top: 27%; left: 50%; transform: translate(-50%,-50%);
    padding: 12px 18px; border-radius: 14px; background: #1a1024f0; border: 1px solid var(--gold);
    text-align: center; font-weight: 700; pointer-events: none; opacity: 0; transition: opacity .25s; z-index: 4;
  }
  #toast.show { opacity: 1; }
  #toast small { display: block; color: var(--gold); margin-top: 4px; font-size: 14px; }

  /* ---------- нижняя панель ---------- */
  #panel { background: var(--panel); border-top: 1px solid var(--line); padding: 0 12px 10px; position: relative; z-index: 2; }
  /* ручка сворачивания панели */
  #panelToggle { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; height: 26px; font-size: 12px; color: var(--muted); }
  #panelToggle .bar { width: 36px; height: 4px; border-radius: 2px; background: var(--line); }
  #panelToggle .chev { transition: transform .2s; }
  #panel.collapsed .chev { transform: rotate(180deg); }
  #panel.collapsed #cards, #panel.collapsed #mult { display: none; }
  #panel.collapsed #goldRow { margin-bottom: 0; }
  #canBuy { display: none; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
  #panel.collapsed #canBuy.on { display: inline-block; }
  #goldRow { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  #gold { font-size: 20px; font-weight: 800; color: var(--gold); }
  #gold::before { content: "◆ "; font-size: 15px; }
  #mult { display: flex; gap: 4px; }
  .multBtn { padding: 5px 9px; border-radius: 8px; font-size: 12px; font-weight: 700; background: var(--panel2); border: 1px solid var(--line); color: var(--muted); }
  .multBtn.on { color: var(--text); border-color: var(--accent); }
  .card { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 12px; background: var(--panel2); border: 1px solid var(--line); }
  .cardIcon { width: 42px; height: 42px; border-radius: 10px; flex: none; display: grid; place-items: center; font-size: 22px; background: #3b2550; }
  .cardInfo { flex: 1; min-width: 0; }
  .cardTitle { font-weight: 700; font-size: 14px; }
  .cardSub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .cardSub b { color: var(--ok); }
  .buy {
    min-width: 104px; padding: 9px 10px; border-radius: 10px; font-weight: 800; font-size: 13px; line-height: 1.25;
    background: linear-gradient(180deg, #7a4fc4, #4b2c86); border: 1px solid var(--accent);
  }
  .buy span { display: block; font-size: 12px; font-weight: 700; color: var(--gold); }
  .buy:disabled { background: #2a2234; border-color: var(--line); color: var(--muted); }
  .buy:disabled span { color: var(--muted); }
  .buy:not(:disabled):active { transform: scale(.96); }

  /* ---------- настройки ---------- */
  .askWrap { position: absolute; inset: 0; background: #000b; display: none; align-items: center; justify-content: center; z-index: 20; padding: 20px; }
  .askWrap.show { display: flex; }
  .askBox { width: 100%; max-width: 320px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
  .askBox p { font-size: 14px; line-height: 1.45; margin-bottom: 6px; }
  .askBtns { display: flex; gap: 8px; } .askBtns .mBtn { flex: 1; }
  #modal { position: absolute; inset: 0; background: #000a; display: none; align-items: center; justify-content: center; z-index: 10; padding: 16px; }
  #modal.show { display: flex; }
  #modalBox { width: 100%; max-width: 320px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
  #modalBox h3 { margin-bottom: 10px; }
  #modalBox p { font-size: 13px; color: var(--muted); margin-bottom: 14px; line-height: 1.45; }
  .mBtn { width: 100%; padding: 12px; border-radius: 10px; font-weight: 700; margin-top: 8px; background: var(--panel2); border: 1px solid var(--line); }
  .mBtn.danger { background: #4a1820; border-color: #8a2a3a; }
  .card + .card { margin-top: 8px; }
  .cardSub .dim { color: var(--muted); }
  .cardSub .ms { color: var(--gold); opacity: .8; }
  #stats { cursor: pointer; }
  #statsMore { display: none; margin-top: 3px; font-size: 11px; color: var(--muted); }
  #statsMore.show { display: block; }
  .dmg.auto { font-size: 18px; text-shadow: 0 2px 0 #000, 0 0 6px currentColor; }
  /* союзник на арене (временная заглушка) */
  #allyCards { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  #allyCards .card + .card { margin-top: 0; }
  #cards { max-height: 30dvh; overflow-y: auto; overscroll-behavior: contain; margin: 0 -4px; padding: 0 4px; }
  /* союзники на арене (временные заглушки): двое по бокам впереди, двое позади */
  /* главный герой — впереди по центру, вид со спины (временная заглушка) */
  #hero { position: absolute; left: 50%; bottom: 14px; height: min(34%, 150px); aspect-ratio: 1 / 1.15; transform: translateX(-50%); z-index: 2; pointer-events: none; }
  #hero .fig { width: 100%; height: 100%; animation: allyIdle 3s ease-in-out infinite; transform-origin: 50% 100%; }
  #hero.attack .fig { animation: heroAtk .18s ease-out; }
  #hero svg { width: 100%; height: 100%; overflow: visible; }
  #hero .allyTag { color: var(--gold); bottom: -13px; }
  @keyframes heroAtk { 35% { transform: translateY(-14px) scale(1.04) rotate(-3deg); } 100% { transform: none; } }
  /* ультимейты */
  .ultBar { position: absolute; left: 18%; right: 18%; bottom: -4px; height: 4px; border-radius: 2px; background: #00000080; overflow: hidden; }
  .ultBar i { display: block; height: 100%; width: 0; background: currentColor; }
  .ultBar.ready i { box-shadow: 0 0 6px currentColor; }
  .ally.ulting .fig { animation: ultPulse .5s ease-out; }
  @keyframes ultPulse { 0% { filter: brightness(1); } 30% { filter: brightness(2.4) drop-shadow(0 0 10px currentColor); transform: scale(1.12); } 100% { filter: none; transform: none; } }
  #ultBanner { position: absolute; top: 46px; left: 0; right: 0; text-align: center; font-weight: 800; font-size: 16px; letter-spacing: .5px; pointer-events: none; opacity: 0; z-index: 4; text-shadow: 0 2px 0 #000, 0 0 12px currentColor; }
  #ultBanner.show { animation: banner 1.1s ease-out; }
  @keyframes banner { 0% { opacity: 0; transform: scale(.7); } 15% { opacity: 1; transform: scale(1.08); } 70% { opacity: 1; transform: none; } 100% { opacity: 0; } }
  .dmg.nuke { font-size: 34px; text-shadow: 0 3px 0 #000, 0 0 14px currentColor; }
  #arena.fury::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 55%, transparent 40%, #ff3b2a33 100%); }
  #enemy.marked .body { filter: drop-shadow(0 0 10px #ff8a3d) drop-shadow(0 0 3px #ffd36b); }
  #hero.empowered svg { filter: drop-shadow(0 0 10px #b98cff); }
  #buffs { display: flex; justify-content: center; gap: 6px; margin-top: 5px; min-height: 20px; }
  .buff { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px; background: #00000060; border: 1px solid currentColor; }
  /* криты */
  .dmg.crit { font-size: 27px; color: #ffd36b; text-shadow: 0 2px 0 #000, 0 0 10px #ff6b4a; }
  .dmg.auto.crit { font-size: 22px; }
  /* панель способностей главного героя — вне арены, чтобы не перехватывать тапы */
  #abilityBar { display: flex; gap: 8px; padding: 6px 12px; background: var(--bg1); border-top: 1px solid var(--line); position: relative; z-index: 2; }
  .abil { flex: 1; display: flex; min-width: 0; height: 44px; border-radius: 12px; background: var(--panel2); border: 1px solid var(--line); overflow: hidden; }
  .abilUse { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; padding: 0 10px; text-align: left; position: relative; }
  .abilIcon { font-size: 18px; flex: none; }
  .abilText { min-width: 0; }
  .abilName { font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .abilState { font-size: 11px; color: var(--muted); }
  .abil.ready { border-color: var(--accent); }
  .abil.ready .abilState { color: var(--ok); }
  .abil.active { border-color: var(--gold); box-shadow: 0 0 10px #ffd36b40; }
  .abil.locked { opacity: .45; }
  .abilCd { position: absolute; left: 0; top: 0; bottom: 0; background: #00000055; pointer-events: none; }
  .abilAuto { width: 40px; flex: none; font-size: 10px; font-weight: 800; color: var(--muted); border-left: 1px solid var(--line); }
  .abilAuto.on { color: #1a0a08; background: var(--ok); }
  /* вспышка крита — коротко и без перегрузки */
  .critFlash { position: absolute; width: 70px; height: 70px; border-radius: 50%; pointer-events: none; transform: translate(-50%,-50%) scale(.3);
    background: radial-gradient(circle, #fff6 0%, #ffd36b55 40%, transparent 70%); animation: cflash .16s ease-out forwards; z-index: 3; }
  @keyframes cflash { to { transform: translate(-50%,-50%) scale(1.2); opacity: 0; } }
  /* вкладки панели */
  #tabs { display: flex; gap: 4px; margin-bottom: 8px; overflow-x: auto; scrollbar-width: none; }
  #tabs::-webkit-scrollbar { display: none; }
  .tab { flex: 1; padding: 7px 4px; border-radius: 9px; font-size: 12px; font-weight: 700; color: var(--muted); background: var(--panel2); border: 1px solid var(--line); }
  .tab.on { color: var(--text); border-color: var(--accent); }
  #ticketDot { display: none; width: 7px; height: 7px; border-radius: 50%; background: var(--gold); vertical-align: middle; }
  #ticketDot.on { display: inline-block; }
  #panel.collapsed #tabs, #panel.collapsed .tabBody { display: none !important; }
  .tabBody { display: none; max-height: 30dvh; overflow-y: auto; overscroll-behavior: contain; }
  #panel[data-tab="heroes"] #heroesTab, #panel[data-tab="portal"] #portalTab, #panel[data-tab="altar"] #altarTab, #panel[data-tab="souls"] #soulsTab, #panel[data-tab="runes"] #runesTab, #panel[data-tab="pve"] #pveTab, #panel[data-tab="quests"] #questsTab, #panel[data-tab="season"] #seasonTab { display: block; }
  #soulDot { display: none; width: 7px; height: 7px; border-radius: 50%; background: #8fe6ff; vertical-align: middle; }
  #soulDot.on { display: inline-block; }
  .tab { font-size: 11px; padding: 7px 8px; flex: 1 0 auto; white-space: nowrap; }
  /* души и артефакты */
  .soulHead { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
  .soulCnt { font-size: 15px; font-weight: 700; } .soulCnt b { color: #8fe6ff; }
  .soulBonus { font-size: 12px; color: var(--ok); font-weight: 700; }
  .ritualBox { padding: 10px; border-radius: 12px; border: 1px solid #5a3a7a; background: linear-gradient(180deg, #2a1640, #1a1024); margin: 6px 0 4px; }
  .ritualBox.ready { border-color: #b98cff; box-shadow: 0 0 12px #b98cff40; }
  .ritualBox p { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.4; }
  .ritBtn { width: 100%; margin-top: 8px; padding: 10px; border-radius: 10px; font-weight: 800; background: linear-gradient(180deg, #7a4fc4, #4b2c86); border: 1px solid var(--accent); }
  .ritBtn:disabled { background: #2a2234; border-color: var(--line); color: var(--muted); }
  .artIcon { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; font-size: 17px; flex: none; background: #241a34; }
  .dpsPrev { font-size: 10px; color: var(--muted); }
  .dpsPrev b { color: var(--text); } .dpsPrev .dn { color: #ff8a8a; } .dpsPrev .up { color: var(--ok); }
  /* дерево душ: узлы ветви соединены линией */
  .branch { position: relative; padding-left: 14px; }
  .branch::before { content: ""; position: absolute; left: 5px; top: 8px; bottom: 18px; width: 2px; background: #3a2a5a; border-radius: 1px; }
  .branch .hRow { position: relative; }
  .branch .hRow::before { content: ""; position: absolute; left: -11px; top: 50%; width: 9px; height: 2px; background: #3a2a5a; }
  .branch .hRow.locked::before, .branch.closed::before { background: #2a2234; }
  .branchHead { display: flex; justify-content: space-between; align-items: baseline; }
  .branchHead small { font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: 0; }
  .runeIcon { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; font-size: 19px; font-weight: 800; flex: none; background: #1e1a30; color: var(--r, #b98cff); border: 1px solid var(--r, #3a2a4a); }
  .spare { font-size: 11px; color: var(--muted); margin: 4px 2px 0; display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
  .spare .hBtn { padding: 4px 7px; }
  .askList { display: block; font-size: 12px; line-height: 1.5; color: var(--muted); margin: 6px 0 10px; }
  .askList b { color: var(--text); }
  #panel:not([data-tab="up"]) #cards, #panel:not([data-tab="up"]) #mult { display: none; }
  /* Алтарь */
  .altHead { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 6px; }
  .ess { font-size: 15px; font-weight: 700; } .ess b { color: #8fe6ff; }
  .altBtns { display: flex; gap: 5px; }
  .step { display: flex; align-items: center; gap: 2px; }
  .step button { width: 26px; height: 26px; border-radius: 7px; background: var(--panel); border: 1px solid var(--line); font-weight: 800; }
  .step span { min-width: 22px; text-align: center; font-weight: 800; font-size: 12px; }
  .lockBtn { width: 30px; height: 26px; border-radius: 7px; background: var(--panel); border: 1px solid var(--line); font-size: 13px; }
  .lockBtn.on { border-color: var(--gold); }
  .sacBtn { width: 100%; margin: 8px 0; padding: 10px; border-radius: 10px; font-weight: 800; background: linear-gradient(180deg, #a83a4a, #6a1f2a); border: 1px solid #ff6b7a; }
  .sacBtn:disabled { background: #2a2234; border-color: var(--line); color: var(--muted); }
  .recipe { padding: 8px 10px; border-radius: 11px; background: #1a1424; border: 1px dashed var(--line); font-size: 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .recipe + .recipe { margin-top: 6px; }
  .recipe small { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; }
  .secTitle { font-size: 12px; font-weight: 800; color: var(--muted); margin: 10px 2px 6px; letter-spacing: .5px; }
  /* редкости */
  .r-E { --r: #9a9aa8; } .r-D { --r: #6be3a0; } .r-C { --r: #6bb8ff; } .r-B { --r: #b98cff; }
  .r-A { --r: #ffa64a; } .r-S { --r: #ff5a6a; } .r-GOD { --r: #ffd36b; }
  .rar { display: inline-block; min-width: 22px; padding: 0 4px; border-radius: 5px; font-size: 10px; font-weight: 800; text-align: center; color: #120a18; background: var(--r); }
  .badge { font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 6px; margin-left: 4px; vertical-align: middle; }
  .badge.sq { background: #6be3a033; color: var(--ok); } .badge.rs { background: #ffffff14; color: var(--muted); }
  .hRow { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 11px; background: var(--panel2); border: 1px solid var(--line); border-left: 3px solid var(--r); }
  .hRow + .hRow { margin-top: 6px; }
  .hRow.locked { opacity: .5; }
  .hIcon { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; font-size: 17px; flex: none; }
  .hInfo { flex: 1; min-width: 0; }
  .hName { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hSub { font-size: 11px; color: var(--muted); margin-top: 1px; }
  .stars { color: var(--gold); letter-spacing: -1px; }
  .hBtn { padding: 6px 8px; border-radius: 8px; font-size: 11px; font-weight: 700; background: var(--panel); border: 1px solid var(--line); white-space: nowrap; }
  .hBtn.go { border-color: var(--accent); color: var(--text); }
  .hBtn:disabled { opacity: .4; }
  .hBtns { display: flex; flex-direction: column; gap: 4px; flex: none; }
  .hBtns .hBtn { width: 100%; }
  .hBtn.evo { border-color: #ff9a3d; color: #ffd0a0; }
  .matHead { display: flex; gap: 14px; font-size: 14px; font-weight: 700; margin: 0 2px 6px; }
  .matHead b { color: var(--text); }
  .evoTag { color: #ffb36b; font-weight: 800; }
  .evoNeed { font-size: 10px; color: var(--muted); margin-top: 1px; }
  .evoNeed .ok { color: var(--ok); } .evoNeed .no { color: #ff8a8a; }
  .hIcon { position: relative; }
  .hIcon .evoPip { position: absolute; right: -3px; bottom: -3px; font-size: 9px; font-weight: 900; padding: 0 3px; border-radius: 5px; background: #ff9a3d; color: #1a0a08; }
  .hint2 { font-size: 11px; color: var(--muted); margin: 0 2px 6px; }
  /* портал */
  .portalHead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .tickets { font-size: 15px; font-weight: 700; } .tickets b { color: var(--gold); }
  .pity { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .portalBtns { display: flex; gap: 6px; }
  .pBtn { padding: 10px 14px; border-radius: 10px; font-weight: 800; background: linear-gradient(180deg, #7a4fc4, #4b2c86); border: 1px solid var(--accent); }
  .pBtn:disabled { background: #2a2234; border-color: var(--line); color: var(--muted); }
  .odds { font-size: 10px; color: var(--muted); margin: 8px 0; line-height: 1.6; }
  .results { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
  .res { border-radius: 9px; padding: 6px 2px; text-align: center; background: var(--panel2); border: 1px solid var(--r); font-size: 10px; animation: pop .3s ease-out backwards; }
  .res .ri { font-size: 18px; } .res .rn { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .res .new { color: var(--gold); font-weight: 800; }
  @keyframes pop { from { transform: scale(.5); opacity: 0; } }
  #allyLayer { position: absolute; inset: 0; pointer-events: none; }
  /* размер зависит от высоты арены — на коротком экране фигуры меньше и не перекрываются */
  .ally { position: absolute; height: min(36%, 130px); aspect-ratio: 1 / 1.3; display: none; transform-origin: 50% 100%; bottom: 18px; }
  .ally.back { height: min(28%, 106px); bottom: calc(18px + min(36%, 130px) + 16px); filter: brightness(.8); }
  .ally.on { display: block; }
  .ally .fig { width: 100%; height: 100%; animation: allyIdle 2.8s ease-in-out infinite; }
  .ally.R .fig svg { transform: scaleX(-1); }
  .ally.attack .fig { animation: allyAtkL .2s ease-out; }
  .ally.R.attack .fig { animation: allyAtkR .2s ease-out; }
  .ally svg { width: 100%; height: 100%; overflow: visible; }
  .allyTag { position: absolute; left: -10px; right: -10px; bottom: -15px; text-align: center; font-size: 10px; font-weight: 700; white-space: nowrap; }
  @keyframes allyIdle { 50% { transform: translateY(-3px); } }
  @keyframes allyAtkL { 40% { transform: translate(14px,-6px) rotate(6deg); } 100% { transform: none; } }
  @keyframes allyAtkR { 40% { transform: translate(-14px,-6px) rotate(-6deg); } 100% { transform: none; } }
  #version { position: absolute; bottom: 2px; left: 8px; font-size: 10px; color: #ffffff30; pointer-events: none; }

  /* ===== интерфейс в стиле образца (0.20): весь экран — бой, меню по бокам, шторка снизу ===== */
  :root { --frame1: #b3302a; --frame2: #6a1512; --frameEdge: #e0a85a; --frameDark: #3a0c0a; }
  #hud { padding-top: 6px; }
  #resBar { display: flex; gap: 5px; align-items: center; margin-bottom: 6px; }
  .res { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: space-between; gap: 4px; height: 28px; padding: 0 8px 0 6px;
    border-radius: 8px; background: #0a0608cc; border: 1px solid #ffffff14; box-shadow: inset 0 1px 0 #ffffff0d; }
  .res i { font-style: normal; font-size: 14px; }
  .res b { font-size: 13px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .res:first-child b { color: var(--gold); }
  #settingsBtn { position: static; flex: none; width: 30px; height: 28px; opacity: .75; }
  /* кнопки в рамках */
  .side { position: absolute; top: 8px; display: flex; flex-direction: column; gap: clamp(4px, 1dvh, 10px); z-index: 3; }
  .side.L { left: 8px; } .side.R { right: 8px; }
  .sideBtn { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; width: clamp(44px, 6.6dvh, 58px); }
  .sideBtn .ico { width: 100%; aspect-ratio: 1; display: grid; place-items: center; font-size: clamp(20px, 3.4dvh, 28px); border-radius: 12px;
    background: radial-gradient(circle at 50% 35%, var(--frame1), var(--frame2)); border: 2px solid var(--frameEdge);
    box-shadow: 0 0 0 2px var(--frameDark), inset 0 0 0 2px #00000040, inset 0 2px 0 #ffffff30, 0 4px 8px #0008; }
  .sideBtn .lbl { font-size: 10px; font-weight: 800; color: #fff; text-shadow: 0 1px 0 #000, 0 0 4px #000; white-space: nowrap; }
  .sideBtn .bang { display: none; position: absolute; top: -6px; right: -6px; width: 18px; height: 22px; font-style: normal; font-size: 15px; font-weight: 900; line-height: 22px;
    color: #3a1a00; background: linear-gradient(180deg, #ffe08a, #ffa628); border-radius: 6px 6px 9px 9px; box-shadow: 0 0 0 2px #5a2a00, 0 2px 4px #000a; animation: bang 1.4s ease-in-out infinite; }
  .sideBtn.on .bang { display: block; }
  .sideBtn.cur .ico { border-color: #fff3c0; box-shadow: 0 0 0 2px var(--frameDark), 0 0 12px #ffd36b99, inset 0 2px 0 #ffffff30; }
  .sideBtn:active .ico { transform: scale(.94); }
  @keyframes bang { 50% { transform: translateY(-3px) rotate(8deg); } }
  /* «Бей босса» — большая кнопка по центру */
  #farmBar { left: 50%; right: auto; transform: translateX(-50%); top: 6px; flex-direction: column; gap: 4px; padding: 0; background: none; border: none; z-index: 3; }
  #farmBar .plate { padding: 3px 14px; border-radius: 6px; background: #2a120ccc; color: #ffcf8a; font-size: 12px; font-weight: 800; }
  #bossBtn { padding: 10px 30px; border-radius: 12px; font-size: 18px; font-weight: 900; color: #fff; text-shadow: 0 1px 0 #6a2a00;
    background: linear-gradient(180deg, #ffb347, #e8741c 55%, #c2500f); border: 2px solid #ffe08a; box-shadow: 0 0 0 3px #5a2400, 0 4px 10px #000a; }
  #modeBar { left: 50%; right: auto; transform: translateX(-50%); top: 6px; width: min(62%, 260px); }
  /* способности — в нижних углах, рамки как у меню */
  #abilityBar { background: none; border: none; justify-content: space-between; align-items: flex-end; padding: 4px 8px 6px; z-index: 3; }
  #abilityBar .abil { flex: none; width: clamp(62px, 9dvh, 76px); height: auto; flex-direction: column; background: none; border: none; overflow: visible; }
  .abilUse { flex: none; width: 100%; aspect-ratio: 1; flex-direction: column; justify-content: center; gap: 0; padding: 0; text-align: center; border-radius: 12px; overflow: hidden;
    background: radial-gradient(circle at 50% 35%, var(--frame1), var(--frame2)); border: 2px solid var(--frameEdge); box-shadow: 0 0 0 2px var(--frameDark), inset 0 2px 0 #ffffff30, 0 4px 8px #0008; }
  .abilIcon { font-size: clamp(20px, 3.4dvh, 26px); }
  .abilText { width: 100%; }
  .abilName { font-size: 9px; text-shadow: 0 1px 0 #000; }
  .abilState { font-size: 9px; color: #ffe6c0; }
  .abilCd { left: 0; right: 0; top: auto; bottom: 0; width: auto !important; height: 0; background: #000000a0; }
  .abilAuto { width: 100%; height: 20px; margin-top: 4px; border: 1px solid #ffffff20; border-radius: 7px; background: #0a0608cc; font-size: 9px; }
  .abil.ready .abilUse { border-color: #fff3c0; box-shadow: 0 0 0 2px var(--frameDark), 0 0 12px #ffd36b88; }
  .abil.active .abilUse { border-color: var(--gold); box-shadow: 0 0 0 2px var(--frameDark), 0 0 16px #ffd36bcc; }
  .abil.ready, .abil.active { border: none; box-shadow: none; }
  /* меню — шторка снизу поверх боя */
  #game { position: relative; }
  #panel { position: absolute; left: 0; right: 0; bottom: 0; z-index: 6; height: 62%; display: flex; flex-direction: column;
    border-radius: 18px 18px 0 0; border: 2px solid var(--frameEdge); border-bottom: none; box-shadow: 0 -2px 0 var(--frameDark), 0 -10px 30px #000c;
    padding-bottom: calc(10px + env(safe-area-inset-bottom)); transition: transform .22s ease-out; }
  #panel.collapsed { transform: translateY(105%); pointer-events: none; }
  #panelToggle { height: 34px; justify-content: space-between; padding: 0 4px; font-size: 14px; font-weight: 800; color: var(--text); }
  #panelToggle .x { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 8px; background: var(--panel2); border: 1px solid var(--line); font-size: 13px; color: var(--muted); }
  #panel.collapsed #canBuy.on { display: none; }
  .tabBody, #cards { max-height: none; flex: 1; min-height: 0; }
  #panel #cards { overflow-y: auto; }
  #panel .tabBody { overflow-y: auto; }
  #panel { overflow: hidden; }
  /* задний ряд союзников — внутрь, чтобы не прятаться за боковыми кнопками */
  .ally.back { margin: 0 9%; }
  /* «Бей босса» не наезжает на боковые колонки */
  #farmBar, #modeBar { top: 4px; }
  #version { bottom: auto; top: 2px; left: auto; right: 6px; }
</style>
</head>
<body>
<div id="game">
  <div id="bgHall"><div class="img"></div></div>
  <div id="hud">
    <div id="resBar">
      <div class="res"><i>◆</i><b id="resGold">0</b></div>
      <div class="res"><i>🎟</i><b id="resTickets">0</b></div>
      <div class="res"><i>🔹</i><b id="resShards">0</b></div>
      <div class="res"><i>👻</i><b id="resSouls">0</b></div>
      <button id="settingsBtn" aria-label="Настройки">⚙</button>
    </div>
    <div id="floorRow">
      <button class="navBtn" id="prevFloor" aria-label="Этаж ниже">‹</button>
      <div id="floorLabel">Этаж 1</div>
      <button class="navBtn" id="nextFloor" aria-label="Этаж выше">›</button>
    </div>
    <div id="biomeLabel"></div>
    <div id="dots"></div>
    <div id="enemyName"></div>
    <div id="hpBar"><div id="hpFill"></div><div id="hpText"></div></div>
    <div id="timerBar"><div id="timerFill"></div></div>
    <div id="stats">Урон за тап <b id="tapDmg"></b> · DPS <b id="dps">0</b> ⓘ<div id="statsMore"></div></div>
    <div id="buffs"></div>
  </div>

  <div id="arena">
    <div id="ultBanner"></div>
    <div id="modeBar"><span id="modeInfo"></span><button id="leaveBtn">Выйти</button></div>
    <div id="farmBar"><span class="plate">Фарм этажа</span><button id="bossBtn">Бей босса</button></div>
    <!-- боковое меню: кнопки в рамках, «!» — есть что сделать -->
    <div class="side L">
      <button class="sideBtn" data-open="season"><span class="ico">🎭</span><span class="lbl">Сезон</span><i class="bang">!</i></button>
      <button class="sideBtn" data-open="heroes"><span class="ico">🪖</span><span class="lbl">Герои</span><i class="bang">!</i></button>
      <button class="sideBtn" data-open="portal"><span class="ico">🌀</span><span class="lbl">Портал</span><i class="bang">!</i></button>
      <button class="sideBtn" data-open="altar"><span class="ico">🕯</span><span class="lbl">Алтарь</span><i class="bang">!</i></button>
      <button class="sideBtn" data-open="quests"><span class="ico">📜</span><span class="lbl">Задания</span><i class="bang">!</i></button>
    </div>
    <div class="side R">
      <button class="sideBtn" data-open="up"><span class="ico">⚔</span><span class="lbl">Прокачка</span><i class="bang">!</i></button>
      <button class="sideBtn" data-open="souls"><span class="ico">👻</span><span class="lbl">Души</span><i class="bang">!</i></button>
      <button class="sideBtn" data-open="runes"><span class="ico">ᚦ</span><span class="lbl">Руны</span><i class="bang">!</i></button>
      <button class="sideBtn" data-open="pve"><span class="ico">🧭</span><span class="lbl">PvE</span><i class="bang">!</i></button>
    </div>
    <!-- Временная заглушка врага (не финальный ассет) -->
    <div id="enemy">
      <svg viewBox="0 0 200 230">
        <ellipse cx="100" cy="222" rx="70" ry="8" fill="#00000070"/>
        <g class="body">
          <path d="M40 215 Q30 140 55 95 Q70 60 100 55 Q130 60 145 95 Q170 140 160 215 Q130 200 100 210 Q70 200 40 215Z" fill="#3b2550" stroke="#140a1d" stroke-width="4"/>
          <path d="M65 90 L55 40 L80 75Z M135 90 L145 40 L120 75Z" fill="#2a1a3a" stroke="#140a1d" stroke-width="4" stroke-linejoin="round"/>
          <path class="crown" d="M70 62 L76 30 L88 50 L100 22 L112 50 L124 30 L130 62Z" fill="#c9962e" stroke="#140a1d" stroke-width="4" stroke-linejoin="round"/>
          <ellipse cx="80" cy="110" rx="11" ry="8" fill="#ff4d6a"/>
          <ellipse cx="120" cy="110" rx="11" ry="8" fill="#ff4d6a"/>
          <circle cx="80" cy="110" r="3.5" fill="#fff"/><circle cx="120" cy="110" r="3.5" fill="#fff"/>
          <path d="M78 145 Q100 160 122 145 L115 152 L108 146 L100 154 L92 146 L85 152Z" fill="#140a1d"/>
          <path d="M60 170 Q100 185 140 170" fill="none" stroke="#5c3b7a" stroke-width="4" stroke-linecap="round"/>
        </g>
      </svg>
    </div>
    <div id="allyLayer"></div>
    <div id="hero">
      <div class="fig">
        <svg viewBox="0 0 120 138">
          <ellipse cx="60" cy="133" rx="44" ry="6" fill="#00000080"/>
          <path d="M18 132 Q22 80 40 66 L80 66 Q98 80 102 132 Q60 122 18 132Z" fill="#3a1a1a" stroke="#0a0608" stroke-width="3"/>
          <path d="M34 72 Q60 58 86 72 L84 96 Q60 104 36 96Z" fill="#4a4f5a" stroke="#0a0608" stroke-width="3"/>
          <path d="M28 74 Q30 62 42 64 L40 80 Q32 82 28 74Z M92 74 Q90 62 78 64 L80 80 Q88 82 92 74Z" fill="#6a707c" stroke="#0a0608" stroke-width="2.5"/>
          <path d="M46 62 Q44 36 60 32 Q76 36 74 62 Q60 68 46 62Z" fill="#1a1014" stroke="#0a0608" stroke-width="3"/>
          <path d="M48 44 Q52 30 62 31 Q72 32 73 46 Q66 38 60 40 Q54 38 48 44Z" fill="#2a1a22"/>
          <path d="M86 70 L104 8" stroke="#c9d2dc" stroke-width="6" stroke-linecap="round"/>
          <path d="M86 70 L104 8" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity=".7"/>
          <path d="M78 72 L96 78" stroke="#c9962e" stroke-width="5" stroke-linecap="round"/>
          <circle cx="84" cy="76" r="4" fill="#ff4d6a" stroke="#0a0608" stroke-width="1.5"/>
        </svg>
      </div>
      <div class="allyTag">Призванный</div>
    </div>
    <div id="hint">Тапай по врагу!</div>
    <div id="toast"></div>
  </div>

  <div id="abilityBar"></div>
  <div id="panel" class="collapsed">
    <button id="panelToggle" aria-label="Закрыть меню"><span id="toggleLabel">Прокачка</span><span class="x">✕</span><span id="canBuy"></span></button>
    <div id="goldRow">
      <div id="gold">0</div>
      <div id="mult">
        <button class="multBtn on" data-n="1">×1</button>
        <button class="multBtn" data-n="10">×10</button>
        <button class="multBtn" data-n="100">×100</button>
        <button class="multBtn" data-n="max">MAX</button>
        <button class="multBtn" data-n="ms">ДО ×3</button>
      </div>
    </div>
    <div id="tabs">
      <button class="tab on" data-tab="up">Прокачка</button>
      <button class="tab" data-tab="quests">Задания <span id="questDot"></span></button>
      <button class="tab" data-tab="season">Сезон</button>
      <button class="tab" data-tab="heroes">Герои</button>
      <button class="tab" data-tab="portal">Портал <span id="ticketDot"></span></button>
      <button class="tab" data-tab="altar">Алтарь</button>
      <button class="tab" data-tab="souls">Души <span id="soulDot"></span></button>
      <button class="tab" data-tab="runes">Руны</button>
      <button class="tab" data-tab="pve">PvE <span id="pveDot"></span></button>

    <div class="card">
      <div class="cardIcon">⚔</div>
      <div class="cardInfo">
        <div class="cardTitle">Сила удара · ур. <span id="tapLvl">1</span></div>
        <div class="cardSub" id="tapSub"></div>
      </div>
      <button class="buy" id="buyTap"></button>
    </div>
    <div id="allyCards"></div>
    </div>
    <div id="heroesTab" class="tabBody"></div>
    <div id="altarTab" class="tabBody"></div>
    <div id="soulsTab" class="tabBody"></div>
    <div id="runesTab" class="tabBody"></div>
    <div id="pveTab" class="tabBody"></div>
    <div id="questsTab" class="tabBody"></div>
    <div id="seasonTab" class="tabBody"></div>
    <div id="portalTab" class="tabBody">
      <div class="portalHead">
        <div><div class="tickets">🎟 <b id="ticketCount">0</b> билетов</div><div class="pity" id="pityInfo"></div></div>
        <div class="portalBtns"><button class="pBtn" id="pull1">×1</button><button class="pBtn" id="pull10">×10</button></div>
      </div>

  <div id="modal">
    <div id="modalBox">
      <h3>Настройки</h3>
      <p id="saveInfo"></p>
      <button class="mBtn" id="closeModal">Закрыть</button>
      <button class="mBtn danger" id="resetBtn">Сбросить прогресс</button>
    </div>
  </div>
  <!-- Своё окно подтверждения: системные confirm() в некоторых просмотрщиках заблокированы и молча отвечают «нет» -->
  <div id="away" class="askWrap">
    <div class="askBox">
      <p><b id="awayTitle">Пока вас не было</b> <span id="awayTime" style="color:var(--muted)"></span></p>
      <span class="askList" id="awayList"></span>
      <button class="mBtn" id="awayOk">Забрать</button>
    </div>
