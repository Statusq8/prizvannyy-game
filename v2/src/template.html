<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d0a12">
<title>Призванный: Башня Гачи</title>
<style>
  :root {
    --bg1: #0d0a12; --bg2: #1e1329; --panel: #170f20; --panel2: #23172f;
    --text: #efe6f5; --muted: #9a8aa8; --line: #3a2a4a;
    --hp: #c23a4a; --hp-dark: #5a1820;
    --accent: #b98cff; --gold: #ffd36b; --boss: #ff6b4a; --ok: #6be3a0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%; background: var(--bg1); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden; touch-action: manipulation; user-select: none; -webkit-user-select: none;
  }
  button { font: inherit; color: inherit; border: none; background: none; cursor: pointer; }
  #game {
    position: relative; height: 100%; height: 100dvh; max-width: calc(100dvh * 9 / 16); margin: 0 auto;
    background: radial-gradient(ellipse at 50% 45%, var(--bg2) 0%, var(--bg1) 70%);
    display: flex; flex-direction: column; overflow: hidden;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  /* ---------- верхний HUD ---------- */
  #hud { padding: 10px 16px 6px; text-align: center; position: relative; z-index: 2; }
  #floorRow { display: flex; align-items: center; justify-content: center; gap: 10px; }
  .navBtn {
    width: 34px; height: 34px; border-radius: 10px; font-size: 18px;
    background: var(--panel2); border: 1px solid var(--line);
  }
  .navBtn:disabled { opacity: .25; }
  #floorLabel { font-size: 17px; font-weight: 800; min-width: 100px; }
  #settingsBtn { position: absolute; right: 12px; top: 10px; font-size: 18px; opacity: .6; width: 34px; height: 34px; }
  #dots { display: flex; justify-content: center; gap: 5px; margin-top: 8px; }
  .dot { width: 18px; height: 6px; border-radius: 3px; background: var(--line); }
  .dot.done { background: var(--accent); }
  .dot.cur { background: var(--text); }
  .dot.boss { width: 26px; background: #5a2a24; }
  .dot.boss.cur { background: var(--boss); }
  #enemyName { margin-top: 8px; font-size: 15px; font-weight: 700; }
  #enemyName.boss { color: var(--boss); }
  #hpBar {
    position: relative; margin-top: 6px; height: 18px; border-radius: 9px;
    background: var(--hp-dark); border: 1px solid #00000080; overflow: hidden;
  }
  #hpFill { height: 100%; width: 100%; background: linear-gradient(180deg, #e65566, var(--hp)); transition: width .1s ease-out; }
  #hpText { position: absolute; inset: 0; font-size: 12px; line-height: 18px; font-weight: 700; text-shadow: 0 1px 2px #000; }
  #timerBar { margin-top: 5px; height: 5px; border-radius: 3px; background: #2a1c1c; overflow: hidden; visibility: hidden; }
  #timerBar.show { visibility: visible; }
  #timerFill { height: 100%; width: 100%; background: var(--boss); }
  #timerFill.low { background: #ff3030; }
  #stats { margin-top: 6px; font-size: 12px; color: var(--muted); }
  #stats b { color: var(--text); }

  /* ---------- арена ---------- */
  #arena { position: relative; flex: 1; display: flex; align-items: center; justify-content: center; cursor: pointer; min-height: 0; }
  #enemy {
    position: relative; z-index: 1;
    /* размер по высоте арены; враг приподнят, чтобы впереди было место главному герою */
    height: min(44%, 280px); aspect-ratio: 1 / 1.15; transform-origin: 50% 90%; margin-bottom: min(24%, 120px);
    animation: idle 2.4s ease-in-out infinite; pointer-events: none;
  }
  #enemy.boss { height: min(52%, 330px); }
  #enemy svg { width: 100%; height: 100%; overflow: visible; }
  #enemy .crown { display: none; }
  #enemy.boss .crown { display: inline; }
  #enemy.hit { animation: hit .14s ease-out; }
  #enemy.hit .body { filter: brightness(2.2) saturate(.4); }
  #enemy.dead { animation: death .35s ease-in forwards; }
  #enemy.spawn { animation: spawn .25s ease-out; }
  @keyframes idle { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-6px) scale(1.01,.99); } }
  @keyframes hit { 0% { transform: none; } 30% { transform: translate(-6px,2px) scale(.94,1.04); } 60% { transform: translate(5px,-1px) scale(1.03,.97); } 100% { transform: none; } }
  @keyframes death { 30% { transform: scale(1.08,.9); filter: brightness(2.5); } 100% { transform: scale(.6,.1) translateY(40px); opacity: 0; filter: brightness(3); } }
  @keyframes spawn { from { transform: scale(.7) translateY(20px); opacity: 0; } }

  .dmg {
    position: absolute; font-weight: 800; font-size: 24px; color: #fff; pointer-events: none;
    text-shadow: 0 2px 0 #000, 0 0 8px var(--accent); animation: float .7s ease-out forwards;
    transform: translate(-50%,-50%); white-space: nowrap;
  }
  .dmg.gold { color: var(--gold); font-size: 18px; text-shadow: 0 2px 0 #000; }
  @keyframes float { 0% { opacity: 0; transform: translate(-50%,-30%) scale(.6); } 15% { opacity: 1; transform: translate(-50%,-60%) scale(1.15); } 100% { opacity: 0; transform: translate(-50%,-180%) scale(1); } }
  .spark {
    position: absolute; width: 56px; height: 56px; border-radius: 50%; border: 3px solid var(--accent);
    pointer-events: none; transform: translate(-50%,-50%) scale(.2); animation: spark .3s ease-out forwards;
  }
  @keyframes spark { to { transform: translate(-50%,-50%) scale(1.3); opacity: 0; } }
  #hint { position: absolute; bottom: 10px; left: 0; right: 0; text-align: center; font-size: 13px; color: var(--muted); pointer-events: none; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }

  #farmBar {
    position: absolute; top: 8px; left: 16px; right: 16px; display: none;
    align-items: center; justify-content: space-between; gap: 8px;
    padding: 8px 10px 8px 14px; border-radius: 12px; background: #2a1720e6; border: 1px solid #5a2a34;
    font-size: 13px; z-index: 3;
  }
  #farmBar.show { display: flex; }
  #bossBtn { padding: 8px 12px; border-radius: 9px; font-weight: 700; background: var(--boss); color: #1a0a08; }

  #toast {
    position: absolute; top: 27%; left: 50%; transform: translate(-50%,-50%);
    padding: 12px 18px; border-radius: 14px; background: #1a1024f0; border: 1px solid var(--gold);
    text-align: center; font-weight: 700; pointer-events: none; opacity: 0; transition: opacity .25s; z-index: 4;
  }
  #toast.show { opacity: 1; }
  #toast small { display: block; color: var(--gold); margin-top: 4px; font-size: 14px; }

  /* ---------- нижняя панель ---------- */
  #panel { background: var(--panel); border-top: 1px solid var(--line); padding: 0 12px 10px; position: relative; z-index: 2; }
  /* ручка сворачивания панели */
  #panelToggle { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; height: 26px; font-size: 12px; color: var(--muted); }
  #panelToggle .bar { width: 36px; height: 4px; border-radius: 2px; background: var(--line); }
  #panelToggle .chev { transition: transform .2s; }
  #panel.collapsed .chev { transform: rotate(180deg); }
  #panel.collapsed #cards, #panel.collapsed #mult { display: none; }
  #panel.collapsed #goldRow { margin-bottom: 0; }
  #canBuy { display: none; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
  #panel.collapsed #canBuy.on { display: inline-block; }
  #goldRow { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  #gold { font-size: 20px; font-weight: 800; color: var(--gold); }
  #gold::before { content: "◆ "; font-size: 15px; }
  #mult { display: flex; gap: 4px; }
  .multBtn { padding: 5px 9px; border-radius: 8px; font-size: 12px; font-weight: 700; background: var(--panel2); border: 1px solid var(--line); color: var(--muted); }
  .multBtn.on { color: var(--text); border-color: var(--accent); }
  .card { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 12px; background: var(--panel2); border: 1px solid var(--line); }
  .cardIcon { width: 42px; height: 42px; border-radius: 10px; flex: none; display: grid; place-items: center; font-size: 22px; background: #3b2550; }
  .cardInfo { flex: 1; min-width: 0; }
  .cardTitle { font-weight: 700; font-size: 14px; }
  .cardSub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .cardSub b { color: var(--ok); }
  .buy {
    min-width: 104px; padding: 9px 10px; border-radius: 10px; font-weight: 800; font-size: 13px; line-height: 1.25;
    background: linear-gradient(180deg, #7a4fc4, #4b2c86); border: 1px solid var(--accent);
  }
  .buy span { display: block; font-size: 12px; font-weight: 700; color: var(--gold); }
  .buy:disabled { background: #2a2234; border-color: var(--line); color: var(--muted); }
  .buy:disabled span { color: var(--muted); }
  .buy:not(:disabled):active { transform: scale(.96); }

  /* ---------- настройки ---------- */
  .askWrap { position: absolute; inset: 0; background: #000b; display: none; align-items: center; justify-content: center; z-index: 20; padding: 20px; }
  .askWrap.show { display: flex; }
  .askBox { width: 100%; max-width: 320px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
  .askBox p { font-size: 14px; line-height: 1.45; margin-bottom: 6px; }
  .askBtns { display: flex; gap: 8px; } .askBtns .mBtn { flex: 1; }
  #modal { position: absolute; inset: 0; background: #000a; display: none; align-items: center; justify-content: center; z-index: 10; padding: 16px; }
  #modal.show { display: flex; }
  #modalBox { width: 100%; max-width: 320px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
  #modalBox h3 { margin-bottom: 10px; }
  #modalBox p { font-size: 13px; color: var(--muted); margin-bottom: 14px; line-height: 1.45; }
  .mBtn { width: 100%; padding: 12px; border-radius: 10px; font-weight: 700; margin-top: 8px; background: var(--panel2); border: 1px solid var(--line); }
  .mBtn.danger { background: #4a1820; border-color: #8a2a3a; }
  .card + .card { margin-top: 8px; }
  .cardSub .dim { color: var(--muted); }
  .cardSub .ms { color: var(--gold); opacity: .8; }
  #stats { cursor: pointer; }
  #statsMore { display: none; margin-top: 3px; font-size: 11px; color: var(--muted); }
  #statsMore.show { display: block; }
  .dmg.auto { font-size: 18px; text-shadow: 0 2px 0 #000, 0 0 6px currentColor; }
  /* союзник на арене (временная заглушка) */
  #allyCards { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  #allyCards .card + .card { margin-top: 0; }
  #cards { max-height: 30dvh; overflow-y: auto; overscroll-behavior: contain; margin: 0 -4px; padding: 0 4px; }
  /* союзники на арене (временные заглушки): двое по бокам впереди, двое позади */
  /* главный герой — впереди по центру, вид со спины (временная заглушка) */
  #hero { position: absolute; left: 50%; bottom: 14px; height: min(34%, 150px); aspect-ratio: 1 / 1.15; transform: translateX(-50%); z-index: 2; pointer-events: none; }
  #hero .fig { width: 100%; height: 100%; animation: allyIdle 3s ease-in-out infinite; transform-origin: 50% 100%; }
  #hero.attack .fig { animation: heroAtk .18s ease-out; }
  #hero svg { width: 100%; height: 100%; overflow: visible; }
  #hero .allyTag { color: var(--gold); bottom: -13px; }
  @keyframes heroAtk { 35% { transform: translateY(-14px) scale(1.04) rotate(-3deg); } 100% { transform: none; } }
  /* ультимейты */
  .ultBar { position: absolute; left: 18%; right: 18%; bottom: -4px; height: 4px; border-radius: 2px; background: #00000080; overflow: hidden; }
  .ultBar i { display: block; height: 100%; width: 0; background: currentColor; }
  .ultBar.ready i { box-shadow: 0 0 6px currentColor; }
  .ally.ulting .fig { animation: ultPulse .5s ease-out; }
  @keyframes ultPulse { 0% { filter: brightness(1); } 30% { filter: brightness(2.4) drop-shadow(0 0 10px currentColor); transform: scale(1.12); } 100% { filter: none; transform: none; } }
  #ultBanner { position: absolute; top: 46px; left: 0; right: 0; text-align: center; font-weight: 800; font-size: 16px; letter-spacing: .5px; pointer-events: none; opacity: 0; z-index: 4; text-shadow: 0 2px 0 #000, 0 0 12px currentColor; }
  #ultBanner.show { animation: banner 1.1s ease-out; }
  @keyframes banner { 0% { opacity: 0; transform: scale(.7); } 15% { opacity: 1; transform: scale(1.08); } 70% { opacity: 1; transform: none; } 100% { opacity: 0; } }
  .dmg.nuke { font-size: 34px; text-shadow: 0 3px 0 #000, 0 0 14px currentColor; }
  #arena.fury::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 55%, transparent 40%, #ff3b2a33 100%); }
  #enemy.marked .body { filter: drop-shadow(0 0 10px #ff8a3d) drop-shadow(0 0 3px #ffd36b); }
  #hero.empowered svg { filter: drop-shadow(0 0 10px #b98cff); }
  #buffs { display: flex; justify-content: center; gap: 6px; margin-top: 5px; min-height: 20px; }
  .buff { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px; background: #00000060; border: 1px solid currentColor; }
  /* криты */
  .dmg.crit { font-size: 27px; color: #ffd36b; text-shadow: 0 2px 0 #000, 0 0 10px #ff6b4a; }
  .dmg.auto.crit { font-size: 22px; }
  /* панель способностей главного героя — вне арены, чтобы не перехватывать тапы */
  #abilityBar { display: flex; gap: 8px; padding: 6px 12px; background: var(--bg1); border-top: 1px solid var(--line); position: relative; z-index: 2; }
  .abil { flex: 1; display: flex; min-width: 0; height: 44px; border-radius: 12px; background: var(--panel2); border: 1px solid var(--line); overflow: hidden; }
  .abilUse { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; padding: 0 10px; text-align: left; position: relative; }
  .abilIcon { font-size: 18px; flex: none; }
  .abilText { min-width: 0; }
  .abilName { font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .abilState { font-size: 11px; color: var(--muted); }
  .abil.ready { border-color: var(--accent); }
  .abil.ready .abilState { color: var(--ok); }
  .abil.active { border-color: var(--gold); box-shadow: 0 0 10px #ffd36b40; }
  .abil.locked { opacity: .45; }
  .abilCd { position: absolute; left: 0; top: 0; bottom: 0; background: #00000055; pointer-events: none; }
  .abilAuto { width: 40px; flex: none; font-size: 10px; font-weight: 800; color: var(--muted); border-left: 1px solid var(--line); }
  .abilAuto.on { color: #1a0a08; background: var(--ok); }
  /* вспышка крита — коротко и без перегрузки */
  .critFlash { position: absolute; width: 70px; height: 70px; border-radius: 50%; pointer-events: none; transform: translate(-50%,-50%) scale(.3);
    background: radial-gradient(circle, #fff6 0%, #ffd36b55 40%, transparent 70%); animation: cflash .16s ease-out forwards; z-index: 3; }
  @keyframes cflash { to { transform: translate(-50%,-50%) scale(1.2); opacity: 0; } }
  /* вкладки панели */
  #tabs { display: flex; gap: 4px; margin-bottom: 8px; }
  .tab { flex: 1; padding: 7px 4px; border-radius: 9px; font-size: 12px; font-weight: 700; color: var(--muted); background: var(--panel2); border: 1px solid var(--line); }
  .tab.on { color: var(--text); border-color: var(--accent); }
  #ticketDot { display: none; width: 7px; height: 7px; border-radius: 50%; background: var(--gold); vertical-align: middle; }
  #ticketDot.on { display: inline-block; }
  #panel.collapsed #tabs, #panel.collapsed .tabBody { display: none !important; }
  .tabBody { display: none; max-height: 30dvh; overflow-y: auto; overscroll-behavior: contain; }
  #panel[data-tab="heroes"] #heroesTab, #panel[data-tab="portal"] #portalTab, #panel[data-tab="altar"] #altarTab { display: block; }
  #panel:not([data-tab="up"]) #cards, #panel:not([data-tab="up"]) #mult { display: none; }
  /* Алтарь */
  .altHead { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 6px; }
  .ess { font-size: 15px; font-weight: 700; } .ess b { color: #8fe6ff; }
  .altBtns { display: flex; gap: 5px; }
  .step { display: flex; align-items: center; gap: 2px; }
  .step button { width: 26px; height: 26px; border-radius: 7px; background: var(--panel); border: 1px solid var(--line); font-weight: 800; }
  .step span { min-width: 22px; text-align: center; font-weight: 800; font-size: 12px; }
  .lockBtn { width: 30px; height: 26px; border-radius: 7px; background: var(--panel); border: 1px solid var(--line); font-size: 13px; }
  .lockBtn.on { border-color: var(--gold); }
  .sacBtn { width: 100%; margin: 8px 0; padding: 10px; border-radius: 10px; font-weight: 800; background: linear-gradient(180deg, #a83a4a, #6a1f2a); border: 1px solid #ff6b7a; }
  .sacBtn:disabled { background: #2a2234; border-color: var(--line); color: var(--muted); }
  .recipe { padding: 8px 10px; border-radius: 11px; background: #1a1424; border: 1px dashed var(--line); font-size: 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .recipe + .recipe { margin-top: 6px; }
  .recipe small { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; }
  .secTitle { font-size: 12px; font-weight: 800; color: var(--muted); margin: 10px 2px 6px; letter-spacing: .5px; }
  /* редкости */
  .r-E { --r: #9a9aa8; } .r-D { --r: #6be3a0; } .r-C { --r: #6bb8ff; } .r-B { --r: #b98cff; }
  .r-A { --r: #ffa64a; } .r-S { --r: #ff5a6a; } .r-GOD { --r: #ffd36b; }
  .rar { display: inline-block; min-width: 22px; padding: 0 4px; border-radius: 5px; font-size: 10px; font-weight: 800; text-align: center; color: #120a18; background: var(--r); }
  .badge { font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 6px; margin-left: 4px; vertical-align: middle; }
  .badge.sq { background: #6be3a033; color: var(--ok); } .badge.rs { background: #ffffff14; color: var(--muted); }
  .hRow { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 11px; background: var(--panel2); border: 1px solid var(--line); border-left: 3px solid var(--r); }
  .hRow + .hRow { margin-top: 6px; }
  .hRow.locked { opacity: .5; }
  .hIcon { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; font-size: 17px; flex: none; }
  .hInfo { flex: 1; min-width: 0; }
  .hName { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hSub { font-size: 11px; color: var(--muted); margin-top: 1px; }
  .stars { color: var(--gold); letter-spacing: -1px; }
  .hBtn { padding: 6px 8px; border-radius: 8px; font-size: 11px; font-weight: 700; background: var(--panel); border: 1px solid var(--line); white-space: nowrap; }
  .hBtn.go { border-color: var(--accent); color: var(--text); }
  .hBtn:disabled { opacity: .4; }
  .hint2 { font-size: 11px; color: var(--muted); margin: 0 2px 6px; }
  /* портал */
  .portalHead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .tickets { font-size: 15px; font-weight: 700; } .tickets b { color: var(--gold); }
  .pity { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .portalBtns { display: flex; gap: 6px; }
  .pBtn { padding: 10px 14px; border-radius: 10px; font-weight: 800; background: linear-gradient(180deg, #7a4fc4, #4b2c86); border: 1px solid var(--accent); }
  .pBtn:disabled { background: #2a2234; border-color: var(--line); color: var(--muted); }
  .odds { font-size: 10px; color: var(--muted); margin: 8px 0; line-height: 1.6; }
  .results { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
  .res { border-radius: 9px; padding: 6px 2px; text-align: center; background: var(--panel2); border: 1px solid var(--r); font-size: 10px; animation: pop .3s ease-out backwards; }
  .res .ri { font-size: 18px; } .res .rn { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .res .new { color: var(--gold); font-weight: 800; }
  @keyframes pop { from { transform: scale(.5); opacity: 0; } }
  #allyLayer { position: absolute; inset: 0; pointer-events: none; }
  /* размер зависит от высоты арены — на коротком экране фигуры меньше и не перекрываются */
  .ally { position: absolute; height: min(36%, 130px); aspect-ratio: 1 / 1.3; display: none; transform-origin: 50% 100%; bottom: 18px; }
  .ally.back { height: min(28%, 106px); bottom: calc(18px + min(36%, 130px) + 16px); filter: brightness(.8); }
  .ally.on { display: block; }
  .ally .fig { width: 100%; height: 100%; animation: allyIdle 2.8s ease-in-out infinite; }
  .ally.R .fig svg { transform: scaleX(-1); }
  .ally.attack .fig { animation: allyAtkL .2s ease-out; }
  .ally.R.attack .fig { animation: allyAtkR .2s ease-out; }
  .ally svg { width: 100%; height: 100%; overflow: visible; }
  .allyTag { position: absolute; left: -10px; right: -10px; bottom: -15px; text-align: center; font-size: 10px; font-weight: 700; white-space: nowrap; }
  @keyframes allyIdle { 50% { transform: translateY(-3px); } }
  @keyframes allyAtkL { 40% { transform: translate(14px,-6px) rotate(6deg); } 100% { transform: none; } }
  @keyframes allyAtkR { 40% { transform: translate(-14px,-6px) rotate(-6deg); } 100% { transform: none; } }
  #version { position: absolute; bottom: 2px; left: 8px; font-size: 10px; color: #ffffff30; pointer-events: none; }
</style>
</head>
<body>
<div id="game">
  <div id="hud">
    <button id="settingsBtn" aria-label="Настройки">⚙</button>
    <div id="floorRow">
      <button class="navBtn" id="prevFloor" aria-label="Этаж ниже">‹</button>
      <div id="floorLabel">Этаж 1</div>
      <button class="navBtn" id="nextFloor" aria-label="Этаж выше">›</button>
    </div>
    <div id="dots"></div>
    <div id="enemyName"></div>
    <div id="hpBar"><div id="hpFill"></div><div id="hpText"></div></div>
    <div id="timerBar"><div id="timerFill"></div></div>
    <div id="stats">Урон за тап <b id="tapDmg"></b> · DPS <b id="dps">0</b> ⓘ<div id="statsMore"></div></div>
    <div id="buffs"></div>
  </div>

  <div id="arena">
    <div id="ultBanner"></div>
    <div id="farmBar"><span>Фарм этажа</span><button id="bossBtn">Вызвать босса</button></div>
    <!-- Временная заглушка врага (не финальный ассет) -->
    <div id="enemy">
      <svg viewBox="0 0 200 230">
        <ellipse cx="100" cy="222" rx="70" ry="8" fill="#00000070"/>
        <g class="body">
          <path d="M40 215 Q30 140 55 95 Q70 60 100 55 Q130 60 145 95 Q170 140 160 215 Q130 200 100 210 Q70 200 40 215Z" fill="#3b2550" stroke="#140a1d" stroke-width="4"/>
          <path d="M65 90 L55 40 L80 75Z M135 90 L145 40 L120 75Z" fill="#2a1a3a" stroke="#140a1d" stroke-width="4" stroke-linejoin="round"/>
          <path class="crown" d="M70 62 L76 30 L88 50 L100 22 L112 50 L124 30 L130 62Z" fill="#c9962e" stroke="#140a1d" stroke-width="4" stroke-linejoin="round"/>
          <ellipse cx="80" cy="110" rx="11" ry="8" fill="#ff4d6a"/>
          <ellipse cx="120" cy="110" rx="11" ry="8" fill="#ff4d6a"/>
          <circle cx="80" cy="110" r="3.5" fill="#fff"/><circle cx="120" cy="110" r="3.5" fill="#fff"/>
          <path d="M78 145 Q100 160 122 145 L115 152 L108 146 L100 154 L92 146 L85 152Z" fill="#140a1d"/>
          <path d="M60 170 Q100 185 140 170" fill="none" stroke="#5c3b7a" stroke-width="4" stroke-linecap="round"/>
        </g>
      </svg>
    </div>
    <div id="allyLayer"></div>
    <div id="hero">
      <div class="fig">
        <svg viewBox="0 0 120 138">
          <ellipse cx="60" cy="133" rx="44" ry="6" fill="#00000080"/>
          <path d="M18 132 Q22 80 40 66 L80 66 Q98 80 102 132 Q60 122 18 132Z" fill="#3a1a1a" stroke="#0a0608" stroke-width="3"/>
          <path d="M34 72 Q60 58 86 72 L84 96 Q60 104 36 96Z" fill="#4a4f5a" stroke="#0a0608" stroke-width="3"/>
          <path d="M28 74 Q30 62 42 64 L40 80 Q32 82 28 74Z M92 74 Q90 62 78 64 L80 80 Q88 82 92 74Z" fill="#6a707c" stroke="#0a0608" stroke-width="2.5"/>
          <path d="M46 62 Q44 36 60 32 Q76 36 74 62 Q60 68 46 62Z" fill="#1a1014" stroke="#0a0608" stroke-width="3"/>
          <path d="M48 44 Q52 30 62 31 Q72 32 73 46 Q66 38 60 40 Q54 38 48 44Z" fill="#2a1a22"/>
          <path d="M86 70 L104 8" stroke="#c9d2dc" stroke-width="6" stroke-linecap="round"/>
          <path d="M86 70 L104 8" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity=".7"/>
          <path d="M78 72 L96 78" stroke="#c9962e" stroke-width="5" stroke-linecap="round"/>
          <circle cx="84" cy="76" r="4" fill="#ff4d6a" stroke="#0a0608" stroke-width="1.5"/>
        </svg>
      </div>
      <div class="allyTag">Призванный</div>
    </div>
    <div id="hint">Тапай по врагу!</div>
    <div id="toast"></div>
  </div>

  <div id="abilityBar"></div>
  <div id="panel">
    <button id="panelToggle" aria-label="Свернуть или развернуть улучшения"><span class="bar"></span><span id="toggleLabel">Свернуть</span><span class="chev">▼</span><span id="canBuy"></span></button>
    <div id="goldRow">
      <div id="gold">0</div>
      <div id="mult">
        <button class="multBtn on" data-n="1">×1</button>
        <button class="multBtn" data-n="10">×10</button>
        <button class="multBtn" data-n="100">×100</button>
        <button class="multBtn" data-n="max">MAX</button>
      </div>
    </div>
    <div id="tabs">
      <button class="tab on" data-tab="up">Улучшения</button>
      <button class="tab" data-tab="heroes">Герои</button>
      <button class="tab" data-tab="portal">Портал <span id="ticketDot"></span></button>
      <button class="tab" data-tab="altar">Алтарь</button>
    </div>
    <div id="cards">
    <div class="card">
      <div class="cardIcon">⚔</div>
      <div class="cardInfo">
        <div class="cardTitle">Сила удара · ур. <span id="tapLvl">1</span></div>
        <div class="cardSub" id="tapSub"></div>
      </div>
      <button class="buy" id="buyTap"></button>
    </div>
    <div id="allyCards"></div>
    </div>
    <div id="heroesTab" class="tabBody"></div>
    <div id="altarTab" class="tabBody"></div>
    <div id="portalTab" class="tabBody">
      <div class="portalHead">
        <div><div class="tickets">🎟 <b id="ticketCount">0</b> билетов</div><div class="pity" id="pityInfo"></div></div>
        <div class="portalBtns"><button class="pBtn" id="pull1">×1</button><button class="pBtn" id="pull10">×10</button></div>
      </div>
      <div class="odds" id="oddsInfo"></div>
      <div class="results" id="pullResults"></div>
    </div>
  </div>

  <div id="modal">
    <div id="modalBox">
      <h3>Настройки</h3>
      <p id="saveInfo"></p>
      <button class="mBtn" id="closeModal">Закрыть</button>
      <button class="mBtn danger" id="resetBtn">Сбросить прогресс</button>
    </div>
  </div>
  <!-- Своё окно подтверждения: системные confirm() в некоторых просмотрщиках заблокированы и молча отвечают «нет» -->
  <div id="ask" class="askWrap">
    <div class="askBox">
      <p id="askText"></p>
      <div class="askBtns"><button class="mBtn" id="askNo">Отмена</button><button class="mBtn danger" id="askYes">Да</button></div>
    </div>
  </div>
  <div id="version">v0.8</div>
</div>

<script>
/*__CORE__*/
</script>
<script>
(function () {
  'use strict';
  const C = Core, CFG = Core.CONFIG, fmt = Core.fmt;
  // Внешний вид союзников (временные заглушки, не финальные ассеты)
  const WEAPON = {
    bow: '<path d="M82 40 Q100 76 82 112" fill="none" stroke="#6b4a2a" stroke-width="4" stroke-linecap="round"/><path d="M82 40 L82 112" stroke="#cfd8dc" stroke-width="1.2"/><path d="M60 76 L96 76" stroke="#cfd8dc" stroke-width="2.5" stroke-linecap="round"/>',
    axe: '<path d="M78 30 L84 118" stroke="#5a3a22" stroke-width="5" stroke-linecap="round"/><path d="M80 34 Q104 40 100 62 Q90 54 82 56Z" fill="#9aa4ab" stroke="#1a1a1a" stroke-width="2.5"/>',
    staff: '<path d="M80 36 L84 120" stroke="#4a2a1a" stroke-width="4" stroke-linecap="round"/><circle cx="80" cy="30" r="9" fill="#ff8a3d" stroke="#5a1a0a" stroke-width="2"/><circle cx="80" cy="30" r="4" fill="#ffe08a"/>',
    blades: '<path d="M70 70 L98 44" stroke="#c8b8ff" stroke-width="4" stroke-linecap="round"/><path d="M68 84 L100 72" stroke="#c8b8ff" stroke-width="4" stroke-linecap="round"/>',
  };
  const ALLY_VIS = {
    irene:  { body: '#1f3c4a', hood: '#163039', eye: '#8fe6ff', icon: '🏹', iconBg: '#1e3a46', weapon: 'bow' },
    borg:   { body: '#4a2a1f', hood: '#3a1f16', eye: '#ffb36b', icon: '🪓', iconBg: '#46281e', weapon: 'axe' },
    lia:    { body: '#4a1f2a', hood: '#3a1620', eye: '#ffd36b', icon: '🔥', iconBg: '#46201e', weapon: 'staff' },
    kael:   { body: '#2a1f4a', hood: '#20163a', eye: '#c8b8ff', icon: '🗡', iconBg: '#2a1e46', weapon: 'blades' },
    garret: { body: '#3a3a2a', hood: '#2c2c1e', eye: '#e6e6b0', icon: '🛡', iconBg: '#36361e', weapon: 'axe' },
    saya:   { body: '#1f4a2c', hood: '#163a20', eye: '#9dffb8', icon: '🔪', iconBg: '#1e4628', weapon: 'blades' },
    drake:  { body: '#1f2c4a', hood: '#16203a', eye: '#8fb8ff', icon: '🔱', iconBg: '#1e2a46', weapon: 'staff' },
    noa:    { body: '#2a2a4a', hood: '#1f1f3a', eye: '#d8e6ff', icon: '⚡', iconBg: '#24244a', weapon: 'staff' },
    velma:  { body: '#2a3a2a', hood: '#1e2c1e', eye: '#b8ff8f', icon: '💀', iconBg: '#223a22', weapon: 'staff' },
    ragnar: { body: '#3a2a3a', hood: '#2c1e2c', eye: '#ff8fb8', icon: '⚔', iconBg: '#3a223a', weapon: 'axe' },
    seiren: { body: '#1f3a4a', hood: '#16303a', eye: '#8fffff', icon: '🌪', iconBg: '#1e3a46', weapon: 'staff' },
    morra:  { body: '#3a1f2a', hood: '#2c1620', eye: '#ff6b9a', icon: '🕯', iconBg: '#3a1e2a', weapon: 'staff' },
    azrael: { body: '#4a3a1f', hood: '#3a2c16', eye: '#fff0a0', icon: '🪽', iconBg: '#46381e', weapon: 'blades' },
  };
  // Слоты отряда: двое по бокам впереди, двое позади
  const SLOTS = [
    { pos: 'left:2%', side: 'L', back: false }, { pos: 'right:2%', side: 'R', back: false },
    { pos: 'left:7%', side: 'L', back: true },  { pos: 'right:7%', side: 'R', back: true },
  ];

  function allySvg(v) {
    return '<svg viewBox="0 0 100 130"><ellipse cx="50" cy="126" rx="34" ry="5" fill="#00000070"/>' +
      '<path d="M22 124 L34 58 Q50 46 66 58 L78 124 Q50 116 22 124Z" fill="' + v.body + '" stroke="#0a0a10" stroke-width="3"/>' +
      '<path d="M32 52 Q32 22 50 18 Q68 22 68 52 Q60 60 50 60 Q40 60 32 52Z" fill="' + v.hood + '" stroke="#0a0a10" stroke-width="3"/>' +
      '<ellipse cx="44" cy="44" rx="3" ry="2.4" fill="' + v.eye + '"/><ellipse cx="57" cy="44" rx="3" ry="2.4" fill="' + v.eye + '"/>' +
      WEAPON[v.weapon] + '</svg>';
  }
  const allyUi = {};                 // id → { sprite, title, sub, btn }
  function buildAllies() {
    const layer = $('allyLayer'), cards = $('allyCards');
    for (const a of CFG.allies) {
      const v = ALLY_VIS[a.id];
      const sp = document.createElement('div');
      sp.className = 'ally';
      sp.innerHTML = '<div class="fig">' + allySvg(v) + '</div><div class="allyTag" style="color:' + v.eye + '">' + a.name + '</div><div class="ultBar" style="color:' + v.eye + '"><i></i></div>';
      layer.appendChild(sp);
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = '<div class="cardIcon" style="background:' + v.iconBg + '">' + v.icon + '</div>' +
        '<div class="cardInfo"><div class="cardTitle"></div><div class="cardSub"></div></div><button class="buy"></button>';
      cards.appendChild(card);
      const btn = card.querySelector('.buy');
      btn.addEventListener('click', () => { if (C.buyAlly(s, a.id, mult)) { save(); render(); } });
      allyUi[a.id] = { card, ultBar: sp.querySelector('.ultBar'), ultFill: sp.querySelector('.ultBar i'), sprite: sp, title: card.querySelector('.cardTitle'), sub: card.querySelector('.cardSub'), btn, color: v.eye };
    }
  }
  const SAVE_KEY = 'prizvannyy_v2_save';
  const STEP = 1 / 30;                 // фиксированный шаг логики
  const DPS_WINDOW = 5;                // период усреднения DPS, сек (TBD)

  const $ = id => document.getElementById(id);
  const el = {
    arena: $('arena'), enemy: $('enemy'), hpFill: $('hpFill'), hpText: $('hpText'),
    enemyName: $('enemyName'), dots: $('dots'), floorLabel: $('floorLabel'),
    prev: $('prevFloor'), next: $('nextFloor'), timerBar: $('timerBar'), timerFill: $('timerFill'),
    tapDmg: $('tapDmg'), dps: $('dps'), hint: $('hint'), farmBar: $('farmBar'), bossBtn: $('bossBtn'),
    toast: $('toast'), gold: $('gold'), tapLvl: $('tapLvl'), tapSub: $('tapSub'), buyTap: $('buyTap'),
    statsMore: $('statsMore'),
    modal: $('modal'), saveInfo: $('saveInfo'),
  };

  // ---------- сохранение ----------
  function load() {
    try { const raw = localStorage.getItem(SAVE_KEY); if (raw) { const s = C.deserialize(raw); if (s) return s; } } catch (e) {}
    return C.newState();
  }
  let lastSave = 0;
  function save() {
    try { localStorage.setItem(SAVE_KEY, C.serialize(s)); lastSave = Date.now(); } catch (e) {}
  }

  let s = load();
  let mult = 1;
  let anyAffordable = false;
  const heroEl = $('hero');
  const UI_KEY = 'prizvannyy_v2_ui';
  function setCollapsed(on) {
    $('panel').classList.toggle('collapsed', on);
    $('toggleLabel').textContent = on ? 'Улучшения' : 'Свернуть';
    try { localStorage.setItem(UI_KEY, JSON.stringify({ collapsed: on })); } catch (e) {}
  }
  try { setCollapsed(!!(JSON.parse(localStorage.getItem(UI_KEY) || '{}').collapsed)); } catch (e) { setCollapsed(false); }
  $('panelToggle').addEventListener('click', () => setCollapsed(!$('panel').classList.contains('collapsed')));
  const dmgLog = [];                    // [время, урон] для DPS
  let tapped = s.stats.taps > 0;

  for (let i = 1; i <= CFG.enemiesPerFloor; i++) {
    const d = document.createElement('div');
    d.className = 'dot' + (i === CFG.enemiesPerFloor ? ' boss' : '');
    el.dots.appendChild(d);
  }

  // ---------- эффекты ----------
  function fx(cls, x, y, text, life) {
    const n = document.createElement('div');
    n.className = cls; n.style.left = x + 'px'; n.style.top = y + 'px';
    if (text != null) n.textContent = text;
    el.arena.appendChild(n);
    setTimeout(() => n.remove(), life);
    return n;
  }
  function restartAnim(cls) {
    el.enemy.classList.remove('hit', 'spawn', 'dead');
    void el.enemy.offsetWidth;
    if (cls) el.enemy.classList.add(cls);
  }
  let toastTimer = 0;
  function toast(html) {
    el.toast.innerHTML = html; el.toast.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => el.toast.classList.remove('show'), 1600);
  }

  // ---------- обработка событий ядра ----------
  function handle(events, x, y) {
    const r = el.arena.getBoundingClientRect();
    for (const e of events) {
      if (e.type === 'hit') {
        if (e.source === 'tap') {
          dmgLog.push([performance.now(), e.dmg, 'tap']);
          heroEl.classList.remove('attack'); void heroEl.offsetWidth; heroEl.classList.add('attack');
          fx('spark', x, y, null, 300);
          if (e.crit) fx('critFlash', x, y, null, 160);
          fx('dmg' + (e.crit ? ' crit' : ''), x + Math.random() * 30 - 15, y, (e.crit ? 'КРИТ ' : '') + fmt(e.dmg), e.crit ? 850 : 700);
        } else {
          dmgLog.push([performance.now(), e.dmg, 'auto']);
          const isUlt = e.source.startsWith('ult:');
          const u = allyUi[isUlt ? e.source.slice(4) : e.source];
          if (u && isUlt) {
            const d = fx('dmg nuke', r.width / 2, r.height * 0.4, fmt(e.dmg), 900);
            d.style.color = u.color;
          } else if (u) {
            u.sprite.classList.remove('attack'); void u.sprite.offsetWidth; u.sprite.classList.add('attack');
            const dx = r.width * (0.38 + Math.random() * 0.24), dy = r.height * (0.42 + Math.random() * 0.14);
            if (e.crit) fx('critFlash', dx, dy, null, 160);
            const d = fx('dmg auto' + (e.crit ? ' crit' : ''), dx, dy, fmt(e.dmg), 700);
            if (!e.crit) d.style.color = u.color;
          }
        }
        restartAnim('hit');
      } else if (e.type === 'kill') {
        restartAnim('dead');
        fx('dmg gold', r.width / 2, r.height * 0.35, '+' + fmt(e.gold) + ' ◆', 700);
        if (e.boss) save();
      } else if (e.type === 'tickets') {
        setTimeout(() => toast('Билеты портала<small>+' + e.n + ' 🎟</small>'), 1700);
      } else if (e.type === 'firstClear') {
        toast('Этаж ' + e.floor + ' пройден впервые!<small>+' + fmt(e.gold) + ' ◆</small>');
      } else if (e.type === 'bossFail') {
        toast('Время вышло!<small style="color:var(--muted)">Усились и вызови босса снова</small>');
        save();
      } else if (e.type === 'ability') {
        const b = $('ultBanner');
        b.textContent = 'Призванный · ' + e.name + '!';
        b.style.color = 'var(--gold)';
        b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
        heroEl.classList.remove('attack'); void heroEl.offsetWidth; heroEl.classList.add('attack');
        renderAbilities();
      } else if (e.type === 'ult') {
        const u = allyUi[e.id];
        u.sprite.classList.remove('ulting'); void u.sprite.offsetWidth; u.sprite.classList.add('ulting');
        const b = $('ultBanner');
        b.textContent = CFG.allies.find(a => a.id === e.id).name + ' · ' + e.name + '!';
        b.style.color = u.color;
        b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
      } else if (e.type === 'spawn') {
        restartAnim('spawn');
      }
    }
  }

  // ---------- ввод ----------
  el.arena.addEventListener('pointerdown', e => {
    if (e.target.closest('#farmBar')) return;
    e.preventDefault();
    const r = el.arena.getBoundingClientRect();
    const ev = C.tap(s);
    if (!ev.length) return;
    if (!tapped) { tapped = true; }
    if (navigator.vibrate) navigator.vibrate(8);
    handle(ev, e.clientX - r.left, e.clientY - r.top);
    render();
  });
  el.bossBtn.addEventListener('click', () => { handle(C.challengeBoss(s)); render(); });
  el.prev.addEventListener('click', () => { handle(C.goToFloor(s, s.floor - 1)); render(); save(); });
  el.next.addEventListener('click', () => { handle(C.goToFloor(s, s.floor + 1)); render(); save(); });
  document.querySelectorAll('.multBtn').forEach(b => b.addEventListener('click', () => {
    mult = b.dataset.n === 'max' ? 'max' : +b.dataset.n;
    document.querySelectorAll('.multBtn').forEach(x => x.classList.toggle('on', x === b));
    render();
  }));
  el.buyTap.addEventListener('click', () => { if (C.buyTap(s, mult)) { save(); render(); } });
  $('stats').addEventListener('click', () => el.statsMore.classList.toggle('show'));
  $('settingsBtn').addEventListener('click', () => {
    el.saveInfo.textContent = 'Прогресс сохраняется автоматически на этом устройстве. Лучший этаж: ' +
      (s.maxFloor) + '. Тапов: ' + fmt(s.stats.taps) + ', побеждено врагов: ' + fmt(s.stats.kills) + '.';
    el.modal.classList.add('show');
  });
  $('closeModal').addEventListener('click', () => el.modal.classList.remove('show'));
  // ---------- окно подтверждения ----------
  let askYesFn = null;
  function ask(text, yesLabel, onYes) {
    $('askText').innerHTML = text;
    $('askYes').textContent = yesLabel || 'Да';
    askYesFn = onYes;
    $('ask').classList.add('show');
  }
  $('askNo').addEventListener('click', () => { $('ask').classList.remove('show'); askYesFn = null; });
  $('askYes').addEventListener('click', () => { $('ask').classList.remove('show'); const f = askYesFn; askYesFn = null; if (f) f(); });

  $('resetBtn').addEventListener('click', () => {
    ask('Сбросить весь прогресс? Это нельзя отменить.', 'Сбросить', () => {
      try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
      s = C.newState(); tapped = false; dmgLog.length = 0;
      el.modal.classList.remove('show'); restartAnim('spawn'); render();
    });
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
  window.addEventListener('pagehide', save);
  document.addEventListener('contextmenu', e => e.preventDefault());

  // ---------- отрисовка ----------
  function render() {
    const en = s.enemy;
    el.floorLabel.textContent = 'Этаж ' + s.floor;
    el.prev.disabled = s.floor <= 1;
    el.next.disabled = s.floor >= s.maxFloor;
    [...el.dots.children].forEach((d, i) => {
      const idx = i + 1;
      d.classList.toggle('done', idx < s.enemyIndex);
      d.classList.toggle('cur', idx === s.enemyIndex);
    });
    el.enemyName.textContent = en.isBoss ? 'БОСС · ' + en.name : en.name;
    el.enemyName.classList.toggle('boss', en.isBoss);
    el.enemy.classList.toggle('boss', en.isBoss);
    el.enemy.style.filter = en.isBoss ? 'hue-rotate(130deg) saturate(1.3)' : 'hue-rotate(' + ((s.floor * 37 + s.enemyIndex * 11) % 360) + 'deg)';
    el.hpFill.style.width = (en.hp / en.maxHp * 100) + '%';
    el.hpText.textContent = fmt(en.hp) + ' / ' + fmt(en.maxHp);
    el.timerBar.classList.toggle('show', en.isBoss);
    el.farmBar.classList.toggle('show', s.farming);
    el.hint.style.display = tapped ? 'none' : '';
    el.tapDmg.textContent = fmt(C.tapDamage(s));
    el.gold.textContent = fmt(s.gold);
    el.tapLvl.textContent = fmt(s.tapLevel);

    const n = mult === 'max' ? Math.max(1, C.maxAffordable(s.tapLevel, s.gold)) : mult;
    const cost = C.upgradeCost(s.tapLevel, n);
    const can = cost <= s.gold;
    el.tapSub.innerHTML = 'Урон ' + fmt(C.tapDamage(s)) + ' → <b>' + fmt(C.tapDamageAt(s.tapLevel + n)) + '</b>' + msHint(s.tapLevel);
    anyAffordable = false;
    renderTabs();
    setBuy(el.buyTap, can, n, cost, '+' + fmt(n) + ' ур.');

    // союзник
    for (const a of CFG.allies) {
      const u = allyUi[a.id], lv = s.allies[a.id].level;
      const an = mult === 'max' ? Math.max(1, C.allyMax(s, a.id)) : mult;
      const acost = C.allyCost(s, a.id, an);
      u.sub.innerHTML = lv ? 'DPS ' + fmt(C.allyDps(s, a.id)) + ' → <b>' + fmt(C.allyDpsAt(a.id, lv + an)) + '</b>' + msHint(lv)
                           : '<span class="dim">' + a.role + ' · удар раз в ' + a.attackInterval + ' с</span> DPS <b>' + fmt(C.allyDpsAt(a.id, an)) + '</b>';
      setBuy(u.btn, acost <= s.gold, an, acost, lv ? '+' + fmt(an) + ' ур.' : 'Нанять' + (an > 1 ? ' +' + fmt(an - 1) : ''));
      const unlocked = s.heroes[a.id].unlocked, sq = s.squad.indexOf(a.id);
      u.card.style.display = unlocked ? '' : 'none';
      u.card.style.order = sq >= 0 ? sq : 10 + CFG.allies.indexOf(a);
      u.title.innerHTML = '<span class="rar r-' + a.rarity + '">' + a.rarity + '</span> ' + a.name + ' · ' + (lv ? 'ур. ' + fmt(lv) : a.role) +
        (sq >= 0 ? '<span class="badge sq">отряд</span>' : '<span class="badge rs">резерв</span>');
      // фигура на арене — только у героя в отряде и нанятого
      const slot = SLOTS[sq];
      u.sprite.classList.toggle('on', sq >= 0 && lv > 0);
      if (slot) {
        u.sprite.className = 'ally ' + slot.side + (slot.back ? ' back' : '') + (sq >= 0 && lv > 0 ? ' on' : '');
        u.sprite.style.cssText = slot.pos;
      }
    }
    $('canBuy').classList.toggle('on', anyAffordable);
  }

  // Подсказка о следующей вехе уровня
  function msHint(level) {
    return '<span class="ms"> · ×' + CFG.milestoneMult + ' на ' + fmt(C.nextMilestone(level)) + '</span>';
  }

  function setBuy(btn, can, n, cost, label) {
    btn.disabled = !can;
    if (can) anyAffordable = true;
    btn.innerHTML = can ? label + '<span>◆ ' + fmt(cost) + '</span>'
                              : 'Не хватает<span>◆ ' + fmt(cost - s.gold) + '</span>';
  }

  const BUFF_UI = [
    { key: 'team', kind: 'teamBuff', color: '#ff8a6b' },
    { key: 'tap', kind: 'tapBuff', color: '#c8b8ff' },
  ];
  let lastBuffHtml = '';
  function renderUlts() {
    for (const a of CFG.allies) {
      const u = allyUi[a.id], st = s.allies[a.id];
      const p = st.level > 0 ? st.ult / a.ult.charge : 0;
      u.ultFill.style.width = (p * 100) + '%';
      u.ultBar.classList.toggle('ready', p >= 1);
    }
    const parts = [];
    for (const b of BUFF_UI) {
      const left = s.buffs[b.key];
      if (left > 0) parts.push('<span class="buff" style="color:' + b.color + '">' + CFG.allies.find(a => a.ult.kind === b.kind).ult.name + ' ' + Math.ceil(left) + 'с</span>');
    }
    if (s.enemy.mark > 0) parts.push('<span class="buff" style="color:#ffb36b">Метка ' + Math.ceil(s.enemy.mark) + 'с</span>');
    const html = parts.join('');
    if (html !== lastBuffHtml) { $('buffs').innerHTML = html; lastBuffHtml = html; }
    el.arena.classList.toggle('fury', s.buffs.team > 0);
    el.enemy.classList.toggle('marked', s.enemy.mark > 0 && s.enemy.alive);
    heroEl.classList.toggle('empowered', s.buffs.tap > 0);
  }

  // ---------- вкладки: коллекция героев и портал ----------
  let tab = 'up';
  let lastPull = [], pullShown = null, heroesHtml = '';
  const RANKS = CFG.rarities;
  function renderTabs() {
    $('panel').dataset.tab = tab;
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
    $('ticketDot').classList.toggle('on', s.tickets > 0);
    if (tab === 'heroes') renderHeroes();
    if (tab === 'portal') renderPortal();
    if (tab === 'altar') renderAltar();
  }
  function renderHeroes() {
    const list = CFG.allies.slice().sort((a, b) => {
      const ua = s.heroes[a.id].unlocked, ub = s.heroes[b.id].unlocked;
      if (ua !== ub) return ua ? -1 : 1;
      return RANKS.indexOf(b.rarity) - RANKS.indexOf(a.rarity);
    });
    let html = '<div class="hint2">Отряд ' + s.squad.length + '/' + CFG.squadSize + ' — на арене, у них работают ультимейты. ' +
      'Нанятые вне отряда тоже бьют в полную силу. Звёзды — за дубликаты из портала.</div>';
    for (const a of list) {
      const h = s.heroes[a.id], v = ALLY_VIS[a.id];
      if (!h.unlocked) {
        html += '<div class="hRow locked r-' + a.rarity + '"><div class="hIcon" style="background:#1a1420">?</div><div class="hInfo">' +
          '<div class="hName"><span class="rar r-' + a.rarity + '">' + a.rarity + '</span> ???</div><div class="hSub">' + (a.hidden ? 'Скрытый рецепт Алтаря' : 'Откройте в портале') + '</div></div></div>';
        continue;
      }
      const sq = C.inSquad(s, a.id), need = C.starCost(s, a.id);
      const stars = '★ ' + h.stars + '/' + CFG.maxStars;
      html += '<div class="hRow r-' + a.rarity + '"><div class="hIcon" style="background:' + v.iconBg + '">' + v.icon + '</div>' +
        '<div class="hInfo"><div class="hName"><span class="rar r-' + a.rarity + '">' + a.rarity + '</span> ' + a.name +
        (sq ? '<span class="badge sq">отряд</span>' : '') + '</div>' +
        '<div class="hSub"><span class="stars">' + stars + '</span> · копий ' + h.copies + ' · ' + a.ult.name + '</div></div>' +
        (need == null ? '<button class="hBtn" disabled>★ max</button>'
                      : '<button class="hBtn' + (h.copies >= need ? ' go' : '') + '" data-star="' + a.id + '"' + (h.copies >= need ? '' : ' disabled') + '>★ за ' + need + '</button>') +
        (sq ? '<button class="hBtn" data-out="' + a.id + '">Убрать</button>'
            : '<button class="hBtn go" data-in="' + a.id + '"' + (s.squad.length >= CFG.squadSize ? ' disabled' : '') + '>В отряд</button>') +
        '</div>';
    }
    if (html !== heroesHtml) { $('heroesTab').innerHTML = html; heroesHtml = html; }   // без лишних перерисовок
  }
  // ---------- Алтарь ----------
  let altarSel = {}, altarHtml = '';
  function cleanSel() {
    for (const id in altarSel) {
      const max = s.locks[id] ? 0 : s.heroes[id].copies;
      altarSel[id] = Math.max(0, Math.min(altarSel[id], max));
      if (!altarSel[id]) delete altarSel[id];
    }
  }
  function renderAltar() {
    cleanSel();
    const A = CFG.altar;
    const total = Object.values(altarSel).reduce((a, b) => a + b, 0);
    const value = total ? C.sacrificeValue(altarSel) : 0;
    let html = '<div class="altHead"><div class="ess">✦ <b>' + fmt(s.essence) + '</b> эссенции</div><div class="altBtns">' +
      '<button class="hBtn go" data-act="all">Выбрать всё</button><button class="hBtn" data-act="none">Сброс</button></div></div>' +
      '<div class="hint2">Пожертвованные копии исчезают навсегда. 🔒 защищает копии героя от выбора.</div>';
    const list = CFG.allies.filter(a => s.heroes[a.id].unlocked)
      .sort((a, b) => RANKS.indexOf(b.rarity) - RANKS.indexOf(a.rarity));
    for (const a of list) {
      const h = s.heroes[a.id], v = ALLY_VIS[a.id], n = altarSel[a.id] || 0, locked = !!s.locks[a.id];
      html += '<div class="hRow r-' + a.rarity + '"><div class="hIcon" style="background:' + v.iconBg + '">' + v.icon + '</div>' +
        '<div class="hInfo"><div class="hName"><span class="rar r-' + a.rarity + '">' + a.rarity + '</span> ' + a.name + '</div>' +
        '<div class="hSub">копий ' + h.copies + ' · ✦' + A.essence[a.rarity] + ' за копию</div></div>' +
        '<button class="lockBtn' + (locked ? ' on' : '') + '" data-lock="' + a.id + '">' + (locked ? '🔒' : '🔓') + '</button>' +
        '<div class="step"><button data-minus="' + a.id + '"' + (n ? '' : ' disabled') + '>−</button><span>' + n + '</span>' +
        '<button data-plus="' + a.id + '"' + (!locked && n < h.copies ? '' : ' disabled') + '>+</button></div></div>';
    }
    html += '<button class="sacBtn" data-act="sac"' + (total ? '' : ' disabled') + '>' +
      (total ? 'Пожертвовать ' + total + ' коп. → +' + fmt(value) + ' ✦' : 'Выберите копии для жертвы') + '</button>';
    html += '<div class="secTitle">РЕЦЕПТЫ</div>';
    html += '<div class="recipe"><div>Слеза портала<small>✦' + A.ticketCost + ' → 1 билет</small></div>' +
      '<button class="hBtn' + (s.essence >= A.ticketCost ? ' go' : '') + '" data-act="tear"' + (s.essence >= A.ticketCost ? '' : ' disabled') + '>Создать</button></div>';
    html += '<div class="recipe"><div>След героя<small>Копия выбранного открытого героя (для звёзд). Цена по редкости: ' +
      RANKS.map(r => r + ' ✦' + A.traceCost[r]).join(', ') + '</small></div></div>';
    for (const a of list) {
      const c = C.traceCost(a.id);
      html += '<div class="recipe" style="border-style:solid"><div><span class="rar r-' + a.rarity + '">' + a.rarity + '</span> ' + a.name + '</div>' +
        '<button class="hBtn' + (s.essence >= c ? ' go' : '') + '" data-trace="' + a.id + '"' + (s.essence >= c ? '' : ' disabled') + '>+1 копия ✦' + fmt(c) + '</button></div>';
    }
    for (const h of CFG.allies.filter(a => a.hidden)) {
      html += s.discovered[h.id]
        ? '<div class="recipe" style="border-color:var(--gold)"><div>' + ALLY_VIS[h.id].icon + ' ' + h.name + ' — скрытый рецепт<small>Пожертвовать за раз по копии: ' +
          h.recipe.map(id => CFG.allies.find(a => a.id === id).name).join(', ') + '</small></div></div>'
        : '<div class="recipe"><div>??? — скрытый рецепт<small>Говорят, Алтарь откликается, если отдать ему весь первый отряд разом…</small></div></div>';
    }
    if (html !== altarHtml) { $('altarTab').innerHTML = html; altarHtml = html; }
  }
  $('altarTab').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || b.disabled) return;
    const d = b.dataset;
    if (d.plus) altarSel[d.plus] = (altarSel[d.plus] || 0) + 1;
    else if (d.minus) altarSel[d.minus] = (altarSel[d.minus] || 0) - 1;
    else if (d.lock) { C.setLock(s, d.lock, !s.locks[d.lock]); save(); }
    else if (d.act === 'all') {
      altarSel = C.selectAllUnlocked(s);
      if (!Object.keys(altarSel).length) toast('Нечего выбрать<small style="color:var(--muted)">Нет копий без 🔒 — их дают повторы в портале</small>');
    }
    else if (d.act === 'none') altarSel = {};
    else if (d.act === 'tear') { if (C.tearOfPortal(s, 1)) { toast('Слеза портала<small>+1 🎟</small>'); save(); } }
    else if (d.trace) { if (C.heroTrace(s, d.trace)) { toast('След героя<small>+1 копия · ' + CFG.allies.find(a => a.id === d.trace).name + '</small>'); save(); } }
    else if (d.act === 'sac') {
      cleanSel();
      const total = Object.values(altarSel).reduce((a, x) => a + x, 0);
      if (!total) return;
      const doSacrifice = () => {
        const r = C.sacrifice(s, altarSel);
        if (r) {
          altarSel = {};
          const f = r.found[0];
          if (f) toast((f.isNew ? 'Скрытое открытие!' : 'Скрытый рецепт') + '<small>' + CFG.allies.find(a => a.id === f.id).name + (f.isNew ? ' присоединилась' : ' +' + f.sets + ' коп.') + ' · +' + fmt(r.essence) + ' ✦</small>');
          else toast('Алтарь принял жертву<small>+' + fmt(r.essence) + ' ✦</small>');
          save();
        }
        render();
      };
      const value = C.sacrificeValue(altarSel);
      ask('Пожертвовать <b>' + total + '</b> коп. за <b>' + fmt(value) + ' ✦</b>?<br><span style="color:var(--muted)">Копии исчезнут навсегда.</span>', 'Пожертвовать', () => {
        if (C.needsRareConfirm(altarSel))
          ask('Среди них есть <b>редкие герои</b> (A, S или GOD). Точно пожертвовать?', 'Да, точно', doSacrifice);
        else doSacrifice();
      });
    }
    render();
  });

  function renderPortal() {
    const P = CFG.portal;
    $('ticketCount').textContent = fmt(s.tickets);
    $('pityInfo').textContent = 'A+ гарантия через ' + (P.pityA - s.pity.a) + ' · S+ через ' + (P.pityS - s.pity.s);
    $('pull1').disabled = s.tickets < 1;
    $('pull10').disabled = s.tickets < 10;
    const total = Object.values(P.odds).reduce((a, b) => a + b, 0);
    $('oddsInfo').innerHTML = 'Шансы: ' + RANKS.map(r => '<span class="rar r-' + r + '">' + r + '</span> ' + (P.odds[r] / total * 100).toFixed(1) + '%').join(' ') +
      '<br>Билеты: за первое прохождение босса каждого 5-го этажа, на 10-м — больше.';
    if (pullShown === lastPull) return;
    pullShown = lastPull;
    $('pullResults').innerHTML = lastPull.map((x, i) => {
      const a = CFG.allies.find(h => h.id === x.id), v = ALLY_VIS[x.id];
      return '<div class="res r-' + x.rarity + '" style="animation-delay:' + (i * 0.05) + 's"><div class="ri">' + v.icon + '</div><div class="rn">' + a.name +
        '</div><div>' + (x.isNew ? '<span class="new">НОВЫЙ</span>' : '+1 копия') + '</div></div>';
    }).join('');
  }
  document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => { tab = b.dataset.tab; render(); }));
  $('heroesTab').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    let ok = false;
    if (b.dataset.star) ok = C.starUp(s, b.dataset.star);
    if (b.dataset.in) ok = C.squadAdd(s, b.dataset.in);
    if (b.dataset.out) ok = C.squadRemove(s, b.dataset.out);
    if (ok) { save(); render(); }
  });
  function pull(n) {
    const r = C.summon(s, n);
    if (!r) return;
    lastPull = r; save(); render();
    const best = r.reduce((m, x) => RANKS.indexOf(x.rarity) > RANKS.indexOf(m.rarity) ? x : m, r[0]);
    if (RANKS.indexOf(best.rarity) >= RANKS.indexOf('A')) toast('Редкий герой!<small>' + best.rarity + ' · ' + CFG.allies.find(a => a.id === best.id).name + '</small>');
  }
  $('pull1').addEventListener('click', () => pull(1));
  $('pull10').addEventListener('click', () => pull(10));


  // ---------- способности главного героя ----------
  const ABIL_ICON = { flurry: '⚔', hunt: '🎯' };
  const abilUi = {};
  function buildAbilities() {
    const bar = $('abilityBar');
    for (const a of CFG.abilities) {
      const w = document.createElement('div');
      w.className = 'abil';
      w.innerHTML = '<button class="abilUse"><div class="abilCd"></div><span class="abilIcon">' + ABIL_ICON[a.id] + '</span>' +
        '<div class="abilText"><div class="abilName">' + a.name + '</div><div class="abilState"></div></div></button>' +
        '<button class="abilAuto" aria-label="Автоиспользование">АВТО</button>';
      bar.appendChild(w);
      const use = w.querySelector('.abilUse'), auto = w.querySelector('.abilAuto');
      use.addEventListener('click', () => { const ev = C.useAbility(s, a.id); if (ev.length) { handle(ev); save(); } });
      auto.addEventListener('click', () => { C.setAbilityAuto(s, a.id, !s.abilities[a.id].auto); save(); renderAbilities(); });
      abilUi[a.id] = { w, state: w.querySelector('.abilState'), cd: w.querySelector('.abilCd'), auto };
    }
  }
  function renderAbilities() {
    for (const a of CFG.abilities) {
      const u = abilUi[a.id], st = s.abilities[a.id];
      const unlocked = C.abilityUnlocked(s, a.id);
      u.w.classList.toggle('locked', !unlocked);
      u.w.classList.toggle('active', st.active > 0);
      u.w.classList.toggle('ready', unlocked && st.cd <= 0 && st.active <= 0);
      u.auto.classList.toggle('on', st.auto);
      u.auto.style.visibility = unlocked ? '' : 'hidden';
      u.state.textContent = !unlocked ? 'с этажа ' + a.unlockFloor
        : st.active > 0 ? 'действует ' + Math.ceil(st.active) + 'с'
        : st.cd > 0 ? 'через ' + Math.ceil(st.cd) + 'с' : 'готово';
      u.cd.style.width = (unlocked && st.active <= 0 && st.cd > 0 ? st.cd / a.cooldown * 100 : 0) + '%';
    }
  }

  function renderLive() {
    renderAbilities();
    renderUlts();
    if (s.enemy.isBoss) {
      const p = Math.max(0, s.bossTimeLeft / CFG.bossTimeSec);
      el.timerFill.style.width = (p * 100) + '%';
      el.timerFill.classList.toggle('low', s.bossTimeLeft < 5);
    }
    const now = performance.now();
    while (dmgLog.length && now - dmgLog[0][0] > DPS_WINDOW * 1000) dmgLog.shift();
    let tapSum = 0, allSum = 0;
    for (const d of dmgLog) { allSum += d[1]; if (d[2] === 'tap') tapSum += d[1]; }
    const tapDps = tapSum / DPS_WINDOW, auto = C.autoDps(s);
    el.dps.textContent = fmt(tapDps + auto);                       // общий DPS
    if (el.statsMore.classList.contains('show'))
      el.statsMore.textContent = 'Тап ' + fmt(tapDps) + '/с · Авто ' + fmt(auto) + '/с · Реальный средний ' + fmt(allSum / DPS_WINDOW) + '/с · Крит ' + Math.round(C.critChance(s) * 100) + '% ×' + C.critMult(s).toFixed(1);
  }

  // ---------- игровой цикл ----------
  let acc = 0, last = performance.now();
  function loop(now) {
    acc += Math.min(0.25, (now - last) / 1000); last = now;
    let changed = false;
    while (acc >= STEP) {
      const ev = C.tick(s, STEP); acc -= STEP;
      if (ev.length) { handle(ev); changed = true; }
    }
    if (changed) render();
    renderLive();
    if (Date.now() - lastSave > 5000) save();
    requestAnimationFrame(loop);
  }
  buildAllies();
  buildAbilities();
  render();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
