name: Сборка APK
# APK собирается ТОЛЬКО по команде (решение автора 03.11.2026): вкладка Actions → «Сборка APK» → Run workflow.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Тесты ядра и сборка игры
        run: |
          cd work
          node --test tests/*.test.js
          node build.js
          mkdir -p ../android/app/src/main/assets
          cp dist/index.html ../android/app/src/main/assets/index.html
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.7' }
      - name: Сборка APK
        run: gradle -p android assembleRelease --no-daemon
      - name: Имя файла с версией
        run: |
          V=$(node -p "require('./work/version.json').version")
          cp android/app/build/outputs/apk/release/app-release.apk "Prizvannyy-$V.apk"
          echo "V=$V" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with: { name: 'Prizvannyy-${{ env.V }}-apk', path: 'Prizvannyy-*.apk' }
      - name: Выпуск на странице Releases (скачать APK прямо на телефон)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.V }}
          name: Призванный ${{ env.V }}
          body: APK для Android. Ставится поверх прошлой версии без потери прогресса (один ключ подписи).
          files: Prizvannyy-*.apk
          make_latest: true
