name: Сборка APK
# APK собирается ТОЛЬКО по команде (решение автора 03.11.2026): вкладка Actions → «Сборка APK» → Run workflow.
# 0.94: ключ подписи — только из секретов репозитория (Settings → Secrets and variables → Actions):
#   PZ_KEYSTORE_BASE64   — файл .jks в base64
#   PZ_KEYSTORE_PASSWORD — пароль хранилища
#   PZ_KEY_PASSWORD      — пароль ключа
#   PZ_KEY_ALIAS         — (необязательно) имя ключа, по умолчанию prizvannyy
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Проверка секретов подписи
        env:
          KS: ${{ secrets.PZ_KEYSTORE_BASE64 }}
          P1: ${{ secrets.PZ_KEYSTORE_PASSWORD }}
          P2: ${{ secrets.PZ_KEY_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$P1" ] || [ -z "$P2" ]; then
            echo "::error::Нет секретов подписи (PZ_KEYSTORE_BASE64 / PZ_KEYSTORE_PASSWORD / PZ_KEY_PASSWORD). См. ANDROID.md"; exit 1; fi
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Тесты ядра и сборка игры
        run: |
          npm test
          npm run build
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.7' }
      - name: Ключ из секрета (только во временной папке раннера)
        env:
          KS: ${{ secrets.PZ_KEYSTORE_BASE64 }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "PZ_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV
      - name: Сборка APK
        env:
          PZ_KEYSTORE_PASSWORD: ${{ secrets.PZ_KEYSTORE_PASSWORD }}
          PZ_KEY_PASSWORD: ${{ secrets.PZ_KEY_PASSWORD }}
          PZ_KEY_ALIAS: ${{ secrets.PZ_KEY_ALIAS }}
        run: gradle -p android assembleRelease --no-daemon
      - name: Удалить ключ с раннера
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - name: Имя файла с версией
        run: |
          V=$(node -p "require('./package.json').version")
          test -f android/app/build/outputs/apk/release/app-release.apk || { echo "::error::APK не подписан"; exit 1; }
          cp android/app/build/outputs/apk/release/app-release.apk "Prizvannyy-$V.apk"
          echo "V=$V" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with: { name: 'Prizvannyy-${{ env.V }}-apk', path: 'Prizvannyy-*.apk' }
      - name: Выпуск на странице Releases (скачать APK прямо на телефон)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.V }}
          name: Призванный ${{ env.V }}
          body: APK для Android. Ставится поверх прошлой версии без потери прогресса (один ключ подписи).
          files: Prizvannyy-*.apk
          make_latest: true
