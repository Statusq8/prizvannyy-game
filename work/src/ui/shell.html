<div id="app">
  <div id="topbar">
    <div class="res gold"><img id="ico-gold" alt=""><span id="gold">0</span></div>
    <div class="res scr"><img id="ico-scr" alt=""><span id="scrolls">0</span></div>
    <div class="spacer"></div>
    <div class="rec">Рекорд <b id="record">0</b><br><span id="zone"></span></div>
  </div>
  <div id="screens">
    <section class="screen on" id="scr-battle">
      <div id="scene">
        <div class="bg" id="bg"></div><div class="fog"></div>
        <div class="unit" id="enemy"><img class="spr" alt=""></div>
        <div class="slot" data-slot="1"></div><div class="slot" data-slot="2"></div>
        <div class="unit" id="main"><img class="spr" alt=""></div>
        <div class="slot" data-slot="3"></div><div class="slot" data-slot="4"></div>
        <div class="vign"></div>
        <div id="hud-top">
          <div class="floorline"><span id="floorlbl">ЭТАЖ 1</span><span class="tag" id="floortag" hidden></span></div>
          <div class="enemyname" id="enemyname"></div>
          <div class="hpwrap"><div class="hpbar"><b id="hplag"></b><i id="hpfill"></i></div><img id="hpframe" alt=""></div>
          <div class="hptext" id="hptext"></div>
          <div class="waves" id="waves"></div>
          <div class="timer" id="timer" hidden></div>
        </div>
        <div id="hud-left">
          <div class="dpsbox">Урон/с<b id="dps">0</b></div>
          <div class="dpsbox">Тап<b id="tapdmg">0</b></div>
        </div>
        <div id="hud-side">
          <button class="sidebtn" id="btn-speed"><img id="ico-speed" alt="">×1</button>
          <button class="sidebtn" id="btn-auto"><img id="ico-auto" alt="">АВТО</button>
          <button class="sidebtn" id="btn-up"><img id="ico-up" alt="">УСИЛ.<span class="dot" id="up-dot" hidden></span></button>
        </div>
        <div id="drawer"><button id="drawer-handle">▼ Свернуть</button><div id="quick"></div></div>
      </div>
    </section>
    <section class="screen" id="scr-tower"></section>
    <section class="screen" id="scr-heroes"></section>
    <section class="screen" id="scr-summon"></section>
    <section class="screen" id="scr-more"></section>
  </div>
  <nav id="nav">
    <button data-s="battle" class="on"><img id="nav-battle" alt="">Бой</button>
    <button data-s="tower"><img id="nav-tower" alt="">Башня</button>
    <button data-s="heroes"><img id="nav-heroes" alt="">Герои<span class="badge" id="badge-heroes" hidden></span></button>
    <button data-s="summon"><img id="nav-summon" alt="">Призыв</button>
    <button data-s="more"><img id="nav-more" alt="">Ещё<span class="badge" id="badge-more" hidden>!</span></button>
  </nav>
  <div id="modal"><div class="sheet"><div class="shead"><h2 id="mtitle"></h2><button id="mclose"><img id="ico-close" alt="Закрыть"></button></div><div id="mtabs"></div><div class="sbody" id="mbody"></div></div></div>
</div>
