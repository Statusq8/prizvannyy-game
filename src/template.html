<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d0a12">
<title>Призванный: Башня Гачи</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ruslan+Display&family=Rubik+Dirt&family=Russo+One&display=swap&subset=cyrillic" rel="stylesheet">
<style>
  :root {
    --bg1: #0d0a12; --bg2: #1e1329; --panel: #170f20; --panel2: #23172f;
    --text: #efe6f5; --muted: #9a8aa8; --line: #3a2a4a;
    --hp: #c23a4a; --hp-dark: #5a1820;
    --accent: #b98cff; --gold: #ffd36b; --boss: #ff6b4a; --ok: #6be3a0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%; background: var(--bg1); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden; touch-action: manipulation; user-select: none; -webkit-user-select: none;
  }
  button { font: inherit; color: inherit; border: none; background: none; cursor: pointer; }
  #game {
    position: relative; height: 100%; height: 100dvh; max-width: calc(100dvh * 9 / 16); margin: 0 auto;
    background: radial-gradient(ellipse at 50% 45%, var(--bg2) 0%, var(--bg1) 70%);
    display: flex; flex-direction: column; overflow: hidden; isolation: isolate;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  /* фон этажа: зал Башни (одна картинка, оттенок по биому) */
  #bgHall { position: absolute; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
  #bgHall .img { position: absolute; inset: 0; background: url("__BG_HALL__") center 62% / cover no-repeat;
    filter: hue-rotate(var(--bh, 0deg)) saturate(var(--bs, 1)) brightness(var(--bb, 1));
    transform: translateX(var(--hx, 0%)) scale(var(--hz, 1)) scaleX(var(--hf, 1)); transform-origin: 50% 62%;
    transition: filter .8s, transform .8s; }
  /* затемнение сверху (HUD) и снизу (панель), чтобы текст читался */
  #bgHall::after { content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, #0d0a12f0 0%, #0d0a12a0 18%, #0d0a1230 38%, #0d0a1210 60%, #0d0a1280 80%, #0d0a12f0 100%); }

  /* ---------- верхний HUD ---------- */
  #hud { padding: 10px 16px 6px; text-align: center; position: relative; z-index: 2; }
  #floorRow { display: flex; align-items: center; justify-content: center; gap: 10px; }
  .navBtn {
    width: 34px; height: 34px; border-radius: 10px; font-size: 18px;
    background: var(--panel2); border: 1px solid var(--line);
  }
  .navBtn:disabled { opacity: .25; }
  #floorLabel { font-size: 17px; font-weight: 800; min-width: 100px; }
  #settingsBtn { position: absolute; right: 12px; top: 10px; font-size: 18px; opacity: .6; width: 34px; height: 34px; }
  #biomeLabel { font-size: 11px; font-weight: 700; letter-spacing: .6px; color: var(--muted); margin-top: 3px; text-transform: uppercase; }
  #dots { display: flex; justify-content: center; gap: 5px; margin-top: 6px; }
  .dot { width: 18px; height: 6px; border-radius: 3px; background: var(--line); }
  .dot.done { background: var(--accent); }
  .dot.cur { background: var(--text); }
  .dot.boss { width: 26px; background: #5a2a24; }
  .dot.boss.cur { background: var(--boss); }
  #enemyName { margin-top: 8px; font-size: 15px; font-weight: 700; }
  #enemyName.boss { color: var(--boss); }
  #enemyName.rare { color: var(--gold); }
  #enemyName.rare.crystal { color: #8fe6ff; }
  .phMark { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: #ffffffb0; box-shadow: 0 0 3px #000; z-index: 1; }
  .phMark.past { background: #ffffff30; }
  #enemy.rare-gold .body { filter: drop-shadow(0 0 12px #ffd36b) drop-shadow(0 0 4px #fff3b0); }
  #enemy.rare-crystal .body { filter: drop-shadow(0 0 12px #8fe6ff) drop-shadow(0 0 4px #e0faff); }
  #enemy.vuln .body { animation: vulnPulse .5s ease-in-out infinite alternate; }
  @keyframes vulnPulse { to { filter: brightness(1.6) drop-shadow(0 0 14px #ff6b4a); } }
  #hpBar {
    position: relative; margin-top: 6px; height: 18px; border-radius: 9px;
    background: var(--hp-dark); border: 1px solid #00000080; overflow: hidden;
  }
  #hpFill { height: 100%; width: 100%; background: linear-gradient(180deg, #e65566, var(--hp)); transition: width .1s ease-out; }
  #hpText { position: absolute; inset: 0; font-size: 12px; line-height: 18px; font-weight: 700; text-shadow: 0 1px 2px #000; }
  #timerBar { margin-top: 5px; height: 5px; border-radius: 3px; background: #2a1c1c; overflow: hidden; visibility: hidden; }
  #timerBar.show { visibility: visible; }
  #timerFill { height: 100%; width: 100%; background: var(--boss); }
  #timerFill.low { background: #ff3030; }
  #stats { margin-top: 6px; font-size: 12px; color: var(--muted); }
  #stats b { color: var(--text); }

  /* ---------- арена ---------- */
  #arena { position: relative; flex: 1; display: flex; align-items: center; justify-content: center; cursor: pointer; min-height: 0; }
  #enemy {
    position: relative; z-index: 1;
    /* размер по высоте арены; враг приподнят, чтобы впереди было место главному герою */
    height: min(44%, 280px); aspect-ratio: 1 / 1.15; transform-origin: 50% 90%; margin-bottom: min(24%, 120px);
    animation: idle 2.4s ease-in-out infinite; pointer-events: none;
  }
  #enemy.boss { height: min(52%, 330px); }
  #enemy svg { width: 100%; height: 100%; overflow: visible; }
  #enemy .crown { display: none; }
  #enemy.boss .crown { display: inline; }
  #enemy.hit { animation: hit .14s ease-out; }
  #enemy.hit .body { filter: brightness(2.2) saturate(.4); }
  /* hit-stop (0.35): на долю секунды замирают враг, герой, союзники и питомец — только картинка, бой и урон не останавливаются */
  #game.hs #enemy, #game.hs #enemy *, #game.hs #hero, #game.hs #hero *, #game.hs .ally, #game.hs .ally *, #game.hs #pet, #game.hs #pet * { animation-play-state: paused !important; transition: none !important; }
  #game.hs #enemy .body { filter: brightness(2.6) saturate(.3); }
  #enemy.dead { animation: death .35s ease-in forwards; }
  #enemy.spawn { animation: spawn .25s ease-out; }
  @keyframes idle { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-6px) scale(1.01,.99); } }
  @keyframes hit { 0% { transform: none; } 30% { transform: translate(-6px,2px) scale(.94,1.04); } 60% { transform: translate(5px,-1px) scale(1.03,.97); } 100% { transform: none; } }
  @keyframes death { 30% { transform: scale(1.08,.9); filter: brightness(2.5); } 100% { transform: scale(.6,.1) translateY(40px); opacity: 0; filter: brightness(3); } }
  @keyframes spawn { from { transform: scale(.7) translateY(20px); opacity: 0; } }

  .dmg {
    position: absolute; font-weight: 800; font-size: 24px; color: #fff; pointer-events: none;
    text-shadow: 0 2px 0 #000, 0 0 8px var(--accent); animation: float .7s ease-out forwards;
    transform: translate(-50%,-50%); white-space: nowrap;
  }
  .dmg.gold { color: var(--gold); font-size: 18px; text-shadow: 0 2px 0 #000; }
  @keyframes float { 0% { opacity: 0; transform: translate(-50%,-30%) scale(.6); } 15% { opacity: 1; transform: translate(-50%,-60%) scale(1.15); } 100% { opacity: 0; transform: translate(-50%,-180%) scale(1); } }
  .spark {
    position: absolute; width: 56px; height: 56px; border-radius: 50%; border: 3px solid var(--accent);
    pointer-events: none; transform: translate(-50%,-50%) scale(.2); animation: spark .3s ease-out forwards;
  }
  @keyframes spark { to { transform: translate(-50%,-50%) scale(1.3); opacity: 0; } }
  #hint { position: absolute; bottom: 10px; left: 0; right: 0; text-align: center; font-size: 13px; color: var(--muted); pointer-events: none; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }

  #farmBar {
    position: absolute; top: 8px; left: 16px; right: 16px; display: none;
    align-items: center; justify-content: space-between; gap: 8px;
    padding: 8px 10px 8px 14px; border-radius: 12px; background: #2a1720e6; border: 1px solid #5a2a34;
    font-size: 13px; z-index: 3;
  }
  #farmBar.show { display: flex; }
  #modeBar { position: absolute; top: 8px; left: 16px; right: 16px; display: none; align-items: center; justify-content: space-between; gap: 8px;
    padding: 8px 10px 8px 14px; border-radius: 12px; background: #1a2030e6; border: 1px solid #3a4a6a; font-size: 13px; z-index: 3; }
  #modeBar.show { display: flex; }
  #leaveBtn { padding: 8px 12px; border-radius: 9px; font-weight: 700; background: var(--panel2); border: 1px solid var(--line); }
  #questDot { display: none; width: 7px; height: 7px; border-radius: 50%; background: var(--gold); vertical-align: middle; }
  #questDot.on { display: inline-block; }
  .qBar { height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; margin-top: 4px; }
  .qBar i { display: block; height: 100%; background: var(--accent); }
  .qBar.done i { background: var(--ok); }
  .hRow.claimed { opacity: .45; }
  .claimAll { width: 100%; margin-bottom: 6px; padding: 10px; border-radius: 10px; font-weight: 800; background: linear-gradient(180deg, #3a8a5a, #1f5a36); border: 1px solid var(--ok); }
  #seasonTab .altBtns { flex-wrap: wrap; } #seasonTab .altBtns .hBtn { flex: 1; white-space: normal; }
  #panel .tabBody { overflow-x: hidden; }
  .seasonHead { padding: 10px 12px; border-radius: 12px; margin-bottom: 6px; background: linear-gradient(135deg, #4a1f3a, #1f1430); border: 1px solid #b98cff66; }
  .seasonHead b { font-size: 15px; } .seasonHead small { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; }
  .passBar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; margin: 6px 0 2px; }
  .passBar i { display: block; height: 100%; background: linear-gradient(90deg, #b98cff, #ffd36b); }
  .passRow { display: grid; grid-template-columns: 44px 1fr 1fr; gap: 5px; align-items: stretch; }
  .passRow + .passRow { margin-top: 5px; }
  .passLv { display: grid; place-items: center; border-radius: 9px; background: var(--panel2); font-weight: 800; font-size: 12px; border: 1px solid var(--line); }
  .passLv.got { border-color: var(--gold); color: var(--gold); }
  .passCell { min-width: 0; padding: 6px; border-radius: 9px; font-size: 10px; text-align: left; background: var(--panel2); border: 1px solid var(--line); white-space: normal; line-height: 1.35; }
  .passCell.paid { background: #2a1f14; border-color: #6a4a24; }
  .passCell.ready { border-color: var(--ok); box-shadow: 0 0 8px #6be3a040; }
  .passCell.done { opacity: .4; }
  .passCell:disabled:not(.done) { opacity: .65; }
  .claimAll:disabled { background: #2a2234; border-color: var(--line); color: var(--muted); }
  #pveDot { display: none; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); vertical-align: middle; }
  #pveDot.on { display: inline-block; }
  .tierPick { display: flex; align-items: center; gap: 3px; }
  .tierPick button { width: 24px; height: 24px; border-radius: 7px; background: var(--panel); border: 1px solid var(--line); font-weight: 800; }
  .tierPick span { min-width: 30px; text-align: center; font-size: 11px; font-weight: 800; }
  .diffs { display: flex; gap: 4px; margin-top: 5px; flex-wrap: wrap; }
  .diffs .hBtn { flex: 1; min-width: 0; }
  #bossBtn { padding: 8px 12px; border-radius: 9px; font-weight: 700; background: var(--boss); color: #1a0a08; }

  #toast {
    position: absolute; top: 27%; left: 50%; transform: translate(-50%,-50%);
    padding: 12px 18px; border-radius: 14px; background: #1a1024f0; border: 1px solid var(--gold);
    text-align: center; font-weight: 700; pointer-events: none; opacity: 0; transition: opacity .25s; z-index: 4;
  }
  #toast.show { opacity: 1; }
  #toast small { display: block; color: var(--gold); margin-top: 4px; font-size: 14px; }

  /* ---------- нижняя панель ---------- */
  #panel { background: var(--panel); border-top: 1px solid var(--line); padding: 0 12px 10px; position: relative; z-index: 2; }
  /* ручка сворачивания панели */
  #panelToggle { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; height: 26px; font-size: 12px; color: var(--muted); }
  #panelToggle .bar { width: 36px; height: 4px; border-radius: 2px; background: var(--line); }
  #panelToggle .chev { transition: transform .2s; }
  #panel.collapsed .chev { transform: rotate(180deg); }
  #panel.collapsed #cards, #panel.collapsed #mult { display: none; }
  #panel.collapsed #goldRow { margin-bottom: 0; }
  #canBuy { display: none; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
  #panel.collapsed #canBuy.on { display: inline-block; }
  #goldRow { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  #gold { font-size: 20px; font-weight: 800; color: var(--gold); }
  #gold::before { content: "◆ "; font-size: 15px; }
  #mult { display: flex; gap: 4px; }
  .multBtn { padding: 5px 9px; border-radius: 8px; font-size: 12px; font-weight: 700; background: var(--panel2); border: 1px solid var(--line); color: var(--muted); }
  .multBtn.on { color: var(--text); border-color: var(--accent); }
  .card { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 12px; background: var(--panel2); border: 1px solid var(--line); }
  .cardIcon { width: 42px; height: 42px; border-radius: 10px; flex: none; display: grid; place-items: center; font-size: 22px; background: #3b2550; }
  .cardInfo { flex: 1; min-width: 0; }
  .cardTitle { font-weight: 700; font-size: 14px; }
  .cardSub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .cardSub b { color: var(--ok); }
  .buy {
    min-width: 104px; padding: 9px 10px; border-radius: 10px; font-weight: 800; font-size: 13px; line-height: 1.25;
    background: linear-gradient(180deg, #7a4fc4, #4b2c86); border: 1px solid var(--accent);
  }
  .buy span { display: block; font-size: 12px; font-weight: 700; color: var(--gold); }
  .buy:disabled { background: #2a2234; border-color: var(--line); color: var(--muted); }
  .buy:disabled span { color: var(--muted); }
  .buy:not(:disabled):active { transform: scale(.96); }

  /* ---------- настройки ---------- */
  .askWrap { position: absolute; inset: 0; background: #000b; display: none; align-items: center; justify-content: center; z-index: 20; padding: 20px; }
  .askWrap.show { display: flex; }
  .askBox { width: 100%; max-width: 320px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
  .askBox p { font-size: 14px; line-height: 1.45; margin-bottom: 6px; }
  .askBtns { display: flex; gap: 8px; } .askBtns .mBtn { flex: 1; }
  #modal { position: absolute; inset: 0; background: #000a; display: none; align-items: center; justify-content: center; z-index: 10; padding: 16px; }
  #modal.show { display: flex; }
  #modalBox { width: 100%; max-width: 320px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
  #modalBox h3 { margin-bottom: 10px; }
  #modalBox { max-height: 92%; overflow-y: auto; }
  .setRow { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .setRow .opts { display: flex; gap: 4px; }
  .setRow .opts button { padding: 5px 8px; border-radius: 7px; font-size: 11px; font-weight: 700; background: var(--panel2); border: 1px solid var(--line); color: var(--muted); }
  .setRow .opts button.on { color: var(--text); border-color: var(--accent); }
  body.lowq #bgHall .img { filter: none !important; transition: none; }
  body.lowq .ally .fig, body.lowq #hero .fig, body.lowq #pet .pfig { animation: none !important; }
  body.lowq .sideBtn .ico, body.lowq .abilUse { box-shadow: none !important; }
  #arena.shake { animation: shake .18s ease-out; }
  @keyframes shake { 25% { transform: translate(3px, -2px); } 50% { transform: translate(-3px, 2px); } 75% { transform: translate(2px, 1px); } }
  .res { cursor: pointer; }
  #modalBox p { font-size: 13px; color: var(--muted); margin-bottom: 14px; line-height: 1.45; }
  .mBtn { width: 100%; padding: 12px; border-radius: 10px; font-weight: 700; margin-top: 8px; background: var(--panel2); border: 1px solid var(--line); }
  .mBtn.danger { background: #4a1820; border-color: #8a2a3a; }
  .card + .card { margin-top: 8px; }
  .cardSub .dim { color: var(--muted); }
  .cardSub .ms { color: var(--gold); opacity: .8; }
  #stats { cursor: pointer; }
  #statsMore { display: none; margin-top: 3px; font-size: 11px; color: var(--muted); }
  #statsMore.show { display: block; }
  .dmg.auto { font-size: 18px; text-shadow: 0 2px 0 #000, 0 0 6px currentColor; }
  /* союзник на арене (временная заглушка) */
  #allyCards { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  #allyCards .card + .card { margin-top: 0; }
  #cards { max-height: 30dvh; overflow-y: auto; overscroll-behavior: contain; margin: 0 -4px; padding: 0 4px; }
  /* союзники на арене (временные заглушки): двое по бокам впереди, двое позади */
  /* главный герой — впереди по центру, вид со спины (временная заглушка) */
  /* питомец — впереди слева от героя (временная заглушка) */
  #pet { position: absolute; left: 27%; bottom: 10px; width: min(15%, 64px); aspect-ratio: 1; z-index: 2; pointer-events: none; display: none; }
  #pet.on { display: block; }
  #pet .pfig { width: 100%; height: 100%; display: grid; place-items: center; font-size: clamp(26px, 5dvh, 44px);
    filter: drop-shadow(0 4px 3px #000a) drop-shadow(0 0 8px #b98cff80); animation: petIdle 1.6s ease-in-out infinite; }
  #pet.attack .pfig { animation: petAtk .22s ease-out; }
  #pet .allyTag { color: #d8b8ff; bottom: -12px; }
  @keyframes petIdle { 50% { transform: translateY(-4px); } }
  @keyframes petAtk { 40% { transform: translate(18px, -14px) scale(1.15); } 100% { transform: none; } }
  #hero { position: absolute; left: 50%; bottom: 14px; height: min(34%, 150px); aspect-ratio: 1 / 1.15; transform: translateX(-50%); z-index: 2; pointer-events: none; }
  #hero .fig { width: 100%; height: 100%; animation: allyIdle 3s ease-in-out infinite; transform-origin: 50% 100%; }
  #hero.attack .fig { animation: heroAtk .18s ease-out; }
  #hero svg { width: 100%; height: 100%; overflow: visible; }
  #hero .allyTag { color: var(--gold); bottom: -13px; }
  /* эталонный герой картинками (0.36): холст 1:1, ноги на 76% высоты — сдвигаем вниз, чтобы стоял на прежнем месте */
  #hero.art { height: min(64%, 300px); aspect-ratio: 1; transform: translate(-50%, 22%); }
  #hero.art .allyTag { bottom: calc(24% - 16px); }
  #hero.art .fig { position: relative; }
  #hero .pose { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none; user-select: none; -webkit-user-drag: none; }
  #hero .pose.atk, #hero .pose.ult { visibility: hidden; }
  #hero.attack .pose.idle, #hero.casting .pose.idle, #hero.casting .pose.atk { visibility: hidden; }
  #hero.attack:not(.casting) .pose.atk { visibility: visible; }
  #hero.casting .pose.ult { visibility: visible; }
  #hero.art.attack .fig { animation: heroAtkArt .2s ease-out; }
  @keyframes heroAtkArt { 0% { transform: translateY(0); } 35% { transform: translateY(-6%) scale(1.03); } 100% { transform: translateY(0); } }
  #hero.empowered .pose { filter: drop-shadow(0 0 10px #b98cff); }
  /* эффекты из пака 1: попадание, крит, взмах */
  .spark.art { width: 92px; height: 92px; border: none; border-radius: 0; background: url("__ART_vfx_hit__") center / contain no-repeat; animation: sparkArt .26s ease-out forwards; }
  @keyframes sparkArt { 0% { transform: translate(-50%,-50%) scale(.4) rotate(0deg); opacity: 1; } 100% { transform: translate(-50%,-50%) scale(1.15) rotate(25deg); opacity: 0; } }
  .critFlash.art { width: 150px; height: 150px; border-radius: 0; background: url("__ART_vfx_crit__") center / contain no-repeat; animation: cflashArt .3s ease-out forwards; }
  @keyframes cflashArt { 0% { transform: translate(-50%,-50%) scale(.3); opacity: 1; } 60% { opacity: 1; } 100% { transform: translate(-50%,-50%) scale(1.25); opacity: 0; } }
  .slash { position: absolute; width: 170px; height: 170px; pointer-events: none; z-index: 3; background: url("__ART_vfx_slash__") center / contain no-repeat;
    transform: translate(-50%,-50%) rotate(var(--r, 0deg)) scale(.7); animation: slashArt .22s ease-out forwards; }
  @keyframes slashArt { 0% { opacity: 0; transform: translate(-50%,-50%) rotate(var(--r, 0deg)) scale(.6); } 30% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%,-50%) rotate(calc(var(--r, 0deg) + 20deg)) scale(1.05); } }
  @keyframes heroAtk { 35% { transform: translateY(-14px) scale(1.04) rotate(-3deg); } 100% { transform: none; } }
  /* ультимейты */
  .ultBar { position: absolute; left: 18%; right: 18%; bottom: -4px; height: 4px; border-radius: 2px; background: #00000080; overflow: hidden; }
  .ultBar i { display: block; height: 100%; width: 0; background: currentColor; }
  .ultBar.ready i { box-shadow: 0 0 6px currentColor; }

  /* разделы: группа на весь экран со строкой иконок-вкладок, окна-«свитки» по центру поверх боя */
  #groupHead { display: none; align-items: flex-end; gap: 6px; padding: 8px 0 8px; border-bottom: 2px solid var(--frameDark); margin-bottom: 8px; }

  #panel.popup { top: 8%; bottom: 7%; left: 5%; right: 5%; height: auto; z-index: 9; border-radius: 14px; border: 3px solid #b8925e; box-shadow: 0 0 0 3px #2a1a0a, 0 10px 40px #000e; }
  #panel.popup #panelToggle { justify-content: center; font-size: 18px; color: #ff6a4a; }
  #panel.popup #panelToggle .x { display: none; }
  #popBack { display: none; order: 99; flex: none; margin: 8px auto 0; padding: 10px 40px; border-radius: 10px; font-size: 16px; font-weight: 900; color: #fff;
    background: linear-gradient(180deg, #3a6ae8, #1a3aa8); border: 2px solid #c9b06a; box-shadow: 0 0 0 2px #0a0a2a; }

  /* ===== карточки «Прокачки» по образцу (0.31): пергамент, портрет в рамке ===== */
  #multCycle { min-width: 76px; padding: 7px 14px; border-radius: 9px; font-size: 15px; font-weight: 900; color: #3a2a00;
    background: linear-gradient(180deg, #f4e35a, #c9b52a); border: 2px solid #5a4a10; box-shadow: 0 0 0 2px #1a1408, inset 0 2px 0 #fff8; }
  #cards .card { background: linear-gradient(180deg, #d8b886, #b8925e); border: 2px solid #4a3018; box-shadow: 0 0 0 2px #1a1008, inset 0 1px 0 #fff5; border-radius: 10px; padding: 8px; }
  #cards .cardIcon { width: 58px; height: 58px; border-radius: 6px; font-size: 28px; border: 3px solid #8a8a92; box-shadow: 0 0 0 2px #2a2a30, inset 0 0 10px #0008; }
  #cards .card.nohire .cardIcon { filter: grayscale(1) brightness(.85); opacity: .55; }
  #cards .cardTitle { color: #3a2410; font-size: 15px; }
  #cards .cardSub { color: #5a3a1c; font-weight: 600; }
  #cards .cardSub b { color: #1f6a2e; } #cards .cardSub .ms { color: #8a3a10; opacity: 1; } #cards .cardSub .dim { color: #6a4a2c; }
  #cards .badge.rs { background: #0002; color: #4a3018; } #cards .badge.sq { background: #1f6a2e33; color: #1f5a28; }
  #cards .buy { min-width: 116px; border-radius: 10px; color: #ffe8c0; text-shadow: 0 1px 0 #0008;
    background: linear-gradient(180deg, #d8382c, #8a1410); border: 2px solid #2a0a08; box-shadow: 0 0 0 2px #5a5a62, inset 0 2px 0 #ff9a8a66; }
  #cards .buy.hire { background: linear-gradient(180deg, #9a4ad8, #5a1a8a); box-shadow: 0 0 0 2px #5a5a62, inset 0 2px 0 #d8a8ff66; }

  .lockCard { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 10px;
    background: linear-gradient(180deg, #2a3a30, #1a2620); border: 2px solid #4a3a5a; box-shadow: 0 0 0 2px #120a18; }
  .lockCard .cardIcon { width: 58px; height: 58px; border-radius: 6px; font-size: 26px; filter: grayscale(.6) brightness(.7); border: 3px solid #5a4a6a; display: grid; place-items: center; flex: none; }
  .lockCard .lcInfo { flex: 1; text-align: center; }
  .lockCard .lcName { font-weight: 800; color: #e8e0d0; }
  .lockCard button { margin-top: 6px; padding: 7px 14px; border-radius: 8px; font-weight: 800; color: #fff; background: linear-gradient(180deg, #4aa8e8, #1a6aa8); border: 2px solid #0a2a48; }
  .heroDetail { padding: 10px; border-radius: 12px; margin-bottom: 8px; background: linear-gradient(180deg, #d8b886, #b8925e); border: 2px solid #4a3018; color: #3a2410; }
  .heroDetail .hdTop { display: flex; gap: 10px; }
  .heroDetail .hdPort { width: 76px; height: 76px; border-radius: 8px; display: grid; place-items: center; font-size: 40px; border: 3px solid #8a8a92; flex: none; }
  .heroDetail .hdName { font-size: 16px; font-weight: 900; }
  .heroDetail .hdStat { font-size: 12px; font-weight: 700; color: #5a3a1c; margin-top: 2px; }
  .heroDetail .hdSlots { display: grid; grid-template-columns: repeat(3, 34px); gap: 4px; margin-left: auto; align-content: start; }
  .heroDetail .hdSlot { width: 34px; height: 34px; border-radius: 5px; display: grid; place-items: center; font-size: 16px; background: #1a1210; border: 2px solid #5a4a3a; position: relative; }
  .heroDetail .hdSlot.empty { opacity: .5; }
  .heroDetail .hdSlot.empty::after { content: "✕"; position: absolute; right: 1px; bottom: -2px; font-size: 10px; color: #ff4a3a; font-weight: 900; }
  .heroDetail .hdBtns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-top: 8px; }
  .heroDetail .hdBtns button { padding: 8px 4px; border-radius: 8px; font-size: 12px; font-weight: 800; color: #fff; background: linear-gradient(180deg, #2a8a6a, #145a44); border: 2px solid #0a2a20; }
  .heroDetail .hdBtns button:disabled { background: #4a4a52; color: #a8a8b0; }
  .hIcon { cursor: pointer; }
  /* экран героя: описание, ульт, навыки (0.32) */
  .hdLore { margin-top: 8px; padding: 7px 9px; border-radius: 9px; background: #3a1e0c1c; border: 1px solid #5a3a1a30; font-size: 12px; color: #5a3a1e; font-weight: 700; }
  .hdLore q { display: block; font-style: italic; color: #2a1608; font-weight: 600; margin-bottom: 3px; }
  .hdUlt { margin-top: 6px; font-size: 12px; line-height: 1.35; color: #2a1608; }
  .hdUlt b { color: #8a2a10; }
  .heroDetail .secTitle { color: #6a3a1a; }
  .hdPerks { margin-top: 6px; display: grid; gap: 4px; }
  .hdPerk { display: flex; align-items: center; gap: 7px; padding: 5px 8px; border-radius: 8px; background: #3a1e0c1c; font-size: 12px; color: #2a1608; }
  .hdPerk .pl { flex: none; min-width: 42px; text-align: center; padding: 2px 4px; border-radius: 6px; font-weight: 900; font-size: 11px; background: #2a8a6a; color: #fff; }
  .hdPerk .pd { flex: 1; min-width: 0; } .hdPerk .pd b { display: block; }
  .hdPerk.lock { color: #6a5a4a; } .hdPerk.lock .pl { background: #6a6056; }
  .hdPerk .pk { flex: none; font-size: 11px; font-weight: 700; color: #8a2a10; white-space: nowrap; }
  /* бонус за вход, путешествие во времени, сундуки (0.33) */
  .loginGrid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin: 4px 0 8px; }
  .lgDay { position: relative; padding: 4px 2px 3px; border-radius: 8px; text-align: center; font-size: 10px; line-height: 1.2; background: var(--panel2); border: 1px solid var(--line); min-height: 44px; }
  .lgDay b { display: block; font-size: 11px; color: var(--muted); }
  .lgDay.big { border-color: #c9962e; background: linear-gradient(180deg, #3a2a10, #23172f); }
  .lgDay.got { opacity: .45; } .lgDay.got::after { content: "✓"; position: absolute; top: 1px; right: 4px; color: var(--ok); font-weight: 900; }
  .lgDay.now { border: 2px solid var(--gold); box-shadow: 0 0 8px #ffd36b80; } .lgDay.now b { color: var(--gold); }
  .chestRow { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 4px 0 6px; }
  .chestRow button { padding: 6px 2px; border-radius: 10px; background: var(--panel2); border: 1px solid var(--line); font-size: 11px; line-height: 1.25; }
  .chestRow button .ci { display: block; font-size: 22px; }
  .chestRow button.ready { border: 2px solid var(--gold); box-shadow: 0 0 8px #ffd36b80; animation: vulnPulse .6s ease-in-out infinite alternate; }
  .chestRow button.open { opacity: .45; }
  .chestBar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .chestBar i { display: block; height: 100%; background: var(--gold); }
  #enemy.rare-chest .body { filter: drop-shadow(0 0 12px #ffb36b) drop-shadow(0 0 4px #fff3b0) sepia(.6) saturate(1.6); }
  #enemyName.rare.chest { color: #ffb36b; }
  /* статистика */
  .stGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .stCell { padding: 7px 9px; border-radius: 9px; background: var(--panel2); border: 1px solid var(--line); }
  .stCell span { display: block; font-size: 11px; color: var(--muted); }
  .stCell b { font-size: 15px; }
  /* карта Башни */
  #floorLabel { cursor: pointer; }
  #floorLabel::after { content: " 🗺"; font-size: 13px; opacity: .7; }
  .mapHead { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .mapHead .mt { flex: 1; text-align: center; font-weight: 800; font-size: 13px; }
  .mapHead .mt small { display: block; font-weight: 600; color: var(--muted); font-size: 11px; }
  .mapBar { display: flex; gap: 6px; margin-bottom: 8px; }
  .mapBar button { flex: 1; }
  .mapPath { position: relative; padding: 4px 0 10px; }
  .mapPath::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 4px; margin-left: -2px; background: repeating-linear-gradient(#c9962e80 0 8px, transparent 8px 14px); }
  .mapHall { position: relative; margin: 8px auto 4px; width: max-content; padding: 2px 10px; border-radius: 10px; font-size: 11px; font-weight: 800; color: var(--gold); background: #0a0608; border: 1px solid #c9962e60; }
  .mapRow { position: relative; height: 38px; }
  .mapNode { position: absolute; top: 3px; width: 34px; height: 32px; margin-left: -17px; border-radius: 50%; font-size: 11px; font-weight: 900; color: #fff;
    background: radial-gradient(circle at 50% 35%, #3a8a5a, #1a4a2a); border: 2px solid #8fe6a0; display: grid; place-items: center; }
  .mapNode.lock { background: #2a2a30; border-color: #4a4a52; color: #8a8a90; }
  .mapNode.cur { background: radial-gradient(circle at 50% 35%, var(--frame1), var(--frame2)); border-color: var(--frameEdge); box-shadow: 0 0 10px #ffb36b; }
  .mapNode.fin { width: 44px; height: 40px; margin-left: -22px; top: -1px; font-size: 18px; }
  .mapNode i { position: absolute; bottom: -9px; font-style: normal; font-size: 10px; color: var(--text); text-shadow: 0 0 3px #000; }

  /* 0.37: чистый экран — интерфейс скрыт, логика работает; меню и кнопки возвращаем по одному. Старый интерфейс: адрес с #ui */
  body.clean #abilityBar, body.clean #panel, body.clean #arena .sideBtn, body.clean .leftCol, body.clean #flyout,
  body.clean #farmBar, body.clean #hint, body.clean #ultBanner, body.clean #version,
  body.clean #modal, body.clean .allyTag, body.clean .ultBar { display: none !important; }

  /* 0.38: верхняя полоса — золото, общий DPS отряда, без урона тапа (видна всегда, нажатие ничего не делает) */
  body:not(.clean) #topBar { display: none; }
  #topBar { position: absolute; z-index: 5; left: 0; right: 0; top: 0; display: flex; justify-content: space-between; gap: 8px; padding: calc(env(safe-area-inset-top) + 8px) 8px 0; pointer-events: none; }
  /* камень / металл: каменная табличка в металлической оправе */
  #topBar .tb { min-width: 0; height: 30px; display: flex; align-items: center; gap: 4px; padding: 0 8px 0 3px; border-radius: 7px;
    background: radial-gradient(ellipse at 30% 20%, #5a5462 0%, transparent 60%), linear-gradient(#45404c, #2b2731 55%, #1f1c24);
    border: 2px solid #8d8597; border-color: #b4adbd #6e6678 #4e4757 #8d8597;
    box-shadow: 0 0 0 1px #0d0b10, 0 3px 6px #000a, inset 0 1px 0 #ffffff2a, inset 0 -2px 0 #0007; }
  #topBar .tb i { flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: 12px;
    background: radial-gradient(circle at 40% 30%, #e6e1ec, #8a8294 45%, #3d3844 100%); border: 1px solid #1a161e; box-shadow: inset 0 0 0 2px #00000030; color: #241f2a; }
  #topBar .tb.g i { background: radial-gradient(circle at 40% 30%, #fff1b8, #d4a23a 45%, #6a4a12 100%); color: #3a2606; }
  #topBar .tb b { font-family: 'Russo One', system-ui, sans-serif; flex: 1 1 auto; min-width: 0; text-align: right; padding-left: 2px; font-size: 14px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #efeaf3; text-shadow: 0 1px 0 #000, 0 0 4px #000a; }
  #topBar .tb.g b { color: var(--gold); }
  #topBar .tb small { flex: none; font-size: 9px; font-weight: 800; color: #b9b1c3; letter-spacing: .4px; text-shadow: 0 1px 0 #000; }

  /* 0.39: шапка боя (чистый экран). Плашка этажа между золотом и DPS, под ней биом, имя врага, HP + секунды босса, прогресс 1–10.
     Шрифты: Ruslan Display (готика), Rubik Dirt (манхва/комикс), Russo One (числа) — Google Fonts, без интернета системные. */
  #hpRow { position: relative; }
  #timerSec { display: none; }
  body.clean #hud { position: absolute; z-index: 4; left: 0; right: 0; top: 0; padding: calc(env(safe-area-inset-top) + 8px) 0 0; display: flex; flex-direction: column; align-items: center; pointer-events: none; }
  body.clean #resBar, body.clean #stats, body.clean #buffs, body.clean #timerBar { display: none !important; }
  body.clean #floorRow { order: 1; gap: 0; height: 30px; padding: 0 2px; border-radius: 7px;

    border: 2px solid; border-color: #b4adbd #6e6678 #4e4757 #8d8597; box-shadow: 0 0 0 1px #0d0b10, 0 3px 6px #000a, inset 0 1px 0 #ffffff2a, inset 0 -2px 0 #0007; }
  body.clean .navBtn { pointer-events: auto; width: 26px; height: 26px; border: none; background: none; font-size: 22px; line-height: 1; color: #d8d0e2; text-shadow: 0 1px 0 #000; }
  body.clean .navBtn:disabled { opacity: .2; }
  body.clean #floorLabel::after { content: none; }
  body.clean #floorLabel { min-width: 84px; font-family: 'Ruslan Display', Georgia, serif; font-size: 16px; font-weight: 400; letter-spacing: .5px; color: #f4e6c2;
    text-shadow: 0 1px 0 #000, 0 0 6px #b98cff80; pointer-events: none; white-space: nowrap; }
  body.clean #biomeLabel { order: 2; margin-top: 5px; font-family: 'Ruslan Display', Georgia, serif; font-size: 10px; font-weight: 400; letter-spacing: 1px; color: #c9b8dc;
    text-shadow: 0 1px 2px #000, 0 0 4px #000; max-width: 92%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  body.clean #enemyName { order: 3; margin-top: 8px; font-family: 'Rubik Dirt', 'Impact', system-ui, sans-serif; font-size: 20px; font-weight: 400; letter-spacing: 1px; text-transform: uppercase; color: #fff;
    -webkit-text-stroke: 1px #000; paint-order: stroke fill; text-shadow: 2px 2px 0 #000, 0 0 10px #b98cff70; max-width: 94%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  body.clean #enemyName.boss { color: #ff7a52; text-shadow: 2px 2px 0 #000, 0 0 12px #ff3a1a90; }
  body.clean #enemyName.rare { color: var(--gold); text-shadow: 2px 2px 0 #000, 0 0 12px #ffd36b90; }
  body.clean #enemyName.rare.crystal { color: #8fe6ff; }
  body.clean #hpRow { order: 4; width: 74%; margin-top: 4px; }
  body.clean #hpBar { margin: 0; height: 16px; border-radius: 3px; background: linear-gradient(#1a0a0e, #2e0f16); border: 2px solid #120a10;
    box-shadow: 0 0 0 1px #6e6678, 0 3px 8px #000c, inset 0 2px 4px #000; overflow: hidden; }
  body.clean #hpBar::before, body.clean #hpBar::after { content: ""; position: absolute; top: 50%; width: 8px; height: 8px; margin-top: -4px; background: #8d8597; transform: rotate(45deg); border: 1px solid #000; z-index: 2; }
  body.clean #hpBar::before { left: -5px; } body.clean #hpBar::after { right: -5px; }
  body.clean #hpFill { background: linear-gradient(180deg, #ff7686 0%, #d42a42 45%, #8a1022 100%); box-shadow: inset 0 1px 0 #ffffff60, 0 0 8px #ff2a4a80; }
  body.clean #hpText { font-family: 'Russo One', system-ui, sans-serif; font-size: 11px; line-height: 12px; font-weight: 400; color: #fff; text-shadow: 0 1px 0 #000, 0 0 3px #000; z-index: 3; }
  body.clean #timerSec.show { display: block; position: absolute; left: 100%; top: 50%; transform: translateY(-50%); margin-left: 10px; white-space: nowrap;
    font-family: 'Russo One', system-ui, sans-serif; font-size: 15px; color: #ffd36b; text-shadow: 0 1px 0 #000, 0 0 6px #000; }

  body.clean #dots { order: 5; margin-top: 7px; gap: 6px; align-items: center; }

  body.clean .dot.boss { width: 12px; height: 12px; background: #3a1410; border-color: #c24a2a; }
  body.clean .dot.boss.cur { background: #ff6b4a; box-shadow: 0 0 8px #ff6b4a; }

<script>
(function () {

    seiren: { body: '#1f3a4a', hood: '#16303a', eye: '#8fffff', icon: '🌪', iconBg: '#1e3a46', weapon: 'staff' },
    carna:  { body: '#4a1f3a', hood: '#3a162c', eye: '#ffd36b', icon: '🎭', iconBg: '#46203a', weapon: 'blades' },
    yuki:   { body: '#dfe8f2', hood: '#b8c8da', eye: '#6bd8ff', icon: '❄', iconBg: '#2a3a4a', weapon: 'staff' },
    morra:  { body: '#3a1f2a', hood: '#2c1620', eye: '#ff6b9a', icon: '🕯', iconBg: '#3a1e2a', weapon: 'staff' },
    kassian: { body: '#2a2a3a', hood: '#1a1a2a', eye: '#ff7a20', icon: '🛡', iconBg: '#2a1e1a', weapon: 'axe' },
    nyx:    { body: '#1a1030', hood: '#100820', eye: '#ff40c0', icon: '🌙', iconBg: '#2a103a', weapon: 'blades' },
    azrael: { body: '#4a3a1f', hood: '#3a2c16', eye: '#fff0a0', icon: '🪽', iconBg: '#46381e', weapon: 'blades' },
  };
  // Слоты отряда: двое по бокам впереди, двое позади
  const SLOTS = [
    { pos: 'left:2%', side: 'L', back: false }, { pos: 'right:2%', side: 'R', back: false },
    { pos: 'left:7%', side: 'L', back: true },  { pos: 'right:7%', side: 'R', back: true },
  ];

  // Облики эволюции (временные заглушки): I — сияние, II — наплечники и плащ, III — корона и ореол
  function allySvg(v, evo) {
    evo = evo || 0;
    const aura = evo >= 1 ? '<ellipse cx="50" cy="80" rx="44" ry="52" fill="' + v.eye + '" opacity="' + (0.10 + 0.05 * evo) + '"/>' : '';
    const cape = evo >= 2 ? '<path d="M30 60 Q16 96 20 126 L34 124 Z M70 60 Q84 96 80 126 L66 124 Z" fill="' + v.eye + '" opacity=".55" stroke="#0a0a10" stroke-width="2"/>' +
      '<path d="M26 64 Q34 52 44 58 L40 70 Z M74 64 Q66 52 56 58 L60 70 Z" fill="#c8ccd4" stroke="#0a0a10" stroke-width="2.5"/>' : '';
    const crown = evo >= 3 ? '<ellipse cx="50" cy="12" rx="17" ry="4.5" fill="none" stroke="' + v.eye + '" stroke-width="2.5"/>' +
      '<path d="M38 22 L41 12 L46 19 L50 9 L54 19 L59 12 L62 22 Z" fill="#ffd36b" stroke="#5a3a0a" stroke-width="1.5"/>' : '';
    return '<svg viewBox="0 0 100 130"><ellipse cx="50" cy="126" rx="34" ry="5" fill="#00000070"/>' + aura + cape +
      '<path d="M22 124 L34 58 Q50 46 66 58 L78 124 Q50 116 22 124Z" fill="' + v.body + '" stroke="#0a0a10" stroke-width="3"/>' +
      '<path d="M32 52 Q32 22 50 18 Q68 22 68 52 Q60 60 50 60 Q40 60 32 52Z" fill="' + v.hood + '" stroke="#0a0a10" stroke-width="3"/>' +
      '<ellipse cx="44" cy="44" rx="3" ry="2.4" fill="' + v.eye + '"/><ellipse cx="57" cy="44" rx="3" ry="2.4" fill="' + v.eye + '"/>' +
      WEAPON[v.weapon] + crown + '</svg>';
  }
  const allyUi = {};                 // id → { sprite, title, sub, btn }
  function buildAllies() {
    const layer = $('allyLayer'), cards = $('allyCards');
    for (const a of CFG.allies) {
      const v = ALLY_VIS[a.id];
      const sp = document.createElement('div');
      sp.className = 'ally';
      sp.innerHTML = '<div class="fig">' + allySvg(v, s.heroes[a.id].evo) + '</div><div class="allyTag" style="color:' + v.eye + '">' + a.name + '</div><div class="ultBar" style="color:' + v.eye + '"><i></i></div>';
      layer.appendChild(sp);
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = '<div class="cardIcon" style="background:' + v.iconBg + '">' + v.icon + '</div>' +
        '<div class="cardInfo"><div class="cardTitle"></div><div class="cardSub"></div></div><button class="buy"></button>';
      cards.appendChild(card);
      // закрытый герой — плашка «Освободить героя»
      const lk = document.createElement('div');
      lk.className = 'lockCard';
      lk.innerHTML = '<div class="cardIcon" style="background:' + v.iconBg + '">' + v.icon + '</div><div class="lcInfo"><div class="lcName">' + a.name + ' · ' + a.rarity + '</div>' +
        '<button>Освободить героя</button></div>';
      lk.querySelector('button').addEventListener('click', () => { tab = a.hidden ? 'altar' : a.seasonal ? 'season' : 'portal'; setCollapsed(false); render(); });
      cards.appendChild(lk);
      const btn = card.querySelector('.buy');
      btn.addEventListener('click', () => {
        if (btn.dataset.rank) { if (C.rankUp(s, a.id)) { toast('Новый ранг · ' + a.name + '<small>потолок уровня ' + fmt(C.allyCap(s, a.id)) + '</small>'); save(); render(); } return; }
        if (C.buyAlly(s, a.id, buyCount(s.allies[a.id].level))) { save(); render(); }
      });
      allyUi[a.id] = { lock: lk, evo: s.heroes[a.id].evo, fig: sp.querySelector('.fig'), card, ultBar: sp.querySelector('.ultBar'), ultFill: sp.querySelector('.ultBar i'), sprite: sp, title: card.querySelector('.cardTitle'), sub: card.querySelector('.cardSub'), btn, color: v.eye };
    }
  }
  const SAVE_KEY = 'prizvannyy_v2_save';
  const STEP = 1 / 30;                 // фиксированный шаг логики
  const DPS_WINDOW = 5;                // период усреднения DPS, сек (TBD)

  const $ = id => document.getElementById(id);
  const el = {
    arena: $('arena'), enemy: $('enemy'), hpFill: $('hpFill'), hpText: $('hpText'),
    enemyName: $('enemyName'), dots: $('dots'), floorLabel: $('floorLabel'),
    prev: $('prevFloor'), next: $('nextFloor'), timerBar: $('timerBar'), timerFill: $('timerFill'),
    tapDmg: $('tapDmg'), dps: $('dps'), hint: $('hint'), farmBar: $('farmBar'), bossBtn: $('bossBtn'),
    toast: $('toast'), gold: $('gold'), tapLvl: $('tapLvl'), tapSub: $('tapSub'), buyTap: $('buyTap'),
    statsMore: $('statsMore'),
    modal: $('modal'), saveInfo: $('saveInfo'),
  };

  // ---------- сохранение ----------
  // ---------- страховка сохранений (GDD §17, 0.42): 3 циклические копии раз в 5 минут + снимок перед ритуалом ----------
  // Основное сохранение не удаляется никогда: если оно повреждено, его копия кладётся в «_broken», игра поднимается
  // из последней целой резервной копии. Ручной откат — только к копии, которая прошла проверку (deserialize).
  const BAK_N = 3, BAK_EVERY = 5 * 60 * 1000, BAK_KEY = i => SAVE_KEY + '_bak' + i, PRE_RIT = SAVE_KEY + '_preRitual';
  let restoredFrom = null;
  function readCopy(key) {
    try { const w = JSON.parse(localStorage.getItem(key) || 'null'); if (!w || !w.data) return null;
      const st = C.deserialize(w.data); return st ? { key, t: +w.t || 0, st, data: w.data } : null; } catch (e) { return null; }
  }
  function backupList() {
    const out = [];
    for (let i = 0; i < BAK_N; i++) { const c = readCopy(BAK_KEY(i)); if (c) out.push({ ...c, kind: 'auto' }); }
    const pr = readCopy(PRE_RIT); if (pr) out.push({ ...pr, kind: 'ritual' });
    return out.sort((a, b) => b.t - a.t);
  }
  function load() {
    let raw = null;
    try { raw = localStorage.getItem(SAVE_KEY); if (raw) { const st = C.deserialize(raw); if (st) return st; } } catch (e) {}
    const list = backupList();
    if (raw && list.length) { try { localStorage.setItem(SAVE_KEY + '_broken', raw); } catch (e) {} }
    if (list.length) { restoredFrom = list[0]; return list[0].st; }
    return C.newState();
  }
  function writeCopy(key) { try { localStorage.setItem(key, JSON.stringify({ t: Date.now(), data: C.serialize(s) })); } catch (e) {} }
  let lastSave = 0, lastBak = 0;
  try { lastBak = Math.max(0, ...[0, 1, 2].map(i => (+JSON.parse(localStorage.getItem(BAK_KEY(i)) || '{}').t || 0))); } catch (e) {}
  let blockSave = false;                                   // после отката — не перезаписать возвращённую копию при перезагрузке
  function save() {
    if (blockSave) return;
    try { localStorage.setItem(SAVE_KEY, C.serialize(s)); lastSave = Date.now(); } catch (e) {}
    if (Date.now() - lastBak >= BAK_EVERY) {                 // самая старая из трёх копий заменяется новой
      let oldest = 0, ot = Infinity;
      for (let i = 0; i < BAK_N; i++) { let tt = 0; try { tt = +JSON.parse(localStorage.getItem(BAK_KEY(i)) || '{}').t || 0; } catch (e) {} if (tt < ot) { ot = tt; oldest = i; } }
      writeCopy(BAK_KEY(oldest)); lastBak = Date.now();
    }
  }
  function restoreCopy(key) {
    const c = readCopy(key); if (!c) return false;
    writeCopy(SAVE_KEY + '_beforeRestore');                  // текущее состояние не теряется и при откате
    try { localStorage.setItem(SAVE_KEY, c.data); } catch (e) { return false; }
    blockSave = true; location.reload(); return true;
  }

  let s = load();
  let mult = 1;
  let anyAffordable = false;
  const heroEl = $('hero');
  const UI_KEY = 'prizvannyy_v2_ui';
  const TAB_NAMES = { stats: 'Статистика', map: 'Карта Башни', bones: 'Кости', inbox: 'Награды', events: 'События', season: 'Сезон', up: 'Прокачка', quests: 'Задания', heroes: 'Герои', portal: 'Портал', altar: 'Алтарь', souls: 'Души', runes: 'Руны', pve: 'PvE' };

  // задания/события/сезон — окна-свитки поверх боя, карта и PvE — отдельные экраны
  const GROUP_L = [['up', '⚔', 'Прокачка'], ['heroes', '🪖', 'Герои'], ['portal', '🌀', 'Портал'], ['altar', '🕯', 'Алтарь'], ['souls', '👻', 'Души']];

    el.enemyName.classList.toggle('chest', en.rare === 'chest');
    el.enemy.classList.toggle('boss', en.isBoss);
    el.enemy.classList.toggle('rare-gold', en.rare === 'gold');
    el.enemy.classList.toggle('rare-crystal', en.rare === 'crystal');
    el.enemy.classList.toggle('rare-chest', en.rare === 'chest');
    // оттенок от биома + небольшой разброс; редкие и боссы — свои
    el.enemy.style.filter = en.rare ? 'none' : en.isBoss ? 'hue-rotate(' + (bio.hue + 130) + 'deg) saturate(1.3)' + (en.final ? ' contrast(1.15)' : '')
      : 'hue-rotate(' + (bio.hue + (s.floor * 37 + s.enemyIndex * 11) % 60 - 30) + 'deg)';
    // отметки фаз на полоске HP босса
    const marks = en.isBoss ? (en.final ? CFG.bossPhases.final : CFG.bossPhases.normal) : [];
    const mk = marks.map((t, i) => t + ':' + (en.phase > i + 1 ? 1 : 0)).join();
    if (mk !== lastMarks) {
      lastMarks = mk;
      $('hpBar').querySelectorAll('.phMark').forEach(x => x.remove());
      marks.forEach((t, i) => { const d = document.createElement('div'); d.className = 'phMark' + (en.phase > i + 1 ? ' past' : ''); d.style.left = (t * 100) + '%'; $('hpBar').appendChild(d); });
    }
    el.hpFill.style.width = (B.toNum(B.div(en.hp, en.maxHp)) * 100) + '%';
    el.hpText.textContent = fmt(en.hp) + ' / ' + fmt(en.maxHp);
    timerSec.classList.toggle('show', s.mode ? (s.mode.kind !== 'endless' || en.isBoss) : en.isBoss);
    el.timerBar.classList.toggle('show', s.mode ? (s.mode.kind !== 'endless' || en.isBoss) : en.isBoss);
    el.farmBar.classList.toggle('show', s.farming && !s.mode);
    el.hint.style.display = tapped ? 'none' : '';
    el.tapDmg.textContent = fmt(C.tapHit(s));
    el.gold.textContent = fmt(s.gold);
    const tcap = C.tapCap(s), tAtCap = s.tapLevel >= tcap;
    el.tapLvl.textContent = fmt(s.tapLevel) + '/' + fmt(tcap);

    const n = Math.max(1, Math.min(tcap - s.tapLevel, mult === 'max' ? Math.max(1, C.maxAffordable(s.tapLevel, s.gold)) : buyCount(s.tapLevel)));
    const cost = C.upgradeCost(s.tapLevel, n);
    const can = B.lte(cost, s.gold);
    el.tapSub.innerHTML = rankTag(s.heroRank) + (tAtCap ? 'Урон ' + fmt(C.tapHit(s)) + ' · <span class="ms">потолок — повысьте ранг</span>'
      : 'Урон ' + fmt(C.tapHit(s)) + ' → <b>' + fmt(B.mul(C.tapDamageAt(s.tapLevel + n), C.permMult(s, 'tap'))) + '</b>' + msHint(s.tapLevel));
    anyAffordable = false;
    renderTabs();
    if (tAtCap) setRank(el.buyTap, 'hero');
    else setBuy(el.buyTap, can, n, cost, '+' + fmt(n) + ' ур.' + (mult === 'ms' ? ' ×' + CFG.milestoneMult : ''));

    // союзник
    for (const a of CFG.allies) {
      const u = allyUi[a.id], lv = s.allies[a.id].level;
      const acap = C.allyCap(s, a.id), aAtCap = lv >= acap;
      const an = Math.max(1, Math.min(acap - lv, mult === 'max' ? Math.max(1, C.allyMax(s, a.id)) : buyCount(lv)));
      const acost = C.allyCost(s, a.id, an);
      const pm = B.mul(C.permMult(s, 'ally'), C.heroMult(s, a.id));   // души, артефакты, звёзды и эволюция
      if (u.evo !== s.heroes[a.id].evo) { u.evo = s.heroes[a.id].evo; u.fig.innerHTML = allySvg(ALLY_VIS[a.id], u.evo); }
      u.sub.innerHTML = aAtCap ? rankTag(s.heroes[a.id].rank) + 'DPS ' + fmt(B.mul(C.allyDps(s, a.id), C.permMult(s, 'ally'))) + ' · <span class="ms">потолок — повысьте ранг</span>'
                    : lv ? rankTag(s.heroes[a.id].rank) + 'DPS ' + fmt(B.mul(C.allyDps(s, a.id), C.permMult(s, 'ally'))) + ' → <b>' + fmt(B.mul(C.allyDpsAt(a.id, lv + an), pm)) + '</b>' + msHint(lv)
                           : '<span class="dim">' + a.role + ' · удар раз в ' + a.attackInterval + ' с</span> DPS <b>' + fmt(B.mul(C.allyDpsAt(a.id, an), pm)) + '</b>';
      if (aAtCap) setRank(u.btn, a.id);
      else setBuy(u.btn, B.lte(acost, s.gold), an, acost, (lv ? '+' + fmt(an) + ' ур.' : 'Нанять' + (an > 1 ? ' +' + fmt(an - 1) : '')) + (mult === 'ms' ? ' ×' + CFG.milestoneMult : ''));
      const unlocked = s.heroes[a.id].unlocked, sq = s.squad.indexOf(a.id);
      u.card.style.display = unlocked ? '' : 'none';
      u.card.classList.toggle('nohire', !lv);
      u.lock.style.display = unlocked ? 'none' : '';
      u.lock.style.order = 100 + CFG.allies.indexOf(a);
      u.card.style.order = sq >= 0 ? sq : 10 + CFG.allies.indexOf(a);
      u.title.innerHTML = '<span class="rar r-' + a.rarity + '">' + a.rarity + '</span> ' + a.name + ' · ' + (lv ? 'ур. ' + fmt(lv) + '/' + fmt(acap) : a.role) +
        (sq >= 0 ? '<span class="badge sq">отряд</span>' : '<span class="badge rs">резерв</span>');
      // фигура на арене — только у героя в отряде и нанятого
      const slot = SLOTS[sq];
      u.sprite.classList.toggle('on', sq >= 0 && lv > 0);
      if (slot) {
        u.sprite.className = 'ally ' + slot.side + (slot.back ? ' back' : '') + (sq >= 0 && lv > 0 ? ' on' : '');
        u.sprite.style.cssText = slot.pos;
      }
    }
    $('canBuy').classList.toggle('on', anyAffordable);
    const upBtn = document.querySelector('.sideBtn[data-open="up"]'); if (upBtn) upBtn.classList.toggle('on', anyAffordable);
    if (ui2Refresh) ui2Refresh();
  }

  // Подсказка о следующей вехе уровня
  function msHint(level) {
    return '<span class="ms"> · ×' + CFG.milestoneMult + ' на ' + fmt(C.nextMilestone(level)) + '</span>';
  }

  // Ранг: «Р III·4» — ранг и подранг
  const RN = ['', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X'];
  function rankTag(k) { const r = C.rankLabel(k); return '<span class="ms">Ранг ' + RN[r.rank] + (r.max ? ' · макс' : '·' + r.sub) + '</span> · '; }
  // Кнопка повышения ранга на месте покупки, когда уровень упёрся в потолок
  function setRank(btn, who) {
    const c = C.rankCost(s, who), M = CFG.materials;
    btn.dataset.rank = '1';
    if (!c) { btn.disabled = true; btn.innerHTML = 'Предел<span>ур. ' + fmt(C.capAt(C.maxSteps())) + '</span>'; return; }
    const evoOk = who === 'hero' || s.heroes[who].evo >= c.needEvo;
    const can = C.canRankUp(s, who);
    btn.disabled = !can;
    if (can) anyAffordable = true;
    const price = M.shard.icon + ' ' + fmt(c.shards) + (c.hearts ? ' ' + M.heart.icon + ' ' + c.hearts : '');
    btn.innerHTML = !evoOk ? 'Нужна эволюция ' + RN[c.needEvo] + '<span>для ранга ' + RN[c.newRank] + '</span>'
      : (c.newRank ? '⇧ Ранг ' + RN[c.newRank] : '⇧ Подранг') + '<span>' + price + ' → ' + fmt(c.cap) + '</span>';
  }
  function setBuy(btn, can, n, cost, label) {
    delete btn.dataset.rank;
    btn.disabled = !can;
    if (can) anyAffordable = true;
    const hire = /^Нанять/.test(label);
    btn.classList.toggle('hire', hire);
    // как в образце: «Улучшить / Нанять» и цена; сколько уровней — мелко
    const head = (hire ? 'Нанять' : 'Улучшить') + (n > 1 ? ' <small>+' + fmt(n) + '</small>' : '');
    btn.innerHTML = head + '<span>◆ ' + fmt(cost) + '</span>';
  }

  const BUFF_UI = [
    { key: 'team', kind: 'teamBuff', color: '#ff8a6b' },
    { key: 'tap', kind: 'tapBuff', color: '#c8b8ff' },
  ];
  let lastBuffHtml = '';
  function renderUlts() {
    for (const a of CFG.allies) {
      const u = allyUi[a.id], st = s.allies[a.id];
      const p = st.level > 0 ? st.ult / a.ult.charge : 0;
      u.ultFill.style.width = (p * 100) + '%';
      u.ultBar.classList.toggle('ready', p >= 1);
    }
    const parts = [];
    for (const b of BUFF_UI) {
      const left = s.buffs[b.key];
      if (left > 0) parts.push('<span class="buff" style="color:' + b.color + '">' + CFG.allies.find(a => a.ult.kind === b.kind).ult.name + ' ' + Math.ceil(left) + 'с</span>');
    }
    if (s.enemy.vuln > 0 && s.enemy.alive) parts.push('<span class="buff" style="color:#ff6b4a">Уязвим ' + Math.ceil(s.enemy.vuln) + 'с</span>');
    el.enemy.classList.toggle('vuln', s.enemy.vuln > 0 && s.enemy.alive);
    if (s.enemy.mark > 0) parts.push('<span class="buff" style="color:#ffb36b">Метка ' + Math.ceil(s.enemy.mark) + 'с</span>');
    const html = parts.join('');
    if (html !== lastBuffHtml) { $('buffs').innerHTML = html; lastBuffHtml = html; }
    el.arena.classList.toggle('fury', s.buffs.team > 0);
    el.enemy.classList.toggle('marked', s.enemy.mark > 0 && s.enemy.alive);
    heroEl.classList.toggle('empowered', s.buffs.tap > 0);
  }

  // ---------- вкладки: коллекция героев и портал ----------
  let tab = 'up';
  let lastPull = [], pullShown = null, heroesHtml = '';
  const RANKS = CFG.rarities;
  function renderTabs() {
    C.dailyReset(s, dayKey());
    C.seasonReset(s, dayKey());
    C.eventReset(s, weekKey());
    C.questsReset(s, dayKey(), weekKey());
    $('questDot').classList.toggle('on', C.claimableCount(s) + C.achClaimableCount(s) + C.questChestsReady(s) > 0);
    if (tab === 'quests') renderQuests();
    if (tab === 'season') renderSeason();
    if (tab === 'events') renderEvents();
    if (tab === 'inbox') renderInbox();
    if (tab === 'bones') renderBones();
    if (tab === 'stats') renderStats();
    if (tab === 'map') renderMap();
    const inbN = s.inbox.length + (C.loginAvailable(s, dayKey()) ? 1 : 0) + (C.travelCost(s, dayKey()) === 0 && B.gt(C.offlineDps(s), 0) ? 1 : 0);
    $('inboxCnt').textContent = inbN; $('inboxCnt').classList.toggle('on', inbN > 0);
    $('toggleLabel').textContent = TAB_NAMES[tab] || '';
    // «!» на боковых кнопках
    const fcost = C.findCost(s);
    const bang = {
      up: anyAffordable, quests: C.claimableCount(s) + C.achClaimableCount(s) + C.questChestsReady(s) > 0, portal: s.tickets > 0,
      heroes: (C.classUnlocked(s) && (!s.cls.id || C.classFree(s) > 0)) || CFG.pets.list.some(p => C.canEvolvePet(s, p.id)) || CFG.allies.some(a => s.heroes[a.id].unlocked && (C.canEvolve(s, a.id) || (C.starCost(s, a.id) != null && s.heroes[a.id].copies >= C.starCost(s, a.id)))),
      souls: C.canRitual(s) || (fcost != null && B.gte(s.souls, fcost)),
      pve: !s.mode && CFG.pve.dungeons.some(d => C.attemptsLeft(s, d.id) > 0),
      bones: s.bones.some(b => !b.on) && CFG.bones.slots.some(x => !s.bones.some(b => b.on === 'hero' && b.slot === x.id) && s.bones.some(b => !b.on && b.slot === x.id)),
      season: seasonBang(), events: !s.mode && C.attemptsLeft(s, 'event') > 0, altar: false, runes: s.materials.shard >= CFG.runes.createCost && !s.runes.length,
    };
    bang.inbox = inbN > 0; bang.travel = C.travelCost(s, dayKey()) === 0 && B.gt(C.offlineDps(s), 0);
    navBang = bang;
    const opened = !$('panel').classList.contains('collapsed');
    if (opened) applyMode();
    document.querySelectorAll('.sideBtn').forEach(b => { b.classList.toggle('on', (b.dataset.bang || b.dataset.open).split(',').some(k => bang[k])); b.classList.toggle('cur', opened && tab === b.dataset.open); });
    $('resGold').textContent = fmt(s.gold); $('resTickets').textContent = fmt(s.tickets);
    $('resShards').textContent = fmt(s.materials.shard); $('resSouls').textContent = fmt(s.souls);
    $('panel').dataset.tab = tab;
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
    $('ticketDot').classList.toggle('on', s.tickets > 0);
    const fc = C.findCost(s);
    $('soulDot').classList.toggle('on', C.canRitual(s) || (fc != null && B.gte(s.souls, fc)));
    if (tab === 'heroes') renderHeroes();
    if (tab === 'portal') renderPortal();
    if (tab === 'altar') renderAltar();
    if (tab === 'souls') renderSouls();
    if (tab === 'runes') renderRunes();
    if (tab === 'pve') renderPve();
    $('pveDot').classList.toggle('on', !s.mode && CFG.pve.dungeons.some(d => C.attemptsLeft(s, d.id) > 0));
  }
  function renderHeroes() {
    const list = CFG.allies.slice().sort((a, b) => {
      const ua = s.heroes[a.id].unlocked, ub = s.heroes[b.id].unlocked;
      if (ua !== ub) return ua ? -1 : 1;
      return RANKS.indexOf(b.rarity) - RANKS.indexOf(a.rarity);
    });
    const M = CFG.materials, ROMAN = ['', 'I', 'II', 'III', 'IV', 'V'];
    let html = '<div class="matHead"><span>' + M.shard.icon + ' <b>' + fmt(s.materials.shard) + '</b> осколков</span></div>' +
      heroDetailHtml() + heroTopHtml() +
      '<div class="secTitle">СОЮЗНИКИ</div><div class="hint2">Отряд ' + s.squad.length + '/' + CFG.squadSize + ' — на арене, у них работают ультимейты. ' +
      'Нанятые вне отряда тоже бьют в полную силу. Звёзды — за дубликаты из портала. Эволюция — за звёзды и материалы с боссов, навсегда.</div>';
    for (const a of list) {
      const h = s.heroes[a.id], v = ALLY_VIS[a.id];
      if (!h.unlocked) {
        html += '<div class="hRow locked r-' + a.rarity + '"><div class="hIcon" style="background:#1a1420">?</div><div class="hInfo">' +
          '<div class="hName"><span class="rar r-' + a.rarity + '">' + a.rarity + '</span> ???</div><div class="hSub">' + (a.hidden ? 'Скрытый рецепт Алтаря' : a.seasonal ? 'Сезонный герой — тропа сезона или обмен жетонов' : 'Откройте в портале') + '</div></div></div>';
        continue;
      }
      const sq = C.inSquad(s, a.id), need = C.starCost(s, a.id), ec = C.evoCost(s, a.id), canEvo = C.canEvolve(s, a.id);
      const stars = '★ ' + h.stars + '/' + CFG.maxStars;
      const nEvo = CFG.evolution.stages.length;
      const okNo = (have, want) => '<span class="' + (have >= want ? 'ok' : 'no') + '">';
      const evoNeed = ec ? '<div class="evoNeed">' + ec.name + ' (×' + ec.mult + ' DPS): ' + okNo(h.stars, ec.stars) + '★' + ec.stars + '</span> · ' +
          okNo(s.materials.shard, ec.shards) + M.shard.icon + fmt(ec.shards) + '</span>' +
          (ec.hearts ? ' · ' + okNo(s.materials.heart, ec.hearts) + M.heart.icon + ec.hearts + '</span>' : '') + '</div>'
        : '<div class="evoNeed"><span class="ok">Эволюция завершена</span></div>';
      html += '<div class="hRow r-' + a.rarity + '"><div class="hIcon" data-hd="' + a.id + '" style="background:' + v.iconBg + '">' + v.icon +
        (h.evo ? '<span class="evoPip">' + ROMAN[h.evo] + '</span>' : '') + '</div>' +
        '<div class="hInfo"><div class="hName"><span class="rar r-' + a.rarity + '">' + a.rarity + '</span> ' + a.name +
        (sq ? '<span class="badge sq">отряд</span>' : '') + '</div>' +
        '<div class="hSub"><span class="stars">' + stars + '</span>' + (h.evo ? ' · <span class="evoTag">облик ' + ROMAN[h.evo] + '/' + ROMAN[nEvo] + '</span>' : '') +
        ' · ранг ' + (() => { const r = C.rankLabel(h.rank); return RN[r.rank] + (r.max ? ' макс' : '·' + r.sub); })() + ' · копий ' + h.copies + ' · ' + a.ult.name + '</div>' + evoNeed + '</div><div class="hBtns">' +
        (need == null ? '<button class="hBtn" disabled>★ max</button>'
                      : '<button class="hBtn' + (h.copies >= need ? ' go' : '') + '" data-star="' + a.id + '"' + (h.copies >= need ? '' : ' disabled') + '>★ за ' + need + '</button>') +
        (sq ? '<button class="hBtn" data-out="' + a.id + '">Убрать</button>'
            : '<button class="hBtn go" data-in="' + a.id + '"' + (s.squad.length >= CFG.squadSize ? ' disabled' : '') + '>В отряд</button>') +
        (ec ? '<button class="hBtn' + (canEvo ? ' evo' : '') + '" data-evo="' + a.id + '"' + (canEvo ? '' : ' disabled') + '>⬆ ' + ROMAN[ec.stage] + '</button>' : '') +
        '</div></div>';
    }
    if (html !== heroesHtml) { $('heroesTab').innerHTML = html; heroesHtml = html; }   // без лишних перерисовок
  }
  // ---------- статистика (0.32) ----------
  let liveTapDps = 0, liveAllDps = 0;
  const goldLog = [];                      // [время, заработано золота] раз в секунду — для «золото/мин»
  function goldSample(now) {
    if (goldLog.length && now - goldLog[goldLog.length - 1][0] < 1000) return;
    goldLog.push([now, s.stats.goldEarned]);
    while (goldLog.length > 61) goldLog.shift();
  }
  function goldPerMin() {
    if (goldLog.length < 2) return 0;
    const a = goldLog[0], b = goldLog[goldLog.length - 1], span = (b[0] - a[0]) / 60000;
    return span > 0 ? B.max(0, B.div(B.sub(b[1], a[1]), span)) : 0;
  }
  function playTimeTxt(sec) {
    const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60);
    return h ? h + ' ч ' + m + ' мин' : m + ' мин';
  }
  function renderStats() {
    const st = s.stats, auto = C.autoDps(s);
    const cells = [
      ['Общий DPS', fmt(B.add(liveTapDps, auto))], ['Реальный средний', fmt(liveAllDps)],
      ['Урон за тап', fmt(C.tapHit(s))], ['Авто DPS', fmt(auto)],
      ['Шанс крита', Math.round(C.critChance(s) * 100) + '%'], ['Крит-урон', '×' + C.critMult(s).toFixed(1)],
      ['Критов всего', fmt(st.crits)], ['Золото в минуту', fmt(goldPerMin())],
      ['Золота заработано', fmt(st.goldEarned)], ['Души сейчас', fmt(s.souls)],
      ['Душ получено', fmt(st.soulsEarned)], ['Тапов', fmt(st.taps)],
      ['Макс. тапов в секунду', fmt(st.maxTps)], ['Врагов побеждено', fmt(st.kills)],
      ['Боссов побеждено', fmt(st.bossKills)], ['Рекорд этажа', fmt(s.bestFloor)],
      ['Ритуалов', fmt(s.rituals)], ['Время в игре', playTimeTxt(st.playTime)],
    ];
    $('statsTab').innerHTML = '<div class="hint2">Золото в минуту — по последней минуте игры. Время в игре считается только при открытой игре.</div><div class="stGrid">' +
      cells.map(c => '<div class="stCell"><span>' + c[0] + '</span><b>' + c[1] + '</b></div>').join('') + '</div>' + titlesHtml();
  }
  // Титулы за 1-й/10-й/100-й ритуал (0.51): только для красоты, выбранный показывается в профиле
  function titlesHtml() {
    const all = CFG.ritual.milestones;
    let h = '<div class="secTitle">ТИТУЛЫ' + (s.title ? ' · сейчас «' + s.title + '»' : '') + '</div><div class="spare">';
    for (const m of all) {
      const own = s.titles.includes(m.title), cur = s.title === m.title;
      h += own ? '<button class="hBtn' + (cur ? ' go' : '') + '" data-title="' + m.title + '"' + (cur ? ' disabled' : '') + '>' + (cur ? '✦ ' : '') + m.title + '</button>'
               : '<span class="badge rs">🔒 ' + m.title + ' — ритуал №' + m.n + '</span>';
    }
    if (s.skins.includes('eternal')) h += '<span class="badge sq">облик «Вечный призванный» открыт</span>';
    return h + '</div>';
  }
  $('statsTab').addEventListener('click', e => {
    const b = e.target.closest('[data-title]'); if (!b) return;
    if (C.setTitle(s, b.dataset.title)) { toast('Титул<small>' + b.dataset.title + '</small>'); save(); render(); }
  });
  $('statsBtn').addEventListener('click', () => { el.modal.classList.remove('show'); tab = 'stats'; setCollapsed(false); render(); });

  // ---------- карта Башни (0.32): путь по этажам биома, замки, финальный босс ----------
  let mapPage = null, mapHtml = '';
  function renderMap() {
    const BF = CFG.biomeFloors, lastPage = Math.floor((Math.min(CFG.maxFloor, s.maxFloor) - 1) / BF);
    if (mapPage == null) mapPage = Math.floor((s.floor - 1) / BF);
    mapPage = Math.max(0, Math.min(lastPage, mapPage));
    const lo = mapPage * BF + 1, hi = Math.min(CFG.maxFloor, lo + BF - 1);
    let html = '<div class="mapHead"><button class="navBtn" data-mp="-1"' + (mapPage > 0 ? '' : ' disabled') + '>‹</button>' +
      '<div class="mt">' + C.biomeName(lo) + '<small>этажи ' + fmt(lo) + '–' + fmt(hi) + ' · открыто до ' + fmt(s.maxFloor) + '</small></div>' +

  // ---------- Алтарь ----------
  let altarSel = {}, altarHtml = '';
  function cleanSel() {
    for (const id in altarSel) {
      const max = s.locks[id] ? 0 : s.heroes[id].copies;
      altarSel[id] = Math.max(0, Math.min(altarSel[id], max));
      if (!altarSel[id]) delete altarSel[id];
    }
  }

    cleanSel();

    let html = '<div class="altHead"><div class="ess">✦ <b>' + fmt(s.essence) + '</b> эссенции</div><div class="altBtns">' +
      '<button class="hBtn go" data-act="all">Выбрать всё</button><button class="hBtn" data-act="none">Сброс</button></div></div>' +
      '<div class="hint2">Пожертвованные копии исчезают навсегда. 🔒 защищает копии героя от выбора.</div>';

        '<div class="hSub">копий ' + h.copies + ' · ✦' + A.essence[a.rarity] + ' за копию</div></div>' +
        '<button class="lockBtn' + (locked ? ' on' : '') + '" data-lock="' + a.id + '">' + (locked ? '🔒' : '🔓') + '</button>' +
        '<div class="step"><button data-minus="' + a.id + '"' + (n ? '' : ' disabled') + '>−</button><span>' + n + '</span>' +
        '<button data-plus="' + a.id + '"' + (!locked && n < h.copies ? '' : ' disabled') + '>+</button></div></div>';

    html += '<div class="secTitle">РЕЦЕПТЫ</div>';

      '<button class="hBtn' + (s.essence >= A.ticketCost ? ' go' : '') + '" data-act="tear"' + (s.essence >= A.ticketCost ? '' : ' disabled') + '>Создать</button></div>';
    html += '<div class="recipe"><div>След героя<small>Копия выбранного открытого героя (для звёзд). Цена по редкости: ' +
      RANKS.map(r => r + ' ✦' + A.traceCost[r]).join(', ') + '</small></div></div>';
    for (const a of list) {
      const c = C.traceCost(a.id);
      html += '<div class="recipe" style="border-style:solid"><div><span class="rar r-' + a.rarity + '">' + a.rarity + '</span> ' + a.name + '</div>' +
        '<button class="hBtn' + (s.essence >= c ? ' go' : '') + '" data-trace="' + a.id + '"' + (s.essence >= c ? '' : ' disabled') + '>+1 копия ✦' + fmt(c) + '</button></div>';
    }
    for (const h of CFG.allies.filter(a => a.hidden)) {

          h.recipe.map(id => CFG.allies.find(a => a.id === id).name).join(', ') + '</small></div></div>'
        : '<div class="recipe"><div>??? — скрытый рецепт<small>Говорят, Алтарь откликается, если отдать ему весь первый отряд разом…</small></div></div>';
    }

  $('altarTab').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || b.disabled) return;
    const d = b.dataset;
    if (d.plus) altarSel[d.plus] = (altarSel[d.plus] || 0) + 1;
    else if (d.minus) altarSel[d.minus] = (altarSel[d.minus] || 0) - 1;
    else if (d.lock) { C.setLock(s, d.lock, !s.locks[d.lock]); save(); }
    else if (d.act === 'all') {
      altarSel = C.selectAllUnlocked(s);
      if (!Object.keys(altarSel).length) toast('Нечего выбрать<small style="color:var(--muted)">Нет копий без 🔒 — их дают повторы в портале</small>');
    }
    else if (d.act === 'none') altarSel = {};
    else if (d.act === 'heart') { if (C.forgeHeart(s, 1)) { toast('Сердце стража<small>+1 ' + CFG.materials.heart.icon + '</small>'); save(); } }
    else if (d.act === 'tear') { if (C.tearOfPortal(s, 1)) { toast('Слеза портала<small>+1 🎟</small>'); save(); } }
    else if (d.trace) { if (C.heroTrace(s, d.trace)) { toast('След героя<small>+1 копия · ' + CFG.allies.find(a => a.id === d.trace).name + '</small>'); save(); } }
    else if (d.act === 'sac') {
      cleanSel();
      const total = Object.values(altarSel).reduce((a, x) => a + x, 0);
      if (!total) return;
      const doSacrifice = () => {
        const r = C.sacrifice(s, altarSel);
        if (r) {
          altarSel = {};
          const f = r.found[0];
          if (f) toast((f.isNew ? 'Скрытое открытие!' : 'Скрытый рецепт') + '<small>' + CFG.allies.find(a => a.id === f.id).name + (f.isNew ? ' присоединилась' : ' +' + f.sets + ' коп.') + ' · +' + fmt(r.essence) + ' ✦</small>');
          else toast('Алтарь принял жертву<small>+' + fmt(r.essence) + ' ✦</small>');
          save();
        }
        render();
      };
      const value = C.sacrificeValue(altarSel);
      ask('Пожертвовать <b>' + total + '</b> коп. за <b>' + fmt(value) + ' ✦</b>?<br><span style="color:var(--muted)">Копии исчезнут навсегда.</span>', 'Пожертвовать', () => {
        if (C.needsRareConfirm(altarSel))
          ask('Среди них есть <b>редкие герои</b> (A, S или GOD). Точно пожертвовать?', 'Да, точно', doSacrifice);
        else doSacrifice();
      });

    render();
  });

  // ---------- задания ----------
  // Неделя начинается с понедельника; ключ — дата этого понедельника
  function weekKey() {
    const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - (d.getDay() + 6) % 7);
    return 'w' + d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  let questsHtml = '';
  function rewardLine(r) {
    const M = CFG.materials, p = [];
    if (r.souls) p.push('👻 ' + fmt(r.souls));
    if (r.tickets) p.push('🎟 ' + r.tickets); if (r.essence) p.push('✦ ' + r.essence);
    if (r.shard) p.push(M.shard.icon + ' ' + r.shard); if (r.heart) p.push(M.heart.icon + ' ' + r.heart);
    return p.join(' · ');
  }
  function questRows(list) {
    let html = '';
    for (const q of list) {
      const pr = C.questProgress(s, q.id), done = pr >= q.goal, claimed = !!s.quests.claimed[q.id];
      const btn = claimed ? '<button class="hBtn" disabled>✓</button>'
        : done ? '<button class="hBtn go" data-claim="' + q.id + '">Забрать</button>'
        : q.go ? '<button class="hBtn" data-go="' + q.go + '">Перейти</button>' : '';
      html += '<div class="hRow' + (claimed ? ' claimed' : '') + '" style="--r:' + (done && !claimed ? 'var(--ok)' : 'var(--line)') + '"><div class="hInfo">' +
        '<div class="hName">' + q.name + '</div><div class="hSub">' + fmt(pr) + ' / ' + fmt(q.goal) + ' · награда ' + rewardLine(q.reward) + '</div>' +
        '<div class="qBar' + (done ? ' done' : '') + '"><i style="width:' + (pr / q.goal * 100) + '%"></i></div></div>' + btn + '</div>';
    }
    return html;
  }
  function renderQuests() {
    const Q = CFG.quests, n = C.claimableCount(s) + C.achClaimableCount(s);
    let html = '<button class="claimAll" data-act="all"' + (n ? '' : ' disabled') + '>' + (n ? 'Забрать всё (' + n + ')' : 'Нечего забирать') + '</button>';
    const dc = C.dailyClaimedCount(s), QC = CFG.questChests, last = QC[QC.length - 1].need;
    html += '<div class="secTitle">СУНДУКИ ЗАДАНИЙ · выполнено ' + dc + '/' + last + ' ежедневных</div><div class="chestBar"><i style="width:' + Math.min(100, dc / last * 100) + '%"></i></div><div class="chestRow">' +
      QC.map((c, i) => { const open = s.quests.chests[i], ready = C.questChestReady(s, i);
        return '<button class="' + (open ? 'open' : ready ? 'ready' : '') + '" data-chest="' + i + '"' + (ready ? '' : ' disabled') + '><span class="ci">' + (open ? '📭' : '🧰') + '</span>' +
          (open ? 'открыт' : c.need + ' задан.') + '<br><small>' + rewardLine(c.reward) + '</small></button>'; }).join('') + '</div>';
    html += '<div class="secTitle">ЕЖЕДНЕВНЫЕ · обновятся в полночь</div>' + questRows(Q.daily);
    html += '<div class="secTitle">ЕЖЕНЕДЕЛЬНЫЕ · обновятся в понедельник</div>' + questRows(Q.weekly);
    const intro = Q.intro.filter(q => !s.quests.claimed[q.id]), doneN = Q.intro.length - intro.length;
    html += '<div class="secTitle">ВВОДНЫЕ · выполнено ' + doneN + '/' + Q.intro.length + '</div>' + (intro.length ? questRows(intro) : '<div class="hint2">Все вводные задания выполнены.</div>');
    html += '<div class="secTitle">РИТУАЛЬНЫЕ · текущий забег, обновятся после ритуала</div>' + questRows(Q.ritual);
    const A = CFG.achievements, pts = C.achPoints(s);
    html += '<div class="secTitle">ДОСТИЖЕНИЯ · очков ' + pts + ' · +' + Math.round(pts * A.dmgPerPoint * 100) + '% всего урона навсегда</div>';
    for (const a of A.list) {
      const t = C.achTier(s, a.id), maxed = t >= a.goals.length, goal = maxed ? a.goals[a.goals.length - 1] : a.goals[t];
      const v = C.achValue(s, a), can = C.achClaimable(s, a.id), pr = Math.min(1, v / goal);
      html += '<div class="hRow' + (maxed ? ' claimed' : '') + '" style="--r:' + (can ? 'var(--ok)' : maxed ? 'var(--gold)' : 'var(--line)') + '"><div class="artIcon">' + a.icon + '</div><div class="hInfo">' +
        '<div class="hName">' + a.name + ' · ступень ' + t + '/' + a.goals.length + '</div>' +
        '<div class="hSub">' + (maxed ? 'все ступени получены' : fmt(Math.min(v, goal)) + ' / ' + fmt(goal) + ' · награда ' + rewardLine(a.reward) + ' и +1 очко') + '</div>' +
        (maxed ? '' : '<div class="qBar' + (can ? ' done' : '') + '"><i style="width:' + pr * 100 + '%"></i></div>') + '</div>' +
        (can ? '<button class="hBtn go" data-ach="' + a.id + '">Забрать</button>' : maxed ? '<button class="hBtn" disabled>✓</button>' : '') + '</div>';
    }
    if (html !== questsHtml) { $('questsTab').innerHTML = html; questsHtml = html; }
  }
  $('questsTab').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || b.disabled) return;
    const d = b.dataset;
    if (d.chest) { const r = C.openQuestChest(s, +d.chest); if (r) { toast('🧰 Сундук открыт<small>' + rewardLine(r) + '</small>'); save(); } }

    html += '<div class="passRow" style="font-size:10px;color:var(--muted);font-weight:800"><span></span><span>БЕСПЛАТНО</span><span>ПРЕМИУМ</span></div>';
    for (let l = 1; l <= S.passLevels; l++) {

  }
  $('seasonTab').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || b.disabled) return;

      const r = C.claimTrail(s, dk);

    } else if (d.act === 'hero') { const id = C.buySeasonHero(s, dk); if (id) toast('Обмен<small>' + CFG.allies.find(a => a.id === id).name + '</small>'); }

    save(); render();
  });

  // ---------- доп. PvE ----------
  function dayKey() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  const tierSel = {};
  let pveHtml = '';
  function rewardText(r) {
    const M = CFG.materials, parts = [];
    if (r.gold) parts.push('◆ ' + fmt(r.gold));
    if (r.shard) parts.push(M.shard.icon + ' ' + fmt(r.shard));
    if (r.heart) parts.push(M.heart.icon + ' ' + r.heart);
    if (r.bone) parts.push('кость ' + CFG.rarities[r.bone.tier] + ' · ' + C.boneSlot(r.bone.slot).name);
    if (r.runeTier != null) parts.push('руна ' + CFG.rarities[r.runeTier] + (r.runeType ? ' · ' + C.runeKind(r.runeType).name : ''));
    return parts.join(' · ');
  }
  function renderPve() {
    const P = CFG.pve, busy = !!s.mode, maxT = C.maxDungeonTier(s);
    let html = busy ? '<div class="hint2" style="color:var(--gold)">Сейчас идёт «' + s.mode.name + '». Выйти можно кнопкой на арене.</div>' : '';
    html += '<div class="secTitle">ЕЖЕДНЕВНЫЕ ПОДЗЕМЕЛЬЯ · ' + P.dungeonEnemies + ' врагов за ' + P.dungeonTime + ' с · попытки обновляются в полночь</div>';
    for (const d of P.dungeons) {
      const t = tierSel[d.id] = Math.min(maxT, Math.max(1, tierSel[d.id] || maxT)), left = C.attemptsLeft(s, d.id), can = !busy && left > 0;
      html += '<div class="hRow" style="--r:#6bb8ff"><div class="artIcon">' + d.icon + '</div><div class="hInfo">' +
        '<div class="hName">' + d.name + ' · попыток ' + left + '/' + P.dailyAttempts + '</div><div class="hSub">' + d.desc + '</div>' +
        '<div class="dpsPrev">Награда: <b>' + rewardText(C.dungeonReward(s, d.id, t)) + '</b> · враги как на этаже ' + t * P.tierFloors + '</div></div>' +
        '<div class="hBtns"><div class="tierPick"><button data-tier="' + d.id + ':-1"' + (t > 1 ? '' : ' disabled') + '>−</button><span>ур. ' + t + '</span>' +
        '<button data-tier="' + d.id + ':1"' + (t < maxT ? '' : ' disabled') + '>+</button></div>' +
        '<button class="hBtn' + (can ? ' go' : '') + '" data-dun="' + d.id + '"' + (can ? '' : ' disabled') + '>Войти</button></div></div>';
    }
    const el2 = C.attemptsLeft(s, 'endless'), canE = !busy && el2 > 0;
    html += '<div class="secTitle">БЕСКОНЕЧНОЕ ПОДЗЕМЕЛЬЕ</div>' +
      '<div class="hRow" style="--r:#b98cff"><div class="artIcon">∞</div><div class="hInfo"><div class="hName">Рекорд: ' + s.pve.endlessBest + ' волн · попыток ' + el2 + '/' + P.endless.attempts + '</div>' +
      '<div class="hSub">Волны без таймера, каждые ' + P.endless.bossEvery + ' — контрольный босс на ' + P.endless.bossTime + ' с. За босса ✦ эссенция, за новый рекордный рубеж — 🎟 билет.</div></div>' +
      '<button class="hBtn' + (canE ? ' go' : '') + '" data-act="endless"' + (canE ? '' : ' disabled') + '>Войти</button></div>';
    C.trialSync(s);
    const tl = C.attemptsLeft(s, 'trial'), canT = !busy && tl > 0, T = P.trial;
    html += '<div class="secTitle">ИСПЫТАТЕЛЬНАЯ БАШНЯ · равные условия для всех</div>' +
      '<div class="hRow" style="--r:#ffd36b"><div class="artIcon">🗼</div><div class="hInfo"><div class="hName">Рекорд недели: ' + s.trial.weekBest + ' · за всё время: ' + s.trial.best + ' · попыток ' + tl + '/' + T.attempts + '</div>' +
      '<div class="hSub">Только тапы одинаковой силы — без прокачки, критов, союзников и питомца. ' + T.time + ' с на каждого стража, с каждым HP больше. За стража ✦ ' + T.essencePer + '. Рейтинг — позже, с сервером.</div></div>' +
      '<button class="hBtn' + (canT ? ' go' : '') + '" data-act="trial"' + (canT ? '' : ' disabled') + '>Войти</button></div>';
    const bosses = C.personalBosses(s), pl = C.attemptsLeft(s, 'personal');
    html += '<div class="secTitle">ЛИЧНЫЕ БОССЫ · попыток ' + pl + '/' + P.personal.attempts + ' в день · ' + P.personal.time + ' с</div>';
    if (!bosses.length) html += '<div class="hRow locked" style="--r:#3a2a4a"><div class="artIcon">?</div><div class="hInfo"><div class="hName">Пока нет</div><div class="hSub">Победите финального босса биома (этаж 50) — он станет личным боссом</div></div></div>';
    for (const b of bosses) {
      html += '<div class="hRow" style="--r:#ff6b4a"><div class="artIcon">👹</div><div class="hInfo"><div class="hName">' + b.name + '</div><div class="hSub">' + b.biome + ' · этаж ' + b.floor + '</div><div class="diffs">' +
        P.personal.diffs.map(D => { const can = !busy && pl > 0; return '<button class="hBtn' + (can ? ' go' : '') + '" data-pb="' + b.id + ':' + D.id + '"' + (can ? '' : ' disabled') + '>' + D.name + '<br><small>' + rewardText(C.personalReward(s, b.floor, D.id)) + '</small></button>'; }).join('') +
        '</div></div></div>';
    }
    html += '<div class="secTitle">МИРОВОЙ БОСС</div><div class="hRow locked" style="--r:#3a2a4a"><div class="artIcon">🌍</div><div class="hInfo"><div class="hName">Скоро</div><div class="hSub">Общий прогресс всех игроков требует онлайн-сервера — появится вместе с аккаунтами</div></div></div>';
    if (html !== pveHtml) { $('pveTab').innerHTML = html; pveHtml = html; }
  }
  function startMode(kind, opts) {

  $('pveTab').addEventListener('click', e => {

  $('leaveBtn').addEventListener('click', () => {
    const m = s.mode; if (!m) return;
